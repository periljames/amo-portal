services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./backend/uploads:/app/uploads
    ports:
      - "8080:8080"

  rostering-automation:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    command: ["python", "-m", "amodb.jobs.rostering_automation", "--loop"]
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend
      - ./backend/uploads:/app/uploads
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    ports:
      - "5173:80"
    depends_on:
      - backend
