# Production frontend origin.
#
# The SPA calls the API same-origin (getApiBaseUrl() returns the current origin
# when VITE_API_BASE_URL is unset), so this server must reverse-proxy every
# backend route prefix to the API container and the operations gateway. This
# mirrors the Vite dev proxy (frontend/src/services/devProxyRouting.ts) so the
# application behaves identically in development and production.
#
# Upstream hostnames (`backend`, `platform-ops-gateway`) resolve on the Compose
# network. Override host:port via build/deploy if the topology differs.

# Browser page navigations send `Accept: text/html`; SPA fetch()/XHR calls send
# `Accept: */*` or application/json. This lets shared prefixes (/platform, /qms)
# serve the SPA for navigations and the API for data calls.
map $http_accept $amo_wants_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (manuals/training/evidence). Raise if larger files are expected.
    client_max_body_size 1024m;

    # ----- Operations gateway (isolated control-plane service) -----
    location ^~ /ops/ {
        proxy_pass http://platform-ops-gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ----- Server-Sent Events / streaming (no buffering) -----
    location /api/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # ----- Public artifact verification is a pure SPA route -----
    location ~ ^/verify(/|$) {
        try_files $uri /index.html;
    }

    # ----- Shared prefixes: SPA for HTML navigations, API for data calls -----
    # /platform/* (superadmin console pages vs. control-plane API) and the public
    # /qms/audit-access, /qms/car-access signed workspaces.
    location ~ ^/(platform|qms/audit-access|qms/car-access)(/|$) {
        if ($request_method = GET) {
            set $amo_spa_candidate $amo_wants_html;
        }
        if ($amo_spa_candidate = 1) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    # ----- Backend API prefixes (always proxied to the API container) -----
    location ~ ^/(auth|accounts|admin|billing|aircraft|work-orders|crs|training|public|quality|qms|reliability|audit|audit-events|bootstrap|integrations|api|notifications|email-logs|tasks|healthz|livez|readyz|health|time|manuals|doc-control|records|foundations|rostering|workforce)(/|$) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ----- Everything else is the SPA -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
