services:
  auth-rate-limit-redis:
    image: redis:8.10.0-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: "${AUTH_RATE_LIMIT_REDIS_CPU_LIMIT:-0.50}"
    mem_limit: "${AUTH_RATE_LIMIT_REDIS_MEMORY_LIMIT:-192m}"
    pids_limit: 128

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      AMO_REQUIRE_SHARED_STORAGE: "true"
      AMO_INSTALL_SHARED_STORAGE_ROUTE_HARDENING: "true"
      # User-facing API capacity is reserved for HTTP/realtime traffic. Durable
      # and scheduled work runs in the isolated services below.
      PORTAL_EMBEDDED_JOB_WORKER: "false"
      PORTAL_EMBEDDED_SCHEDULED_WORKER: "false"
      DOCUMENT_EVIDENCE_PACK_EMBEDDED_WORKER: "false"
      DB_POOL_SIZE: "${PORTAL_DB_POOL_SIZE:-20}"
      DB_MAX_OVERFLOW: "${PORTAL_DB_MAX_OVERFLOW:-10}"
      DB_POOL_TIMEOUT: "${PORTAL_DB_POOL_TIMEOUT:-5}"
      PORTAL_API_PROCESS_COUNT: "${PORTAL_API_PROCESS_COUNT:-2}"
      UVICORN_BACKLOG: "${UVICORN_BACKLOG:-4096}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      AUTH_RATE_LIMIT_SHARED_REQUIRED: "true"
      AUTH_RATE_LIMIT_REDIS_URL: "redis://auth-rate-limit-redis:6379/0"
      PORTAL_WORKER_PROCESS_COUNT: "${PORTAL_WORKER_PROCESS_COUNT:-5}"
      PORTAL_SCHEDULED_PROCESS_COUNT: "${PORTAL_SCHEDULED_PROCESS_COUNT:-1}"
      DOCUMENT_EVIDENCE_PACK_PROCESS_COUNT: "${DOCUMENT_EVIDENCE_PACK_PROCESS_COUNT:-1}"
      PLATFORM_OPS_GATEWAY_PROCESS_COUNT: "1"
      PLATFORM_OPS_WORKER_PROCESS_COUNT: "1"
      ROSTER_AUTOMATION_PROCESS_COUNT: "1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/amo-portal/shared/logs:/var/log/amo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      auth-rate-limit-redis:
        condition: service_healthy

  portal-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PORTAL_WORKER_FAMILIES: "${PORTAL_WORKER_FAMILIES:-workforce,saas,training-workbooks,training-reports,document-indexing}"
      PORTAL_WORKER_CONCURRENCY: "${PORTAL_WORKER_CONCURRENCY:-1}"
      PORTAL_WORKER_DB_POOL_SIZE: "${PORTAL_WORKER_DB_POOL_SIZE:-2}"
      PORTAL_WORKER_DB_MAX_OVERFLOW: "${PORTAL_WORKER_DB_MAX_OVERFLOW:-1}"
      PORTAL_WORKER_DB_POOL_TIMEOUT: "${PORTAL_WORKER_DB_POOL_TIMEOUT:-3}"
      # Report/index consumers remain hot so newly requested artifacts begin
      # processing within roughly one second without sharing the API pool.
      TRAINING_REPORT_JOB_INTERVAL_SECONDS: "${TRAINING_REPORT_JOB_INTERVAL_SECONDS:-1}"
      DOCUMENT_INDEX_WORKER_POLL_SECONDS: "${DOCUMENT_INDEX_WORKER_POLL_SECONDS:-1}"
    command: ["python", "-m", "amodb.jobs.portal_worker_main"]
    restart: unless-stopped
    cpus: "${PORTAL_WORKER_CPU_LIMIT:-2.0}"
    mem_limit: "${PORTAL_WORKER_MEMORY_LIMIT:-2g}"
    pids_limit: 256
    depends_on:
      backend:
        condition: service_healthy

  portal-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PORTAL_SCHEDULED_DB_POOL_SIZE: "${PORTAL_SCHEDULED_DB_POOL_SIZE:-2}"
      PORTAL_SCHEDULED_DB_MAX_OVERFLOW: "${PORTAL_SCHEDULED_DB_MAX_OVERFLOW:-1}"
      PORTAL_SCHEDULED_DB_POOL_TIMEOUT: "${PORTAL_SCHEDULED_DB_POOL_TIMEOUT:-3}"
    command: ["python", "-m", "amodb.jobs.portal_scheduler_main"]
    restart: unless-stopped
    cpus: "${PORTAL_SCHEDULER_CPU_LIMIT:-0.5}"
    mem_limit: "${PORTAL_SCHEDULER_MEMORY_LIMIT:-512m}"
    pids_limit: 128
    depends_on:
      backend:
        condition: service_healthy

  document-evidence-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DOCUMENT_EVIDENCE_PACK_DB_POOL_SIZE: "${DOCUMENT_EVIDENCE_PACK_DB_POOL_SIZE:-1}"
      DOCUMENT_EVIDENCE_PACK_DB_MAX_OVERFLOW: "${DOCUMENT_EVIDENCE_PACK_DB_MAX_OVERFLOW:-1}"
      DOCUMENT_EVIDENCE_PACK_DB_POOL_TIMEOUT: "${DOCUMENT_EVIDENCE_PACK_DB_POOL_TIMEOUT:-3}"
      DOCUMENT_EVIDENCE_PACK_WORKER_POLL_SECONDS: "${DOCUMENT_EVIDENCE_PACK_WORKER_POLL_SECONDS:-0.5}"
    command: ["python", "-m", "amodb.apps.doc_control.evidence_pack_worker_main"]
    restart: unless-stopped
    cpus: "${DOCUMENT_EVIDENCE_WORKER_CPU_LIMIT:-1.0}"
    mem_limit: "${DOCUMENT_EVIDENCE_WORKER_MEMORY_LIMIT:-1g}"
    pids_limit: 128
    depends_on:
      backend:
        condition: service_healthy

  platform-ops-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "${PLATFORM_OPS_DB_POOL_SIZE:-3}"
      DB_MAX_OVERFLOW: "${PLATFORM_OPS_DB_MAX_OVERFLOW:-2}"
      DB_POOL_TIMEOUT: "${PLATFORM_OPS_DB_POOL_TIMEOUT:-3}"
      DB_STATEMENT_TIMEOUT_MS: "${PLATFORM_OPS_DB_STATEMENT_TIMEOUT_MS:-15000}"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${PLATFORM_OPS_DB_IDLE_TX_TIMEOUT_MS:-30000}"
      DB_READ_ONLY_TRANSACTIONS: "true"
      PLATFORM_OPS_POLL_INTERVAL_SEC: "${PLATFORM_OPS_POLL_INTERVAL_SEC:-2}"
      PLATFORM_OPS_SNAPSHOT_INTERVAL_SEC: "${PLATFORM_OPS_SNAPSHOT_INTERVAL_SEC:-10}"
    command: ["uvicorn", "amodb.platform_ops_main:app", "--host", "0.0.0.0", "--port", "8090", "--workers", "1"]
    restart: unless-stopped
    cpus: "${PLATFORM_OPS_CPU_LIMIT:-0.75}"
    mem_limit: "${PLATFORM_OPS_MEMORY_LIMIT:-768m}"
    pids_limit: 256
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  platform-ops-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "${PLATFORM_OPS_WORKER_DB_POOL_SIZE:-2}"
      DB_MAX_OVERFLOW: "${PLATFORM_OPS_WORKER_DB_MAX_OVERFLOW:-1}"
      DB_POOL_TIMEOUT: "${PLATFORM_OPS_WORKER_DB_POOL_TIMEOUT:-3}"
      DB_STATEMENT_TIMEOUT_MS: "${PLATFORM_OPS_WORKER_DB_STATEMENT_TIMEOUT_MS:-30000}"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${PLATFORM_OPS_WORKER_DB_IDLE_TX_TIMEOUT_MS:-60000}"
      PLATFORM_OPS_WORKER_SECONDS: "${PLATFORM_OPS_WORKER_SECONDS:-2}"
      PLATFORM_OPS_WORKER_BATCH_SIZE: "${PLATFORM_OPS_WORKER_BATCH_SIZE:-10}"
      PLATFORM_OPS_JOB_LEASE_SECONDS: "${PLATFORM_OPS_JOB_LEASE_SECONDS:-120}"
    command: ["python", "-m", "amodb.platform_ops_worker_main"]
    restart: unless-stopped
    cpus: "${PLATFORM_OPS_WORKER_CPU_LIMIT:-0.35}"
    mem_limit: "${PLATFORM_OPS_WORKER_MEMORY_LIMIT:-384m}"
    pids_limit: 128

  rostering-automation:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      AMO_REQUIRE_SHARED_STORAGE: "true"
      AMO_INSTALL_SHARED_STORAGE_ROUTE_HARDENING: "false"
      DB_POOL_SIZE: "${ROSTER_AUTOMATION_DB_POOL_SIZE:-1}"
      DB_MAX_OVERFLOW: "${ROSTER_AUTOMATION_DB_MAX_OVERFLOW:-1}"
      DB_POOL_TIMEOUT: "${ROSTER_AUTOMATION_DB_POOL_TIMEOUT:-3}"
    command: ["python", "-m", "amodb.jobs.rostering_automation", "--loop"]
    restart: unless-stopped
    volumes:
      - /opt/amo-portal/shared/logs:/var/log/amo
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
      platform-ops-gateway:
        condition: service_healthy
