services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      AMO_REQUIRE_SHARED_STORAGE: "true"
      AMO_INSTALL_SHARED_STORAGE_ROUTE_HARDENING: "true"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/amo-portal/shared/logs:/var/log/amo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  platform-ops-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "${PLATFORM_OPS_DB_POOL_SIZE:-3}"
      DB_MAX_OVERFLOW: "${PLATFORM_OPS_DB_MAX_OVERFLOW:-2}"
      DB_POOL_TIMEOUT: "${PLATFORM_OPS_DB_POOL_TIMEOUT:-3}"
      DB_STATEMENT_TIMEOUT_MS: "${PLATFORM_OPS_DB_STATEMENT_TIMEOUT_MS:-15000}"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${PLATFORM_OPS_DB_IDLE_TX_TIMEOUT_MS:-30000}"
      DB_READ_ONLY_TRANSACTIONS: "true"
      PLATFORM_OPS_POLL_INTERVAL_SEC: "${PLATFORM_OPS_POLL_INTERVAL_SEC:-2}"
      PLATFORM_OPS_SNAPSHOT_INTERVAL_SEC: "${PLATFORM_OPS_SNAPSHOT_INTERVAL_SEC:-10}"
    command: ["uvicorn", "amodb.platform_ops_main:app", "--host", "0.0.0.0", "--port", "8090", "--workers", "1"]
    restart: unless-stopped
    cpus: "${PLATFORM_OPS_CPU_LIMIT:-0.75}"
    mem_limit: "${PLATFORM_OPS_MEMORY_LIMIT:-768m}"
    pids_limit: 256
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  platform-ops-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "${PLATFORM_OPS_WORKER_DB_POOL_SIZE:-2}"
      DB_MAX_OVERFLOW: "${PLATFORM_OPS_WORKER_DB_MAX_OVERFLOW:-1}"
      DB_POOL_TIMEOUT: "${PLATFORM_OPS_WORKER_DB_POOL_TIMEOUT:-3}"
      DB_STATEMENT_TIMEOUT_MS: "${PLATFORM_OPS_WORKER_DB_STATEMENT_TIMEOUT_MS:-30000}"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${PLATFORM_OPS_WORKER_DB_IDLE_TX_TIMEOUT_MS:-60000}"
      PLATFORM_OPS_WORKER_SECONDS: "${PLATFORM_OPS_WORKER_SECONDS:-2}"
      PLATFORM_OPS_WORKER_BATCH_SIZE: "${PLATFORM_OPS_WORKER_BATCH_SIZE:-10}"
      PLATFORM_OPS_JOB_LEASE_SECONDS: "${PLATFORM_OPS_JOB_LEASE_SECONDS:-120}"
    command: ["python", "-m", "amodb.platform_ops_worker_main"]
    restart: unless-stopped
    cpus: "${PLATFORM_OPS_WORKER_CPU_LIMIT:-0.35}"
    mem_limit: "${PLATFORM_OPS_WORKER_MEMORY_LIMIT:-384m}"
    pids_limit: 128

  rostering-automation:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      AMO_REQUIRE_SHARED_STORAGE: "true"
      AMO_INSTALL_SHARED_STORAGE_ROUTE_HARDENING: "false"
    command: ["python", "-m", "amodb.jobs.rostering_automation", "--loop"]
    restart: unless-stopped
    volumes:
      - /opt/amo-portal/shared/logs:/var/log/amo
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
      platform-ops-gateway:
        condition: service_healthy
