global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: amo-portal

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: otel-hub
    static_configs:
      - targets: ["otel-hub:9465"]

  - job_name: node-exporter
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node-exporter/*.json"]
        refresh_interval: 30s

  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cadvisor/*.json"]
        refresh_interval: 30s
