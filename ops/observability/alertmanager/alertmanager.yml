global:
  resolve_timeout: 5m

route:
  receiver: local-null
  group_by: [alertname, cluster_id, node_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-null

# Notification integrations are intentionally not committed with credentials.
# Configure receivers through deployment-local secret files/environment before production paging is enabled.
