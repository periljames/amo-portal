receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  resource/platform:
    attributes:
      - key: service.namespace
        action: upsert
        value: amo-portal
      - key: amo.cluster.id
        action: upsert
        value: ${env:OBSERVABILITY_CLUSTER_ID}
      - key: amo.node.id
        action: upsert
        value: ${env:OBSERVABILITY_NODE_ID}
      - key: deployment.environment.name
        action: upsert
        value: ${env:OBSERVABILITY_ENVIRONMENT}
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/hub:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    tls:
      insecure: ${env:OTEL_EXPORTER_OTLP_INSECURE}
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/platform, batch]
      exporters: [otlp/hub]
  telemetry:
    logs:
      level: info
