[databases]
amodb_api = host=postgres-rw port=5432 dbname=amodb pool_size=90 reserve_pool=10
amodb_workforce = host=postgres-rw port=5432 dbname=amodb pool_size=45 reserve_pool=5
amodb_worker = host=postgres-rw port=5432 dbname=amodb pool_size=35 reserve_pool=5
amodb_scheduler = host=postgres-rw port=5432 dbname=amodb pool_size=10 reserve_pool=2
amodb_read = host=postgres-ro port=5432 dbname=amodb pool_size=30 reserve_pool=5
amodb_migration = host=postgres-rw port=5432 dbname=amodb pool_size=5 reserve_pool=0

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 10
min_pool_size = 10
reserve_pool_size = 2
reserve_pool_timeout = 3
server_connect_timeout = 5
server_login_retry = 5
query_timeout = 35
query_wait_timeout = 15
client_idle_timeout = 7200
server_idle_timeout = 600
server_lifetime = 3600
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
