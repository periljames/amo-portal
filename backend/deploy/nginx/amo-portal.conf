upstream amo_portal_api {
    zone amo_portal_api 64k;
    least_conn;
    server amo-portal-api:8080 max_fails=2 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    location = /livez { proxy_pass http://amo_portal_api/livez; proxy_connect_timeout 2s; proxy_read_timeout 3s; }
    location = /readyz { proxy_pass http://amo_portal_api/readyz; proxy_connect_timeout 2s; proxy_read_timeout 5s; }
    location = /healthz { proxy_pass http://amo_portal_api/healthz; proxy_connect_timeout 2s; proxy_read_timeout 5s; }
    location = /health { proxy_pass http://amo_portal_api/health; proxy_connect_timeout 2s; proxy_read_timeout 5s; }
    location = /time { proxy_pass http://amo_portal_api/time; proxy_connect_timeout 2s; proxy_read_timeout 5s; }

    location / {
        proxy_pass http://amo_portal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
