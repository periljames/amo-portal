services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amo_resilience_test
      POSTGRES_USER: amo_test
      POSTGRES_PASSWORD: amo_test
    ports: ["55432:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U amo_test -d amo_resilience_test]
      interval: 2s
      timeout: 2s
      retries: 30
