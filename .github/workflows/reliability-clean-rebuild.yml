name: Reliability Clean Rebuild Diagnostic

on:
  push:
    branches:
      - agent/reliability-v2-clean
    paths:
      - docs/reliability/.clean-rebuild-trigger

permissions:
  contents: write

jobs:
  diagnose-source-overlay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-clean
          fetch-depth: 0

      - name: Diagnose clean source reconstruction
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/reliability-clean
          declare -A CODES
          run_stage() {
            local name="$1"
            shift
            "$@" >"/tmp/reliability-clean/${name}.log" 2>&1
            CODES[$name]=$?
            echo "$name=${CODES[$name]}"
          }

          run_stage fetch git fetch origin agent/reliability-v2-foundation feat/global-tenant-navigation-quality-home --force
          run_stage source_commit git cat-file -e '00851d2556c2ec6ac0525dc7c4f3648812c171ab^{commit}'
          run_stage base_commit git cat-file -e '309a8eac0aecfdbb19a1ecd71c83cdbaababb074^{commit}'
          run_stage overlay bash -lc "git checkout 00851d2556c2ec6ac0525dc7c4f3648812c171ab -- backend/amodb/apps/reliability docs/reliability/RELIABILITY_MODULE_V2_TARGET_DESIGN.md docs/reliability/RELIABILITY_V2_IMPLEMENTATION_TRACKER.md docs/reliability/RELIABILITY_V2_VALIDATION.md docs/reliability/RELIABILITY_COMPLETE_SCOPE_VALIDATION.md frontend/src/pages/reliability frontend/src/services/reliability.ts frontend/src/styles/reliability-v2.css"
          run_stage obsolete_page git rm -f --ignore-unmatch frontend/src/pages/ReliabilityReportsPage.tsx
          run_stage make_patch bash -lc "git diff --binary 309a8eac0aecfdbb19a1ecd71c83cdbaababb074 00851d2556c2ec6ac0525dc7c4f3648812c171ab -- backend/amodb/alembic/env.py backend/amodb/main.py frontend/src/App.tsx frontend/src/app/PortalRouteSurface.tsx frontend/src/app/portalRouteManifest.ts frontend/src/app/portalRouteManifest.test.ts frontend/src/app/routePreload.ts frontend/src/portalRoutes.tsx > /tmp/reliability-clean/shared.patch"
          run_stage apply_patch git apply --3way /tmp/reliability-clean/shared.patch
          run_stage status git status --short
          run_stage diffcheck git diff --check

          {
            echo '# Reliability Clean Rebuild Diagnostic'
            echo
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo
            echo '| Stage | Exit |'
            echo '|---|---:|'
            for name in fetch source_commit base_commit overlay obsolete_page make_patch apply_patch status diffcheck; do
              echo "| $name | ${CODES[$name]:-999} |"
            done
            for name in fetch source_commit base_commit overlay obsolete_page make_patch apply_patch status diffcheck; do
              echo
              echo "## $name"
              echo '```text'
              tail -n 160 "/tmp/reliability-clean/${name}.log"
              echo '```'
            done
          } > docs/reliability/CLEAN_REBUILD_DIAGNOSTIC.md

          git reset --hard HEAD
          git clean -fd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reliability/CLEAN_REBUILD_DIAGNOSTIC.md
          git commit -m "Record Reliability clean rebuild diagnostic"
          git push origin HEAD:agent/reliability-v2-clean
