name: Apply Training Authoritative Status Cleanup

on:
  push:
    branches:
      - codex/training-record-redesign-20260817

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[training-authoritative-status-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/training-record-redesign-20260817
          fetch-depth: 0
      - name: Apply guarded source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('frontend/src/pages/QMSTrainingUserPage.tsx')
          text = page.read_text(encoding='utf-8')
          pattern = re.compile(r'''function effectiveTrainingStatus\(item: TrainingStatusItem \| null \| undefined\): string \{.*?\n\}\n\nfunction effectiveTrainingStatusForRecord''', re.S)
          replacement = '''function effectiveTrainingStatus(item: TrainingStatusItem | null | undefined): string {
            return item?.status || "NOT_DONE";
          }

          function effectiveTrainingStatusForRecord'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'effectiveTrainingStatus block: expected 1 match, got {count}')
          text = text.replace('if (effectiveStatus === "NOT_DONE") return "Not done";', 'if (effectiveStatus === "NOT_DONE") return "Not completed";')
          page.write_text(text, encoding='utf-8')

          component = Path('frontend/src/components/training/TrainingRequirementList.tsx')
          text = component.read_text(encoding='utf-8')
          marker = '''function buildRows(items: TrainingStatusItem[], courses: TrainingCourseRead[], records: TrainingRecordRead[], files: TrainingFileRead[]): RequirementRow[] {'''
          helper = '''function startRowLongPress(event: React.PointerEvent<HTMLElement>): void {
            if (event.pointerType === "mouse") return;
            const row = event.currentTarget;
            const timer = window.setTimeout(() => row.querySelector("details.trl-menu")?.setAttribute("open", ""), 650);
            row.dataset.trainingLongPressTimer = String(timer);
          }

          function cancelRowLongPress(event: React.PointerEvent<HTMLElement>): void {
            const raw = event.currentTarget.dataset.trainingLongPressTimer;
            if (raw) window.clearTimeout(Number(raw));
            delete event.currentTarget.dataset.trainingLongPressTimer;
          }

          '''
          if 'function startRowLongPress' not in text:
              if marker not in text:
                  raise SystemExit('buildRows marker missing')
              text = text.replace(marker, helper + marker, 1)

          old_tr = '''<tr key={row.key} onContextMenu={(event) => {
            event.preventDefault();
            event.currentTarget.querySelector("details")?.setAttribute("open", "");
          }}>'''
          new_tr = '''<tr key={row.key}
            onContextMenu={(event) => {
              event.preventDefault();
              event.currentTarget.querySelector("details.trl-menu")?.setAttribute("open", "");
            }}
            onPointerDown={startRowLongPress}
            onPointerUp={cancelRowLongPress}
            onPointerCancel={cancelRowLongPress}
            onPointerMove={cancelRowLongPress}
          >'''
          if old_tr in text:
              text = text.replace(old_tr, new_tr, 1)

          old_article = '''<article className="trl-card" key={row.key} onContextMenu={(event) => { event.preventDefault(); event.currentTarget.querySelector("details.trl-menu")?.setAttribute("open", ""); }}>'''
          new_article = '''<article className="trl-card" key={row.key}
            onContextMenu={(event) => { event.preventDefault(); event.currentTarget.querySelector("details.trl-menu")?.setAttribute("open", ""); }}
            onPointerDown={startRowLongPress}
            onPointerUp={cancelRowLongPress}
            onPointerCancel={cancelRowLongPress}
            onPointerMove={cancelRowLongPress}
          >'''
          if old_article in text:
              text = text.replace(old_article, new_article, 1)

          component.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleaned sources
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/QMSTrainingUserPage.tsx frontend/src/components/training/TrainingRequirementList.tsx
          git commit -m "fix(training): keep compliance status authoritative [training-authoritative-status-applied]"
          git push origin HEAD:codex/training-record-redesign-20260817
