name: Diagnose Tenant Shell Merge Into Reliability

on:
  push:
    branches:
      - agent/reliability-v2-foundation
    paths:
      - docs/reliability/.sync-current-shell

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0
      - name: Record exact merge result
        shell: bash
        run: |
          set +e
          ORIGINAL_SHA="$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/global-tenant-navigation-quality-home
          FETCH_SHA="$(git rev-parse FETCH_HEAD)"
          git merge --no-edit --no-ff FETCH_HEAD > /tmp/merge.log 2>&1
          MERGE_RC=$?
          git status --short > /tmp/status.log
          git diff --name-only --diff-filter=U > /tmp/conflicts.log
          cat > /tmp/report.md <<EOF
          # Reliability Tenant-Shell Merge Diagnostic

          - Run: \`${GITHUB_RUN_ID}\`
          - Reliability source SHA: \`${ORIGINAL_SHA}\`
          - Fetched shell SHA: \`${FETCH_SHA}\`
          - Merge exit code: \`${MERGE_RC}\`

          ## Conflicted files

          \`\`\`text
          $(cat /tmp/conflicts.log)
          \`\`\`

          ## Merge log

          \`\`\`text
          $(cat /tmp/merge.log)
          \`\`\`

          ## Status

          \`\`\`text
          $(cat /tmp/status.log)
          \`\`\`
          EOF
          git merge --abort >/dev/null 2>&1 || true
          git reset --hard "$ORIGINAL_SHA"
          git clean -fd
          mkdir -p docs/reliability
          cp /tmp/report.md docs/reliability/SHELL_MERGE_DIAGNOSTIC.md
          git add docs/reliability/SHELL_MERGE_DIAGNOSTIC.md
          git commit -m "Record tenant-shell merge diagnostics"
          git push origin HEAD:agent/reliability-v2-foundation
