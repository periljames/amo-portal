name: Quality Module CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/quality/**"
      - "backend/amodb/apps/qms/**"
      - "backend/amodb/alembic/versions/quality_*.py"
      - "backend/amodb/tests/test_quality*.py"
      - "backend/amodb/tests/test_postgres*.py"
      - "backend/amodb/tests/test_qms*.py"
      - "frontend/src/components/QMS/**"
      - "frontend/src/pages/Quality*.tsx"
      - "frontend/src/pages/qms/**"
      - "frontend/src/pages/qualityAudits/**"
      - "frontend/src/services/qms*.ts"
      - "frontend/src/services/quality*.ts"
      - "frontend/src/styles/qms*.css"
      - "frontend/src/styles/quality*.css"
      - "frontend/tests/e2e/qms-*.spec.ts"
      - ".github/workflows/quality-module-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/amodb/apps/quality/**"
      - "backend/amodb/apps/qms/**"
      - "backend/amodb/alembic/versions/quality_*.py"
      - "backend/amodb/tests/test_quality*.py"
      - "backend/amodb/tests/test_postgres*.py"
      - "backend/amodb/tests/test_qms*.py"
      - "frontend/src/components/QMS/**"
      - "frontend/src/pages/Quality*.tsx"
      - "frontend/src/pages/qms/**"
      - "frontend/src/pages/qualityAudits/**"
      - "frontend/src/services/qms*.ts"
      - "frontend/src/services/quality*.ts"
      - "frontend/src/styles/qms*.css"
      - "frontend/src/styles/quality*.css"
      - "frontend/tests/e2e/qms-*.spec.ts"
      - ".github/workflows/quality-module-ci.yml"

concurrency:
  group: quality-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: backend
      SECRET_KEY: quality-module-ci-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: sqlite+pysqlite:///:memory:
      DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
      DATABASE_READ_URL: sqlite+pysqlite:///:memory:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Quality backend
        run: >-
          python -m compileall -q
          backend/amodb/apps/quality
          backend/amodb/apps/qms
          backend/amodb/tests/test_quality*.py
          backend/amodb/tests/test_qms*.py
      - name: Validate SQLAlchemy mapper configuration
        working-directory: backend
        run: python -c "from amodb.main import app; from sqlalchemy.orm import configure_mappers; configure_mappers(); print('Quality mapper configuration OK')"
      - name: Run Audit Programme backend contracts
        run: >-
          pytest -q
          backend/amodb/apps/quality/tests/test_audit_programme_service.py
          backend/amodb/apps/quality/tests/test_audit_programme_router_contracts.py
          backend/amodb/apps/quality/tests/test_audit_programme_route_registration.py
      - name: Run Assurance OS backend contracts
        run: >-
          pytest -q
          backend/amodb/apps/quality/tests/test_assurance_operating_system_services.py
          backend/amodb/apps/quality/tests/test_assurance_operating_system_router_contracts.py
          backend/amodb/apps/quality/tests/test_assurance_operating_system_route_registration.py
      - name: Run Quality workflow and dashboard regressions
        run: >-
          pytest -q
          backend/amodb/apps/quality/tests/test_tenant_route_isolation.py
          backend/amodb/apps/quality/tests/test_audit_conflict_service.py
          backend/amodb/apps/quality/tests/test_audit_conflict_routes.py
          backend/amodb/apps/quality/tests/test_audit_handoff_routes.py
          backend/amodb/apps/quality/tests/test_evidence_metadata_immutability.py
          backend/amodb/apps/quality/tests/test_evidence_register.py
          backend/amodb/apps/quality/tests/test_dashboard_source.py
          backend/amodb/apps/quality/tests/test_quality_control_room.py
          backend/amodb/apps/quality/tests/test_quality_metrics_definition.py
          backend/amodb/apps/quality/tests/test_policy_validation.py
          backend/amodb/apps/quality/tests/test_reference_id_ownership.py
          backend/amodb/apps/quality/tests/test_audit_preparation_context.py
          backend/amodb/apps/quality/tests/test_audit_preparation_routes.py
          backend/amodb/apps/quality/tests/test_audit_workflow_service.py
          backend/amodb/apps/quality/tests/test_audit_route_decomposition.py
          backend/amodb/apps/quality/tests/test_people_router_contracts.py
          backend/amodb/apps/quality/tests/test_register_route_contracts.py

  postgres-quality-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_quality_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_quality_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: backend
      SECRET_KEY: quality-module-postgres-ci-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_quality_ci
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_quality_ci
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_quality_ci
      QUALITY_SCHEMA_STRICT: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Upgrade through all Alembic heads
        working-directory: backend
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Run PostgreSQL Quality schema checks
        run: >-
          pytest -q
          backend/amodb/tests/test_postgres_quality_schema.py
          backend/amodb/tests/test_postgres_quality_rls.py
          backend/amodb/tests/test_quality_migration_fk_contract.py
          backend/amodb/tests/test_qms_models_postgres.py
          backend/amodb/tests/test_qms_rls_context.py
          backend/amodb/tests/test_qms_rls_cross_tenant.py
          backend/amodb/tests/test_qms_programme_postgres.py
          backend/amodb/tests/test_qms_people_postgres.py
          backend/amodb/tests/test_qms_assurance_postgres.py
          backend/amodb/tests/test_qms_intelligence_postgres.py
          backend/amodb/tests/test_qms_approval_graph_postgres.py

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_API_PROXY_TARGET: http://127.0.0.1:8080
      VITE_ALLOWED_HOSTS: 127.0.0.1,localhost
      E2E_BASE_URL: http://127.0.0.1:4173
      PLAYWRIGHT_REUSE_EXISTING_SERVER: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start QMS readiness backend
        env:
          PYTHONPATH: backend
          SECRET_KEY: quality-module-browser-ci-secret
          DATABASE_URL: sqlite+pysqlite:///:memory:
          DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
          DATABASE_READ_URL: sqlite+pysqlite:///:memory:
          APP_ENV: test
        run: |
          python -m uvicorn amodb.main:app --host 127.0.0.1 --port 8080 > /tmp/qms-readiness.log 2>&1 &
          echo $! > /tmp/qms-readiness.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qms-readiness.log
          exit 1
      - name: Start QMS preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qms-preview.log 2>&1 &
          echo $! > /tmp/qms-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qms-preview.log
          exit 1
      - name: Browser - assurance Control Room and governed control hub
        run: npx playwright test tests/e2e/qms-excellence-cockpit.spec.ts --workers=1
      - name: Browser - Quality navigation, refresh and CAR usability
        if: always()
        run: npx playwright test tests/e2e/qms-usability-enhancements.spec.ts --workers=1
      - name: Browser - governed Missions
        if: always()
        run: npx playwright test tests/e2e/qms-missions.spec.ts --workers=1
      - name: Browser - Audit Programme
        if: always()
        run: npx playwright test tests/e2e/qms-audit-programme.spec.ts --workers=1
      - name: Browser - People, Assurance and Intelligence workspaces
        if: always()
        run: npx playwright test tests/e2e/qms-assurance-operating-system.spec.ts --workers=1
      - name: Browser - bounded generic registers
        if: always()
        run: npx playwright test tests/e2e/qms-register-bounded.spec.ts --workers=1
      - name: Browser - modern Planner
        if: always()
        env:
          E2E_CHROMIUM_CHANNEL: "1"
        run: npx playwright test tests/e2e/qms-modern-planner-live.spec.ts --workers=1
      - name: Browser - Planner lifecycle
        if: always()
        run: npx playwright test tests/e2e/qms-planner-lifecycle.spec.ts --workers=1
      - name: Browser - Planner audit handoff
        if: always()
        run: npx playwright test tests/e2e/qms-planner-audit-handoff.spec.ts --workers=1
      - name: Lint Quality-owned frontend surfaces
        if: always()
        run: >-
          npm exec -- eslint
          src/services/qmsAssuranceCases.ts
          src/services/qmsAuditHubActions.ts
          src/services/qmsAuditHubActions.test.ts
          src/services/qmsAuditProgramme.ts
          src/services/qmsDashboard.ts
          src/services/qmsDashboard.test.ts
          src/services/qmsIntelligence.ts
          src/services/qmsMissions.ts
          src/services/qmsPeople.ts
          src/services/qmsRegisters.ts
          src/services/qualityExcellence.ts
          src/services/qualityPortal.ts
          src/components/QMS/AssuranceControlRoom.tsx
          src/components/QMS/AuditControlHub.tsx
          src/components/QMS/AuditInboxWorkQueue.tsx
          src/components/QMS/AuditPlanner.tsx
          src/components/QMS/AssuranceCaseWorkspace.tsx
          src/components/QMS/QualityAuditHandoffHost.tsx
          src/components/QMS/QualityChecklistTemplateHost.tsx
          src/components/QMS/QualityEvidenceViewer.tsx
          src/components/QMS/QualityModuleRenderer.tsx
          src/components/QMS/QualityRouteChrome.tsx
          src/components/QMS/QualityRouteWorkbench.tsx
          src/components/QMS/QualityContextTabs.tsx
          src/components/QMS/QualityPeopleWorkspace.tsx
          src/components/QMS/QualityAssuranceWorkspace.tsx
          src/components/QMS/QualityIntelligenceWorkspace.tsx
          src/components/QMS/QualityProgrammeWorkspace.tsx
          src/pages/qms/QmsRouteScreen.tsx
          src/pages/qms/routes/qmsRouteRegistry.ts
          src/utils/qmsRouteContext.ts
          tests/e2e/qms-excellence-cockpit.spec.ts
          tests/e2e/qms-usability-enhancements.spec.ts
          tests/e2e/qms-missions.spec.ts
          tests/e2e/qms-audit-programme.spec.ts
          tests/e2e/qms-assurance-operating-system.spec.ts
          tests/e2e/qms-register-bounded.spec.ts
          tests/e2e/qms-modern-planner-live.spec.ts
          tests/e2e/qms-planner-lifecycle.spec.ts
          tests/e2e/qms-planner-audit-handoff.spec.ts
      - name: Stop QMS preview server
        if: always()
        run: |
          if [ -f /tmp/qms-preview.pid ]; then
            kill "$(cat /tmp/qms-preview.pid)" || true
          fi
          if [ -f /tmp/qms-readiness.pid ]; then
            kill "$(cat /tmp/qms-readiness.pid)" || true
          fi
