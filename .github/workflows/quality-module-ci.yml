name: Quality Module CI

on:
  push:
    branches:
      - agent/qms-modern-business-planner
  pull_request:
    paths:
      - "backend/amodb/quality_main.py"
      - "backend/amodb/apps/quality/**"
      - "backend/amodb/apps/accounts/portal_preferences_*"
      - "backend/amodb/apps/accounts/tests/test_portal_preferences_contract.py"
      - "backend/amodb/apps/audit/**"
      - "backend/amodb/apps/tasks/**"
      - "backend/amodb/apps/exports/**"
      - "backend/amodb/alembic/versions/quality_*.py"
      - "backend/amodb/alembic/versions/accounts_20260804_portal_preferences.py"
      - "backend/docs/quality/**"
      - "frontend/src/pages/Quality*.tsx"
      - "frontend/src/pages/QMS*.tsx"
      - "frontend/src/pages/qms/**"
      - "frontend/src/pages/qualityAudits/**"
      - "frontend/src/components/QMS/**"
      - "frontend/src/components/Layout/qmsSidebarNavigation*"
      - "frontend/src/components/dashboard/QualityCockpit*.tsx"
      - "frontend/src/dashboards/DashboardCockpit.tsx"
      - "frontend/src/layouts/QmsShell.tsx"
      - "frontend/src/services/qms*.ts"
      - "frontend/src/services/qualityExcellence.ts"
      - "frontend/src/services/portalPreferences.ts"
      - "frontend/src/types/qms.ts"
      - "frontend/src/styles/qms*.css"
      - "frontend/src/styles/quality-excellence*.css"
      - "frontend/tests/e2e/qms-*.spec.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/portalRoutes.tsx"
      - "frontend/eslint.config.js"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/quality-module-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "quality backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Verify Quality migration contract
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
          SECRET_KEY: quality-migration-contract-secret
          QUALITY_SCHEMA_STRICT: "0"
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("amodb/alembic.ini"))
          integrity = script.get_revision("quality_20260722_schema_integrity")
          preferences = script.get_revision("accounts_260804_portal_prefs")
          assurance = script.get_revision("quality_260804_assurance_hub")
          assurance_rls = script.get_revision("quality_260804_assurance_rls")
          assurance_wiring = script.get_revision("quality_260804_assurance_wiring")
          trigger_fix = script.get_revision("quality_260804_trigger_fix")
          missions = script.get_revision("quality_260808_missions")
          audit_programme = script.get_revision("quality_260808_audit_programme")

          assert integrity is not None
          assert integrity.down_revision == "workforce_20260721_complete"
          assert preferences is not None
          assert preferences.down_revision == "accounts_20260803_auth_session"
          assert assurance is not None
          assert assurance.down_revision == "accounts_260804_portal_prefs"
          assert assurance_rls is not None
          assert assurance_rls.down_revision == "quality_260804_assurance_hub"
          assert assurance_wiring is not None
          assert assurance_wiring.down_revision == "quality_260804_assurance_rls"
          assert trigger_fix is not None
          assert trigger_fix.down_revision == "quality_260804_assurance_wiring"
          assert missions is not None
          assert missions.down_revision == "docgov_rel_20260807_merge"
          assert audit_programme is not None
          assert audit_programme.down_revision == "quality_260808_missions"
          assert all(
              len(revision.revision) <= 32
              for revision in (preferences, assurance, assurance_rls, assurance_wiring, trigger_fix, missions, audit_programme)
          )
          PY
      - name: Compile Quality backend
        run: >-
          python -m compileall -q
          amodb/quality_main.py
          amodb/apps/quality
          amodb/apps/accounts/portal_preferences_models.py
          amodb/apps/accounts/portal_preferences_router.py
          amodb/alembic/versions/accounts_20260804_portal_preferences.py
          amodb/alembic/versions/quality_260804_assurance_hub.py
          amodb/alembic/versions/quality_260804_assurance_rls.py
          amodb/alembic/versions/quality_260804_assurance_wiring.py
          amodb/alembic/versions/quality_260804_trigger_fix.py
          amodb/alembic/versions/quality_260808_missions.py
          amodb/alembic/versions/quality_260808_audit_programme.py
      - name: Configure application mappers used by Quality
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
          SECRET_KEY: quality-mapper-test-secret
          QUALITY_SCHEMA_STRICT: "0"
        run: python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; import amodb.quality_main; configure_mappers(); print('Quality application mappers configured')"
      - name: Run Audit Programme contract
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
          SECRET_KEY: quality-audit-programme-secret
          QUALITY_SCHEMA_STRICT: "0"
        run: pytest -q amodb/apps/quality/tests/test_audit_programme_contract.py
      - name: Run Quality workflow and dashboard regressions
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
          SECRET_KEY: quality-test-secret
          QUALITY_SCHEMA_STRICT: "0"
        run: >-
          pytest -q
          amodb/apps/accounts/tests/test_portal_preferences_contract.py
          amodb/apps/quality/tests/test_tenant_route_isolation.py
          amodb/apps/quality/tests/test_dashboard_v2_contract.py
          amodb/apps/quality/tests/test_quality_delivery_profile.py
          amodb/apps/quality/tests/test_workflow_transitions.py
          amodb/apps/quality/tests/test_audit_workflow_enforcement.py
          amodb/apps/quality/tests/test_audit_events.py
          amodb/apps/quality/tests/test_register_pagination.py
          amodb/apps/quality/tests/test_task_integrations.py
          amodb/apps/quality/tests/test_evidence_pack_exports.py
          amodb/apps/quality/tests/test_excellence_contract.py
          amodb/apps/quality/tests/test_assurance_wiring_contract.py
          amodb/apps/quality/tests/test_assurance_metrics_contract.py
          amodb/apps/quality/tests/test_mission_contract.py
          amodb/apps/quality/tests/test_planner_router.py

  postgres-quality-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_quality_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "quality PostgreSQL dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Run Quality schema hardening probe
        env:
          APP_ENV: test
          SECRET_KEY: quality-postgres-test-secret
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
          DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
        run: python -m amodb.apps.quality.tests.postgres_schema_integrity_probe
      - name: Run continuous assurance migration, event and RLS probe
        env:
          APP_ENV: test
          SECRET_KEY: quality-postgres-test-secret
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
          DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
        run: python -m amodb.apps.quality.tests.postgres_excellence_probe
      - name: Run Mission migration and tenant RLS probe
        env:
          APP_ENV: test
          SECRET_KEY: quality-postgres-test-secret
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
          DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
        run: python -m amodb.apps.quality.tests.postgres_mission_probe
      - name: Run Audit Programme migration and tenant RLS probe
        env:
          APP_ENV: test
          SECRET_KEY: quality-postgres-test-secret
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
          DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
        run: python -m amodb.apps.quality.tests.postgres_audit_programme_probe

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "quality frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Run Quality frontend regressions
        run: npm run test:quality
      - name: Validate CSS ownership contract
        run: npm run check:css
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium for focused QMS browser tests
        run: npx playwright install --with-deps chromium
      - name: Start QMS preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qms-preview.log 2>&1 &
          echo $! > /tmp/qms-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qms-preview.log
          exit 1
      - name: Browser - assurance Control Room and governed control hub
        run: npx playwright test tests/e2e/qms-excellence-cockpit.spec.ts --workers=1
      - name: Browser - Quality navigation, refresh and CAR usability
        if: always()
        run: npx playwright test tests/e2e/qms-usability-enhancements.spec.ts --workers=1
      - name: Browser - governed Missions
        if: always()
        run: npx playwright test tests/e2e/qms-missions.spec.ts --workers=1
      - name: Browser - bounded generic registers
        if: always()
        run: npx playwright test tests/e2e/qms-register-bounded.spec.ts --workers=1
      - name: Browser - modern Planner
        if: always()
        run: npx playwright test tests/e2e/qms-modern-planner-live.spec.ts --workers=1
      - name: Browser - Planner lifecycle
        if: always()
        run: npx playwright test tests/e2e/qms-planner-lifecycle.spec.ts --workers=1
      - name: Browser - Planner audit handoff
        if: always()
        run: npx playwright test tests/e2e/qms-planner-audit-handoff.spec.ts --workers=1
      - name: Lint Quality-owned frontend surfaces
        if: always()
        run: >-
          npm exec -- eslint
          src/services/qmsAuditHubActions.ts
          src/services/qmsAuditHubActions.test.ts
          src/services/qmsDashboard.ts
          src/services/qmsDashboard.test.ts
          src/services/qmsMissions.ts
          src/services/qmsRegisters.ts
          src/services/qualityExcellence.ts
          src/services/portalPreferences.ts
          src/pages/QualityCarsPage.tsx
          src/pages/qualityAudits/QualityAuditRegisterPage.tsx
          src/pages/qms
          src/components/QMS/PortalTextScaleManager.tsx
          src/components/QMS/QualityContextTabs.tsx
          src/components/QMS/QualityDataFreshnessCoordinator.tsx
          src/components/QMS/QualityEnhancementsHost.tsx
          src/components/QMS/QualityExcellenceCockpit.tsx
          src/components/Layout/qmsSidebarNavigation.test.ts
          src/types/qms.ts
