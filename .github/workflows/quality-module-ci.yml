name: Quality Module CI

on:
  pull_request:
    paths:
      - "backend/amodb/quality_main.py"
      - "backend/amodb/apps/quality/**"
      - "backend/amodb/apps/accounts/portal_preferences_*"
      - "backend/amodb/apps/accounts/tests/test_portal_preferences_contract.py"
      - "backend/amodb/apps/audit/**"
      - "backend/amodb/apps/tasks/**"
      - "backend/amodb/apps/exports/**"
      - "backend/amodb/alembic/versions/quality_*.py"
      - "backend/amodb/alembic/versions/accounts_20260804_portal_preferences.py"
      - "backend/docs/quality/**"
      - "frontend/src/pages/Quality*.tsx"
      - "frontend/src/pages/QMS*.tsx"
      - "frontend/src/pages/qms/**"
      - "frontend/src/pages/qualityAudits/**"
      - "frontend/src/components/QMS/**"
      - "frontend/src/components/Layout/qmsSidebarNavigation*"
      - "frontend/src/services/qms*.ts"
      - "frontend/src/services/qualityExcellence.ts"
      - "frontend/src/services/portalPreferences.ts"
      - "frontend/src/types/qms.ts"
      - "frontend/src/styles/qms*.css"
      - "frontend/src/styles/quality-excellence*.css"
      - "frontend/tests/e2e/qms-*.spec.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/portalRoutes.tsx"
      - "frontend/src/app/PortalRouteSurface.tsx"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/quality-module-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    name: Quality backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: quality-contract-secret
      QUALITY_SCHEMA_STRICT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "quality backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Compile Quality backend
        run: python -m compileall -q amodb/quality_main.py amodb/apps/quality amodb/apps/accounts/portal_preferences_models.py amodb/apps/accounts/portal_preferences_router.py
      - name: Configure Quality application mappers
        run: python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; import amodb.quality_main; configure_mappers(); print('Quality application mappers configured')"
      - name: Run canonical Quality backend contracts
        run: >-
          pytest -q
          amodb/apps/accounts/tests/test_portal_preferences_contract.py
          amodb/apps/quality/tests/test_audit_programme_contract.py
          amodb/apps/quality/tests/test_assurance_operating_system_completion.py
          amodb/apps/quality/tests/test_assurance_os_contract.py
          amodb/apps/quality/tests/test_tenant_route_isolation.py
          amodb/apps/quality/tests/test_dashboard_v2_contract.py
          amodb/apps/quality/tests/test_quality_delivery_profile.py
          amodb/apps/quality/tests/test_workflow_transitions.py
          amodb/apps/quality/tests/test_audit_workflow_enforcement.py
          amodb/apps/quality/tests/test_qms_admin_checklist_regressions.py
          amodb/apps/quality/tests/test_audit_events.py
          amodb/apps/quality/tests/test_register_pagination.py
          amodb/apps/quality/tests/test_task_integrations.py
          amodb/apps/quality/tests/test_evidence_pack_exports.py
          amodb/apps/quality/tests/test_excellence_contract.py
          amodb/apps/quality/tests/test_assurance_wiring_contract.py
          amodb/apps/quality/tests/test_assurance_metrics_contract.py
          amodb/apps/quality/tests/test_mission_contract.py
          amodb/apps/quality/tests/test_planner_router.py
          amodb/apps/quality/tests/test_assurance_cockpit_contract.py

  postgres-quality-schema:
    name: Quality PostgreSQL schema and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_quality_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SECRET_KEY: quality-postgres-test-secret
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_quality_test
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "quality PostgreSQL dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Run Quality schema integrity probe
        run: python -m amodb.apps.quality.tests.postgres_schema_integrity_probe
      - name: Run continuous assurance migration, event and RLS probe
        run: python -m amodb.apps.quality.tests.postgres_excellence_probe
      - name: Run Mission migration and tenant RLS probe
        run: python -m amodb.apps.quality.tests.postgres_mission_probe
      - name: Run Audit Programme migration and tenant RLS probe
        run: python -m amodb.apps.quality.tests.postgres_audit_programme_probe
      - name: Run People, Assurance, Intelligence and Approval Graph probe
        run: python -m amodb.apps.quality.tests.postgres_assurance_operating_system_probe
      - name: Run completed assurance OS and audit preparation RLS probe
        run: python -m amodb.apps.quality.tests.postgres_assurance_os_probe

  frontend:
    name: Quality frontend canonical contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "quality frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Run Quality frontend contracts
        run: npm run test:quality
      - name: Validate CSS ownership contract
        run: npm run check:css
      - name: Typecheck and production build
        run: npm run build
      - name: Lint Quality-owned surfaces
        run: >-
          npm exec -- eslint
          src/services/qmsAssuranceCases.ts
          src/services/qmsAuditHubActions.ts
          src/services/qmsAuditProgramme.ts
          src/services/qmsDashboard.ts
          src/services/qmsIntelligence.ts
          src/services/qmsMissions.ts
          src/services/qmsPeople.ts
          src/services/qmsRegisters.ts
          src/services/qualityExcellence.ts
          src/services/portalPreferences.ts
          src/pages/QualityCarsPage.tsx
          src/pages/qualityAudits
          src/pages/qms
          src/components/QMS
          src/types/qms.ts

  canonical-browser-gates:
    name: Canonical browser gate ownership
    runs-on: ubuntu-latest
    needs: [backend-contract, postgres-quality-schema, frontend]
    steps:
      - name: Confirm browser coverage ownership
        run: |
          echo "Browser acceptance is intentionally owned by the focused QMS workflows:"
          echo "- QMS Planner CI"
          echo "- Audit lifecycle Playwright"
          echo "- QMS Operational UI CI"
          echo "- QMS CAR Control Loop CI / Real Browser CI"
          echo "- QMS Live Audit CI / Real Browser CI / Setup Prepare Real Browser CI"
          echo "- QMS Assurance OS Completion CI"
          echo "Quality Module CI therefore validates shared backend, PostgreSQL/RLS, frontend unit, CSS, lint and production-build contracts without duplicating superseded browser assertions."
