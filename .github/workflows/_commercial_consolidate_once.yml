name: One-time direct commercial consolidation

on:
  push:
    branches: [agent/platform-commercial-scale-hardening]
    paths: [".github/workflows/_commercial_consolidate_once.yml"]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/platform-commercial-scale-hardening
          fetch-depth: 0
      - name: Fold runtime policy wrappers into canonical modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          def function(text, name):
              tree = ast.parse(text)
              node = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name), None)
              if node is None: raise RuntimeError(f"missing function {name}")
              lines = text.splitlines(True)
              return "".join(lines[node.lineno-1:node.end_lineno]).rstrip(), node

          def extract(path, name):
              return function(Path(path).read_text(encoding="utf-8"), name)[0]

          def replace_def(text, name, replacement):
              _, node = function(text, name)
              lines = text.splitlines(True)
              return "".join(lines[:node.lineno-1] + [replacement.rstrip()+"\n\n"] + lines[node.end_lineno:])

          cs_path = Path("backend/amodb/apps/platform/commercial_services.py")
          cs = cs_path.read_text(encoding="utf-8")
          paystack = extract("backend/amodb/apps/platform/payment_data_policy.py", "_safe_paystack_webhook").replace("def _safe_paystack_webhook(", "def record_paystack_webhook(", 1)
          cs = replace_def(cs, "record_paystack_webhook", paystack)

          transport = "backend/amodb/apps/platform/payment_transport_policy.py"
          settlement = extract(transport, "_settlement_credential")
          if "def _settlement_credential(" not in cs:
              cs = cs.replace("def record_mpesa_callback(", settlement+"\n\n\ndef record_mpesa_callback(", 1)
          record = extract(transport, "minimized_mpesa_callback").replace("def minimized_mpesa_callback(", "def record_mpesa_callback(", 1)
          process = extract(transport, "process_minimized_mpesa_callback").replace("def process_minimized_mpesa_callback(", "def _process_mpesa_callback(", 1)
          cs = replace_def(cs, "record_mpesa_callback", record)
          cs = replace_def(cs, "_process_mpesa_callback", process)

          activation_path = "backend/amodb/apps/platform/module_activation_policy.py"
          if "from . import module_commerce\n" not in cs:
              cs = cs.replace("from . import commercial_integrations as integrations\n", "from . import commercial_integrations as integrations\nfrom . import module_commerce\n")
          helper_specs = [
              ("_details", "_activation_details"),
              ("_period_delta", "_activation_period_delta"),
              ("_metadata", "_activation_metadata"),
              ("_restore_legacy_base_license", "_restore_base_license"),
          ]
          helpers=[]
          for old,new in helper_specs:
              s=extract(activation_path, old).replace(f"def {old}(", f"def {new}(", 1)
              s=s.replace("_period_delta(", "_activation_period_delta(").replace("_metadata(", "_activation_metadata(")
              s=s.replace("LEGACY_BASE_RENEWAL", "BASE_RENEWAL").replace("Legacy renewal", "Base renewal").replace("legacy renewal", "base renewal")
              helpers.append(s)
          activation=extract(activation_path,"enable_paid_module_contract").replace("def enable_paid_module_contract(","def _enable_paid_module(",1)
          activation=activation.replace("_details(","_activation_details(").replace("_restore_legacy_base_license(","_restore_base_license(").replace("_period_delta(","_activation_period_delta(").replace("_metadata(","_activation_metadata(")
          if "def _activation_details(" not in cs:
              cs=cs.replace("def _enable_paid_module(","\n\n".join(helpers)+"\n\n\ndef _enable_paid_module(",1)
          cs=replace_def(cs,"_enable_paid_module",activation)
          cs_path.write_text(cs,encoding="utf-8")

          # Direct provider URL hardening.
          ci_path=Path("backend/amodb/apps/platform/commercial_integrations.py")
          ci=ci_path.read_text(encoding="utf-8")
          if "import os\n" not in ci: ci=ci.replace("import json\n","import json\nimport os\n")
          for helper in ("_production_runtime","_require_secure_callback","_trusted_hosted_redirect"):
              if f"def {helper}(" not in ci:
                  ci=ci.replace("def paystack_initialize_transaction(",extract(transport,helper)+"\n\n\ndef paystack_initialize_transaction(",1)
          ci=ci.replace('    if callback_url:\n        body["callback_url"] = saas_providers._safe_url(callback_url, allowed_schemes=("https", "http"))\n','    if callback_url:\n        _require_secure_callback(callback_url, label="Paystack callback_url")\n        body["callback_url"] = saas_providers._safe_url(callback_url, allowed_schemes=("https", "http"))\n')
          ci=ci.replace('        "authorization_url": str(data.get("authorization_url")),\n','        "authorization_url": _trusted_hosted_redirect(str(data.get("authorization_url")), provider="Paystack", allowed_hosts={"checkout.paystack.com", "standard.paystack.co"}),\n')
          # M-PESA callback URL is also external in production.
          target='    body = {\n        "BusinessShortCode": shortcode,\n'
          if target in ci and '_require_secure_callback(callback_url, label="M-PESA callback_url")' not in ci:
              ci=ci.replace(target,'    _require_secure_callback(callback_url, label="M-PESA callback_url")\n'+target,1)
          ci_path.write_text(ci,encoding="utf-8")

          sp_path=Path("backend/amodb/apps/platform/saas_providers.py")
          sp=sp_path.read_text(encoding="utf-8")
          if "import os\n" not in sp: sp=sp.replace("import json\n","import json\nimport os\n")
          for helper in ("_production_runtime","_require_secure_callback"):
              if f"def {helper}(" not in sp:
                  sp=sp.replace("def create_stripe_checkout_session(",extract(transport,helper)+"\n\n\ndef create_stripe_checkout_session(",1)
          sp=sp.replace('    _safe_url(success_url, allowed_schemes=("https", "http"))\n    _safe_url(cancel_url, allowed_schemes=("https", "http"))\n','    _require_secure_callback(success_url, label="Stripe success_url")\n    _require_secure_callback(cancel_url, label="Stripe cancel_url")\n    _safe_url(success_url, allowed_schemes=("https", "http"))\n    _safe_url(cancel_url, allowed_schemes=("https", "http"))\n')
          sp=sp.replace('        "checkout_url": response.get("url"),\n','        "checkout_url": _trusted_stripe_checkout_url(response.get("url")),\n')
          if "def _trusted_stripe_checkout_url(" not in sp:
              helper='''def _trusted_stripe_checkout_url(value: Any) -> str | None:\n    url = str(value or "").strip()\n    if not url:\n        return None\n    parsed = urllib.parse.urlsplit(url)\n    host = (parsed.hostname or "").lower()\n    if parsed.scheme.lower() != "https" or not (host == "checkout.stripe.com" or host.endswith(".checkout.stripe.com")):\n        raise RuntimeError("Stripe returned an untrusted hosted checkout URL")\n    if parsed.username or parsed.password:\n        raise RuntimeError("Stripe checkout URL must not contain user credentials")\n    return urllib.parse.urlunsplit(parsed)'''
              sp=sp.replace("def create_stripe_checkout_session(",helper+"\n\n\ndef create_stripe_checkout_session(",1)
          sp_path.write_text(sp,encoding="utf-8")

          mc_path=Path("backend/amodb/apps/platform/module_commerce.py")
          mc=mc_path.read_text(encoding="utf-8")
          needle="    if row is None:\n        row = account_models.ModuleSubscription(\n"
          if "created_offer_placeholder = row is None" not in mc and needle in mc:
              mc=mc.replace(needle,"    created_offer_placeholder = row is None\n"+needle,1)
              mc=mc.replace('    metadata = _decode_metadata(row)\n    terms = {\n','    metadata = _decode_metadata(row)\n    if created_offer_placeholder:\n        metadata["commercial_offer_only"] = True\n    terms = {\n',1)
          mc_path.write_text(mc,encoding="utf-8")

          init=Path("backend/amodb/apps/platform/__init__.py")
          source=init.read_text(encoding="utf-8")
          for line in [
              "from .module_activation_policy import install_module_activation_policy\n",
              "from .module_offer_policy import install_module_offer_policy\n",
              "from .payment_data_policy import install_payment_data_policy\n",
              "from .payment_transport_policy import install_payment_transport_policy\n",
              "install_payment_data_policy()\n","install_payment_transport_policy()\n","install_module_offer_policy()\n","install_module_activation_policy()\n",
          ]: source=source.replace(line,"")
          init.write_text(source,encoding="utf-8")

          for stale in ["payment_data_policy.py","payment_transport_policy.py","module_activation_policy.py","module_offer_policy.py"]:
              p=Path("backend/amodb/apps/platform")/stale
              if p.exists(): p.unlink()
          PY
          python -m compileall -q backend/amodb/apps/platform backend/amodb/apps/accounts
          git diff --check
      - name: Commit and push source-only consolidation
        shell: bash
        run: |
          git config user.name "amo-portal-ci"
          git config user.email "amo-portal-ci@users.noreply.github.com"
          git add backend frontend
          git diff --cached --check
          git commit -m "refactor(commercial): eliminate payment and module policy monkeypatches"
          git push origin HEAD:agent/platform-commercial-scale-hardening
