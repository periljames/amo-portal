name: Reliability Permanent Hotfix Publisher

on:
  push:
    branches:
      - agent/reliability-permanent-hotfix
    paths:
      - '.github/workflows/reliability-hotfix-scheduled.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: reliability-permanent-hotfix-publisher
  cancel-in-progress: false

jobs:
  publish-verified-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliability_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reliability_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: reliability-permanent-hotfix-secret
      JWT_SECRET_KEY: reliability-permanent-hotfix-jwt
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
      WRITE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reliability-permanent-hotfix
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Reconstruct verified permanent source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/scripts/apply_reliability_review_fixes.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'start = text.index(f"def {name}(\\n")',
              'start = text.index(f"def {name}(")',
          )
          source = source.replace(
              'end = text.index(f"\\ndef {next_name}(\\n", start)',
              'end = text.index(f"\\ndef {next_name}(", start)',
          )
          path.write_text(source, encoding='utf-8')
          PY
          python backend/scripts/apply_reliability_review_fixes.py
          echo 'f7f1340e8b34af391398218009dd59494aa4784388529ec028c0f83589dbd799  backend/amodb/apps/reliability/advanced_services.py' | sha256sum -c -
          echo '32da4772bc0739387aea724416d976c9872c5948fe9d669f9c571cbdb8c6cead  backend/amodb/apps/reliability/services.py' | sha256sum -c -
          python -m py_compile \
            backend/amodb/apps/reliability/advanced_services.py \
            backend/amodb/apps/reliability/services.py \
            backend/amodb/apps/reliability/tests/test_review_regressions.py

      - name: Remove all temporary Reliability recovery machinery
        shell: bash
        run: |
          set -euo pipefail
          git show 55b4263623b5dc7ee3baef91fd8f39cc2c44aa2b:.github/workflows/reliability-module-ci.yml > .github/workflows/reliability-module-ci.yml
          rm -f .github/workflows/reliability-hotfix-finalizer.yml
          rm -f .github/workflows/reliability-hotfix-pr-finalizer.yml
          rm -f .github/workflows/reliability-hotfix-scheduled.yml
          rm -f .github/workflows/reliability-review-finalize-v2.yml
          rm -f .github/workflows/reliability-review-fixes.yml
          rm -f backend/scripts/apply_reliability_review_fixes.py
          rm -f docs/reliability/.review-fix-trigger
          rm -f docs/reliability/.review-fix-trigger-v2
          rm -f docs/reliability/.hotfix-trigger
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete
          test ! -e .github/workflows/reliability-hotfix-scheduled.yml
          test ! -e .github/workflows/reliability-review-finalize-v2.yml
          test ! -e backend/scripts/apply_reliability_review_fixes.py
          grep -q '^  contents: read$' .github/workflows/reliability-module-ci.yml
          if grep -R -n -E 'apply_reliability_review_fixes|review-fix-trigger|hotfix-trigger|Reliability Hotfix Scheduled|Reliability Review Finalizer' .github/workflows docs/reliability backend/scripts 2>/dev/null; then
            echo 'Temporary Reliability recovery reference remains in the final tree.'
            exit 1
          fi
          git diff --check

      - name: Compile application and configure mappers
        run: |
          python -m compileall -q backend/amodb/apps/reliability
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print('application import and mapper configuration passed')
          PY

      - name: Verify one Alembic head and upgrade clean PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python -m alembic -c backend/amodb/alembic.ini heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
          grep -q 'rel_20260803_complete_scope' /tmp/alembic-heads.txt
          python -m alembic -c backend/amodb/alembic.ini upgrade heads
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as connection:
              width = connection.execute(text("""
                  SELECT character_maximum_length
                  FROM information_schema.columns
                  WHERE table_name = 'alembic_version'
                    AND column_name = 'version_num'
              """)).scalar_one()
          assert width is not None and width >= 128, width
          print(f'alembic_version.version_num capacity: {width}')
          PY

      - name: Run all Reliability tests
        run: pytest -q backend/amodb/apps/reliability/tests

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run tenant-shell contracts
        working-directory: frontend
        run: npm run test:tenant-shell

      - name: Lint Reliability frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/reliability/*.tsx src/services/reliability.ts

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Publish the validated final tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          echo 'Final permanent hotfix diff:'
          git diff --cached --stat
          git diff --cached --name-status
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m 'Hotfix Reliability ingestion, metrics, scheduling and counts'
          git push origin HEAD:agent/reliability-permanent-hotfix
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record exact-head validation status
        env:
          GH_TOKEN: ${{ github.token }}
          HOTFIX_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${HOTFIX_SHA}" \
            -f state=success \
            -f context='Reliability Permanent Hotfix Validation' \
            -f description='Hashes, backend, PostgreSQL, tests, tenant shell, lint and production build passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
