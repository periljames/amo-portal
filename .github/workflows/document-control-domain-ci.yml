name: Document Control Domain CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/doc_control/**"
      - "backend/amodb/apps/manuals/**"
      - "backend/amodb/apps/rostering/tests/postgres_migration_probe.py"
      - "backend/amodb/alembic/**"
      - "backend/docs/document_control/**"
      - "backend/requirements.txt"
      - "frontend/src/pages/documentControl/**"
      - "frontend/src/pages/manuals/**"
      - "frontend/src/pages/DocControlPages.tsx"
      - "frontend/src/services/documentControl*.ts"
      - "frontend/src/services/documentation.ts"
      - "frontend/src/services/pdfReader.ts"
      - "frontend/src/services/pdfWorkingCopyAuthority.ts"
      - "frontend/src/services/publications.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/components/Layout/DepartmentLayout.tsx"
      - ".github/workflows/document-control-domain-ci.yml"
      - ".github/workflows/publications-reader-ci.yml"

permissions:
  contents: read

jobs:
  document-control-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amodb
          POSTGRES_PASSWORD: amodb
          POSTGRES_DB: amodb_document_control_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amodb -d amodb_document_control_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: document-control-ci-secret-key-not-for-production
      JWT_SECRET_KEY: document-control-ci-jwt-secret-not-for-production
      DATABASE_WRITE_URL: postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_ci
      DATABASE_READ_URL: postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_ci
      DATABASE_URL: postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_ci
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Record main migration baseline
        shell: bash
        run: |
          set +e
          createdb -h 127.0.0.1 -U amodb amodb_document_control_main_baseline
          git worktree add --detach /tmp/amo-main origin/main
          (
            cd /tmp/amo-main
            DATABASE_WRITE_URL=postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_main_baseline \
            DATABASE_READ_URL=postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_main_baseline \
            DATABASE_URL=postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_main_baseline \
            PYTHONPATH=backend \
            alembic -c backend/amodb/alembic.ini upgrade heads
          ) > /tmp/document-control-main-baseline.log 2>&1
          echo "main_baseline_exit=$?" >> /tmp/document-control-main-baseline.log
          exit 0
        env:
          PGPASSWORD: amodb

      - name: Verify Alembic graph
        shell: bash
        run: |
          set -o pipefail
          alembic -c backend/amodb/alembic.ini heads 2>&1 | tee /tmp/document-control-alembic-heads.log

      - name: Record Alembic ancestry diagnostics
        shell: bash
        run: |
          python - <<'PY' > /tmp/document-control-alembic-graph.log 2>&1
          from pathlib import Path
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("backend/amodb/alembic.ini")
          script = ScriptDirectory.from_config(config)
          print("heads=", script.get_heads())
          print("bases=", script.get_bases())
          print("migration_files=")
          for path in sorted(Path("backend/amodb/alembic/versions").glob("*.py")):
              print(path.name)
          print("head_nodes=")
          for revision_id in script.get_heads():
              revision = script.get_revision(revision_id)
              print(revision_id, "down=", revision.down_revision, "depends_on=", revision.dependencies, "path=", revision.path)
          for revision_id in ("rostering_20260724_governance", "a1b2c3d4e5f6", "document_control_20260724_domain", "document_control_20260724_scope_fk", "document_control_20260724_distribution_integrity"):
              try:
                  revision = script.get_revision(revision_id)
              except Exception as exc:
                  print("lookup_failed", revision_id, repr(exc))
              else:
                  print("target", revision_id, "down=", revision.down_revision, "depends_on=", revision.dependencies, "path=", revision.path)
          print("references_to_a1b2c3d4e5f6=")
          revision_map = getattr(script.revision_map, "_revision_map", {})
          for revision_id, revision in revision_map.items():
              if not isinstance(revision_id, str) or revision is None:
                  continue
              parents = revision.down_revision
              if isinstance(parents, str):
                  parents = (parents,)
              if "a1b2c3d4e5f6" in tuple(parents or ()):
                  print(revision_id, revision.path)
          PY
          cat /tmp/document-control-alembic-graph.log

      - name: Upgrade clean PostgreSQL schema
        shell: bash
        run: |
          set -o pipefail
          alembic -c backend/amodb/alembic.ini upgrade heads 2>&1 | tee /tmp/document-control-alembic-upgrade.log

      - name: Compile Document Control backend
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q amodb/apps/doc_control amodb/apps/manuals 2>&1 | tee /tmp/document-control-backend-compile.log

      - name: Configure mappers and verify route registration
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/document-control-backend-contract.log
          from sqlalchemy.orm import configure_mappers
          from amodb.apps.doc_control import domain_models  # noqa: F401
          from amodb.main import app

          configure_mappers()
          workspace_routes = [
              route
              for route in app.routes
              if getattr(route, "path", "").startswith("/doc-control/workspace/")
          ]
          paths = {route.path for route in workspace_routes}
          required = {
              "/doc-control/workspace/t/{tenant_slug}/dashboard",
              "/doc-control/workspace/t/{tenant_slug}/documents",
              "/doc-control/workspace/t/{tenant_slug}/documents/{manual_id}",
              "/doc-control/workspace/t/{tenant_slug}/documents/{manual_id}/read-target",
              "/doc-control/workspace/t/{tenant_slug}/workflows/{workflow_id}/transition",
              "/doc-control/workspace/t/{tenant_slug}/distribution-campaigns/{campaign_id}/issue",
              "/doc-control/workspace/t/{tenant_slug}/reports/master-register",
          }
          missing = required - paths
          if missing:
              raise SystemExit(f"Missing Document Control routes: {sorted(missing)}")

          expected_first_modules = {
              "/doc-control/workspace/t/{tenant_slug}/dashboard": "amodb.apps.doc_control.workspace_dashboard_router",
              "/doc-control/workspace/t/{tenant_slug}/documents": "amodb.apps.doc_control.workspace_library_router",
              "/doc-control/workspace/t/{tenant_slug}/documents/{manual_id}": "amodb.apps.doc_control.workspace_record_router",
          }
          for path, expected_module in expected_first_modules.items():
              matching = [route for route in workspace_routes if route.path == path]
              if not matching:
                  raise SystemExit(f"Missing route precedence target: {path}")
              endpoint_module = getattr(matching[0].endpoint, "__module__", "")
              if endpoint_module != expected_module:
                  raise SystemExit(
                      f"Unsafe route precedence for {path}: {endpoint_module!r}; expected {expected_module!r}"
                  )

          reader_routes = {
              "/manuals/t/{tenant_slug}/{manual_id}/rev/{revision_id}/pdf-capabilities": "amodb.apps.manuals.pdf_reader_router",
              "/manuals/t/{tenant_slug}/{manual_id}/rev/{revision_id}/flatten.pdf": "amodb.apps.manuals.pdf_reader_router",
              "/manuals/t/{tenant_slug}/{manual_id}/rev/{revision_id}/submit-record": "amodb.apps.manuals.pdf_reader_router",
              "/manuals/t/{tenant_slug}/linked-resources/{reference_id}/submit": "amodb.apps.manuals.knowledge_reader_access_router",
          }
          for path, expected_module in reader_routes.items():
              matching = [route for route in app.routes if getattr(route, "path", "") == path]
              if not matching:
                  raise SystemExit(f"Missing controlled PDF reader route: {path}")
              endpoint_module = getattr(matching[0].endpoint, "__module__", "")
              if endpoint_module != expected_module:
                  raise SystemExit(
                      f"Unsafe PDF reader route precedence for {path}: {endpoint_module!r}; expected {expected_module!r}"
                  )
          print(f"Verified {len(paths)} Document Control workspace paths and controlled PDF reader route precedence")
          PY

      - name: Run Document Control domain invariants
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -q amodb/apps/doc_control/tests 2>&1 | tee /tmp/document-control-backend-tests.log

      - name: Run controlled PDF engine and source contracts explicitly
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            amodb/apps/doc_control/tests/test_pdf_reader_engine.py \
            amodb/apps/doc_control/tests/test_pdf_reader_source_contract.py \
            2>&1 | tee /tmp/document-control-pdf-engine-tests.log

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run browser PDF engine unit tests
        working-directory: frontend
        shell: bash
        run: npx vitest run src/pages/manuals/pdfReaderEngine.test.ts

      - name: Build Document Control frontend
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/document-control-frontend-build.log

      - name: Verify no seeded operational worklists remain routed
        shell: bash
        run: |
          set -o pipefail
          if grep -R -n -E "const (draftQueue|distributionEvents|temporaryRevisions|changeProposals|seededControlledLibrary)" frontend/src/pages/documentControl frontend/src/pages/DocControlPages.tsx; then
            echo "Seeded Document Control operational records remain in the routed implementation."
            exit 1
          fi
          if grep -n "DocControlPages\.legacy" frontend/src/pages/DocControlPages.tsx; then
            echo "The canonical Document Control page surface still exports the legacy seeded pages."
            exit 1
          fi

      - name: Upload Document Control diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: document-control-domain-diagnostics
          path: |
            /tmp/document-control-main-baseline.log
            /tmp/document-control-alembic-heads.log
            /tmp/document-control-alembic-graph.log
            /tmp/document-control-alembic-upgrade.log
            /tmp/document-control-backend-compile.log
            /tmp/document-control-backend-contract.log
            /tmp/document-control-backend-tests.log
            /tmp/document-control-pdf-engine-tests.log
            /tmp/document-control-frontend-build.log
          if-no-files-found: warn
          retention-days: 5
