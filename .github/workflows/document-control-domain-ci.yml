name: Document Control Domain CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/doc_control/**"
      - "backend/amodb/apps/manuals/**"
      - "backend/amodb/alembic/versions/document_control_*.py"
      - "backend/amodb/alembic/versions/aerodoc_*.py"
      - "backend/docs/document_control/**"
      - "frontend/src/pages/documentControl/**"
      - "frontend/src/pages/manuals/**"
      - "frontend/src/pages/DocControlPages.tsx"
      - "frontend/src/pages/docControlPublicationsBridge.css"
      - "frontend/src/services/documentControl*.ts"
      - "frontend/src/services/documentation.ts"
      - "frontend/src/services/pdfReader.ts"
      - "frontend/src/services/pdfWorkingCopyAuthority.ts"
      - "frontend/src/services/publications.ts"
      - ".github/workflows/document-control-domain-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-control-domain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amodb
          POSTGRES_PASSWORD: amodb
          POSTGRES_DB: amodb_document_control_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amodb -d amodb_document_control_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: document-control-ci-secret-key-not-for-production
      JWT_SECRET_KEY: document-control-ci-jwt-secret-not-for-production
      DATABASE_WRITE_URL: postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_ci
      DATABASE_READ_URL: postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_ci
      DATABASE_URL: postgresql+psycopg2://amodb:amodb@127.0.0.1:5432/amodb_document_control_ci
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "Document Control backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Upgrade clean PostgreSQL schema
        run: alembic -c backend/amodb/alembic.ini upgrade heads
      - name: Compile Document Control and Publications backend
        working-directory: backend
        run: python -m compileall -q amodb/apps/doc_control amodb/apps/manuals
      - name: Run Document Control domain invariants
        working-directory: backend
        run: pytest -q amodb/apps/doc_control/tests
      - name: Run Publications integration contracts
        working-directory: backend
        run: >-
          pytest -q
          amodb/apps/manuals/tests/test_pdf_reader_form_override.py
          amodb/apps/manuals/tests/test_pdf_reader_override_route_order.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Document Control frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Run browser PDF reader regressions
        working-directory: frontend
        run: npm exec -- vitest run src/pages/manuals/pdfReaderEngine.test.ts
      - name: Typecheck and build Document Control frontend
        working-directory: frontend
        run: npm run build
