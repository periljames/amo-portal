name: Materialize governed DMS payload

on:
  push:
    branches:
      - agent/dms-reader-governance-completion
    paths:
      - .github/dms-payload/**
      - scripts/materialize_dms_payload.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize reviewed files
        run: python scripts/materialize_dms_payload.py
      - name: Validate Python source
        run: python -m compileall -q backend/amodb/apps/doc_control backend/amodb/jobs backend/amodb/alembic/versions/docgov_20260806_governance.py
      - name: Commit materialized workspace
        run: |
          rm -rf .github/dms-payload scripts/materialize_dms_payload.py .github/workflows/materialize-dms-payload.yml
          git config user.name "amo-portal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(document-control): materialize governed document workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
