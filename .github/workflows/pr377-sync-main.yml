name: PR377 Sync Main

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.number == 377 && github.head_ref == 'fix/workforce-active-users-default-day'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workforce-active-users-default-day
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name 'periljames'
          git config user.email '244658594+periljames@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Remove one-shot workflow and trigger
        run: |
          rm -f .github/workflows/pr377-sync-main.yml
          rm -f .github/pr377-sync-trigger.txt
      - name: Commit cleanup and push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove PR377 synchronization workflow'
          fi
          git push origin HEAD:fix/workforce-active-users-default-day
