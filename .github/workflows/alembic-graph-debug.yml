name: Alembic Clean Schema Probe

on:
  push:
    branches:
      - agent/procurement-ux-document-control-review

permissions:
  contents: write

jobs:
  graph:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procurement_alembic_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procurement_alembic_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      SECRET_KEY: procurement-alembic-probe-secret
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/procurement_alembic_probe
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/procurement_alembic_probe
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/procurement_alembic_probe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/procurement-ux-document-control-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Inspect and upgrade source graph
        working-directory: backend
        run: |
          set +e
          {
            echo "=== ALEMBIC HEADS ==="
            alembic -c amodb/alembic.ini heads --verbose
            echo
            echo "=== PROCUREMENT REVISIONS ==="
            python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("amodb/alembic.ini"))
          for revision_id in ("procurement_20260803_full_domain", "procure_20260803_docs"):
              try:
                  revision = script.get_revision(revision_id)
                  print(revision_id, "resolved", revision.path, "down=", revision.down_revision)
              except Exception as exc:
                  print(revision_id, "FAILED", repr(exc))
          PY
            echo
            echo "=== CLEAN POSTGRES UPGRADE ==="
            alembic -c amodb/alembic.ini upgrade heads
            status=$?
            echo
            echo "UPGRADE_EXIT_STATUS=$status"
            exit $status
          } 2>&1 | tee /tmp/alembic-clean-probe.txt
          exit ${PIPESTATUS[0]}
      - name: Publish clean schema probe
        if: always()
        run: |
          mkdir -p docs
          cp /tmp/alembic-clean-probe.txt docs/alembic-clean-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/alembic-clean-probe.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Alembic clean schema probe"
          git push origin HEAD:agent/procurement-ux-document-control-review
