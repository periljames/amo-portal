name: PR364 Reachable Controls Retry

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rostering-automation-workforce-hr-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply corrected reachable-control patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr364-reachable-controls-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          old = '''approval_marker = \'''      <section className="wr-panel">
        <div className="wr-section-heading">
          <div><h2>Roster approval</h2></div>\'''
if approval_marker in governance_text:
    start = governance_text.index(approval_marker)
    end_marker = '      </section>\\n    </div>\\n  );'
    end = governance_text.index(end_marker, start) + len('      </section>')
    block = governance_text[start:end]
    wrapped = '      {showApprovalWorkflow ? (\\n' + indent(block, '  ') + '\\n      ) : null}'
    governance_text = governance_text[:start] + wrapped + governance_text[end:]
    governance_file.write_text(governance_text, encoding='utf-8')
elif '{showApprovalWorkflow ? (' not in governance_text:
    raise RuntimeError('Roster approval section anchor not found')'''
          new = '''approval_heading = '<div><h2>Roster approval</h2></div>'
if approval_heading in governance_text and '{showApprovalWorkflow ? (' not in governance_text:
    heading_position = governance_text.index(approval_heading)
    start = governance_text.rfind('      <section className="wr-panel">', 0, heading_position)
    if start < 0:
        raise RuntimeError('Roster approval section start not found')
    end = governance_text.index('      </section>', heading_position) + len('      </section>')
    block = governance_text[start:end]
    wrapped = '      {showApprovalWorkflow ? (\\n' + indent(block, '  ') + '\\n      ) : null}'
    governance_text = governance_text[:start] + wrapped + governance_text[end:]
    governance_file.write_text(governance_text, encoding='utf-8')
elif '{showApprovalWorkflow ? (' not in governance_text:
    raise RuntimeError('Roster approval section anchor not found')'''
          if old not in script:
              raise RuntimeError('Original governance matcher not found in staged fixer')
          script = script.replace(old, new, 1)
          exec(compile(script, '/tmp/pr364_reachable_controls.py', 'exec'))
          PY
      - name: Compile backend changes
        run: >-
          python -m compileall -q
          backend/amodb/apps/workforce/hr_schemas.py
          backend/amodb/apps/workforce/hr_service.py
          backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
      - name: Commit product fixes
        run: |
          if git diff --quiet -- backend frontend; then
            echo "Reachable control fixes already present"
            exit 0
          fi
          git config user.name "amo-portal-actions"
          git config user.email "actions@github.com"
          git add \
            backend/amodb/apps/workforce/hr_schemas.py \
            backend/amodb/apps/workforce/hr_service.py \
            backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py \
            frontend/src/pages/rostering/components/RosterGovernancePanel.tsx \
            frontend/src/pages/rostering/components/RosteringSetupWorkspace.tsx \
            frontend/src/pages/rostering/components/WorkforceHrWorkspace.tsx \
            frontend/src/pages/rostering/rosteringSetupExperience.test.ts \
            frontend/src/types/workforceHr.ts
          git commit -m "Restore reachable rostering controls and attendance evidence"
          git push origin HEAD:${{ github.head_ref }}
