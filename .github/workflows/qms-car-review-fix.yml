name: Apply QMS CAR review corrections

on:
  push:
    branches:
      - agent/qms-car-control-loop
    paths:
      - ".github/workflows/qms-car-review-fix.yml"

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/qms-car-control-loop
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              file_path.write_text(text.replace(old, new, 1))

          router = "backend/amodb/apps/quality/car_control_loop_router.py"
          replace_once(router, "    owner = payload.accountable_owner_user_id or car.assigned_to_user_id\n    _assert_user(db, amo_id=ctx.amo_id, user_id=owner)\n    final_due = payload.final_due_date or car.target_closure_date or car.due_date\n    if final_due is None:\n        raise HTTPException(status_code=422, detail=\"A controlled final due date is required to initialize the CAR control loop.\")\n", "    owner = payload.accountable_owner_user_id if \"accountable_owner_user_id\" in payload.model_fields_set else car.assigned_to_user_id\n    _assert_user(db, amo_id=ctx.amo_id, user_id=owner)\n    authoritative_due = car.target_closure_date or car.due_date\n    if payload.final_due_date is not None and authoritative_due is not None and payload.final_due_date != authoritative_due:\n        raise HTTPException(\n            status_code=422,\n            detail=\"The staged control loop must initialize from the authoritative CAR deadline. Use the governed CAR extension workflow to revise an existing deadline.\",\n        )\n    final_due = authoritative_due or payload.final_due_date\n    if final_due is None:\n        raise HTTPException(status_code=422, detail=\"A controlled final due date is required to initialize the CAR control loop.\")\n    if authoritative_due is None:\n        car.target_closure_date = final_due\n")
          replace_once(router, "    if payload.accountable_owner_user_id is not None:\n        _assert_user(db, amo_id=ctx.amo_id, user_id=payload.accountable_owner_user_id)\n        profile.accountable_owner_user_id = payload.accountable_owner_user_id\n", "    if \"accountable_owner_user_id\" in payload.model_fields_set:\n        _assert_user(db, amo_id=ctx.amo_id, user_id=payload.accountable_owner_user_id)\n        profile.accountable_owner_user_id = payload.accountable_owner_user_id\n")
          replace_once(router, "    if payload.owner_user_id is not None:\n        _assert_user(db, amo_id=ctx.amo_id, user_id=payload.owner_user_id)\n        row.owner_user_id = payload.owner_user_id\n    if payload.notes is not None:\n", "    if \"owner_user_id\" in payload.model_fields_set:\n        _assert_user(db, amo_id=ctx.amo_id, user_id=payload.owner_user_id)\n        row.owner_user_id = payload.owner_user_id\n    if payload.notes is not None:\n")
          replace_once(router, "    car.closed_at = car.closed_at or _utcnow()\n    car.evidence_ref = evidence_ref\n    _add_event(\n", "    car.evidence_ref = evidence_ref\n    # Preserve the canonical accepted-close side effects used by the existing\n    # Quality CAR workflow (authoritative RCA/CAPA acceptance, evidence\n    # verification, linked finding/CAP closeout and related task closure).\n    from .router import _close_accepted_car_workflow\n\n    _close_accepted_car_workflow(db, car, actor_user_id=ctx.user_id)\n    _add_event(\n")

          service = "frontend/src/services/qmsCarControlLoop.ts"
          replace_once(service, "    accountable_owner_user_id?: string;\n    final_due_date?: string;\n", "    accountable_owner_user_id?: string | null;\n    final_due_date?: string;\n")
          replace_once(service, "  payload: { accountable_owner_user_id?: string; effectiveness_required?: boolean },\n", "  payload: { accountable_owner_user_id?: string | null; effectiveness_required?: boolean },\n")
          replace_once(service, "  payload: { owner_user_id?: string; status?: CarControlMilestoneStatus; notes?: string; evidence_ref?: string },\n", "  payload: { owner_user_id?: string | null; status?: CarControlMilestoneStatus; notes?: string; evidence_ref?: string },\n")

          page = "frontend/src/pages/qms/QmsCarControlLoopPage.tsx"
          replace_once(page, "  const control = controlQuery.data;\n  const assignees = assigneesQuery.data ?? [];\n  const assigneeOptions = useMemo(\n", "  const control = controlQuery.data;\n  const assignees = useMemo(() => assigneesQuery.data ?? [], [assigneesQuery.data]);\n  const assigneeOptions = useMemo(\n")
          replace_once(page, "  async function runAction(label: string, action: () => Promise<CarControlLoop>, success: string): Promise<void> {\n    setBusy(label);\n    setActionError(null);\n    setActionMessage(null);\n    try {\n      const next = await action();\n      queryClient.setQueryData([\"qms-car-control-loop\", amoCode, carId], next);\n      setActionMessage(success);\n    } catch (error) {\n      setActionError(error instanceof Error ? error.message : \"The governed CAR action could not be completed.\");\n    } finally {\n      setBusy(null);\n    }\n  }\n", "  async function runAction(label: string, action: () => Promise<CarControlLoop>, success: string): Promise<boolean> {\n    setBusy(label);\n    setActionError(null);\n    setActionMessage(null);\n    try {\n      const next = await action();\n      queryClient.setQueryData([\"qms-car-control-loop\", amoCode, carId], next);\n      setActionMessage(success);\n      return true;\n    } catch (error) {\n      setActionError(error instanceof Error ? error.message : \"The governed CAR action could not be completed.\");\n      return false;\n    } finally {\n      setBusy(null);\n    }\n  }\n")
          replace_once(page, "accountable_owner_user_id: initOwner || undefined, final_due_date: initDue || undefined", "accountable_owner_user_id: initOwner || null, final_due_date: initDue || undefined")
          replace_once(page, "accountable_owner_user_id: profileOwner || undefined, effectiveness_required: profileEffectiveness", "accountable_owner_user_id: profileOwner || null, effectiveness_required: profileEffectiveness")
          replace_once(page, "owner_user_id: draft.owner_user_id || undefined, status: draft.status, notes: draft.notes, evidence_ref: draft.evidence_ref", "owner_user_id: draft.owner_user_id || null, status: draft.status, notes: draft.notes, evidence_ref: draft.evidence_ref")
          replace_once(page, "\"Dependency recorded.\").then(() => { setDependencyTitle(\"\"); setDependencyMitigation(\"\"); })", "\"Dependency recorded.\").then((succeeded) => { if (succeeded) { setDependencyTitle(\"\"); setDependencyMitigation(\"\"); } })")
          replace_once(page, "\"Deadline change submitted for governed decision.\").then(() => { setDeadlineDate(\"\"); setDeadlineReason(\"\"); setDeadlineImpact(\"\"); })", "\"Deadline change submitted for governed decision.\").then((succeeded) => { if (succeeded) { setDeadlineDate(\"\"); setDeadlineReason(\"\"); setDeadlineImpact(\"\"); } })")

          test_path = "backend/amodb/apps/quality/tests/test_car_control_loop.py"
          test_file = Path(test_path)
          tests = test_file.read_text()
          addition = "\n\ndef test_nullable_owner_payloads_distinguish_omitted_from_explicit_clear() -> None:\n    from amodb.apps.quality.car_control_loop_router import ControlLoopInitialize, ControlProfileUpdate, MilestoneUpdate\n\n    assert \"accountable_owner_user_id\" not in ControlLoopInitialize(effectiveness_required=True).model_fields_set\n    assert \"accountable_owner_user_id\" in ControlLoopInitialize(accountable_owner_user_id=None, effectiveness_required=True).model_fields_set\n    assert \"accountable_owner_user_id\" not in ControlProfileUpdate().model_fields_set\n    assert \"accountable_owner_user_id\" in ControlProfileUpdate(accountable_owner_user_id=None).model_fields_set\n    assert \"owner_user_id\" not in MilestoneUpdate().model_fields_set\n    assert \"owner_user_id\" in MilestoneUpdate(owner_user_id=None).model_fields_set\n"
          if "test_nullable_owner_payloads_distinguish_omitted_from_explicit_clear" in tests:
              raise SystemExit("Regression test already present unexpectedly")
          test_file.write_text(tests.rstrip() + addition.rstrip() + "\n")

          for path, needles in {
              router: ["from .router import _close_accepted_car_workflow", "_close_accepted_car_workflow(db, car, actor_user_id=ctx.user_id)", 'if "accountable_owner_user_id" in payload.model_fields_set:', 'if "owner_user_id" in payload.model_fields_set:', "Use the governed CAR extension workflow to revise an existing deadline."],
              page: ["Promise<boolean>", "accountable_owner_user_id: profileOwner || null", ".then((succeeded) => { if (succeeded)"],
          }.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"Missing expected review fix in {path}: {needle}")
          PY
      - name: Compile changed Python surfaces
        run: |
          python -m compileall -q \
            backend/amodb/apps/quality/car_control_loop_router.py \
            backend/amodb/apps/quality/tests/test_car_control_loop.py
      - name: Commit corrected implementation
        run: |
          rm .github/workflows/qms-car-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/amodb/apps/quality/car_control_loop_router.py \
                  backend/amodb/apps/quality/tests/test_car_control_loop.py \
                  frontend/src/services/qmsCarControlLoop.ts \
                  frontend/src/pages/qms/QmsCarControlLoopPage.tsx \
                  .github/workflows/qms-car-review-fix.yml
          git diff --cached --check
          git commit -m "fix(quality): preserve CAR governance invariants"
          git push origin HEAD:agent/qms-car-control-loop
