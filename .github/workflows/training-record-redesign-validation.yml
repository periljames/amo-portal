name: PR 506 Training Hardening Patch

on:
  push:
    branches:
      - codex/training-record-redesign-20260817

permissions:
  contents: write

concurrency:
  group: pr506-training-hardening-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
          fetch-depth: 0
      - name: Apply audited Training hardening patch
        run: python scripts/pr506_training_hardening_patch.py
      - name: Verify forbidden legacy semantics are gone
        shell: bash
        run: |
          ! grep -R "_seed_refresher_records_from_initial\|AUTO-SEEDED FROM INITIAL" backend/amodb/apps/training/router.py
          ! grep -n "function coursePhase\|function familyKey" frontend/src/pages/TrainingCompetencePage.tsx
          ! grep -n "_normalized_course_text" backend/amodb/apps/training/compliance.py
          test ! -e scripts/pr506_training_hardening_patch.py
      - name: Commit patched sources and restored validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Training lifecycle and governed records"
          git push origin HEAD:codex/training-record-redesign-20260817
