name: Publications Reader CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/manuals/**"
      - "frontend/src/pages/manuals/**"
      - "frontend/src/pages/DocControl*"
      - "frontend/src/pages/docControlPublicationsBridge.css"
      - "frontend/src/services/publications.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/router.legacy.tsx"
      - "frontend/src/components/Layout/DepartmentLayout.tsx"
      - "frontend/src/components/Layout/DepartmentLayout.legacy.tsx"
      - ".github/workflows/publications-reader-ci.yml"

permissions:
  contents: read

jobs:
  publications-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Publications backend
        working-directory: backend
        run: python -m compileall -q amodb/apps/manuals
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Build Publications frontend
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/publications-frontend-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publications-frontend-build
          path: /tmp/publications-frontend-build.log
          if-no-files-found: warn
          retention-days: 3
