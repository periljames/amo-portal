name: Publications Reader CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/manuals/**"
      - "backend/amodb/apps/doc_control/pdfium_service.py"
      - "backend/amodb/apps/doc_control/tests/test_pdf_reader_*.py"
      - "backend/docs/document_control/PDF_READER_ENGINE_HARDENING_*.md"
      - "frontend/src/pages/manuals/**"
      - "frontend/src/pages/DocControl*"
      - "frontend/src/pages/docControlPublicationsBridge.css"
      - "frontend/src/services/publications.ts"
      - "frontend/src/services/pdfReader.ts"
      - "frontend/src/services/pdfWorkingCopyAuthority.ts"
      - "frontend/src/services/documentation.ts"
      - ".github/workflows/publications-reader-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publications-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publications-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SECRET_KEY: publications-reader-ci-secret-key-not-for-production
      JWT_SECRET_KEY: publications-reader-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "Publications Reader backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Publications and PDF engine backend
        working-directory: backend
        run: python -m compileall -q amodb/apps/manuals amodb/apps/doc_control/pdfium_service.py
      - name: Run controlled PDF engine and source contracts
        working-directory: backend
        run: >-
          pytest -q
          amodb/apps/doc_control/tests/test_pdf_reader_engine.py
          amodb/apps/doc_control/tests/test_pdf_reader_source_contract.py
          amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py
          amodb/apps/manuals/tests/test_pdf_reader_form_override.py
          amodb/apps/manuals/tests/test_pdf_reader_override_route_order.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Publications Reader frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Run browser PDF engine unit tests
        working-directory: frontend
        run: npm exec -- vitest run src/pages/manuals/pdfReaderEngine.test.ts
      - name: Build Publications frontend
        working-directory: frontend
        run: npm run build
