name: Publications Reader CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/manuals/**"
      - "backend/amodb/apps/doc_control/pdfium_service.py"
      - "backend/amodb/apps/doc_control/pdf_capability_service.py"
      - "backend/amodb/apps/doc_control/pdf_capability_prewarm.py"
      - "backend/amodb/apps/doc_control/pdf_safe_processing_service.py"
      - "backend/amodb/apps/doc_control/tests/test_pdf_*.py"
      - "backend/docs/document_control/PDF_READER_ENGINE_HARDENING_*.md"
      - "frontend/src/pages/manuals/**"
      - "frontend/src/pages/DocControl*"
      - "frontend/src/pages/docControlPublicationsBridge.css"
      - "frontend/src/services/publications.ts"
      - "frontend/src/services/pdfReader.ts"
      - "frontend/src/services/pdfWorkingCopyAuthority.ts"
      - "frontend/src/services/documentation.ts"
      - ".github/workflows/publications-reader-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publications-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect shared tenant-shell changes
    runs-on: ubuntu-latest
    outputs:
      tenant_shell: ${{ steps.changed.outputs.tenant_shell }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
      - id: changed
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-$(git rev-parse HEAD^)}"
          head_sha="${PR_HEAD_SHA:-$(git rev-parse HEAD)}"
          git diff --name-only "$base_sha" "$head_sha" | sort -u | tee changed-files.txt
          if grep -Eq '^backend/amodb/apps/accounts/(admin_profile|department_home)|^backend/amodb/apps/accounts/tests/test_(admin_profile|department_home)|^frontend/(playwright\.tenant\.config\.ts|scripts/check-css-contract\.mjs|tests/e2e/tenant-shell-theme\.spec\.ts)$|^frontend/src/(App\.tsx|main\.tsx|router\.tsx|portalRoutes\.tsx|app/(PortalRouteSurface|TenantRouteBoundary|portalRouteManifest)|components/Layout/DepartmentLayout|hooks/usePortalAppearance|pages/DepartmentHomePage|services/(adminProfileMode|departmentHome)|styles/(index|tokens|base|theme-contract|theme-module-repairs|department-home)|styles/components/tenant-shell|styles/foundations/)' changed-files.txt; then
            echo 'tenant_shell=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tenant_shell=false' >> "$GITHUB_OUTPUT"
          fi

  publications-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SECRET_KEY: publications-reader-ci-secret-key-not-for-production
      JWT_SECRET_KEY: publications-reader-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "Publications Reader backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Publications and PDF engine backend
        working-directory: backend
        run: >-
          python -m compileall -q
          amodb/apps/manuals
          amodb/apps/doc_control/pdfium_service.py
          amodb/apps/doc_control/pdf_capability_service.py
          amodb/apps/doc_control/pdf_capability_prewarm.py
          amodb/apps/doc_control/pdf_safe_processing_service.py
      - id: engine
        name: Run core PDF engine contracts
        continue-on-error: true
        working-directory: backend
        run: pytest -q --tb=short amodb/apps/doc_control/tests/test_pdf_reader_engine.py
      - id: source
        name: Run PDF source contracts
        continue-on-error: true
        working-directory: backend
        run: pytest -q --tb=short amodb/apps/doc_control/tests/test_pdf_reader_source_contract.py
      - id: hardening
        name: Run final PDF hardening contracts
        continue-on-error: true
        working-directory: backend
        run: pytest -q --tb=short amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py
      - id: interaction
        name: Run PDF interaction architecture contracts
        continue-on-error: true
        working-directory: backend
        run: pytest -q --tb=short amodb/apps/doc_control/tests/test_pdf_reader_interaction_contract.py
      - id: capability
        name: Run PDF capability cache contracts
        continue-on-error: true
        working-directory: backend
        run: pytest -q --tb=short amodb/apps/doc_control/tests/test_pdf_capability_service.py
      - id: forms
        name: Run PDF form and route-order contracts
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q --tb=short
          amodb/apps/manuals/tests/test_pdf_reader_form_override.py
          amodb/apps/manuals/tests/test_pdf_reader_override_route_order.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Publications Reader frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - id: engine_unit
        name: Run browser PDF engine unit tests
        continue-on-error: true
        working-directory: frontend
        run: npm exec -- vitest run src/pages/manuals/pdfReaderEngine.test.ts
      - id: virtual_unit
        name: Run PDF virtualization unit tests
        continue-on-error: true
        working-directory: frontend
        run: npm exec -- vitest run src/pages/manuals/pdfReaderVirtualization.test.ts
      - id: typecheck
        name: Typecheck Publications frontend
        continue-on-error: true
        working-directory: frontend
        run: npx tsc -b
      - id: modal_audit
        name: Run modal layer audit
        continue-on-error: true
        working-directory: frontend
        run: npm run check:modals
      - id: vite
        name: Build Publications Vite bundle
        continue-on-error: true
        working-directory: frontend
        run: npx vite build
      - name: Enforce Publications Reader validation
        if: always()
        env:
          ENGINE: ${{ steps.engine.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          HARDENING: ${{ steps.hardening.outcome }}
          INTERACTION: ${{ steps.interaction.outcome }}
          CAPABILITY: ${{ steps.capability.outcome }}
          FORMS: ${{ steps.forms.outcome }}
          ENGINE_UNIT: ${{ steps.engine_unit.outcome }}
          VIRTUAL_UNIT: ${{ steps.virtual_unit.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          MODAL_AUDIT: ${{ steps.modal_audit.outcome }}
          VITE: ${{ steps.vite.outcome }}
        run: |
          failures=0
          check_result() {
            name="$1"
            result="$2"
            printf '%s=%s\n' "$name" "$result"
            if [ "$result" != "success" ]; then
              failures=$((failures + 1))
              echo "::error title=$name failed::$name completed with outcome $result."
            fi
          }
          check_result engine "$ENGINE"
          check_result source "$SOURCE"
          check_result hardening "$HARDENING"
          check_result interaction "$INTERACTION"
          check_result capability "$CAPABILITY"
          check_result forms "$FORMS"
          check_result engine_unit "$ENGINE_UNIT"
          check_result virtual_unit "$VIRTUAL_UNIT"
          check_result typecheck "$TYPECHECK"
          check_result modal_audit "$MODAL_AUDIT"
          check_result vite "$VITE"
          if [ "$failures" -ne 0 ]; then
            echo "::error title=Publications Reader validation failed::$failures validation group(s) failed."
            exit 1
          fi

  tenant-completion:
    name: Tenant shell and department-home completion
    needs: scope
    if: needs.scope.outputs.tenant_shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: tenant-completion-secret
      QUALITY_SCHEMA_STRICT: "0"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "Tenant completion backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile and import tenant backend surfaces
        working-directory: backend
        run: |
          python -m compileall -q amodb/apps/accounts amodb/apps/quality/tenant_security.py
          python -c "import amodb.main; print('Tenant backend imported')"
      - name: Run tenant governance, home and route-isolation tests
        working-directory: backend
        run: >-
          pytest -q
          amodb/apps/accounts/tests/test_admin_profile_governance.py
          amodb/apps/accounts/tests/test_department_home_security.py
          amodb/apps/quality/tests/test_tenant_route_isolation.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Tenant completion frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Run route, home and CSS contracts
        working-directory: frontend
        run: npm run test:tenant-shell
      - name: Run Quality home contracts
        working-directory: frontend
        run: npm run test:qms-overview
      - name: Typecheck and build the integrated frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium for focused layout checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify light and dark desktop/mobile layouts
        working-directory: frontend
        run: npm run test:tenant-render
