name: Publications Reader CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/manuals/**"
      - "backend/amodb/apps/doc_control/pdfium_service.py"
      - "backend/amodb/apps/doc_control/tests/test_pdf_reader_*.py"
      - "backend/docs/document_control/PDF_READER_ENGINE_HARDENING_*.md"
      - "backend/requirements.txt"
      - "frontend/src/pages/manuals/**"
      - "frontend/src/pages/DocControl*"
      - "frontend/src/pages/docControlPublicationsBridge.css"
      - "frontend/src/services/publications.ts"
      - "frontend/src/services/pdfReader.ts"
      - "frontend/src/services/pdfWorkingCopyAuthority.ts"
      - "frontend/src/services/documentation.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/router.legacy.tsx"
      - "frontend/src/components/Layout/DepartmentLayout.tsx"
      - "frontend/src/components/Layout/DepartmentLayout.legacy.tsx"
      - ".github/workflows/publications-reader-ci.yml"
      - ".github/workflows/document-control-domain-ci.yml"

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  publications-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      SECRET_KEY: publications-reader-ci-secret-key-not-for-production
      JWT_SECRET_KEY: publications-reader-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Publications and PDF engine backend
        working-directory: backend
        run: python -m compileall -q amodb/apps/manuals amodb/apps/doc_control/pdfium_service.py
      - name: Run controlled PDF engine and source contracts
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -q \
            amodb/apps/doc_control/tests/test_pdf_reader_engine.py \
            amodb/apps/doc_control/tests/test_pdf_reader_source_contract.py \
            amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py \
            2>&1 | tee /tmp/publications-pdf-engine-tests.log
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run browser PDF engine unit tests
        working-directory: frontend
        shell: bash
        run: npx vitest run src/pages/manuals/pdfReaderEngine.test.ts
      - name: Build Publications frontend
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/publications-frontend-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: publications-reader-diagnostics
          path: |
            /tmp/publications-pdf-engine-tests.log
            /tmp/publications-frontend-build.log
          if-no-files-found: warn
          retention-days: 5

  apply-verified-reader-bundle:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/document-reader-pdfium-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the writable PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/document-reader-pdfium-hardening
          fetch-depth: 0

      - name: Retrieve, validate, and publish the verified reader files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: 52a7f420a5cff8a52bfbd6d6bd5c3dfb304d77ba
          COMMENT_ID: '5145575459'
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/comment-body.txt
          sed -n '/^BUNDLE_BASE64_START$/,/^BUNDLE_BASE64_END$/p' /tmp/comment-body.txt \
            | sed '1d;$d' \
            | tr -d '\r\n' > /tmp/reader-bundle.b64
          test -s /tmp/reader-bundle.b64
          base64 --decode /tmp/reader-bundle.b64 > /tmp/reader-bundle.tar.gz

          tar -tzf /tmp/reader-bundle.tar.gz | LC_ALL=C sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          backend/amodb/apps/doc_control/pdfium_service.py
          backend/amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py
          backend/amodb/apps/doc_control/tests/test_pdf_reader_interaction_contract.py
          frontend/src/pages/manuals/PdfReaderCore.tsx
          frontend/src/pages/manuals/pdfReaderEngine.test.ts
          frontend/src/pages/manuals/pdfReaderEngine.ts
          EOF
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/actual-files.txt; then
            echo 'Unsafe bundle path detected' >&2
            exit 1
          fi

          mkdir -p /tmp/reader-bundle
          tar -xzf /tmp/reader-bundle.tar.gz -C /tmp/reader-bundle
          while IFS= read -r file; do
            install -D -m 0644 "/tmp/reader-bundle/${file}" "${file}"
          done < /tmp/expected-files.txt

          git diff --check
          git diff --name-only HEAD -- | LC_ALL=C sort > /tmp/changed-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

          git config user.name 'AMO Portal automation'
          git config user.email 'actions@users.noreply.github.com'
          while IFS= read -r file; do
            git add -- "$file"
          done < /tmp/expected-files.txt
          git commit -m 'Complete PDF reader navigation and form custody'
          git push origin HEAD:agent/document-reader-pdfium-hardening
