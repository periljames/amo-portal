name: Reliability Completion Diagnostic V3

on:
  push:
    branches:
      - agent/reliability-v2-foundation
    paths:
      - docs/reliability/.completion-diagnostic-v3-trigger

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_reliability_diagnostic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_reliability_diagnostic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_reliability_diagnostic
      WRITE_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_reliability_diagnostic
      SECRET_KEY: reliability-diagnostic-secret
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Run deterministic completion diagnostic
        continue-on-error: true
        run: python backend/scripts/run_reliability_completion_diagnostic.py
      - name: Publish exact diagnostic report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reliability/COMPLETE_SCOPE_DIAGNOSTIC.md
          git commit -m "Record complete Reliability full-stack diagnostic" || true
          git push origin HEAD:agent/reliability-v2-foundation
