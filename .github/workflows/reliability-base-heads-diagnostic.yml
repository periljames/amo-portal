name: Reliability Base Heads Diagnostic

on:
  push:
    branches:
      - agent/reliability-404-clean-final

permissions:
  contents: read

jobs:
  alembic-heads:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      SECRET_KEY: reliability-diagnostic-secret-not-for-production
      JWT_SECRET_KEY: reliability-diagnostic-jwt-not-for-production
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Print Alembic heads
        run: python -m alembic -c backend/amodb/alembic.ini heads
