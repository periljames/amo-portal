name: Aircraft Architecture Source Repair

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-architecture-source-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-training-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair Python 3.11-incompatible Training f-strings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/amodb/apps/training/router.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          repairs = 0

          for index, line in list(enumerate(lines)):
              if "rendered = f" in line and "json.dumps(payload, separators=" in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index:index + 1] = [
                      f'{indent}rendered_payload = json.dumps(payload, separators=(",", ":"))',
                      f'{indent}rendered = f"{{_TRAINING_EVENT_META_PREFIX}}{{rendered_payload}}"',
                  ]
                  repairs += 1
                  break

          for index, line in list(enumerate(lines)):
              if "content_disposition = f" in line and "path.name.replace" in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index:index + 1] = [
                      f'{indent}safe_path_name = path.name.replace(\'"\', "_")',
                      f'{indent}content_disposition = (',
                      f'{indent}    f\'attachment; filename="{{document_key.lower().replace("_", "-")}}-{{safe_path_name}}"\'',
                      f'{indent})',
                  ]
                  repairs += 1
                  break

          if repairs:
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              print(f"Applied {repairs} Python 3.11 source repair(s) to {path}")
          else:
              print("Training router repairs already applied; no source change required")
          PY
      - name: Compile repaired Training router with Python 3.11
        run: python -m py_compile backend/amodb/apps/training/router.py
      - name: Commit source repair
        run: |
          if git diff --quiet -- backend/amodb/apps/training/router.py; then
            echo "No repair commit required."
            exit 0
          fi
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/amodb/apps/training/router.py
          git commit -m "Phase U1 QC: repair Training router Python 3.11 syntax"
          git push origin HEAD:agent/aircraft-induction-architecture
