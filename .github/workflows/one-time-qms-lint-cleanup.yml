name: One-time QMS lint cleanup

on:
  push:
    branches:
      - agent/qms-modern-business-planner

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qms-modern-business-planner
          fetch-depth: 0
      - name: Apply QMS lint corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          scale = Path("frontend/src/components/QMS/PortalTextScaleManager.tsx")
          text = scale.read_text(encoding="utf-8")
          text = text.replace('import React, { useEffect, useMemo, useState } from "react";', 'import React, { useEffect, useState } from "react";')
          text = text.replace('''  const user = getCachedUser();
  const identity = `${user?.id || "anonymous"}:${user?.amo_id || "platform"}`;
  const storageKey = useMemo(() => preferenceStorageKey(), [identity]);''', '''  const storageKey = preferenceStorageKey();''')
          text = text.replace('''  useEffect(() => {
    const stored = readStoredScale();
    setScale(stored);
    applyScale(stored);
  }, [storageKey]);''', '''  useEffect(() => {
    applyScale(scale);
  }, [scale]);''')
          scale.write_text(text, encoding="utf-8")

          tabs = Path("frontend/src/components/QMS/QualityContextTabs.tsx")
          text = tabs.read_text(encoding="utf-8")
          text = text.replace('''    if (!qualityActive) {
      document.querySelector(".quality-context-bar-host")?.remove();
      setMountTarget(null);
      return;
    }''', '''    if (!qualityActive) {
      document.querySelector(".quality-context-bar-host")?.remove();
      return;
    }''')
          tabs.write_text(text, encoding="utf-8")

          legacy = Path("frontend/src/pages/qms/QmsCanonicalLegacyPage.tsx")
          text = legacy.read_text(encoding="utf-8")
          text = text.replace('''    const idle = (window as any).requestIdleCallback as undefined | ((cb: () => void, options?: { timeout?: number }) => number);
    if (idle) {
      const id = idle(run, { timeout: 900 });
      return () => {
        const cancel = (window as any).cancelIdleCallback as undefined | ((id: number) => void);
        if (cancel) cancel(id);
      };
    }''', '''    const idleWindow = window as Window & {
      requestIdleCallback?: (callback: () => void, options?: { timeout?: number }) => number;
      cancelIdleCallback?: (id: number) => void;
    };
    const idle = idleWindow.requestIdleCallback;
    if (idle) {
      const id = idle(run, { timeout: 900 });
      return () => {
        idleWindow.cancelIdleCallback?.(id);
      };
    }''')
          legacy.write_text(text, encoding="utf-8")

          register = Path("frontend/src/pages/qms/QmsRegisterPage.tsx")
          text = register.read_text(encoding="utf-8")
          text = text.replace('''  useEffect(() => {
    void load();
    return () => abortRef.current?.abort(new DOMException("Quality register unmounted", "AbortError"));
  }, [load]);''', '''  useEffect(() => {
    const timer = window.setTimeout(() => {
      void load();
    }, 0);
    return () => {
      window.clearTimeout(timer);
      abortRef.current?.abort(new DOMException("Quality register unmounted", "AbortError"));
    };
  }, [load]);''')
          register.write_text(text, encoding="utf-8")
          PY
      - name: Commit corrections and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/QMS/PortalTextScaleManager.tsx frontend/src/components/QMS/QualityContextTabs.tsx frontend/src/pages/qms/QmsCanonicalLegacyPage.tsx frontend/src/pages/qms/QmsRegisterPage.tsx
          git rm .github/workflows/one-time-qms-lint-cleanup.yml
          git commit -m "Resolve QMS frontend lint blockers"
          git push origin HEAD:agent/qms-modern-business-planner
