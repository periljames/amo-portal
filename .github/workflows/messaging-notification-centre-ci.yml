name: Messaging and Notification Centre CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/amodb/apps/realtime/**"
      - "backend/amodb/apps/doc_control/reminder_runtime_guard.py"
      - "backend/amodb/apps/doc_control/reminder_service.py"
      - "backend/amodb/apps/doc_control/workflow_notifications.py"
      - "backend/amodb/apps/doc_control/workspace_publication_distribution.py"
      - "backend/amodb/apps/doc_control/workspace_retention_accountability_router.py"
      - "backend/amodb/apps/training/calendar_update_dispatch.py"
      - "backend/amodb/apps/training/operating_service.py"
      - "backend/amodb/apps/training/readiness_service.py"
      - "frontend/src/components/Layout/DepartmentLayoutImpl.tsx"
      - "frontend/src/components/messaging/**"
      - "frontend/src/services/messaging.ts"
      - "frontend/src/services/messaging.test.ts"
      - "frontend/src/styles/components/messaging.css"
      - ".github/workflows/messaging-notification-centre-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messaging-notification-centre-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SECRET_KEY: messaging-notification-ci-secret
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "messaging dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Run messaging, notification and tenant-isolation tests
        run: pytest amodb/apps/realtime/tests/test_messaging_hardening.py amodb/apps/realtime/tests/test_realtime_security_hardening.py -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run notification and messaging unit tests
        run: npm exec -- vitest run src/components/messaging/notificationModel.test.ts src/services/messaging.test.ts src/components/feedback/toastPolicy.test.ts
      - name: Lint changed messaging surfaces
        run: npm exec -- eslint src/components/messaging/MessagingHub.tsx src/components/messaging/notificationModel.ts src/services/messaging.ts src/components/Layout/DepartmentLayoutImpl.tsx
      - name: Typecheck production frontend
        run: npx tsc -b
      - name: Validate CSS contracts
        run: npm run check:css
