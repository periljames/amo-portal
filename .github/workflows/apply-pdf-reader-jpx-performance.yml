name: Apply PDF reader JPX and performance repair

on:
  push:
    branches:
      - agent/pdf-reader-jpx-assets-performance
    paths:
      - .github/triggers/apply-pdf-reader-jpx-performance.txt

permissions:
  contents: write

concurrency:
  group: apply-pdf-reader-jpx-performance
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pdf-reader-jpx-assets-performance
          fetch-depth: 0
          token: ${{ github.token }}
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply deterministic reader patch
        run: |
          python .github/scripts/apply_pdf_reader_runtime_fix.py
          python - <<'PY'
          from pathlib import Path

          contract = Path('backend/amodb/apps/doc_control/tests/test_pdf_reader_interaction_contract.py')
          source = contract.read_text(encoding='utf-8')
          source = source.replace(
              '    assert "viteStaticCopy" in vite\n',
              '    assert "fs.cpSync" in vite\n    assert "pdfJsRuntimeAssetsPlugin" in vite\n',
          )
          contract.write_text(source, encoding='utf-8')
          PY

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build frontend and verify shipped decoder resources
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build
          pdfjs_version="$(node -p "require('./node_modules/pdfjs-dist/package.json').version")"
          export PDFJS_VERSION="$pdfjs_version"
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path.cwd()
          version = os.environ["PDFJS_VERSION"]
          for directory in ("wasm", "cmaps", "standard_fonts"):
              source = root / "node_modules" / "pdfjs-dist" / directory
              target = root / "dist" / "pdfjs" / version / directory
              if not source.is_dir():
                  raise SystemExit(f"Missing installed PDF.js source directory: {source}")
              if not target.is_dir():
                  raise SystemExit(f"Missing built PDF.js asset directory: {target}")
              source_files = {path.relative_to(source).as_posix() for path in source.rglob("*") if path.is_file()}
              target_files = {path.relative_to(target).as_posix() for path in target.rglob("*") if path.is_file()}
              missing = sorted(source_files - target_files)
              if missing:
                  raise SystemExit(f"PDF.js {directory} assets missing from build: {missing[:20]}")
              print(f"Verified {len(source_files)} copied PDF.js {directory} files.")

          wasm_names = {
              path.name.lower()
              for path in (root / "dist" / "pdfjs" / version / "wasm").rglob("*")
              if path.is_file()
          }
          if "openjpeg.wasm" not in wasm_names:
              raise SystemExit(f"OpenJPEG WASM runtime not found. Built files: {sorted(wasm_names)}")
          if "openjpeg_nowasm_fallback.js" not in wasm_names:
              raise SystemExit(f"OpenJPEG JavaScript fallback not found. Built files: {sorted(wasm_names)}")
          if "qcms_bg.wasm" not in wasm_names:
              raise SystemExit(f"QCMS runtime not found. Built files: {sorted(wasm_names)}")
          print("OpenJPEG WASM, JavaScript fallback and QCMS assets are present in the production build.")
          PY

      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "PDF reader backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Run focused source contracts
        env:
          PYTHONPATH: backend
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: '1'
          DATABASE_URL: sqlite+pysqlite:///:memory:
          DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
          SECRET_KEY: pdf-reader-runtime-contract-secret
        run: |
          pytest -q \
            backend/amodb/apps/doc_control/tests/test_pdf_reader_interaction_contract.py \
            backend/amodb/apps/doc_control/tests/test_pdf_reader_source_contract.py
          git diff --check

      - name: Commit validated product changes
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_pdf_reader_runtime_fix.py
          rm -f .github/triggers/apply-pdf-reader-jpx-performance.txt
          rm -f .github/workflows/apply-pdf-reader-jpx-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ship PDF.js decoders and accelerate publication rendering'
          git push origin HEAD:agent/pdf-reader-jpx-assets-performance
