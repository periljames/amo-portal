name: PR364 Reachable Controls Fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rostering-automation-workforce-hr-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore governance controls and attendance visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import indent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise RuntimeError(f'Expected source block not found in {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Make the mature governance component reusable in Setup without
          # duplicating Command's submitted-roster decision workflow.
          governance_path = 'frontend/src/pages/rostering/components/RosterGovernancePanel.tsx'
          replace_once(
              governance_path,
              '''export function RosterGovernancePanel({
            people,
            periods,
            bases,
            canManageRules,
            canManageAuthorities,
          }: {
            people: RosterPersonRead[];
            periods: RosterPeriodRead[];
            bases: Array<{ id: string; code: string }>;
            canManageRules: boolean;
            canManageAuthorities: boolean;
          }) {''',
              '''export function RosterGovernancePanel({
            people,
            periods,
            bases,
            canManageRules,
            canManageAuthorities,
            showApprovalWorkflow = true,
          }: {
            people: RosterPersonRead[];
            periods: RosterPeriodRead[];
            bases: Array<{ id: string; code: string }>;
            canManageRules: boolean;
            canManageAuthorities: boolean;
            showApprovalWorkflow?: boolean;
          }) {''',
          )
          replace_once(
              governance_path,
              '    enabled: Boolean(effectiveVersionId),',
              '    enabled: Boolean(effectiveVersionId) && showApprovalWorkflow,',
          )
          governance_file = Path(governance_path)
          governance_text = governance_file.read_text(encoding='utf-8')
          approval_marker = '''      <section className="wr-panel">
            <div className="wr-section-heading">
              <div><h2>Roster approval</h2></div>'''
          if approval_marker in governance_text:
              start = governance_text.index(approval_marker)
              end_marker = '      </section>\n    </div>\n  );'
              end = governance_text.index(end_marker, start) + len('      </section>')
              block = governance_text[start:end]
              wrapped = '      {showApprovalWorkflow ? (\n' + indent(block, '  ') + '\n      ) : null}'
              governance_text = governance_text[:start] + wrapped + governance_text[end:]
              governance_file.write_text(governance_text, encoding='utf-8')
          elif '{showApprovalWorkflow ? (' not in governance_text:
              raise RuntimeError('Roster approval section anchor not found')

          # Re-expose rule editing and authority assignment inside the new
          # guided Setup policy section.
          setup_path = 'frontend/src/pages/rostering/components/RosteringSetupWorkspace.tsx'
          replace_once(
              setup_path,
              '''import type { ShiftTemplateKind, ShiftTemplateRead } from "../../../types/rostering";''',
              '''import { listAllRosterPeople } from "../../../services/rosterPeople";
          import type { ShiftTemplateKind, ShiftTemplateRead } from "../../../types/rostering";''',
          )
          replace_once(
              setup_path,
              '''import { EmptyState, RosterLoading, StatusPill } from "./RosterShell";''',
              '''import { RosterGovernancePanel } from "./RosterGovernancePanel";
          import { RosterRuleQuickEditor } from "./RosterRuleQuickEditor";
          import { EmptyState, RosterLoading, StatusPill } from "./RosterShell";''',
          )
          replace_once(
              setup_path,
              '    enabled: section === "calendar",',
              '    enabled: section === "calendar" || section === "policy",',
          )
          replace_once(
              setup_path,
              '''  const rulesQuery = useQuery({
              queryKey: ["rostering", "settings", "rules"],''',
              '''  const governancePeopleQuery = useQuery({
              queryKey: ["rostering", "settings", "governance-people"],
              queryFn: () => listAllRosterPeople({
                page_size: 250,
                active_only: true,
                roster_eligible_only: false,
              }),
              enabled: section === "policy",
              staleTime: 15 * 60_000,
            });
            const rulesQuery = useQuery({
              queryKey: ["rostering", "settings", "rules"],''',
          )
          replace_once(
              setup_path,
              '''  const permissions = permissionsQuery.data?.permissions || [];
            const can = (permission: string) => permissions.includes(permission);''',
              '''  const permissions = permissionsQuery.data?.permissions || [];
            const governancePeople = useMemo(
              () => governancePeopleQuery.data?.items || [],
              [governancePeopleQuery.data?.items],
            );
            const governanceBases = useMemo(() => {
              const map = new Map<string, { id: string; code: string }>();
              governancePeople.forEach((person) => {
                if (!person.primary_base_station_id) return;
                map.set(person.primary_base_station_id, {
                  id: person.primary_base_station_id,
                  code: person.primary_base_code || "BASE",
                });
              });
              return [...map.values()].sort((left, right) => left.code.localeCompare(right.code));
            }, [governancePeople]);
            const can = (permission: string) => permissions.includes(permission);''',
          )
          replace_once(
              setup_path,
              '''        <PolicyPanel
                  rules={rulesQuery.data || []}
                  loading={rulesQuery.isPending}
                  authorityCount={readiness.active_approval_authority_count}
                  canManageRules={can("roster.manage_rules")}
                  root={root}
                />''',
              '''        <PolicyPanel
                  rules={rulesQuery.data || []}
                  loading={rulesQuery.isPending}
                  authorityCount={readiness.active_approval_authority_count}
                  canManageRules={can("roster.manage_rules")}
                  canManageAuthorities={can("roster.manage_approval_authorities")}
                  people={governancePeople}
                  periods={periodsQuery.data || []}
                  bases={governanceBases}
                  governanceLoading={governancePeopleQuery.isPending || periodsQuery.isPending}
                  governanceError={governancePeopleQuery.error || periodsQuery.error}
                />''',
          )
          replace_once(
              setup_path,
              '''function PolicyPanel({
            rules,
            loading,
            authorityCount,
            canManageRules,
            root,
          }: {
            rules: Awaited<ReturnType<typeof listRosterRules>>;
            loading: boolean;
            authorityCount: number;
            canManageRules: boolean;
            root: string;
          }) {''',
              '''function PolicyPanel({
            rules,
            loading,
            authorityCount,
            canManageRules,
            canManageAuthorities,
            people,
            periods,
            bases,
            governanceLoading,
            governanceError,
          }: {
            rules: Awaited<ReturnType<typeof listRosterRules>>;
            loading: boolean;
            authorityCount: number;
            canManageRules: boolean;
            canManageAuthorities: boolean;
            people: Awaited<ReturnType<typeof listAllRosterPeople>>["items"];
            periods: Awaited<ReturnType<typeof listRosterPeriods>>;
            bases: Array<{ id: string; code: string }>;
            governanceLoading: boolean;
            governanceError: unknown;
          }) {''',
          )
          replace_once(
              setup_path,
              '''        {!canManageRules ? <div className="rs-readonly">Rules are visible for review. Only authorised policy controllers can change them.</div> : null}
              </section>
              <section className="wr-panel rs-approval-summary"><div><CheckCircle2 size={20} /><span><strong>{authorityCount}</strong> active approval authority record{authorityCount === 1 ? "" : "s"}</span></div><p>Approval authorities define who may review and approve. Pending approvals belong in Command, not Setup.</p><Link className="wr-button wr-button--secondary" to={`${root}/dashboard`}>Open Command <ArrowRight size={14} /></Link></section>''',
              '''        {!canManageRules ? <div className="rs-readonly">Rules are visible for review. Only authorised policy controllers can change them.</div> : null}
              </section>
              {canManageRules ? <RosterRuleQuickEditor /> : null}
              <section className="wr-panel rs-approval-summary"><div><CheckCircle2 size={20} /><span><strong>{authorityCount}</strong> active approval authority record{authorityCount === 1 ? "" : "s"}</span></div><p>Approval authorities define review and publishing scopes. Configure them here; submitted roster decisions remain in Command.</p></section>
              {governanceError ? <div className="wr-inline-error" role="alert">{errorMessage(governanceError)}</div> : null}
              {governanceLoading ? <RosterLoading label="Loading approval authorities…" /> : (
                <RosterGovernancePanel
                  people={people}
                  periods={periods}
                  bases={bases}
                  canManageRules={canManageRules}
                  canManageAuthorities={canManageAuthorities}
                  showApprovalWorkflow={false}
                />
              )}''',
          )

          # Add canonical attendance-variance read models to the HR response.
          schema_path = 'backend/amodb/apps/workforce/hr_schemas.py'
          replace_once(
              schema_path,
              'from typing import Literal, Optional',
              'from typing import Any, Literal, Optional',
          )
          replace_once(
              schema_path,
              '''class HrOvertimeDecisionRequest(HrSchema):''',
              '''class HrAttendanceExceptionRead(HrSchema):
              id: str
              amo_id: str
              roster_assignment_id: str
              user_id: str
              user_full_name: Optional[str] = None
              planned_minutes: int
              attendance_minutes: int
              productive_minutes: int
              variance_minutes: int
              classification: str
              metadata_json: Optional[dict[str, Any]] = None
              calculated_at: datetime


          class HrOvertimeDecisionRequest(HrSchema):''',
          )
          replace_once(
              schema_path,
              '''    pending_overtime: list[HrOvertimeRequestRead]
              people: list[HrPersonReadiness]''',
              '''    pending_overtime: list[HrOvertimeRequestRead]
              attendance_exceptions: list[HrAttendanceExceptionRead]
              people: list[HrPersonReadiness]''',
          )

          service_path = 'backend/amodb/apps/workforce/hr_service.py'
          replace_once(
              service_path,
              '''def list_overtime_requests(''',
              '''def serialize_attendance_exception(
              row: models.RosterActualVariance,
              *,
              user: Optional[account_models.User] = None,
          ) -> hr_schemas.HrAttendanceExceptionRead:
              return hr_schemas.HrAttendanceExceptionRead(
                  id=row.id,
                  amo_id=row.amo_id,
                  roster_assignment_id=row.roster_assignment_id,
                  user_id=row.user_id,
                  user_full_name=_display_name(user),
                  planned_minutes=row.planned_minutes,
                  attendance_minutes=row.attendance_minutes,
                  productive_minutes=row.productive_minutes,
                  variance_minutes=row.variance_minutes,
                  classification=row.classification,
                  metadata_json=row.metadata_json if isinstance(row.metadata_json, dict) else None,
                  calculated_at=row.calculated_at,
              )


          def list_overtime_requests(''',
          )
          replace_once(
              service_path,
              '''    attendance_exception_rows = db.query(models.RosterActualVariance).filter(
              models.RosterActualVariance.amo_id == amo_id,
              or_(
                  models.RosterActualVariance.classification != "MATCHED",
                  func.abs(models.RosterActualVariance.variance_minutes) >= 30,
              ),
          ).order_by(models.RosterActualVariance.calculated_at.desc()).limit(50).all()

          actions: list[hr_schemas.HrActionItem] = []''',
              '''    attendance_exception_rows = db.query(models.RosterActualVariance).filter(
              models.RosterActualVariance.amo_id == amo_id,
              or_(
                  models.RosterActualVariance.classification != "MATCHED",
                  func.abs(models.RosterActualVariance.variance_minutes) >= 30,
              ),
          ).order_by(models.RosterActualVariance.calculated_at.desc()).limit(50).all()
              attendance_user_ids = sorted({row.user_id for row in attendance_exception_rows})
              attendance_users = (
                  db.query(account_models.User).filter(
                      account_models.User.amo_id == amo_id,
                      account_models.User.id.in_(attendance_user_ids),
                  ).all()
                  if attendance_user_ids
                  else []
              )
              attendance_users_by_id = {str(user.id): user for user in attendance_users}

          actions: list[hr_schemas.HrActionItem] = []''',
          )
          replace_once(
              service_path,
              '''    for row in pending_overtime_rows[:20]:
              actions.append(hr_schemas.HrActionItem(
                  id=f"overtime:{row.id}",
                  category="OVERTIME",
                  severity="ACTION",
                  title="Overtime approval required",
                  detail=f"{row.requested_minutes} minutes from {row.starts_at.isoformat()}.",
                  user_id=row.user_id,
                  user_name=_display_name(row.user),
                  due_on=row.starts_at.date(),
                  action_label="Review overtime",
                  action_path=f"time/overtime/{row.id}",
              ))
          actions.sort''',
              '''    for row in pending_overtime_rows[:20]:
              actions.append(hr_schemas.HrActionItem(
                  id=f"overtime:{row.id}",
                  category="OVERTIME",
                  severity="ACTION",
                  title="Overtime approval required",
                  detail=f"{row.requested_minutes} minutes from {row.starts_at.isoformat()}.",
                  user_id=row.user_id,
                  user_name=_display_name(row.user),
                  due_on=row.starts_at.date(),
                  action_label="Review overtime",
                  action_path=f"time/overtime/{row.id}",
              ))
              for row in attendance_exception_rows[:20]:
                  actions.append(hr_schemas.HrActionItem(
                      id=f"attendance:{row.id}",
                      category="ATTENDANCE",
                      severity="ACTION",
                      title="Attendance variance requires review",
                      detail=(
                          f"{row.classification}: {row.variance_minutes:+d} minutes variance; "
                          f"{row.attendance_minutes} attendance minutes against {row.planned_minutes} planned."
                      ),
                      user_id=row.user_id,
                      user_name=_display_name(attendance_users_by_id.get(str(row.user_id))),
                      due_on=row.calculated_at.date(),
                      action_label="Inspect variance",
                      action_path=f"time/attendance/{row.id}",
                  ))
          actions.sort''',
          )
          replace_once(
              service_path,
              '''        pending_overtime=[serialize_overtime(row) for row in pending_overtime_rows],
              people=people,''',
              '''        pending_overtime=[serialize_overtime(row) for row in pending_overtime_rows],
              attendance_exceptions=[
                  serialize_attendance_exception(
                      row,
                      user=attendance_users_by_id.get(str(row.user_id)),
                  )
                  for row in attendance_exception_rows
              ],
              people=people,''',
          )

          # Type and render the canonical attendance exceptions in Workforce.
          types_path = 'frontend/src/types/workforceHr.ts'
          replace_once(
              types_path,
              '''export type HrDashboard = {''',
              '''export type HrAttendanceException = {
              id: string;
              amo_id: string;
              roster_assignment_id: string;
              user_id: string;
              user_full_name?: string | null;
              planned_minutes: number;
              attendance_minutes: number;
              productive_minutes: number;
              variance_minutes: number;
              classification: string;
              metadata_json?: Record<string, unknown> | null;
              calculated_at: string;
          };

          export type HrDashboard = {''',
          )
          replace_once(
              types_path,
              '''  pending_overtime: HrOvertimeRequest[];
              people: HrPersonReadiness[];''',
              '''  pending_overtime: HrOvertimeRequest[];
              attendance_exceptions: HrAttendanceException[];
              people: HrPersonReadiness[];''',
          )

          workforce_path = 'frontend/src/pages/rostering/components/WorkforceHrWorkspace.tsx'
          replace_once(
              workforce_path,
              '''    if (item.category === "TIMESHEET" || item.category === "OVERTIME") return <button type="button" className="hr-action-link" onClick={() => onOpen("time")}>{item.action_label || "Review time"} <ArrowRight size={13} /></button>;''',
              '''    if (["TIMESHEET", "OVERTIME", "ATTENDANCE"].includes(item.category)) return <button type="button" className="hr-action-link" onClick={() => onOpen("time")}>{item.action_label || "Review time"} <ArrowRight size={13} /></button>;''',
          )
          replace_once(
              workforce_path,
              '''      <section className="hr-mini-grid"><article><Clock3 size={19} /><strong>{dashboard.attendance_exception_count}</strong><span>attendance exceptions</span></article><article><FileClock size={19} /><strong>{dashboard.pending_timesheet_count}</strong><span>pending timesheets</span></article><article><UserRoundCheck size={19} /><strong>{dashboard.pending_overtime_count}</strong><span>overtime requests</span></article></section>''',
              '''      <section className="wr-panel">
                <div className="wr-section-heading"><div><span className="wr-eyebrow">Attendance reconciliation</span><h2>Attendance exceptions</h2><p>These canonical variances identify the employee, roster assignment and measured difference requiring review.</p></div><span className="wr-header-badge"><Clock3 size={15} /> {dashboard.attendance_exceptions.length} shown</span></div>
                <div className="hr-approval-list">{dashboard.attendance_exceptions.map((exception) => <article key={exception.id}><div><strong>{exception.user_full_name || exception.user_id}</strong><span>{exception.calculated_at.slice(0, 16).replace("T", " ")} · assignment {exception.roster_assignment_id}</span><small>{exception.attendance_minutes} attendance · {exception.productive_minutes} productive · {exception.planned_minutes} planned minutes</small></div><StatusPill value={exception.classification} /><strong className={exception.variance_minutes === 0 ? "" : "is-danger"}>{exception.variance_minutes > 0 ? "+" : ""}{exception.variance_minutes} min</strong></article>)}</div>
                {!dashboard.attendance_exceptions.length ? <EmptyState title="No attendance exceptions" description="Roster-to-attendance variances will appear here with employee and assignment evidence." /> : null}
              </section>
              <section className="hr-mini-grid"><article><Clock3 size={19} /><strong>{dashboard.attendance_exception_count}</strong><span>attendance exceptions</span></article><article><FileClock size={19} /><strong>{dashboard.pending_timesheet_count}</strong><span>pending timesheets</span></article><article><UserRoundCheck size={19} /><strong>{dashboard.pending_overtime_count}</strong><span>overtime requests</span></article></section>''',
          )

          # Focused regression contracts.
          workforce_test = Path('backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py')
          workforce_test_text = workforce_test.read_text(encoding='utf-8')
          attendance_test = '''

          def test_attendance_exception_serializes_canonical_evidence():
              row = SimpleNamespace(
                  id="variance-1",
                  amo_id="amo-1",
                  roster_assignment_id="assignment-1",
                  user_id="employee-1",
                  planned_minutes=480,
                  attendance_minutes=430,
                  productive_minutes=410,
                  variance_minutes=-50,
                  classification="UNDER_RECORDED",
                  metadata_json={"source": "attendance"},
                  calculated_at=datetime(2026, 7, 29, 18, tzinfo=timezone.utc),
              )
              user = SimpleNamespace(full_name="Amina Engineer")

              result = hr_service.serialize_attendance_exception(row, user=user)

              assert result.user_full_name == "Amina Engineer"
              assert result.roster_assignment_id == "assignment-1"
              assert result.variance_minutes == -50
              assert result.metadata_json == {"source": "attendance"}
          '''
          if 'test_attendance_exception_serializes_canonical_evidence' not in workforce_test_text:
              workforce_test.write_text(workforce_test_text + attendance_test, encoding='utf-8')

          setup_test = Path('frontend/src/pages/rostering/rosteringSetupExperience.test.ts')
          setup_test_text = setup_test.read_text(encoding='utf-8')
          old_test = '''    expect(setupWorkspaceSource).toContain("Compliance rules");
              expect(setupWorkspaceSource).toContain("History & diagnostics");'''
          new_test = '''    expect(setupWorkspaceSource).toContain("Compliance rules");
              expect(setupWorkspaceSource).toContain("RosterRuleQuickEditor");
              expect(setupWorkspaceSource).toContain("RosterGovernancePanel");
              expect(setupWorkspaceSource).toContain("showApprovalWorkflow={false}");
              expect(setupWorkspaceSource).toContain("roster.manage_approval_authorities");
              expect(setupWorkspaceSource).toContain("History & diagnostics");'''
          if old_test in setup_test_text:
              setup_test_text = setup_test_text.replace(old_test, new_test, 1)
          elif 'showApprovalWorkflow={false}' not in setup_test_text:
              raise RuntimeError('Setup experience policy test anchor not found')
          old_workforce_test = '''    expect(workforceSource).toContain("dashboard.can_approve_timesheet_hr");'''
          new_workforce_test = '''    expect(workforceSource).toContain("dashboard.can_approve_timesheet_hr");
              expect(workforceSource).toContain("dashboard.attendance_exceptions.map");
              expect(workforceSource).toContain("roster_assignment_id");'''
          if old_workforce_test in setup_test_text:
              setup_test_text = setup_test_text.replace(old_workforce_test, new_workforce_test, 1)
          elif 'dashboard.attendance_exceptions.map' not in setup_test_text:
              raise RuntimeError('Workforce attendance test anchor not found')
          setup_test.write_text(setup_test_text, encoding='utf-8')
          PY
      - name: Compile backend changes
        run: >-
          python -m compileall -q
          backend/amodb/apps/workforce/hr_schemas.py
          backend/amodb/apps/workforce/hr_service.py
          backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
      - name: Commit product fixes
        run: |
          if git diff --quiet -- backend frontend; then
            echo "Reachable control fixes already present"
            exit 0
          fi
          git config user.name "amo-portal-actions"
          git config user.email "actions@github.com"
          git add \
            backend/amodb/apps/workforce/hr_schemas.py \
            backend/amodb/apps/workforce/hr_service.py \
            backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py \
            frontend/src/pages/rostering/components/RosterGovernancePanel.tsx \
            frontend/src/pages/rostering/components/RosteringSetupWorkspace.tsx \
            frontend/src/pages/rostering/components/WorkforceHrWorkspace.tsx \
            frontend/src/pages/rostering/rosteringSetupExperience.test.ts \
            frontend/src/types/workforceHr.ts
          git commit -m "Restore reachable rostering controls and attendance evidence"
          git push origin HEAD:${{ github.head_ref }}
