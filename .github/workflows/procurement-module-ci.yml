name: Procurement Module CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/procurement/**"
      - "backend/amodb/apps/inventory/**"
      - "backend/amodb/apps/quality/audit_assignment_guard.py"
      - "backend/amodb/alembic/versions/procure_*.py"
      - "backend/amodb/alembic/versions/procurement_*.py"
      - "backend/tests/test_procurement_*.py"
      - "backend/tests/test_supplier_governance_contract.py"
      - "frontend/src/pages/procurement/**"
      - "frontend/src/services/procurement.ts"
      - "frontend/src/services/supplierGovernance.ts"
      - "frontend/src/types/procurement.ts"
      - "frontend/src/styles/procurement*.css"
      - "frontend/src/styles/supplier-governance.css"
      - "frontend/src/utils/departmentAccess.ts"
      - "frontend/src/utils/roleAccess.ts"
      - ".env.example"
      - ".github/workflows/procurement-module-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procurement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procurement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procurement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: procurement-ci-secret
      PLATFORM_SECRETS_KEY: "5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU="
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/procurement_ci
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/procurement_ci
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/procurement_ci
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "Procurement backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Procurement and configure mappers
        working-directory: backend
        run: |
          python -m compileall -q amodb/apps/procurement amodb/apps/inventory
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          import amodb.main
          configure_mappers()
          print("Procurement application mappers configured")
          PY
      - name: Verify Alembic graph and clean PostgreSQL upgrade
        working-directory: backend
        run: |
          python -m alembic -c amodb/alembic.ini heads
          python -m alembic -c amodb/alembic.ini upgrade heads
      - name: Run Procurement contracts
        working-directory: backend
        run: >-
          pytest -q
          tests/test_procurement_module_contract.py
          tests/test_procurement_document_contract.py
          tests/test_procurement_frontend_contract.py
          tests/test_supplier_governance_contract.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Procurement frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Lint Procurement-owned surfaces
        run: >-
          npm exec -- eslint
          src/pages/procurement
          src/services/procurement.ts
          src/services/supplierGovernance.ts
          src/types/procurement.ts
      - name: Build production frontend
        run: npm run build