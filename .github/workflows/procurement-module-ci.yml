name: Procurement Module CI

on:
  push:
    paths:
      - "backend/amodb/apps/procurement/**"
      - "backend/amodb/apps/inventory/**"
      - "backend/amodb/apps/finance/**"
      - "backend/amodb/entitlements.py"
      - "backend/amodb/alembic/versions/procurement_20260803_full_domain.py"
      - "backend/amodb/alembic/versions/procure_20260803_docs.py"
      - "backend/tests/test_procurement_module_contract.py"
      - "backend/tests/test_procurement_document_contract.py"
      - "backend/tests/test_procurement_frontend_contract.py"
      - "frontend/src/pages/procurement/**"
      - "frontend/src/services/procurement.ts"
      - "frontend/src/types/procurement.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/app/routePreload.ts"
      - "frontend/src/styles/procurement*.css"
      - "docs/procurement-module.md"
      - ".env.example"
      - ".github/workflows/procurement-module-ci.yml"
  pull_request:
    paths:
      - "backend/amodb/apps/procurement/**"
      - "backend/amodb/apps/inventory/**"
      - "backend/amodb/apps/finance/**"
      - "backend/amodb/entitlements.py"
      - "backend/amodb/alembic/versions/procurement_20260803_full_domain.py"
      - "backend/amodb/alembic/versions/procure_20260803_docs.py"
      - "backend/tests/test_procurement_module_contract.py"
      - "backend/tests/test_procurement_document_contract.py"
      - "backend/tests/test_procurement_frontend_contract.py"
      - "frontend/src/pages/procurement/**"
      - "frontend/src/services/procurement.ts"
      - "frontend/src/types/procurement.ts"
      - "frontend/src/router.tsx"
      - "frontend/src/app/routePreload.ts"
      - "frontend/src/styles/procurement*.css"
      - "docs/procurement-module.md"
      - ".env.example"
      - ".github/workflows/procurement-module-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procurement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_procurement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_procurement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: procurement-ci-secret
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_procurement_ci
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_procurement_ci
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_procurement_ci
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Procurement backend dependency install"
          -- pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Procurement and configure mappers
        working-directory: backend
        run: |
          python -m compileall -q amodb/apps/procurement amodb/apps/inventory
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          import amodb.main
          configure_mappers()
          print("Procurement application mappers configured")
          PY
      - name: Verify Alembic graph and clean PostgreSQL upgrade
        working-directory: backend
        run: |
          python -m alembic -c amodb/alembic.ini heads
          python -m alembic -c amodb/alembic.ini upgrade heads
      - name: Run Procurement module contracts
        working-directory: backend
        run: pytest -q tests/test_procurement_module_contract.py
      - name: Run Procurement document contracts
        working-directory: backend
        run: pytest -q tests/test_procurement_document_contract.py
      - name: Run Procurement frontend contracts
        working-directory: backend
        run: pytest -q tests/test_procurement_frontend_contract.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Procurement frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Lint Procurement-owned surfaces
        run: >-
          npm exec -- eslint
          src/pages/procurement
          src/services/procurement.ts
          src/types/procurement.ts
      - name: Build production frontend
        run: npm run build
