name: PR 422 final Training hardening

on:
  push:
    branches:
      - agent/training-workbook-control-centre
    paths:
      - .github/workflows/pr422-final-hardening.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr422-final-training-hardening
  cancel-in-progress: false

jobs:
  harden-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/training-workbook-control-centre
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply four focused hardening passes
        run: |
          set -euo pipefail
          python scripts/pr422_pass1.py
          python scripts/pr422_pass2.py
          python scripts/pr422_pass3.py
          python scripts/pr422_pass4.py
          rm -f scripts/pr422_pass1.py scripts/pr422_pass2.py scripts/pr422_pass3.py scripts/pr422_pass4.py
          rm -f .github/workflows/pr422-final-hardening.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.orig' -o -name '*.rej' \) -delete
          git diff --check

      - name: Verify controlled product file set
        run: |
          set -euo pipefail
          expected=$'backend/amodb/apps/training/tests/test_workbook_import_mapping.py\nbackend/amodb/apps/training/workbook_import.py\nbackend/amodb/apps/training/workbook_router.py\ndocs/training/TRAINING_TRACKER_WORKBOOK_MAPPING.md\nfrontend/src/components/training/TrainingWorkbookImportDialog.tsx'
          actual="$(git diff --name-only | grep -v '^scripts/pr422_pass' | grep -v '^.github/workflows/pr422-final-hardening.yml$' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected product file set:'
            printf '%s\n' "$actual"
            exit 1
          fi
          test "$(find . -type f \( -name '*.pyc' -o -name '*.orig' -o -name '*.rej' \) -print -quit)" = ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Training backend validation
        env:
          PYTHONPATH: backend
          DATABASE_URL: 'sqlite+pysqlite:///:memory:'
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: '1'
        run: |
          python -m py_compile \
            backend/amodb/apps/training/workbook_import.py \
            backend/amodb/apps/training/workbook_router.py \
            backend/amodb/apps/training/tests/test_workbook_import_mapping.py
          pytest -q backend/amodb/apps/training/tests/test_workbook_import_mapping.py

      - name: Validate Alembic revision graph
        env:
          PYTHONPATH: backend
          DATABASE_URL: 'postgresql+psycopg2://validation:validation@127.0.0.1:5432/validation'
          APP_ENV: test
        working-directory: backend
        run: alembic -c amodb/alembic.ini heads

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check CSS contracts
        working-directory: frontend
        run: npm run check:css

      - name: Commit and push hardened product changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.orig' -o -name '*.rej' \) -delete
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete four-pass Training hardening review'
          git push origin HEAD:agent/training-workbook-control-centre
          gh pr comment 422 --body "Completed four focused merge-readiness hardening passes. Training backend tests, Python compilation, Alembic graph validation, frontend production build, CSS contracts, artifact cleanup, and controlled file-set checks passed in workflow run ${GITHUB_RUN_ID}. Codex review requests were issued for four iterations, but GitHub Codex declined them because the account review quota is exhausted."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 422 --body "The four-pass Training hardening workflow failed in run ${GITHUB_RUN_ID}. No final hardening product commit was pushed by this run."
