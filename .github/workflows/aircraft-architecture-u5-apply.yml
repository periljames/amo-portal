name: Apply Aircraft Architecture U5

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-architecture-u5-apply.yml"

permissions:
  contents: write

jobs:
  gate-parent-and-apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      SECRET_KEY: aircraft-architecture-u5-parent-gate
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Re-gate U1 through U4 exact parent
        run: |
          python -m compileall -q backend/amodb/apps/aircraft_architecture
          heads=$(alembic -c backend/amodb/alembic.ini heads | grep -c '(head)')
          test "$heads" -eq 1
          alembic -c backend/amodb/alembic.ini upgrade head
          python -c "import amodb.main; from sqlalchemy.orm import configure_mappers; configure_mappers()"
          pytest -q backend/amodb/apps/aircraft_architecture
      - name: Create U5 tree and commit from reviewed blobs
        run: |
          cat > /tmp/tree.json <<'JSON'
          {
            "base_tree": "BASE_SHA",
            "tree": [
              {"path":"backend/amodb/apps/aircraft_architecture/induction/__init__.py","mode":"100644","type":"blob","sha":"3c06de5b708103794393fc9da180e69e269763d1"},
              {"path":"backend/amodb/apps/aircraft_architecture/induction/models.py","mode":"100644","type":"blob","sha":"145aeb9334727dde2b665acdf7cc4b8c02859729"},
              {"path":"backend/amodb/apps/aircraft_architecture/induction/schemas.py","mode":"100644","type":"blob","sha":"823b4fc006f888aa2b2471d8e2e2fc724f1c9ece"},
              {"path":"backend/amodb/apps/aircraft_architecture/induction/services.py","mode":"100644","type":"blob","sha":"bd0d2ee0e23b0f25b36a48e6d26b2c72685a0c59"},
              {"path":"backend/amodb/apps/aircraft_architecture/induction/router.py","mode":"100644","type":"blob","sha":"b6026bf73be0e2240084c828b1792463685666d4"},
              {"path":"backend/amodb/apps/aircraft_architecture/induction/tests/test_induction_contract.py","mode":"100644","type":"blob","sha":"b53a59b77f941606a79616181cbe392c5d352feb"},
              {"path":"backend/amodb/apps/aircraft_architecture/router.py","mode":"100644","type":"blob","sha":"f5bd7288a65f65a7125456faf55f1e09e92ee610"},
              {"path":"backend/amodb/alembic/versions/aircraft_arch_20260805_u5_induction.py","mode":"100644","type":"blob","sha":"4a7477d47e55defa68e06951ab4c315d1df41872"},
              {"path":".github/workflows/aircraft-architecture-u5-apply.yml","mode":"100644","type":"blob","sha":null}
            ]
          }
          JSON
          sed -i "s/BASE_SHA/${GITHUB_SHA}/" /tmp/tree.json
          tree_sha=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree.json --jq .sha)
          jq -n --arg message "Phase U5: add atomic aircraft induction and engineering lineage" --arg tree "$tree_sha" --arg parent "$GITHUB_SHA" '{message:$message,tree:$tree,parents:[$parent]}' > /tmp/commit.json
          commit_sha=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" --input /tmp/commit.json --jq .sha)
          jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}' > /tmp/ref.json
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/aircraft-induction-architecture" --input /tmp/ref.json
