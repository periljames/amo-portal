name: Merge Current Tenant Shell Into Reliability

on:
  push:
    branches:
      - agent/reliability-v2-foundation
    paths:
      - docs/reliability/.sync-current-shell

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0
      - name: Merge and publish exact shell head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/global-tenant-navigation-quality-home
          test "$(git rev-parse FETCH_HEAD)" = "309a8eac0aecfdbb19a1ecd71c83cdbaababb074"
          git merge --no-edit --no-ff FETCH_HEAD
          cat >> docs/reliability/RELIABILITY_V2_VALIDATION.md <<EOF

          ## Current tenant-shell synchronization

          - Synchronized shell head: \`309a8eac0aecfdbb19a1ecd71c83cdbaababb074\`
          - Merge diagnostic run: \`30808533950\`
          - Merge publication run: \`${GITHUB_RUN_ID}\`
          - UTC merge time: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`
          - The exact Git merge completed with zero conflicted files.
          EOF
          rm -f docs/reliability/.sync-current-shell docs/reliability/SHELL_MERGE_DIAGNOSTIC.md
          rm -f .github/workflows/reliability-merge-current-shell.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/reliability/RELIABILITY_V2_VALIDATION.md')
          lines = [line.rstrip() for line in path.read_text(encoding='utf-8').splitlines()]
          while lines and not lines[-1]:
              lines.pop()
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git add -A
          git diff --cached --check
          git commit -m "Record current tenant-shell synchronization"
          git push origin HEAD:agent/reliability-v2-foundation
