name: QMS CAR Control Loop Real Browser CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/amodb/apps/quality/car_control_loop*.py"
      - "backend/amodb/apps/quality/router.py"
      - "backend/amodb/apps/quality/models.py"
      - "backend/amodb/scripts/seed_qms_live_audit_e2e.py"
      - "backend/amodb/scripts/complete_qms_live_audit_onboarding_e2e.py"
      - "backend/amodb/scripts/seed_qms_car_real_e2e.py"
      - "frontend/src/pages/PublicCarInvitePage.tsx"
      - "frontend/src/pages/CanonicalPublicCarAccessPage.tsx"
      - "frontend/src/pages/qms/QmsCarControlLoopPage.tsx"
      - "frontend/src/pages/qms/QmsCarControlOperations.tsx"
      - "frontend/src/services/qmsCarControlLoop.ts"
      - "frontend/tests/e2e/qms-car-control-loop-real.spec.ts"
      - ".github/workflows/qms-car-control-loop-real-browser-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qms-car-control-loop-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  car-real:
    name: Responsible manager + Quality browser -> FastAPI -> PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_qms_car_real
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_qms_car_real"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: qms-car-real-browser-ci-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_qms_car_real
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_qms_car_real
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_qms_car_real
      QUALITY_SCHEMA_STRICT: "1"
      PYTHONPATH: backend
      VITE_API_PROXY_TARGET: http://127.0.0.1:8080
      VITE_ALLOWED_HOSTS: 127.0.0.1,localhost
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_QMS_LIVE_FIXTURE: /tmp/qms-live-audit-real-e2e.json
    steps:
      - uses: actions/checkout@v6
        with: { show-progress: false }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend, migrate all heads and seed CAR
        working-directory: backend
        run: |
          pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
          alembic -c amodb/alembic.ini upgrade heads
          python amodb/scripts/seed_qms_live_audit_e2e.py
          python amodb/scripts/complete_qms_live_audit_onboarding_e2e.py
          python amodb/scripts/seed_qms_car_real_e2e.py
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npm exec -- eslint tests/e2e/qms-car-control-loop-real.spec.ts
          npm run build
          npx playwright install --with-deps chromium
      - name: Start production-like stack
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && nohup python -m uvicorn amodb.main:app --host 127.0.0.1 --port 8080 > /tmp/qms-car-real-backend.log 2>&1 & echo $! > /tmp/qms-car-real-backend.pid)
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:8080/openapi.json >/dev/null && break
            [ "$attempt" -lt 60 ] || { cat /tmp/qms-car-real-backend.log; exit 1; }
            sleep 1
          done
          (cd frontend && nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qms-car-real-frontend.log 2>&1 & echo $! > /tmp/qms-car-real-frontend.pid)
          for attempt in $(seq 1 60); do
            curl --silent --fail -H 'Accept: text/html' http://127.0.0.1:4173/qms/car-access/invalid >/dev/null && break
            [ "$attempt" -lt 60 ] || { cat /tmp/qms-car-real-frontend.log; exit 1; }
            sleep 1
          done
      - name: Run real CAR browser lifecycle
        working-directory: frontend
        run: npm exec -- playwright test tests/e2e/qms-car-control-loop-real.spec.ts --project=chromium
      - name: Prove CAR lifecycle in PostgreSQL
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os, uuid
          from pathlib import Path
          from amodb.main import app as _app  # noqa: F401
          from amodb.apps.quality import models
          from amodb.apps.quality.car_control_loop_models import QualityCARControlEvent, QualityCARControlProfile, QualityCARDeadlineChange, QualityCARDependency, QualityCARMilestone
          from amodb.database import WriteSessionLocal

          f = json.loads(Path(os.environ["E2E_QMS_LIVE_FIXTURE"]).read_text())
          car_id = uuid.UUID(f["car_loop_id"])
          db = WriteSessionLocal()
          try:
              car = db.get(models.CorrectiveActionRequest, car_id)
              assert car is not None and str(getattr(car.status, "value", car.status)) == "CLOSED"
              assert car.root_cause_status == "ACCEPTED" and car.capa_status == "ACCEPTED"
              assert car.closed_at is not None and car.evidence_verified_at is not None
              assert "management-control and evidence-ownership root cause" in (car.root_cause_review_note or "")
              assert "implementation, evidence and effectiveness milestones" in (car.capa_review_note or "")

              responses = db.query(models.CARResponse).filter_by(car_id=car_id).order_by(models.CARResponse.submitted_at.asc()).all()
              assert len(responses) == 2, len(responses)
              assert "initial" in (responses[0].root_cause or "")
              assert "rework" in (responses[1].root_cause or "")
              assert str(getattr(responses[0].status, "value", responses[0].status)) in {"CAP_REJECTED", "REJECTED", "SUPERSEDED"}

              profile = db.query(QualityCARControlProfile).filter_by(amo_id=f["amo_id"], car_id=car_id).one()
              assert profile.effectiveness_required is True
              assert profile.accountable_owner_user_id == f["realtime_user_b_id"]
              milestones = db.query(QualityCARMilestone).filter_by(amo_id=f["amo_id"], car_id=car_id).order_by(QualityCARMilestone.phase_order.asc()).all()
              assert [m.milestone_key for m in milestones] == ["RCA_SUBMISSION", "CAP_APPROVAL", "IMPLEMENTATION_COMPLETE", "EVIDENCE_COMPLETE", "EFFECTIVENESS_REVIEW"]
              assert all(m.status == "ACCEPTED" and m.evidence_ref and m.reviewed_at for m in milestones)

              changes = db.query(QualityCARDeadlineChange).filter_by(amo_id=f["amo_id"], car_id=car_id).all()
              assert len(changes) == 1 and changes[0].status == "APPROVED" and changes[0].reviewed_at
              assert changes[0].requested_due_date > changes[0].previous_due_date

              dependencies = db.query(QualityCARDependency).filter_by(amo_id=f["amo_id"], car_id=car_id).all()
              assert len(dependencies) == 1 and dependencies[0].status == "RESOLVED" and dependencies[0].blocks_closure is True

              event_types = {e.event_type for e in db.query(QualityCARControlEvent).filter_by(amo_id=f["amo_id"], car_id=car_id).all()}
              required = {"CONTROL_LOOP_INITIALIZED", "DEADLINE_CHANGE_REQUESTED", "DEADLINE_CHANGE_APPROVED", "DEPENDENCY_OPENED", "DEPENDENCY_UPDATED", "MILESTONE_UPDATED", "CONTROL_LOOP_CLOSED"}
              assert required.issubset(event_types), required - event_types
              print("Real CAR rejection/rework, deadline, dependency, effectiveness and closure persisted")
          finally:
              db.close()
          PY
      - name: Reject runtime failures
        if: always()
        shell: bash
        run: |
          if grep -Eqi "UndefinedTable|UndefinedColumn|Traceback \(most recent call last\)|ERROR: +Exception in ASGI application" /tmp/qms-car-real-backend.log 2>/dev/null; then cat /tmp/qms-car-real-backend.log; exit 1; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qms-car-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
            /tmp/qms-car-real-backend.log
            /tmp/qms-car-real-frontend.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop servers
        if: always()
        shell: bash
        run: |
          [ ! -f /tmp/qms-car-real-frontend.pid ] || kill "$(cat /tmp/qms-car-real-frontend.pid)" 2>/dev/null || true
          [ ! -f /tmp/qms-car-real-backend.pid ] || kill "$(cat /tmp/qms-car-real-backend.pid)" 2>/dev/null || true
