name: PR364 Final Integrity and Pagination

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rostering-automation-workforce-hr-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply integrity, timezone, readiness and pagination fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise RuntimeError(f'Missing {label} anchor')

          # -----------------------------------------------------------------
          # Overtime tenant integrity and AMO-local effective dates.
          # -----------------------------------------------------------------
          hr_path = 'backend/amodb/apps/workforce/hr_service.py'
          hr = read(hr_path)
          hr = replace_once(
              hr,
              'from typing import Optional\n',
              'from typing import Optional\nfrom zoneinfo import ZoneInfo, ZoneInfoNotFoundError\n',
              'ZoneInfo import',
          )
          helper_anchor = 'def _department_code(user: Optional[account_models.User]) -> Optional[str]:\n'
          if 'def _amo_work_date(' not in hr:
              helper = '''def _amo_zone(db: Session, *, amo_id: str) -> ZoneInfo:
              zone_name = (
                  db.query(account_models.AMO.time_zone)
                  .filter(account_models.AMO.id == amo_id)
                  .scalar()
                  or "UTC"
              )
              try:
                  return ZoneInfo(str(zone_name))
              except ZoneInfoNotFoundError:
                  return ZoneInfo("UTC")


          def _amo_work_date(db: Session, *, amo_id: str, instant: datetime) -> date:
              normalized = instant if instant.tzinfo is not None else instant.replace(tzinfo=timezone.utc)
              return normalized.astimezone(_amo_zone(db, amo_id=amo_id)).date()


          def _validated_roster_assignment(
              db: Session,
              *,
              amo_id: str,
              user_id: str,
              assignment_id: str,
              starts_at: datetime,
              ends_at: datetime,
          ):
              from ..rostering import models as roster_models

              assignment = db.query(roster_models.RosterAssignment).filter(
                  roster_models.RosterAssignment.id == assignment_id,
                  roster_models.RosterAssignment.amo_id == amo_id,
              ).first()
              if assignment is None:
                  raise ValueError("Roster assignment was not found in this AMO")
              if str(assignment.user_id) != str(user_id):
                  raise ValueError("Roster assignment does not belong to the overtime employee")
              if assignment.deleted_at is not None:
                  raise ValueError("Deleted roster assignments cannot support overtime claims")
              if assignment.starts_at >= ends_at or assignment.ends_at <= starts_at:
                  raise ValueError("Roster assignment does not overlap the overtime window")
              return assignment


          '''
              if helper_anchor not in hr:
                  raise RuntimeError('HR helper insertion anchor not found')
              hr = hr.replace(helper_anchor, helper + helper_anchor, 1)
          hr = replace_once(
              hr,
              '    on_date = payload.starts_at.date()\n',
              '    on_date = _amo_work_date(db, amo_id=amo_id, instant=payload.starts_at)\n',
              'overtime create local date',
          )
          assignment_insert_anchor = '''    if requested_minutes < 1 or requested_minutes > actual_minutes:
              raise ValueError("requested_minutes must be within the requested overtime window")
          '''
          if '_validated_roster_assignment(' not in hr[hr.index('def create_overtime_request'):hr.index('def decide_overtime')]:
              assignment_block = '''    if payload.roster_assignment_id:
              _validated_roster_assignment(
                  db,
                  amo_id=amo_id,
                  user_id=user_id,
                  assignment_id=payload.roster_assignment_id,
                  starts_at=payload.starts_at,
                  ends_at=payload.ends_at,
              )
          '''
              if assignment_insert_anchor not in hr:
                  raise RuntimeError('Overtime assignment validation anchor not found')
              hr = hr.replace(assignment_insert_anchor, assignment_insert_anchor + assignment_block, 1)
          hr = replace_once(
              hr,
              '        work_date = row.starts_at.date()\n',
              '        work_date = _amo_work_date(db, amo_id=amo_id, instant=row.starts_at)\n',
              'overtime decision local date',
          )

          # -----------------------------------------------------------------
          # Paginated canonical people register.
          # -----------------------------------------------------------------
          if 'def list_people_page(' not in hr:
              page_service = '''def list_people_page(
              db: Session,
              *,
              amo_id: str,
              page: int = 1,
              page_size: int = 100,
              search: Optional[str] = None,
          ) -> hr_schemas.HrPeoplePage:
              today = date.today()
              now = _utcnow()
              contracts = _active_contracts(db, amo_id=amo_id, on_date=today)
              current_contracts: dict[str, models.EmploymentContract] = {}
              for row in contracts:
                  current_contracts.setdefault(str(row.user_id), row)
              selected_contracts = list(current_contracts.values())
              user_ids = list(current_contracts)
              patterns = _effective_patterns(db, amo_id=amo_id, user_ids=user_ids, on_date=today)
              leave_by_user = _active_leave(db, amo_id=amo_id, user_ids=user_ids, now=now)
              items = [
                  _person_readiness(
                      row,
                      pattern=patterns.get(str(row.user_id)),
                      leave=leave_by_user.get(str(row.user_id)),
                  )
                  for row in selected_contracts
              ]
              needle = str(search or "").strip().lower()
              if needle:
                  items = [
                      item for item in items
                      if any(
                          needle in str(value or "").lower()
                          for value in (
                              item.full_name,
                              item.staff_code,
                              item.position_title,
                              item.department_code,
                              item.primary_base_code,
                              item.payroll_number,
                          )
                      )
                  ]
              items.sort(key=lambda item: (item.readiness_state == "READY", item.full_name.lower(), item.user_id))
              total = len(items)
              safe_page_size = max(1, min(int(page_size), 200))
              pages = (total + safe_page_size - 1) // safe_page_size if total else 0
              safe_page = max(1, int(page))
              start = (safe_page - 1) * safe_page_size
              return hr_schemas.HrPeoplePage(
                  items=items[start:start + safe_page_size],
                  page=safe_page,
                  page_size=safe_page_size,
                  total=total,
                  pages=pages,
              )


          '''
              dashboard_anchor = 'def dashboard(\n'
              if dashboard_anchor not in hr:
                  raise RuntimeError('Dashboard insertion anchor not found')
              hr = hr.replace(dashboard_anchor, page_service + dashboard_anchor, 1)
          write(hr_path, hr)

          schema_path = 'backend/amodb/apps/workforce/hr_schemas.py'
          schema = read(schema_path)
          if 'class HrPeoplePage' not in schema:
              page_schema = '''class HrPeoplePage(HrSchema):
              items: list[HrPersonReadiness]
              page: int
              page_size: int
              total: int
              pages: int


          '''
              anchor = 'class HrOvertimeRequestRead(HrSchema):\n'
              if anchor not in schema:
                  raise RuntimeError('People page schema anchor not found')
              schema = schema.replace(anchor, page_schema + anchor, 1)
          write(schema_path, schema)

          router_path = 'backend/amodb/apps/workforce/hr_router.py'
          router = read(router_path)
          if '@router.get("/people"' not in router:
              endpoint = '''@router.get("/people", response_model=hr_schemas.HrPeoplePage)
          def hr_people(
              page: int = Query(default=1, ge=1),
              page_size: int = Query(default=100, ge=1, le=200),
              search: str | None = Query(default=None, max_length=200),
              db: Session = Depends(get_db),
              current_user: account_models.User = Depends(get_current_active_user),
          ):
              permissions.require_permission(
                  db,
                  user=current_user,
                  permission=permissions.PermissionCode.WORKFORCE_VIEW_SENSITIVE,
              )
              return hr_service.list_people_page(
                  db,
                  amo_id=_amo(current_user),
                  page=page,
                  page_size=page_size,
                  search=search,
              )


          '''
              router = router.replace('@router.get("/work-patterns"', endpoint + '@router.get("/work-patterns"', 1)
          write(router_path, router)

          # -----------------------------------------------------------------
          # Readiness must count only active patterns, matching generation.
          # -----------------------------------------------------------------
          automation_path = 'backend/amodb/apps/rostering/automation_service.py'
          automation = read(automation_path)
          old_query = '''    return db.query(workforce_models.EmployeeWorkPatternAssignment).options(
              selectinload(workforce_models.EmployeeWorkPatternAssignment.work_pattern).selectinload(
                  workforce_models.WorkPattern.days
              ),
          ).filter(
              workforce_models.EmployeeWorkPatternAssignment.amo_id == amo_id,
          '''
          new_query = '''    return db.query(workforce_models.EmployeeWorkPatternAssignment).join(
              workforce_models.WorkPattern,
              workforce_models.EmployeeWorkPatternAssignment.work_pattern_id == workforce_models.WorkPattern.id,
          ).options(
              selectinload(workforce_models.EmployeeWorkPatternAssignment.work_pattern).selectinload(
                  workforce_models.WorkPattern.days
              ),
          ).filter(
              workforce_models.EmployeeWorkPatternAssignment.amo_id == amo_id,
              workforce_models.WorkPattern.amo_id == amo_id,
              workforce_models.WorkPattern.is_active.is_(True),
          '''
          automation = replace_once(automation, old_query, new_query, 'active readiness pattern query')
          write(automation_path, automation)

          # -----------------------------------------------------------------
          # Frontend paginated people service and register.
          # -----------------------------------------------------------------
          types_path = 'frontend/src/types/workforceHr.ts'
          types = read(types_path)
          if 'export type HrPeoplePage' not in types:
              people_page_type = '''export type HrPeoplePage = {
              items: HrPersonReadiness[];
              page: number;
              page_size: number;
              total: number;
              pages: number;
          };

          '''
              types = types.replace('export type HrOvertimeRequest = {', people_page_type + 'export type HrOvertimeRequest = {', 1)
          write(types_path, types)

          service_path = 'frontend/src/services/workforceHr.ts'
          service = read(service_path)
          service = replace_once(
              service,
              'import type { HrDashboard, HrOvertimeRequest } from "../types/workforceHr";',
              'import type { HrDashboard, HrOvertimeRequest, HrPeoplePage } from "../types/workforceHr";',
              'people page type import',
          )
          if 'export function listWorkforceHrPeople' not in service:
              people_service = '''export function listWorkforceHrPeople(params: {
              page?: number;
              page_size?: number;
              search?: string;
          } = {}): Promise<HrPeoplePage> {
              return apiJson(`/workforce/hr/people${queryString(params)}`, {
                  offline: { cacheTtlMs: 60_000 },
              });
          }

          '''
              service = service.replace('export function listWorkforceHrPatterns', people_service + 'export function listWorkforceHrPatterns', 1)
          write(service_path, service)

          workspace_path = 'frontend/src/pages/rostering/components/WorkforceHrWorkspace.tsx'
          workspace = read(workspace_path)
          workspace = replace_once(
              workspace,
              '  listWorkforceHrOvertime,\n',
              '  listWorkforceHrOvertime,\n  listWorkforceHrPeople,\n',
              'people service import',
          )
          workspace = replace_once(
              workspace,
              '  const [search, setSearch] = useState("");\n',
              '  const [search, setSearch] = useState("");\n  const [peoplePage, setPeoplePage] = useState(1);\n',
              'people page state',
          )
          if 'const peopleQuery = useQuery' not in workspace:
              query_anchor = '  const leaveQuery = useQuery({\n'
              people_query = '''  const peopleQuery = useQuery({
              queryKey: ["workforce", "hr", "people", peoplePage, search.trim()],
              queryFn: () => listWorkforceHrPeople({
                  page: peoplePage,
                  page_size: 100,
                  search: search.trim() || undefined,
              }),
              enabled: section === "people",
              staleTime: 60_000,
          });
          '''
              if query_anchor not in workspace:
                  raise RuntimeError('People query insertion anchor not found')
              workspace = workspace.replace(query_anchor, people_query + query_anchor, 1)
          people_memo_start = workspace.index('  const people = useMemo(() => {')
          people_memo_end = workspace.index('\n\n  const openSection', people_memo_start)
          people_binding = '  const people = peopleQuery.data?.items || [];'
          workspace = workspace[:people_memo_start] + people_binding + workspace[people_memo_end:]
          workspace = replace_once(
              workspace,
              '          onSearch={setSearch}\n',
              '          onSearch={(value) => { setSearch(value); setPeoplePage(1); }}\n          page={peopleQuery.data?.page || peoplePage}\n          pages={peopleQuery.data?.pages || 0}\n          total={peopleQuery.data?.total || 0}\n          loading={peopleQuery.isPending}\n          onPage={setPeoplePage}\n',
              'people panel pagination props',
          )
          workspace = replace_once(
              workspace,
              '  people, search, onSearch, bases, loadingBases, canManage, busy, runAction,\n',
              '  people, search, onSearch, page, pages, total, loading, onPage, bases, loadingBases, canManage, busy, runAction,\n',
              'people panel destructuring',
          )
          workspace = replace_once(
              workspace,
              '  onSearch: (value: string) => void;\n',
              '  onSearch: (value: string) => void;\n  page: number;\n  pages: number;\n  total: number;\n  loading: boolean;\n  onPage: (page: number) => void;\n',
              'people panel prop types',
          )
          table_end = '      </div>\n      {!people.length ? <EmptyState title="No matching employees" description="Change the search or confirm effective employment contracts exist." /> : null}'
          if 'Showing {people.length} of {total}' not in workspace:
              pagination = '''      </div>
              {loading ? <RosterLoading label="Loading employee register…" /> : null}
              <div className="wr-actions wr-actions--between">
                  <span className="hr-person-source">Showing {people.length} of {total} employees · page {page}{pages ? ` of ${pages}` : ""}</span>
                  <div className="wr-actions">
                      <button type="button" className="wr-button wr-button--secondary wr-button--small" disabled={page <= 1 || loading} onClick={() => onPage(page - 1)}>Previous</button>
                      <button type="button" className="wr-button wr-button--secondary wr-button--small" disabled={!pages || page >= pages || loading} onClick={() => onPage(page + 1)}>Next</button>
                  </div>
              </div>
              {!people.length && !loading ? <EmptyState title="No matching employees" description="Change the search or confirm effective employment contracts exist." /> : null}'''
              if table_end not in workspace:
                  raise RuntimeError('People table pagination anchor not found')
              workspace = workspace.replace(table_end, pagination, 1)
          write(workspace_path, workspace)

          # -----------------------------------------------------------------
          # Focused tests.
          # -----------------------------------------------------------------
          test_path = 'backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py'
          tests = read(test_path)
          if 'test_amo_work_date_uses_tenant_timezone' not in tests:
              tests += '''

          class _ScalarQuery:
              def __init__(self, value):
                  self.value = value
              def filter(self, *args, **kwargs):
                  return self
              def scalar(self):
                  return self.value


          def test_amo_work_date_uses_tenant_timezone():
              db = MagicMock()
              db.query.return_value = _ScalarQuery("Africa/Nairobi")
              instant = datetime(2026, 7, 29, 22, 30, tzinfo=timezone.utc)
              assert hr_service._amo_work_date(db, amo_id="amo-1", instant=instant) == date(2026, 7, 30)


          def test_roster_assignment_validation_rejects_cross_user_link():
              assignment = SimpleNamespace(
                  amo_id="amo-1",
                  user_id="employee-2",
                  deleted_at=None,
                  starts_at=datetime(2026, 7, 29, 17, tzinfo=timezone.utc),
                  ends_at=datetime(2026, 7, 29, 20, tzinfo=timezone.utc),
              )
              db = MagicMock()
              db.query.return_value = _query_returning(assignment)
              with pytest.raises(ValueError, match="does not belong"):
                  hr_service._validated_roster_assignment(
                      db,
                      amo_id="amo-1",
                      user_id="employee-1",
                      assignment_id="assignment-1",
                      starts_at=datetime(2026, 7, 29, 18, tzinfo=timezone.utc),
                      ends_at=datetime(2026, 7, 29, 19, tzinfo=timezone.utc),
                  )


          def test_people_register_is_paginated_without_truncating_total(monkeypatch):
              contracts = []
              for index in range(0, 501):
                  user = SimpleNamespace(
                      id=f"user-{index}",
                      staff_code=f"S{index:04d}",
                      full_name=f"Employee {index:04d}",
                      position_title="Engineer",
                      department=None,
                  )
                  contracts.append(SimpleNamespace(
                      id=f"contract-{index}",
                      user_id=user.id,
                      user=user,
                      employment_status=models.EmploymentStatus.ACTIVE,
                      contract_type=models.ContractType.PERMANENT,
                      effective_from=date(2026, 1, 1),
                      effective_to=None,
                      primary_base_station_id=None,
                      primary_base=None,
                      supervisor=None,
                      standard_weekly_minutes=2400,
                      standard_daily_minutes=480,
                      fte_percentage=100,
                      cost_centre=None,
                      payroll_number=None,
                      overtime_eligible=True,
                      night_shift_eligible=False,
                      standby_eligible=False,
                  ))
              monkeypatch.setattr(hr_service, "_active_contracts", lambda *args, **kwargs: contracts)
              monkeypatch.setattr(hr_service, "_effective_patterns", lambda *args, **kwargs: {})
              monkeypatch.setattr(hr_service, "_active_leave", lambda *args, **kwargs: {})
              result = hr_service.list_people_page(MagicMock(), amo_id="amo-1", page=6, page_size=100)
              assert result.total == 501
              assert result.pages == 6
              assert len(result.items) == 1
          '''
          write(test_path, tests)

          automation_test_path = 'backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py'
          automation_tests = read(automation_test_path)
          if 'test_pattern_readiness_query_filters_inactive_patterns' not in automation_tests:
              automation_tests += '''

          def test_pattern_readiness_query_filters_inactive_patterns():
              source = Path(automation_service.__file__).read_text(encoding="utf-8")
              section = source[source.index("def _pattern_assignments"):source.index("def _estimated_assignments")]
              assert "join(" in section
              assert "WorkPattern.is_active.is_(True)" in section
          '''
              automation_tests = automation_tests.replace('from datetime import datetime, timezone\n', 'from datetime import datetime, timezone\nfrom pathlib import Path\n', 1)
          write(automation_test_path, automation_tests)

          frontend_test_path = 'frontend/src/pages/rostering/rosteringSetupExperience.test.ts'
          frontend_tests = read(frontend_test_path)
          if 'listWorkforceHrPeople' not in frontend_tests:
              frontend_tests = frontend_tests.replace(
                  '    expect(workforceSource).toContain("dashboard.attendance_exceptions.map");',
                  '    expect(workforceSource).toContain("dashboard.attendance_exceptions.map");\n    expect(workforceSource).toContain("listWorkforceHrPeople");\n    expect(workforceSource).toContain("Showing {people.length} of {total}");',
                  1,
              )
          write(frontend_test_path, frontend_tests)
          PY
      - name: Compile corrected backend modules
        run: >-
          python -m compileall -q
          backend/amodb/apps/rostering/automation_service.py
          backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py
          backend/amodb/apps/workforce/hr_router.py
          backend/amodb/apps/workforce/hr_schemas.py
          backend/amodb/apps/workforce/hr_service.py
          backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
      - name: Commit product fixes
        run: |
          if git diff --quiet -- backend frontend; then
            echo "Integrity and pagination fixes already present"
            exit 0
          fi
          git config user.name "amo-portal-actions"
          git config user.email "actions@github.com"
          git add \
            backend/amodb/apps/rostering/automation_service.py \
            backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py \
            backend/amodb/apps/workforce/hr_router.py \
            backend/amodb/apps/workforce/hr_schemas.py \
            backend/amodb/apps/workforce/hr_service.py \
            backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py \
            frontend/src/pages/rostering/components/WorkforceHrWorkspace.tsx \
            frontend/src/pages/rostering/rosteringSetupExperience.test.ts \
            frontend/src/services/workforceHr.ts \
            frontend/src/types/workforceHr.ts
          git commit -m "Harden overtime evidence and paginate Workforce people"
          git push origin HEAD:${{ github.head_ref }}
