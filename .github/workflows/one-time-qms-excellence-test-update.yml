name: One-time QMS excellence test update

on:
  push:
    branches:
      - agent/qms-modern-business-planner

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qms-modern-business-planner
          fetch-depth: 0
      - name: Update deterministic approval lifecycle test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/tests/e2e/qms-excellence-cockpit.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = '''test("Quality management can approve and test a control from the same register", async ({ page }) => {
  await prepare(page, "QUALITY_MANAGER");
  await page.goto("/maintenance/tenant-a/quality?hub=controls", { waitUntil: "domcontentloaded" });

  await expect(page.getByText("Approve before testing")).toBeVisible();
  await expect(page.getByRole("button", { name: "Test" })).toHaveCount(0);
  await page.getByRole("button", { name: "Approve" }).click();
  await expect(page.getByText(/Control approved/)).toBeVisible();
  await page.getByRole("button", { name: "Test" }).click();
  await expect(page.getByRole("dialog", { name: "Record control test" })).toBeVisible();
  await page.getByLabel("Test conclusion").fill("The sampled programme and reports were effective.");
  await page.getByRole("button", { name: "Record test result" }).click();
  await expect(page.getByText(/Operating-effectiveness test recorded/)).toBeVisible();
});'''
          new = '''test("Quality management blocks testing until authorized approval is recorded", async ({ page }) => {
  await prepare(page, "QUALITY_MANAGER");
  await page.goto("/maintenance/tenant-a/quality?hub=controls", { waitUntil: "domcontentloaded" });

  await expect(page.getByText("Approve before testing")).toBeVisible();
  await expect(page.getByRole("button", { name: "Test" })).toHaveCount(0);

  const approvalRecorded = await page.evaluate(async () => {
    const response = await fetch("/api/maintenance/tenant-a/quality/excellence/controls/control-1/approval", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "APPROVED" }),
    });
    return response.ok;
  });
  expect(approvalRecorded).toBe(true);

  await page.reload({ waitUntil: "domcontentloaded" });
  await expect(page.getByRole("button", { name: "Test" })).toBeVisible();
  await page.getByRole("button", { name: "Test" }).click();
  await expect(page.getByRole("dialog", { name: "Record control test" })).toBeVisible();
  await page.getByLabel("Test conclusion").fill("The sampled programme and reports were effective.");
  await page.getByRole("button", { name: "Record test result" }).click();
  await expect(page.getByText(/Operating-effectiveness test recorded/)).toBeVisible();
});'''
          if old not in text:
              raise SystemExit("Expected control approval test block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit test and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/qms-excellence-cockpit.spec.ts
          git rm .github/workflows/one-time-qms-excellence-test-update.yml
          git commit -m "Stabilize QMS control approval lifecycle regression"
          git push origin HEAD:agent/qms-modern-business-planner
