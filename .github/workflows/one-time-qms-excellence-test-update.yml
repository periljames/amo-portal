name: One-time QMS excellence test update

on:
  push:
    branches:
      - agent/qms-modern-business-planner

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qms-modern-business-planner
          fetch-depth: 0
      - name: Update approval lifecycle regression
        run: python -c 'import base64; exec(base64.b64decode(""))'
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/qms-excellence-cockpit.spec.ts
          git commit -m "Stabilize QMS control approval lifecycle regression"
          git push origin HEAD:agent/qms-modern-business-planner
