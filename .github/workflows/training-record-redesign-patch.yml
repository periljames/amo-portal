name: Apply Training Record Redesign Patch

on:
  push:
    branches:
      - codex/training-record-redesign-20260817

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[training-redesign-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/training-record-redesign-20260817
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python scripts/apply_training_record_redesign_patch.py
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/amodb/apps/training/record_presentation.py frontend/src/pages/QMSTrainingUserPage.tsx frontend/src/styles/training.css
          git commit -m "feat(training): apply personnel record redesign [training-redesign-applied]"
          git push origin HEAD:codex/training-record-redesign-20260817
