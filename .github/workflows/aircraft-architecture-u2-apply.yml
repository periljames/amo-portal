name: Apply Aircraft Architecture U2

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-architecture-u2-apply.yml"

permissions:
  contents: write

jobs:
  apply-u2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract reviewed U2 implementation
        env:
          U2_ARCHIVE: ""
        run: |
          python - <<'PY'
          import base64, io, os, tarfile
          archive = base64.b64decode(os.environ["U2_ARCHIVE"])
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              for member in bundle.getmembers():
                  if member.name.startswith("/") or ".." in member.name.split("/"):
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              bundle.extractall(".")
          PY
      - name: Compile and run U2 focused tests
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall -q backend/amodb/apps/aircraft_architecture/effectivity
          python -m py_compile backend/amodb/alembic/versions/aircraft_arch_20260805_u2_effectivity.py
          pytest -q backend/amodb/apps/aircraft_architecture/effectivity/tests
      - name: Commit U2 implementation
        run: |
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/amodb/apps/aircraft_architecture backend/amodb/alembic/versions/aircraft_arch_20260805_u2_effectivity.py
          git commit -m "Phase U2: add explainable effectivity engine"
          git push origin HEAD:agent/aircraft-induction-architecture
