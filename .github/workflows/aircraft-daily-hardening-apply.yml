name: Apply Daily Utilisation Hardening

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-daily-hardening-apply.yml"
      - ".github/transfer/daily-hardening.bin*"

permissions:
  contents: write

jobs:
  merge-validate-publish:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: daily-utilisation-hardening-ci-secret
      JWT_SECRET_KEY: daily-utilisation-hardening-jwt-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      DATABASE_WRITE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      POSTGRES_INTEGRATION_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0

      - name: Merge current main without publishing
        run: |
          set -euo pipefail
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Reconstruct and verify reviewed hardening bundle
        run: |
          set -euo pipefail
          cat .github/transfer/daily-hardening.bin00 \
              .github/transfer/daily-hardening.bin01 \
              .github/transfer/daily-hardening.bin02 \
              .github/transfer/daily-hardening.bin03 \
              .github/transfer/daily-hardening.bin04 > /tmp/daily_hardening_bundle.tgz
          echo "d5ae046e553ad117bbe9d8d3f04864f5edf59fb72ba4b3c1fe1dd78b09bee3dd  /tmp/daily_hardening_bundle.tgz" | sha256sum --check --strict
          tar -xzf /tmp/daily_hardening_bundle.tgz -C .

      - name: Bind integration tests to PostgreSQL and harden shared CI
        run: |
          python - <<'PY_PATCH'
          from pathlib import Path
          import re

          test_path = Path("backend/amodb/apps/aircraft_architecture/daily_utilisation/tests/test_posting_integration.py")
          source = test_path.read_text()
          replacements = [
              (
                  "from decimal import Decimal\nimport uuid\n",
                  "from decimal import Decimal\nimport os\nimport uuid\n",
              ),
              (
                  "from sqlalchemy import func\n",
                  "from sqlalchemy import create_engine, func\nfrom sqlalchemy.orm import sessionmaker\n",
              ),
              ("from amodb.database import WriteSessionLocal\n", ""),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected one integration-test snippet: {old!r}")
              source = source.replace(old, new)

          anchor = "\n\ndef _id(prefix: str) -> str:\n"
          block = '''

POSTGRES_INTEGRATION_URL = os.getenv("POSTGRES_INTEGRATION_URL")
pytestmark = pytest.mark.skipif(
    not POSTGRES_INTEGRATION_URL,
    reason="POSTGRES_INTEGRATION_URL is required for daily utilisation integration tests",
)


def _integration_session_factory():
    assert POSTGRES_INTEGRATION_URL, "POSTGRES_INTEGRATION_URL is required"
    engine = create_engine(POSTGRES_INTEGRATION_URL, pool_pre_ping=True, future=True)
    assert engine.dialect.name == "postgresql", engine.url.render_as_string(hide_password=True)
    return sessionmaker(
        bind=engine,
        autoflush=False,
        autocommit=False,
        expire_on_commit=False,
        future=True,
    )


IntegrationSession = _integration_session_factory() if POSTGRES_INTEGRATION_URL else None


def _new_session():
    assert IntegrationSession is not None, "PostgreSQL integration session is not configured"
    session = IntegrationSession()
    assert session.get_bind().dialect.name == "postgresql"
    return session
'''
          if source.count(anchor) != 1:
              raise SystemExit("expected one integration-test insertion anchor")
          source = source.replace(anchor, block + anchor)
          if source.count("WriteSessionLocal()") != 2:
              raise SystemExit("expected two integration session constructors")
          source = source.replace("WriteSessionLocal()", "_new_session()")
          test_path.write_text(source)

          architecture_path = Path(".github/workflows/aircraft-architecture-ci.yml")
          architecture = architecture_path.read_text()
          db_line = "      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test\n"
          db_block = (
              db_line
              + "      DATABASE_WRITE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test\n"
              + "      POSTGRES_INTEGRATION_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test\n"
          )
          if architecture.count(db_line) != 1:
              raise SystemExit("expected one architecture database URL")
          architecture_path.write_text(architecture.replace(db_line, db_block))

          reliability_path = Path(".github/workflows/reliability-module-ci.yml")
          reliability = reliability_path.read_text()
          old_condition = "        if: github.event_name == 'pull_request'\n"
          new_condition = "        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/reliability-')\n"
          if reliability.count(old_condition) != 1:
              raise SystemExit("expected one Reliability-only diff condition")
          reliability = reliability.replace(old_condition, new_condition)

          head_pattern = re.compile(
              r"^      - name: Verify one Alembic head\n.*?(?=^      - name: Upgrade clean PostgreSQL schema)",
              re.MULTILINE | re.DOTALL,
          )
          head_replacement = '''      - name: Verify one Alembic head with Reliability lineage
        run: |
          python - <<'PY_INNER'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("backend/amodb/alembic.ini"))
          heads = script.get_heads()
          assert len(heads) == 1, heads
          lineage = {revision.revision for revision in script.walk_revisions(heads[0], "base")}
          assert "rel_20260805_ops_exact_counts" in lineage, sorted(lineage)
          print(f"repository_head={heads[0]}; reliability_lineage=present")
          PY_INNER

'''
          reliability, count = head_pattern.subn(head_replacement, reliability, count=1)
          if count != 1:
              raise SystemExit("expected one Reliability Alembic head block")

          revision_pattern = re.compile(
              r"^      - name: Verify Alembic revision and capacity\n.*?(?=^      - name: Run PostgreSQL append-only calculation regression)",
              re.MULTILINE | re.DOTALL,
          )
          revision_replacement = '''      - name: Verify Alembic revision and capacity
        run: |
          python - <<'PY_INNER'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          repository_head = ScriptDirectory.from_config(
              Config("backend/amodb/alembic.ini")
          ).get_current_head()
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              width = connection.execute(text("""
                  SELECT character_maximum_length
                  FROM information_schema.columns
                  WHERE table_name = 'alembic_version'
                    AND column_name = 'version_num'
              """)).scalar_one()
              versions = [row[0] for row in connection.execute(
                  text("SELECT version_num FROM alembic_version ORDER BY version_num")
              )]
          assert width is not None and width >= 128, width
          assert versions == [repository_head], (versions, repository_head)
          print(f"alembic_version={repository_head}; capacity={width}")
          PY_INNER

'''
          reliability, count = revision_pattern.subn(revision_replacement, reliability, count=1)
          if count != 1:
              raise SystemExit("expected one Reliability revision verification block")
          reliability_path.write_text(reliability)
          PY_PATCH

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile hardened aircraft architecture
        run: python -m compileall -q backend/amodb/apps/aircraft_architecture

      - name: Verify one merged Alembic head
        run: |
          output=$(python -m alembic -c backend/amodb/alembic.ini heads)
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '(head)')" -eq 1
          printf '%s\n' "$output" | grep -q 'aircraft_arch_20260805_daily_hardening'

      - name: Upgrade a clean PostgreSQL database
        run: python -m alembic -c backend/amodb/alembic.ini upgrade head

      - name: Import the complete application and initialize mappers
        run: |
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print("application import and mapper configuration passed")
          PY

      - name: Run aircraft architecture unit and PostgreSQL integration tests
        run: pytest -q backend/amodb/apps/aircraft_architecture

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run daily utilisation frontend contracts
        working-directory: frontend
        run: npm exec -- vitest run src/services/dailyUtilisation.test.ts

      - name: Run tenant-shell contracts
        working-directory: frontend
        run: npm run test:tenant-shell

      - name: Lint the daily utilisation frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/planning/DailyAircraftUtilisationPage.tsx src/services/dailyUtilisation.ts src/services/dailyUtilisation.test.ts

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build

      - name: Publish only the validated source
        run: |
          set -euo pipefail
          rm -rf .github/transfer
          rm -f .github/workflows/aircraft-daily-hardening-apply.yml
          rm -f .github/workflows/aircraft-daily-hardening-debug.yml
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "Harden manual daily utilisation end to end"
          git push origin HEAD:agent/aircraft-induction-architecture
