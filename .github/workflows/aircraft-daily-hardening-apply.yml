name: Apply Daily Utilisation Hardening

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-daily-hardening-apply.yml"
      - ".github/transfer/daily-hardening.bin*"

permissions:
  contents: write

jobs:
  merge-validate-publish:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: daily-utilisation-hardening-ci-secret
      JWT_SECRET_KEY: daily-utilisation-hardening-jwt-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      DATABASE_WRITE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      WRITE_DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0

      - name: Merge current main without publishing
        run: |
          set -euo pipefail
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Reconstruct and verify reviewed hardening bundle
        run: |
          set -euo pipefail
          cat .github/transfer/daily-hardening.bin00 \
              .github/transfer/daily-hardening.bin01 \
              .github/transfer/daily-hardening.bin02 \
              .github/transfer/daily-hardening.bin03 \
              .github/transfer/daily-hardening.bin04 > /tmp/daily_hardening_bundle.tgz
          echo "d5ae046e553ad117bbe9d8d3f04864f5edf59fb72ba4b3c1fe1dd78b09bee3dd  /tmp/daily_hardening_bundle.tgz" | sha256sum --check --strict
          tar -xzf /tmp/daily_hardening_bundle.tgz -C .

      - name: Make Reliability CI compatible with shared migration heads
        run: |
          python - <<'PY_PATCH_RELIABILITY'
          from pathlib import Path

          path = Path(".github/workflows/reliability-module-ci.yml")
          source = path.read_text()

          old_condition = "        if: github.event_name == 'pull_request'\n"
          new_condition = "        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/reliability-')\n"
          if source.count(old_condition) != 1:
              raise SystemExit("expected one Reliability-only diff condition")
          source = source.replace(old_condition, new_condition)

          old_head = "\n".join([
              "      - name: Verify one Alembic head",
              "        shell: bash",
              "        run: |",
              "          set -euo pipefail",
              "          set -o pipefail",
              "          python -m alembic -c backend/amodb/alembic.ini heads | tee /tmp/alembic-heads.txt",
              "          test \"$(grep -c '(head)' /tmp/alembic-heads.txt)\" -eq 1",
              "          grep -q 'rel_20260805_ops_exact_counts' /tmp/alembic-heads.txt",
              "",
          ])
          new_head = "\n".join([
              "      - name: Verify one Alembic head with Reliability lineage",
              "        run: |",
              "          python - <<'PY_INNER'",
              "          from alembic.config import Config",
              "          from alembic.script import ScriptDirectory",
              "",
              "          script = ScriptDirectory.from_config(Config(\"backend/amodb/alembic.ini\"))",
              "          heads = script.get_heads()",
              "          assert len(heads) == 1, heads",
              "          lineage = {revision.revision for revision in script.walk_revisions(heads[0], \"base\")}",
              "          assert \"rel_20260805_ops_exact_counts\" in lineage, sorted(lineage)",
              "          print(f\"repository_head={heads[0]}; reliability_lineage=present\")",
              "          PY_INNER",
              "",
          ])
          if source.count(old_head) != 1:
              raise SystemExit("expected one Reliability Alembic head block")
          source = source.replace(old_head, new_head)

          old_revision = "\n".join([
              "      - name: Verify Alembic revision and capacity",
              "        run: |",
              "          python - <<'PY'",
              "          import os",
              "          from sqlalchemy import create_engine, text",
              "",
              "          engine = create_engine(os.environ['DATABASE_URL'])",
              "          with engine.connect() as connection:",
              "              width = connection.execute(text(\"\"\"",
              "                  SELECT character_maximum_length",
              "                  FROM information_schema.columns",
              "                  WHERE table_name = 'alembic_version'",
              "                    AND column_name = 'version_num'",
              "              \"\"\")).scalar_one()",
              "              version = connection.execute(text('SELECT version_num FROM alembic_version')).scalar_one()",
              "          assert width is not None and width >= 128, width",
              "          assert version == 'rel_20260805_ops_exact_counts', version",
              "          print(f'alembic_version={version}; capacity={width}')",
              "          PY",
              "",
          ])
          new_revision = "\n".join([
              "      - name: Verify Alembic revision and capacity",
              "        run: |",
              "          python - <<'PY_INNER'",
              "          import os",
              "          from alembic.config import Config",
              "          from alembic.script import ScriptDirectory",
              "          from sqlalchemy import create_engine, text",
              "",
              "          repository_head = ScriptDirectory.from_config(",
              "              Config(\"backend/amodb/alembic.ini\")",
              "          ).get_current_head()",
              "          engine = create_engine(os.environ['DATABASE_URL'])",
              "          with engine.connect() as connection:",
              "              width = connection.execute(text(\"\"\"",
              "                  SELECT character_maximum_length",
              "                  FROM information_schema.columns",
              "                  WHERE table_name = 'alembic_version'",
              "                    AND column_name = 'version_num'",
              "              \"\"\")).scalar_one()",
              "              versions = [row[0] for row in connection.execute(",
              "                  text('SELECT version_num FROM alembic_version ORDER BY version_num')",
              "              )]",
              "          assert width is not None and width >= 128, width",
              "          assert versions == [repository_head], (versions, repository_head)",
              "          print(f'alembic_version={repository_head}; capacity={width}')",
              "          PY_INNER",
              "",
          ])
          if source.count(old_revision) != 1:
              raise SystemExit("expected one Reliability revision verification block")
          path.write_text(source.replace(old_revision, new_revision))
          PY_PATCH_RELIABILITY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile hardened aircraft architecture
        run: python -m compileall -q backend/amodb/apps/aircraft_architecture

      - name: Verify one merged Alembic head
        run: |
          output=$(python -m alembic -c backend/amodb/alembic.ini heads)
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '(head)')" -eq 1
          printf '%s\n' "$output" | grep -q 'aircraft_arch_20260805_daily_hardening'

      - name: Upgrade a clean PostgreSQL database
        run: python -m alembic -c backend/amodb/alembic.ini upgrade head

      - name: Import the complete application and initialize mappers
        run: |
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print("application import and mapper configuration passed")
          PY

      - name: Run aircraft architecture unit and PostgreSQL integration tests
        run: pytest -q backend/amodb/apps/aircraft_architecture

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run daily utilisation frontend contracts
        working-directory: frontend
        run: npm exec -- vitest run src/services/dailyUtilisation.test.ts

      - name: Run tenant-shell contracts
        working-directory: frontend
        run: npm run test:tenant-shell

      - name: Lint the daily utilisation frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/planning/DailyAircraftUtilisationPage.tsx src/services/dailyUtilisation.ts src/services/dailyUtilisation.test.ts

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build

      - name: Publish only the validated source
        run: |
          set -euo pipefail
          rm -rf .github/transfer
          rm -f .github/workflows/aircraft-daily-hardening-apply.yml
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "Harden manual daily utilisation end to end"
          git push origin HEAD:agent/aircraft-induction-architecture
