name: PR 477 backend failure diagnostic

on:
  push:
    branches:
      - agent/dms-reader-governance-completion
    paths:
      - .github/workflows/pr477-backend-failure-diagnostic.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_document_control_diag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_document_control_diag"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: document-control-diagnostic-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_document_control_diag
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_document_control_diag
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_document_control_diag
      QUALITY_SCHEMA_STRICT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dms-reader-governance-completion
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Upgrade schema and capture pytest failure
        id: test
        working-directory: backend
        shell: bash
        run: |
          set +e
          alembic -c amodb/alembic.ini upgrade heads > /tmp/pr477-report.txt 2>&1
          upgrade=$?
          if [ "$upgrade" -eq 0 ]; then
            pytest -q amodb/apps/doc_control/tests --tb=short >> /tmp/pr477-report.txt 2>&1
            code=$?
          else
            code=$upgrade
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post diagnostic report to PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### PR #477 backend exact-head diagnostic'
            echo
            echo '```text'
            tail -c 50000 /tmp/pr477-report.txt
            echo
            echo '```'
            echo
            echo "Diagnostic exit code: ${{ steps.test.outputs.exit_code }}"
          } > /tmp/pr477-comment.md
          gh pr comment 477 --repo periljames/amo-portal --body-file /tmp/pr477-comment.md
      - name: Remove diagnostic workflow
        shell: bash
        run: |
          git config user.name "amo-portal-automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr477-backend-failure-diagnostic.yml
          git commit -m "chore(document-control): remove backend diagnostic workflow"
          git push origin HEAD:agent/dms-reader-governance-completion
