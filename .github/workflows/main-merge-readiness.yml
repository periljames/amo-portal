name: Main Merge Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: procurement-lint-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  procurement-lint-fix:
    if: github.event.pull_request.head.ref == 'agent/procurement-ui-document-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/procurement-ui-document-controls
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply component-boundary and service lint corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "frontend/src/pages/procurement/ProcurementModule.tsx",
              'import { EMPTY, NAV, ModalShell, dateLabel, humanize, type FormState, type Modal, type Section, type WorkspaceData } from "./procurementUiShared";',
              'import { ModalShell } from "./procurementUiShared";\nimport { EMPTY, NAV, dateLabel, humanize, type FormState, type Modal, type Section, type WorkspaceData } from "./procurementUiModel";',
          )
          replace_once(
              "frontend/src/pages/procurement/ProcurementSections.tsx",
              '''import {
            Empty,
            RecordActions,
            Skeleton,
            badgeClass,
            dateLabel,
            humanize,
            money,
            type FormState,
            type Modal,
            type Section,
            type WorkspaceData,
          } from "./procurementUiShared";''',
              '''import { Empty, RecordActions, Skeleton } from "./procurementUiShared";
          import {
            badgeClass,
            dateLabel,
            humanize,
            money,
            type FormState,
            type Modal,
            type Section,
            type WorkspaceData,
          } from "./procurementUiModel";''',
          )
          replace_once(
              "frontend/src/pages/procurement/ProcurementForms.tsx",
              'import { Field, humanize, money, type FormState, type Modal, type WorkspaceData } from "./procurementUiShared";',
              'import { Field } from "./procurementUiShared";\nimport { humanize, money, type FormState, type Modal, type WorkspaceData } from "./procurementUiModel";',
          )
          replace_once(
              "frontend/src/pages/procurement/procurementActions.ts",
              'import type { FormState, Modal, WorkspaceData } from "./procurementUiShared";',
              'import type { FormState, Modal, WorkspaceData } from "./procurementUiModel";',
          )
          replace_once(
              "frontend/src/services/procurement.ts",
              'function json<T>(method: string, body?: unknown): RequestInit {',
              'function json(method: string, body?: unknown): RequestInit {',
          )
          replace_once(
              "backend/tests/test_procurement_module_contract.py",
              'shared_ui = _read(FRONTEND / "pages" / "procurement" / "procurementUiShared.tsx")',
              'shared_ui = _read(FRONTEND / "pages" / "procurement" / "procurementUiModel.ts")',
          )
          PY
          git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Lint Procurement-owned surfaces
        working-directory: frontend
        run: npm exec -- eslint src/pages/procurement src/services/procurement.ts src/types/procurement.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Restore standard workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/main-merge-readiness.yml
          git diff --check
      - name: Commit lint corrections to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/main-merge-readiness.yml frontend/src/pages/procurement frontend/src/services/procurement.ts backend/tests/test_procurement_module_contract.py
          git commit -m "Fix Procurement frontend lint boundaries"
          git pull --rebase origin agent/procurement-ui-document-controls
          git push origin HEAD:agent/procurement-ui-document-controls
