name: Main Merge Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: procurement-review-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restore-standard-gate:
    if: github.event.pull_request.head.ref == 'agent/procurement-ui-document-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/procurement-ui-document-controls
          fetch-depth: 0
      - name: Restore standard workflow and remove patch scaffolding
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/main-merge-readiness.yml
          git rm -f .github/workflows/procurement-review-fix.yml .github/scripts/procurement_review_fix.py
          git diff --check
      - name: Commit cleanup to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/main-merge-readiness.yml
          git commit -m "Remove temporary Procurement correction scaffolding"
          git push origin HEAD:agent/procurement-ui-document-controls
