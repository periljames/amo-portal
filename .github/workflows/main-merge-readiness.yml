name: Main Merge Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: procurement-focused-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  procurement-focused-validation:
    if: github.event.pull_request.head.ref == 'agent/procurement-ui-document-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/procurement-ui-document-controls
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Procurement backend and contracts
        run: >-
          python -m compileall -q
          backend/amodb/apps/procurement
          backend/amodb/apps/inventory
          backend/tests/test_procurement_module_contract.py
          backend/tests/test_procurement_document_contract.py
          backend/tests/test_procurement_frontend_contract.py
      - name: Run focused Procurement regression contracts
        working-directory: backend
        run: >-
          pytest -q
          tests/test_procurement_module_contract.py
          tests/test_procurement_document_contract.py
          tests/test_procurement_frontend_contract.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Typecheck and build production frontend
        working-directory: frontend
        run: npm run build
      - name: Restore standard workflow and remove temporary updater
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/main-merge-readiness.yml
          git rm -f .github/scripts/add_procurement_release_gate.py
          git diff --check
      - name: Commit cleanup to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/main-merge-readiness.yml
          git commit -m "Validate Procurement contracts and restore merge gate"
          git pull --rebase origin agent/procurement-ui-document-controls
          git push origin HEAD:agent/procurement-ui-document-controls
