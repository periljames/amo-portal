name: Main Merge Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-merge-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect affected project surfaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      schema: ${{ steps.paths.outputs.schema }}
      accounts: ${{ steps.paths.outputs.accounts }}
      quality: ${{ steps.paths.outputs.quality }}
      workforce: ${{ steps.paths.outputs.workforce }}
      rostering: ${{ steps.paths.outputs.rostering }}
      platform: ${{ steps.paths.outputs.platform }}
      tenant_shell: ${{ steps.paths.outputs.tenant_shell }}
      offline: ${{ steps.paths.outputs.offline }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
      - id: paths
        name: Classify changed files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-$(git rev-parse HEAD^)}"
          head_sha="${PR_HEAD_SHA:-$(git rev-parse HEAD)}"
          git diff --name-only "$base_sha" "$head_sha" | sort -u | tee changed-files.txt

          matches() { grep -Eq "$1" changed-files.txt; }
          output() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          backend=false
          frontend=false
          schema=false
          accounts=false
          quality=false
          workforce=false
          rostering=false
          platform=false
          tenant_shell=false
          offline=false

          matches '^backend/' && backend=true || true
          matches '^frontend/' && frontend=true || true
          matches '^backend/amodb/alembic/versions/|^backend/amodb/(database|models)\.py$|^backend/amodb/apps/[^/]+/models[^/]*\.py$' && schema=true || true
          matches '^backend/amodb/apps/accounts/|^backend/amodb/security\.py$|^frontend/src/(services/(auth|adminProfileMode|departmentHome)|pages/(Admin|User|DepartmentHome)|components/admin)/' && accounts=true || true
          matches '^backend/amodb/apps/quality/|^backend/amodb/quality_main\.py$|^frontend/src/(pages/qms|services/qms|types/qms|components/Layout/qmsSidebarNavigation|styles/qms)' && quality=true || true
          matches '^backend/amodb/apps/workforce/|^frontend/src/(pages/workforce|services/workforce)' && workforce=true || true
          matches '^backend/amodb/apps/rostering/|^frontend/src/(pages/rostering|services/rostering|styles/rostering)' && rostering=true || true
          matches '^backend/amodb/apps/platform/|^backend/amodb/apps/realtime/|^backend/amodb/jobs/(saas|platform)|^frontend/src/(pages/platform|services/(platformControl|saasSettings|messaging|realtime)|components/messaging)' && platform=true || true
          matches '^frontend/(playwright\.tenant\.config\.ts|scripts/check-css-contract\.mjs|tests/e2e/tenant-shell-theme\.spec\.ts)$|^frontend/src/(App\.tsx|main\.tsx|router\.tsx|portalRoutes\.tsx|app/(PortalRouteSurface|TenantRouteBoundary|portalRouteManifest)|components/Layout/DepartmentLayout|hooks/usePortalAppearance|pages/DepartmentHomePage|services/(adminProfileMode|departmentHome)|styles/(index|tokens|base|theme-contract|theme-module-repairs|department-home)|styles/components/tenant-shell|styles/foundations/)' && tenant_shell=true || true
          matches '^frontend/src/(services/(apiClient|offlineHttp|offlinePersistence|queryPersister)|components/offline)|^frontend/public/(sw|service-worker|portal-sw)' && offline=true || true

          # Backend bootstrap or dependency changes are genuinely shared by every
          # backend project and therefore require the full backend project matrix.
          if matches '^backend/(requirements[^/]*\.txt|pyproject\.toml)$|^backend/amodb/(main|database|security)\.py$'; then
            backend=true
            accounts=true
            quality=true
            workforce=true
            rostering=true
            platform=true
          fi

          # A lockfile change can alter every frontend dependency. A package.json
          # or main.tsx change alone still receives a production build, but does
          # not manufacture unrelated module test failures.
          if matches '^frontend/package-lock\.json$'; then
            frontend=true
            quality=true
            rostering=true
            platform=true
            tenant_shell=true
            offline=true
          fi
          matches '^frontend/(package\.json|tsconfig[^/]*\.json|vite\.config\.[^/]+)$' && frontend=true || true

          output backend "$backend"
          output frontend "$frontend"
          output schema "$schema"
          output accounts "$accounts"
          output quality "$quality"
          output workforce "$workforce"
          output rostering "$rostering"
          output platform "$platform"
          output tenant_shell "$tenant_shell"
          output offline "$offline"

  schema-postgres:
    name: PostgreSQL schema and mapper contract
    needs: scope
    if: needs.scope.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_merge_readiness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_merge_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SECRET_KEY: main-merge-readiness-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_merge_readiness
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_merge_readiness
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_merge_readiness
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install schema dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "merge-readiness schema dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Verify Alembic graph and upgrade a clean database
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("amodb/alembic.ini"))
          heads = script.get_heads()
          assert heads and len(heads) == len(set(heads)), heads
          print("Alembic heads:", heads)
          PY
          alembic -c amodb/alembic.ini upgrade heads
      - name: Configure every SQLAlchemy mapper
        run: |
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          from amodb.main import app
          import amodb.quality_main
          configure_mappers()
          print(f"Configured all mappers; application exposes {len(app.routes)} routes")
          PY

  backend-regressions:
    name: Affected backend regressions
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: sqlite+pysqlite:///:memory:
      DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: main-merge-backend-test-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      QUALITY_SCHEMA_STRICT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "merge-readiness backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Compile and configure backend
        run: |
          python -m compileall -q amodb
          python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; import amodb.quality_main; configure_mappers(); print('All application mappers configured')"
      - name: Run account, tenant-home and Admin Profile regressions
        if: needs.scope.outputs.accounts == 'true'
        run: pytest -q amodb/apps/accounts/tests
      - name: Run focused Quality workflow regressions
        if: needs.scope.outputs.quality == 'true'
        run: >-
          pytest -q
          amodb/apps/quality/tests/test_quality_imports.py
          amodb/apps/quality/tests/test_tenant_route_isolation.py
          amodb/apps/quality/tests/test_dashboard_v2_contract.py
          amodb/apps/quality/tests/test_audit_reference_integrity.py
          amodb/apps/quality/tests/test_quality_delivery_profile.py
          amodb/apps/quality/tests/test_workflow_transitions.py
          amodb/apps/quality/tests/test_audit_workflow_enforcement.py
          amodb/apps/quality/tests/test_audit_events.py
          amodb/apps/quality/tests/test_task_integrations.py
          amodb/apps/quality/tests/test_evidence_pack_exports.py
      - name: Run Workforce regressions
        if: needs.scope.outputs.workforce == 'true'
        run: pytest -q amodb/apps/workforce/tests
      - name: Run Rostering regressions
        if: needs.scope.outputs.rostering == 'true'
        run: pytest -q amodb/apps/rostering/tests
      - name: Run Platform regressions
        if: needs.scope.outputs.platform == 'true'
        run: pytest -q amodb/apps/platform/tests/test_saas_*.py amodb/apps/realtime/tests/test_*.py

  frontend-regressions:
    name: Affected frontend regressions
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "merge-readiness frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Typecheck and build production frontend
        run: npm run build
      - name: Run Quality overview regressions
        if: needs.scope.outputs.quality == 'true'
        run: npm run test:qms-overview
      - name: Run tenant shell, department home and CSS regressions
        if: needs.scope.outputs.tenant_shell == 'true'
        run: npm run test:tenant-shell
      - name: Run Platform service regressions
        if: needs.scope.outputs.platform == 'true'
        run: npm run test:platform
      - name: Run Rostering regressions
        if: needs.scope.outputs.rostering == 'true'
        run: npm exec -- vitest run src/pages/rostering
      - name: Run offline transport regressions
        if: needs.scope.outputs.offline == 'true'
        run: npm exec -- vitest run src/services/offlineHttp.test.ts
      - name: Lint tenant shell and department home surfaces
        if: needs.scope.outputs.tenant_shell == 'true'
        run: >-
          npm exec -- eslint
          scripts/check-css-contract.mjs
          src/App.tsx src/main.tsx src/router.tsx
          src/app/PortalRouteSurface.tsx src/app/TenantRouteBoundary.tsx
          src/app/portalRouteManifest.ts src/app/portalRouteManifest.test.ts
          src/components/Layout/DepartmentLayout.tsx
          src/hooks/usePortalAppearance.ts
          src/pages/DepartmentHomePage.tsx
          src/services/adminProfileMode.ts src/services/departmentHome.ts src/services/departmentHome.test.ts
      - name: Install Chromium for tenant render smoke tests
        if: needs.scope.outputs.tenant_shell == 'true'
        run: npx playwright install --with-deps chromium
      - name: Verify light and dark layouts at desktop and mobile sizes
        if: needs.scope.outputs.tenant_shell == 'true'
        run: npm run test:tenant-render

  merge-readiness:
    name: Main Merge Readiness
    if: always()
    needs: [scope, schema-postgres, backend-regressions, frontend-regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable project gate to pass
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.scope.result }}" \
            "${{ needs.schema-postgres.result }}" \
            "${{ needs.backend-regressions.result }}" \
            "${{ needs.frontend-regressions.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required project gate ended with: $result" >&2; exit 1 ;;
            esac
          done
          echo "All applicable project-specific checks passed."
