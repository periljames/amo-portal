name: Main Merge Readiness

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-merge-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Main Merge Readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main_merge_readiness
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d main_merge_readiness"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      SECRET_KEY: main-merge-readiness-secret-not-for-production
      JWT_SECRET_KEY: main-merge-readiness-jwt-not-for-production
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/main_merge_readiness
      DATABASE_WRITE_URL: postgresql://postgres:postgres@127.0.0.1:5432/main_merge_readiness
      WRITE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/main_merge_readiness
      DATABASE_READ_URL: postgresql://postgres:postgres@127.0.0.1:5432/main_merge_readiness
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "main merge backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Compile and configure application backend
        run: |
          python -m compileall -q backend/amodb
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          from amodb.main import app
          import amodb.quality_main

          configure_mappers()
          print(f"Configured all application mappers; {len(app.routes)} routes registered")
          PY

      - name: Verify one Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(
              Config("backend/amodb/alembic.ini")
          ).get_heads()
          assert len(heads) == 1, heads
          print(f"Alembic head: {heads[0]}")
          PY

      - name: Upgrade a clean PostgreSQL schema
        run: alembic -c backend/amodb/alembic.ini upgrade heads

      - name: Run account and workforce regressions
        working-directory: backend
        run: pytest -q amodb/apps/accounts/tests amodb/apps/workforce/tests

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Run tenant route and reporting client contracts
        working-directory: frontend
        run: |
          npm run test:tenant-shell
          npm exec -- vitest run src/services/reportingLines.test.ts

      - name: Lint shared tenant and user-management surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/app/PortalRouteSurface.tsx
          src/app/portalRouteManifest.ts
          src/pages/admin-users
          src/services/corporateStructure.ts
          src/services/reportingLines.ts
          src/services/reportingLines.test.ts
