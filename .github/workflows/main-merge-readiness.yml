name: Main Merge Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: procurement-release-gate-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  add-procurement-release-gate:
    if: github.event.pull_request.head.ref == 'agent/procurement-ui-document-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/procurement-ui-document-controls
          fetch-depth: 0
      - name: Add permanent Procurement release-gate coverage
        run: python .github/scripts/add_procurement_release_gate.py
      - name: Validate workflow update
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('.github/workflows/release-candidate-recheck.yml')
          yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          git diff --check
      - name: Commit release-gate coverage to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-candidate-recheck.yml
          git commit -m "Run Procurement contracts in release candidate gate"
          git push origin HEAD:agent/procurement-ui-document-controls
