name: Main Merge Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-merge-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect affected project surfaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      schema: ${{ steps.paths.outputs.schema }}
      accounts: ${{ steps.paths.outputs.accounts }}
      quality: ${{ steps.paths.outputs.quality }}
      workforce: ${{ steps.paths.outputs.workforce }}
      rostering: ${{ steps.paths.outputs.rostering }}
      platform: ${{ steps.paths.outputs.platform }}
      tenant_shell: ${{ steps.paths.outputs.tenant_shell }}
      offline: ${{ steps.paths.outputs.offline }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
      - id: paths
        name: Classify changed files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-}"
          head_sha="${PR_HEAD_SHA:-}"
          if [[ -z "$head_sha" ]]; then
            head_sha="$(git rev-parse HEAD)"
          fi
          if [[ -z "$base_sha" ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "$base_sha" "$head_sha" | sort -u | tee changed-files.txt

          matches() {
            local expression="$1"
            grep -Eq "$expression" changed-files.txt
          }
          output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          backend=false
          frontend=false
          schema=false
          accounts=false
          quality=false
          workforce=false
          rostering=false
          platform=false
          tenant_shell=false
          offline=false

          matches '^backend/' && backend=true || true
          matches '^frontend/' && frontend=true || true
          matches '^backend/amodb/alembic/versions/|^backend/amodb/(database|models|security)\.py$|^backend/amodb/apps/[^/]+/models[^/]*\.py$' && schema=true || true
          matches '^backend/amodb/apps/accounts/|^backend/amodb/security\.py$|^frontend/src/(services/auth|pages/(Admin|User)|components/admin)/' && accounts=true || true
          matches '^backend/amodb/apps/quality/|^backend/amodb/quality_main\.py$|^frontend/src/(pages/qms|services/qms|types/qms|components/Layout/qmsSidebarNavigation|styles/qms)' && quality=true || true
          matches '^backend/amodb/apps/workforce/|^frontend/src/(pages/workforce|services/workforce)' && workforce=true || true
          matches '^backend/amodb/apps/rostering/|^frontend/src/(pages/rostering|services/rostering)' && rostering=true || true
          matches '^backend/amodb/apps/platform/|^backend/amodb/apps/realtime/|^backend/amodb/jobs/(saas|platform)|^frontend/src/(pages/platform|services/(platformControl|saasSettings|messaging|realtime)|components/messaging)' && platform=true || true
          matches '^frontend/src/(App\.tsx|router\.tsx|portalRoutes\.tsx|app/(PortalRouteSurface|TenantRouteBoundary|portalRouteManifest)|components/Layout/DepartmentLayout|styles/components/tenant-shell|services/adminProfileMode)' && tenant_shell=true || true
          matches '^frontend/src/(services/(apiClient|offlineHttp|offlinePersistence|queryPersister)|components/offline)|^frontend/public/(sw|service-worker)' && offline=true || true

          # Core dependency or application bootstrap changes legitimately affect every
          # backend or frontend project. This is the only deliberate broadening rule.
          if matches '^backend/(requirements[^/]*\.txt|pyproject\.toml)$|^backend/amodb/(main|database|security)\.py$'; then
            backend=true
            accounts=true
            quality=true
            workforce=true
            rostering=true
            platform=true
          fi
          if matches '^frontend/(package(-lock)?\.json|tsconfig[^/]*\.json|vite\.config\.[^/]+)$|^frontend/src/main\.tsx$'; then
            frontend=true
            quality=true
            rostering=true
            platform=true
            tenant_shell=true
            offline=true
          fi

          output backend "$backend"
          output frontend "$frontend"
          output schema "$schema"
          output accounts "$accounts"
          output quality "$quality"
          output workforce "$workforce"
          output rostering "$rostering"
          output platform "$platform"
          output tenant_shell "$tenant_shell"
          output offline "$offline"

  schema-postgres:
    name: PostgreSQL schema and mapper contract
    needs: scope
    if: needs.scope.outputs.schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_merge_readiness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_merge_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SECRET_KEY: main-merge-readiness-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_merge_readiness
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_merge_readiness
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_merge_readiness
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "merge-readiness schema dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Verify Alembic graph can be resolved
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("amodb/alembic.ini"))
          heads = script.get_heads()
          print("Alembic heads:", heads)
          assert heads, "Alembic has no head revision"
          assert len(heads) == len(set(heads)), heads
          PY
      - name: Upgrade an empty PostgreSQL database to all heads
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Configure all SQLAlchemy mappers against migrated schema
        run: |
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          from amodb.main import app
          import amodb.quality_main

          configure_mappers()
          print(f"Configured all mappers; application exposes {len(app.routes)} routes")
          PY

  backend-regressions:
    name: Affected backend regressions
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: sqlite+pysqlite:///:memory:
      DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: main-merge-backend-test-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      QUALITY_SCHEMA_STRICT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "merge-readiness backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Compile backend application
        run: python -m compileall -q amodb
      - name: Configure application mappers
        run: python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; import amodb.quality_main; configure_mappers(); print('All application mappers configured')"
      - name: Run account and Admin Profile regressions
        if: needs.scope.outputs.accounts == 'true'
        run: pytest -q amodb/apps/accounts/tests
      - name: Run Quality workflow regressions
        if: needs.scope.outputs.quality == 'true'
        run: >-
          pytest -q
          amodb/apps/quality/tests/test_quality_imports.py
          amodb/apps/quality/tests/test_tenant_route_isolation.py
          amodb/apps/quality/tests/test_dashboard_v2_contract.py
          amodb/apps/quality/tests/test_audit_reference_integrity.py
          amodb/apps/quality/tests/test_quality_delivery_profile.py
          amodb/apps/quality/tests/test_workflow_transitions.py
          amodb/apps/quality/tests/test_audit_workflow_enforcement.py
          amodb/apps/quality/tests/test_audit_events.py
          amodb/apps/quality/tests/test_task_integrations.py
          amodb/apps/quality/tests/test_evidence_pack_exports.py
      - name: Run Workforce regressions
        if: needs.scope.outputs.workforce == 'true'
        run: pytest -q amodb/apps/workforce/tests
      - name: Run Rostering regressions
        if: needs.scope.outputs.rostering == 'true'
        run: pytest -q amodb/apps/rostering/tests
      - name: Verify SaaS and release contracts
        if: needs.scope.outputs.platform == 'true'
        run: |
          python -m amodb.scripts.saas_control_plane_internal_check
          python -m amodb.scripts.saas_release_cleanup_check
      - name: Run Platform and realtime regressions
        if: needs.scope.outputs.platform == 'true'
        run: pytest -q amodb/apps/platform/tests/test_saas_*.py amodb/apps/realtime/tests/test_*.py
      - name: Run Platform worker smoke tests
        if: needs.scope.outputs.platform == 'true'
        run: |
          python -m amodb.jobs.saas_worker_safe --once --batch-size 5
          python -m amodb.jobs.platform_command_worker --once --batch-size 5

  frontend-regressions:
    name: Affected frontend regressions
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "merge-readiness frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Typecheck and build production frontend
        run: npm run build
      - name: Run Quality regressions
        if: needs.scope.outputs.quality == 'true'
        run: npm run test:quality
      - name: Run tenant shell and navigation regressions
        if: needs.scope.outputs.tenant_shell == 'true'
        run: npm run test:tenant-shell
      - name: Run Platform service regressions
        if: needs.scope.outputs.platform == 'true'
        run: npm run test:platform
      - name: Run Rostering regressions
        if: needs.scope.outputs.rostering == 'true'
        run: npm exec -- vitest run src/pages/rostering
      - name: Run offline transport regressions
        if: needs.scope.outputs.offline == 'true'
        run: npm exec -- vitest run src/services/offlineHttp.test.ts
      - name: Lint Quality surfaces
        if: needs.scope.outputs.quality == 'true'
        run: npm exec -- eslint src/pages/qms src/services/qmsAuditHubActions.ts src/services/qmsAuditHubActions.test.ts src/services/qmsDashboard.ts src/services/qmsDashboard.test.ts src/types/qms.ts
      - name: Lint tenant shell surfaces
        if: needs.scope.outputs.tenant_shell == 'true'
        run: npm exec -- eslint src/App.tsx src/router.tsx src/app/PortalRouteSurface.tsx src/app/TenantRouteBoundary.tsx src/app/portalRouteManifest.ts src/app/portalRouteManifest.test.ts src/components/Layout/DepartmentLayout.tsx src/services/adminProfileMode.ts
      - name: Lint Platform surfaces
        if: needs.scope.outputs.platform == 'true'
        run: npm exec -- eslint src/pages/platform src/services/platformControl.ts src/services/platformControl.test.ts src/services/saasSettings.ts src/services/saasSettings.test.ts src/services/messaging.ts src/services/messaging.test.ts src/services/realtime src/components/messaging
      - name: Lint Rostering surfaces
        if: needs.scope.outputs.rostering == 'true'
        run: npm exec -- eslint src/pages/rostering src/services/rostering.ts
      - name: Lint offline surfaces
        if: needs.scope.outputs.offline == 'true'
        run: npm exec -- eslint src/services/apiClient.ts src/services/offlineHttp.ts src/services/offlinePersistence.ts src/services/queryPersister.ts src/components/offline

  merge-readiness:
    name: Main Merge Readiness
    if: always()
    needs:
      - scope
      - schema-postgres
      - backend-regressions
      - frontend-regressions
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable project gate to pass
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.scope.result }}" \
            "${{ needs.schema-postgres.result }}" \
            "${{ needs.backend-regressions.result }}" \
            "${{ needs.frontend-regressions.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required project gate ended with: $result" >&2; exit 1 ;;
            esac
          done
          echo "All applicable project-specific checks passed."
