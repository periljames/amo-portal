name: Main Merge Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: procurement-final-edge-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-procurement-final-edge-fix:
    if: github.event.pull_request.head.ref == 'agent/procurement-ui-document-controls' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/procurement-ui-document-controls
          fetch-depth: 0
      - name: Apply final Procurement edge-case corrections
        run: python .github/scripts/procurement_final_edge_fix.py
      - name: Verify source integrity
        run: |
          python -m compileall -q backend/amodb/apps/procurement backend/tests
          git diff --check
      - name: Commit fixes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/amodb/apps/procurement/document_service.py backend/amodb/apps/procurement/document_router.py backend/amodb/apps/procurement/schemas.py backend/amodb/apps/procurement/router.py frontend/src/pages/procurement/ProcurementDocumentCenter.tsx backend/tests/test_procurement_document_contract.py backend/tests/test_procurement_frontend_contract.py backend/tests/test_procurement_module_contract.py
          git commit -m "Clear final Procurement review edge cases"
          git push origin HEAD:agent/procurement-ui-document-controls
