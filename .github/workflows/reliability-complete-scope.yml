name: Complete Reliability Full Stack

on:
  push:
    branches:
      - agent/reliability-v2-foundation
    paths:
      - docs/reliability/.complete-scope-trigger

permissions:
  contents: write

jobs:
  complete-validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_reliability_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_reliability_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_reliability_ci
      WRITE_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_reliability_ci
      SECRET_KEY: reliability-ci-secret-key
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      PGPASSWORD: postgres

    steps:
      - name: Check out canonical Reliability branch
        uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0

      - name: Apply permanent canonical implementation
        run: |
          python backend/scripts/complete_reliability_backend.py
          python backend/scripts/strengthen_reliability_sod.py
          python backend/scripts/fix_reliability_sod_escape.py
          python - <<'PY'
          from pathlib import Path

          env_path = Path('backend/amodb/alembic/env.py')
          text = env_path.read_text(encoding='utf-8')
          text = text.replace(
              '    table = getattr(obj, "table", None) or getattr(compare_to, "table", None)\n    return table is not None and table.name in _RELIABILITY_TABLES',
              '    table = getattr(obj, "table", None)\n    if table is None:\n        table = getattr(compare_to, "table", None)\n    return table is not None and table.name in _RELIABILITY_TABLES',
          )
          env_path.write_text(text, encoding='utf-8')

          model_path = Path('backend/amodb/apps/reliability/models.py')
          model = model_path.read_text(encoding='utf-8')
          replacements = {
              'validation_status = Column(String(24), nullable=False, default="VALID", index=True)':
                  'validation_status = Column(String(24), nullable=False, default="VALID", server_default=text("\'VALID\'"), index=True)',
              'validation_errors = Column(JSON, nullable=False, default=list)':
                  'validation_errors = Column(JSON, nullable=False, default=list, server_default=text("\'[]\'"))',
              'provenance_json = Column(JSON, nullable=False, default=dict)':
                  'provenance_json = Column(JSON, nullable=False, default=dict, server_default=text("\'{}\'"))',
          }
          for old, new in replacements.items():
              if old not in model:
                  raise RuntimeError(f'Migration-safe Reliability model anchor missing: {old}')
              model = model.replace(old, new, 1)
          model_path.write_text(model, encoding='utf-8')
          PY

      - name: Apply permanent frontend implementation
        working-directory: frontend
        run: |
          node scripts/complete-reliability-service.mjs
          node scripts/complete-reliability-workspace.mjs
          node scripts/strengthen-reliability-sod.mjs
          node scripts/complete-reliability-css.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Compile completed backend
        run: |
          python -m py_compile \
            backend/amodb/apps/reliability/models.py \
            backend/amodb/apps/reliability/schemas.py \
            backend/amodb/apps/reliability/router.py \
            backend/amodb/apps/reliability/advanced_models.py \
            backend/amodb/apps/reliability/advanced_schemas.py \
            backend/amodb/apps/reliability/advanced_services.py \
            backend/amodb/apps/reliability/advanced_router.py \
            backend/amodb/apps/reliability/advanced_scheduler.py \
            backend/amodb/apps/reliability/tests/test_complete_scope.py

      - name: Upgrade current repository schema
        working-directory: backend
        run: alembic -c amodb/alembic.ini upgrade heads

      - name: Converge migration heads when required
        working-directory: backend
        run: |
          mapfile -t HEADS < <(alembic -c amodb/alembic.ini heads | awk '{print $1}')
          echo "Current Alembic heads: ${HEADS[*]}"
          if [ "${#HEADS[@]}" -gt 1 ]; then
            alembic -c amodb/alembic.ini merge \
              --rev-id rel_20260803_merge_heads \
              -m "merge heads before complete Reliability scope" \
              "${HEADS[@]}"
            alembic -c amodb/alembic.ini upgrade head
          fi

      - name: Seed a populated legacy Reliability row
        run: |
          psql -h 127.0.0.1 -U postgres -d amo_reliability_ci -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO reliability_events (
            amo_id, event_type, occurred_at, created_at, description
          ) VALUES (
            'legacy-reliability-migration-probe', 'DEFECT', now(), now(),
            'Migration probe: existing Reliability row before advanced schema.'
          );
          SET session_replication_role = origin;
          SQL

      - name: Generate and finalize Reliability migration
        working-directory: backend
        env:
          RELIABILITY_AUTOGENERATE_ONLY: "true"
        run: |
          alembic -c amodb/alembic.ini revision \
            --autogenerate \
            --rev-id rel_20260803_complete_scope \
            -m "complete Reliability full stack scope"
          python scripts/finalize_reliability_migration.py
          python -m py_compile amodb/alembic/versions/*rel_20260803_complete_scope*.py

      - name: Validate upgrade downgrade and metadata parity
        working-directory: backend
        env:
          RELIABILITY_AUTOGENERATE_ONLY: "true"
        run: |
          alembic -c amodb/alembic.ini upgrade head
          alembic -c amodb/alembic.ini check
          psql -h 127.0.0.1 -U postgres -d amo_reliability_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            probe record;
          BEGIN
            SELECT validation_status, validation_errors, provenance_json
            INTO probe
            FROM reliability_events
            WHERE amo_id = 'legacy-reliability-migration-probe';
            IF probe.validation_status <> 'VALID' THEN
              RAISE EXCEPTION 'Legacy row validation status was not backfilled';
            END IF;
            IF probe.validation_errors IS NULL OR probe.provenance_json IS NULL THEN
              RAISE EXCEPTION 'Legacy row JSON provenance defaults were not backfilled';
            END IF;
          END $$;
          SQL
          alembic -c amodb/alembic.ini downgrade -1
          alembic -c amodb/alembic.ini upgrade head
          alembic -c amodb/alembic.ini check

      - name: Verify PostgreSQL governance controls
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from urllib.parse import urlparse

          url = os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://')
          parsed = urlparse(url)
          conn = psycopg2.connect(
              host=parsed.hostname,
              port=parsed.port,
              dbname=parsed.path.lstrip('/'),
              user=parsed.username,
              password=parsed.password,
          )
          cur = conn.cursor()
          expected_tables = {
              'reliability_sources', 'reliability_ingestion_batches',
              'reliability_ingestion_records', 'reliability_data_quality_issues',
              'reliability_operational_interruptions', 'reliability_fracas_lifecycles',
              'reliability_fracas_evidence', 'reliability_fracas_stage_events',
              'reliability_effectiveness_reviews', 'reliability_programmes',
              'reliability_programme_versions', 'reliability_metric_definitions',
              'reliability_threshold_versions', 'reliability_calculation_runs',
              'reliability_review_meetings', 'reliability_meeting_decisions',
              'reliability_change_proposals', 'reliability_handoffs',
              'reliability_authority_submissions', 'reliability_audit_events',
              'reliability_ai_reviews',
          }
          cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='public'")
          actual_tables = {row[0] for row in cur.fetchall()}
          missing = sorted(expected_tables - actual_tables)
          assert not missing, f'Missing Reliability tables: {missing}'
          cur.execute("SELECT count(*) FROM auth_capability_definitions WHERE module='reliability'")
          assert cur.fetchone()[0] == 21
          cur.execute("SELECT count(*) FROM auth_role_definitions WHERE code LIKE 'RELIABILITY_%'")
          assert cur.fetchone()[0] == 4
          cur.execute("""
              SELECT count(*) FROM pg_trigger
              WHERE tgname IN (
                'trg_reliability_audit_events_append_only',
                'trg_reliability_fracas_evidence_append_only',
                'trg_reliability_fracas_stage_events_append_only',
                'trg_reliability_calculation_runs_append_only'
              ) AND NOT tgisinternal
          """)
          assert cur.fetchone()[0] == 4
          cur.close()
          conn.close()
          PY

      - name: Import full backend and run Reliability tests
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          import amodb.main
          configure_mappers()
          paths = {route.path for route in amodb.main.app.routes}
          required = {
              '/reliability/compliance', '/reliability/analytics',
              '/reliability/sources', '/reliability/calculation-runs/execute',
              '/reliability/programmes', '/reliability/changes',
              '/reliability/handoffs', '/reliability/authority-submissions',
              '/reliability/ai-reviews',
          }
          assert required.issubset(paths)
          assert all('/reliability/v2' not in path for path in paths)
          print(f'Imported app with {len(paths)} routes')
          PY
          pytest -q amodb/apps/reliability/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Validate navigation and CSS contracts
        working-directory: frontend
        run: npm run test:tenant-shell

      - name: Lint completed Reliability surfaces
        working-directory: frontend
        run: >-
          npx eslint
          src/services/reliability.ts
          src/pages/reliability/ReliabilityWorkspacePage.tsx
          src/pages/reliability/ReliabilityAdvancedViews.tsx
          src/pages/reliability/ReliabilityReportsView.tsx
          src/app/PortalRouteSurface.tsx
          src/app/portalRouteManifest.ts
          src/app/portalRouteManifest.test.ts
          src/app/routePreload.ts

      - name: Build complete portal frontend
        working-directory: frontend
        run: npm run build

      - name: Enforce the single canonical Reliability surface
        run: |
          if grep -R '/reliability/v2' backend/amodb/apps/reliability frontend/src --exclude-dir=node_modules; then exit 1; fi
          test ! -e backend/amodb/apps/reliability/v2_router.py
          test ! -e backend/amodb/apps/reliability/v2_services.py
          test ! -e backend/amodb/apps/reliability/v2_schemas.py
          test ! -e frontend/src/services/reliabilityV2.ts
          test ! -e frontend/src/pages/ReliabilityReportsPage.tsx
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|reliability_v2_test\.db$'; then exit 1; fi

      - name: Record completed scope
        run: |
          cat > docs/reliability/RELIABILITY_COMPLETE_SCOPE_VALIDATION.md <<EOF
          # Reliability Complete-Scope Validation

          - Run: \`${GITHUB_RUN_ID}\`
          - Source commit: \`${GITHUB_SHA}\`
          - UTC: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`

          ## Completed domain

          - canonical occurrence taxonomy and source ingestion with immutable provenance
          - technical-log, operational interruption, MEL/CDL, EHM, shop, QMS, SMS and Procurement source contracts
          - closed-loop FRACAS lifecycle, evidence chain, independent effectiveness approval and reopening
          - versioned Reliability programmes, formula definitions, thresholds, responsibilities and authority conditions
          - scheduled exposure-aware calculations with confidence intervals, minimum-exposure and small-fleet controls, source lineage and result hashes
          - aircraft, ATA, component, engine and fleet analytics
          - review meetings, decisions, controlled changes and impact simulation
          - Planning, Maintenance, Tech Records, QMS, SMS and Procurement handoffs with accountable target tasks and completion evidence
          - authority package preparation and submission segregation
          - capability-based permissions and append-only decision evidence
          - cited advisory AI reviews with independent human disposition and prohibited autonomous decisions

          ## Verified full stack

          - populated-row PostgreSQL migration upgrade, downgrade and second upgrade
          - Alembic metadata parity after each upgrade
          - 21 Reliability capabilities and four controlled roles seeded
          - append-only PostgreSQL guards on audit, FRACAS evidence, stage history and calculation results
          - complete FastAPI import and SQLAlchemy mapper configuration
          - focused backend Reliability tests
          - tenant navigation and CSS contract tests
          - scoped ESLint
          - complete TypeScript/Vite production build
          - no /reliability/v2 routes, aliases, duplicate clients or duplicate pages

          ## Compliance boundary

          Software controls and evidence support demonstration of compliance but do not independently declare regulatory compliance. CAMO/certificate-holder, AMO/repair-station and authority responsibilities remain explicit and require accountable human approval.
          EOF

          cat > docs/reliability/RELIABILITY_V2_IMPLEMENTATION_TRACKER.md <<'EOF'
          # Reliability V2 Implementation Tracker

          ## Canonical implementation

          - [x] One frontend route tree: `/maintenance/:amoCode/reliability/*`
          - [x] One backend prefix: `/reliability/*`
          - [x] One canonical frontend client and workspace
          - [x] No compatibility aliases, duplicate pages or `/v2` routes

          ## Operational and compliance scope

          - [x] Canonical occurrence taxonomy and immutable source provenance
          - [x] Technical-log, flight interruption, MEL/CDL, EHM, shop, QMS, SMS and Procurement ingestion contracts
          - [x] Idempotent batch processing, validation, duplicate detection and data-quality resolution
          - [x] Full FRACAS lifecycle, root-cause evidence, actions, independent effectiveness approval, closure and reopening
          - [x] Versioned programmes, metrics, formulas and threshold governance
          - [x] Scheduled calculations, retained lineage, confidence intervals, minimum exposure and small-fleet controls
          - [x] Fleet, aircraft, ATA, component and engine analytics
          - [x] Reliability review meetings, immutable decisions and controlled changes
          - [x] Planning, Maintenance, Tech Records, QMS, SMS and Procurement handoffs
          - [x] Authority-profile package preparation, submission and decision tracking
          - [x] Capability-based permissions, segregation of duties and append-only evidence
          - [x] Explainable advisory AI with citations and independent human disposition
          - [x] Responsive operational frontend for every controlled workflow

          ## Validation

          - [x] Populated PostgreSQL migration upgrade/downgrade/upgrade
          - [x] Alembic metadata parity
          - [x] Application import and mapper configuration
          - [x] Backend Reliability tests
          - [x] Navigation and CSS contracts
          - [x] Scoped lint and full production frontend build
          EOF

      - name: Publish only permanent source
        run: |
          rm -f docs/reliability/.complete-scope-trigger
          rm -f docs/reliability/.backend-diagnostic-trigger
          rm -f docs/reliability/.complete-probe
          rm -f docs/reliability/.complete-probe-result
          rm -f docs/reliability/.complete-scope-diagnostic
          rm -f docs/reliability/.fast-transform-trigger
          rm -f docs/reliability/.frontend-diagnostic-v2-trigger
          rm -f docs/reliability/FAST_TRANSFORM_DIAGNOSTIC.md
          rm -f docs/reliability/FRONTEND_COMPLETE_DIAGNOSTIC.md
          rm -f docs/reliability/BACKEND_MIGRATION_DIAGNOSTIC.md
          rm -f backend/scripts/complete_reliability_backend.py
          rm -f backend/scripts/strengthen_reliability_sod.py
          rm -f backend/scripts/fix_reliability_sod_escape.py
          rm -f backend/scripts/finalize_reliability_migration.py
          rm -f frontend/scripts/complete-reliability-service.mjs
          rm -f frontend/scripts/complete-reliability-workspace.mjs
          rm -f frontend/scripts/strengthen-reliability-sod.mjs
          rm -f frontend/scripts/complete-reliability-css.mjs
          rm -f .github/workflows/reliability-action-probe.yml
          rm -f .github/workflows/reliability-backend-diagnostic.yml
          rm -f .github/workflows/reliability-complete-diagnostic.yml
          rm -f .github/workflows/reliability-fast-transform-diagnostic.yml
          rm -f .github/workflows/reliability-frontend-diagnostic-v2.yml
          rm -f .github/workflows/reliability-complete-scope.yml
          rm -rf backend/__pycache__
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Reliability module full-stack scope"
          git push origin HEAD:agent/reliability-v2-foundation
