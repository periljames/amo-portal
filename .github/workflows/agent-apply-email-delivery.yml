name: Apply complete email delivery patch

on:
  push:
    branches:
      - agent/complete-resend-notification-delivery
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'Stage complete email delivery patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Validate and apply patch
        run: |
          test -f .github/agent/complete-email-delivery.patch || exit 0
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/agent/complete-email-delivery.patch')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          header = re.compile(r'^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$')
          output = []
          index = 0
          while index < len(lines):
              match = header.match(lines[index].rstrip('\n'))
              if not match:
                  output.append(lines[index])
                  index += 1
                  continue
              end = index + 1
              while end < len(lines):
                  if lines[end].startswith('@@ ') or lines[end].startswith('diff --git '):
                      break
                  end += 1
              body = lines[index + 1:end]
              old_count = sum(1 for line in body if line.startswith((' ', '-')))
              new_count = sum(1 for line in body if line.startswith((' ', '+')))
              suffix = match.group(3)
              output.append(f'@@ -{match.group(1)},{old_count} +{match.group(2)},{new_count} @@{suffix}\n')
              output.extend(body)
              index = end
          path.write_text(''.join(output), encoding='utf-8')
          PY
          patch --batch --forward --fuzz=3 -p1 --dry-run < .github/agent/complete-email-delivery.patch
          patch --batch --forward --fuzz=3 -p1 < .github/agent/complete-email-delivery.patch
          rm .github/agent/complete-email-delivery.patch
          python -m compileall -q \
            backend/amodb/apps/accounts \
            backend/amodb/apps/notifications \
            backend/amodb/apps/platform \
            backend/amodb/apps/realtime \
            backend/amodb/apps/tasks \
            backend/amodb/jobs
      - name: Commit completed implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Resend notification delivery"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
