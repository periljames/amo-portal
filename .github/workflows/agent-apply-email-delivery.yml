name: Apply complete email delivery patch

on:
  push:
    branches:
      - agent/complete-resend-notification-delivery
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'Stage complete email delivery patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply and repair completion patch
        run: |
          test -f .github/agent/complete-email-delivery.patch || exit 0
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/agent/complete-email-delivery.patch')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          header = re.compile(r'^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@(.*)$')
          output = []
          index = 0
          while index < len(lines):
              match = header.match(lines[index].rstrip('\n'))
              if not match:
                  output.append(lines[index])
                  index += 1
                  continue
              end = index + 1
              while end < len(lines) and not (
                  lines[end].startswith('@@ ') or lines[end].startswith('diff --git ')
              ):
                  end += 1
              body = lines[index + 1:end]
              old_count = sum(1 for line in body if line.startswith((' ', '-')))
              new_count = sum(1 for line in body if line.startswith((' ', '+')))
              output.append(
                  f'@@ -{match.group(1)},{old_count} +{match.group(2)},{new_count} @@{match.group(3)}\n'
              )
              output.extend(body)
              index = end
          path.write_text(''.join(output), encoding='utf-8')
          PY
          patch --batch --forward --fuzz=3 -p1 < .github/agent/complete-email-delivery.patch || true
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          service_path = Path('backend/amodb/apps/notifications/service.py')
          service = service_path.read_text(encoding='utf-8')
          signature = textwrap.dedent('''
              *,
              amo_id: Optional[str] = None,
              db: Optional[Session] = None,
          ) -> models.EmailLog:
          ''').lstrip('\n')
          replacement = textwrap.dedent('''
              *,
              amo_id: Optional[str] = None,
              db: Optional[Session] = None,
              email_class: policy.EmailClass | str = policy.EmailClass.ROUTINE,
              recipient_user_id: Optional[str] = None,
              audit_context: Optional[dict] = None,
          ) -> models.EmailLog:
          ''').lstrip('\n')
          if 'email_class: policy.EmailClass' not in service:
              if signature not in service:
                  raise RuntimeError('notification service signature anchor was not found')
              service = service.replace(signature, replacement, 1)

          success_pattern = re.compile(
              r'(?m)^ {12}log\.error = None\n'
              r'^ {8}except providers\.EmailDeliveryBlocked as exc:\n'
              r'^ {12}log\.status = models\.EmailStatus\.SKIPPED_NO_PROVIDER\n'
              r'^ {12}log\.error = str\(exc\)'
          )
          success_replacement = (
              '            log.error = None\n'
              '            log.provider = str(result.get("provider") or "resend")\n'
              '            log.provider_message_id = str(result.get("message_id") or "").strip() or None\n'
              '            log.delivery_status = "ACCEPTED"\n'
              '        except providers.EmailDeliveryBlocked as exc:\n'
              '            log.status = models.EmailStatus.SKIPPED_NO_PROVIDER\n'
              '            log.error = str(exc)\n'
              '            log.provider = "resend"\n'
              '            log.delivery_status = "BLOCKED"'
          )
          if 'log.provider_message_id' not in service:
              service, count = success_pattern.subn(success_replacement, service, count=1)
              if count != 1:
                  raise RuntimeError('notification success-state anchor was not found')
          service_path.write_text(service, encoding='utf-8')

          public_path = Path('backend/amodb/apps/accounts/router_public.py')
          public = public_path.read_text(encoding='utf-8')
          if 'from amodb.apps.notifications import service as notification_service' not in public:
              public = public.replace(
                  'from amodb.apps.audit import schemas as audit_schemas\n',
                  'from amodb.apps.audit import schemas as audit_schemas\nfrom amodb.apps.notifications import service as notification_service\n',
                  1,
              )
          helper = textwrap.dedent('''
          def _maybe_send_email(
              background_tasks: BackgroundTasks,
              to_email: str | None,
              subject: str,
              body: str,
              *,
              db: Session,
              amo_id: str,
              user_id: str,
              action_url: str | None,
          ) -> None:
              """Deliver an essential account message through the central Resend path."""

              del background_tasks
              if not to_email or not isinstance(to_email, str) or "@" not in to_email:
                  return
              notification_service.send_email(
                  template_key="password-reset",
                  recipient=to_email,
                  subject=subject,
                  context={"message": body, "action_url": action_url},
                  audit_context={"purpose": "password-reset", "user_id": user_id},
                  correlation_id=f"password-reset:{user_id}:{int(time.time())}",
                  critical=False,
                  email_class="ESSENTIAL",
                  recipient_user_id=user_id,
                  amo_id=amo_id,
                  db=db,
              )
          ''').lstrip()
          pattern = re.compile(r'def _maybe_send_email\([\s\S]*?\n\ndef _maybe_send_whatsapp\(')
          if 'Deliver an essential account message through the central Resend path.' not in public:
              public, count = pattern.subn(helper + '\n\ndef _maybe_send_whatsapp(', public, count=1)
              if count != 1:
                  raise RuntimeError('legacy password email helper was not found')
          public_path.write_text(public, encoding='utf-8')

          for rejected in Path('.').rglob('*.rej'):
              rejected.unlink()
          for original in Path('.').rglob('*.orig'):
              original.unlink()
          PY
          python .github/agent/repair_worker.py
          rm -f .github/agent/repair_worker.py sitecustomize.py
          rm .github/agent/complete-email-delivery.patch
          python -m compileall -q \
            backend/amodb/apps/accounts \
            backend/amodb/apps/notifications \
            backend/amodb/apps/platform \
            backend/amodb/apps/realtime \
            backend/amodb/apps/tasks \
            backend/amodb/jobs
      - name: Commit completed implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Resend notification delivery"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
