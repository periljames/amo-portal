name: Post-477 Reader Consolidation CI

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/amodb/scripts/seed_document_governance_e2e.py"
      - "backend/amodb/apps/doc_control/tests/test_post477_reader_stability_contract.py"
      - "frontend/src/pages/manuals/PdfReaderCoreV5.tsx"
      - "frontend/src/pages/manuals/PublicationAssistedNavigationBridge.tsx"
      - "frontend/src/pages/manuals/ManualReaderPage.tsx"
      - "frontend/src/pages/manuals/publicationReaderPost477Stability.css"
      - "frontend/tests/e2e/document-governance-live.spec.ts"
      - "frontend/tests/e2e/publications-reader-stability.spec.ts"
      - ".github/workflows/document-reader-post477-consolidation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post477-reader-consolidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-reader-stability:
    name: Real PDF source, scroll, zoom, navigator and responsive acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_post477_reader
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_post477_reader"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: post477-reader-consolidation-ci-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_post477_reader
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_post477_reader
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_post477_reader
      QUALITY_SCHEMA_STRICT: "0"
      PYTHONPATH: backend
      VITE_API_PROXY_TARGET: http://127.0.0.1:8080
      VITE_ALLOWED_HOSTS: 127.0.0.1,localhost
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_LIVE_PUBLICATIONS_READER: "1"
      E2E_AMO_CODE: dmsgate
      E2E_AMO_ADMIN_EMAIL: dms-gate@example.com
      E2E_AMO_ADMIN_PASSWORD: DmsGate!2026-Local
      E2E_PUBLICATION_STABILITY_PATH: /maintenance/dmsgate/publications/00000000-0000-4000-8000-000000000480/rev/00000000-0000-4000-8000-000000000481/read
      E2E_PUBLICATION_TOC_TARGET: Stability target
      E2E_PUBLICATION_TOC_TARGET_PAGE: "6"
      E2E_PUBLICATION_SEARCH_TERM: Stability target
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Verify post-477 reader source contracts
        working-directory: backend
        run: pytest -q amodb/apps/doc_control/tests/test_post477_reader_stability_contract.py
      - name: Upgrade disposable browser database
        working-directory: backend
        run: alembic -c amodb/alembic.ini upgrade head
      - name: Seed governed multi-page publication
        working-directory: backend
        run: python amodb/scripts/seed_document_governance_e2e.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Lint consolidated reader and acceptance surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/pages/manuals/PdfReaderCoreV5.tsx
          src/pages/manuals/PublicationAssistedNavigationBridge.tsx
          src/pages/manuals/ManualReaderPage.tsx
          tests/e2e/publications-reader-stability.spec.ts
      - name: Build integrated frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && nohup python -m uvicorn amodb.main:app --host 127.0.0.1 --port 8080 > /tmp/post477-reader-backend.log 2>&1 & echo $! > /tmp/post477-reader-backend.pid)
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/openapi.json >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/post477-reader-backend.log; exit 1; fi
            sleep 1
          done
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/post477-reader-frontend.log 2>&1 & echo $! > /tmp/post477-reader-frontend.pid)
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/maintenance/dmsgate/login >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/post477-reader-frontend.log; exit 1; fi
            sleep 1
          done
      - name: Run authenticated real-world Publications reader stability acceptance
        working-directory: frontend
        run: npm exec -- playwright test tests/e2e/publications-reader-stability.spec.ts
      - name: Dump server logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- backend ---'
          cat /tmp/post477-reader-backend.log 2>/dev/null || true
          echo '--- frontend ---'
          cat /tmp/post477-reader-frontend.log 2>/dev/null || true
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: post477-reader-consolidation-playwright
          path: |
            frontend/test-results
            frontend/playwright-report
