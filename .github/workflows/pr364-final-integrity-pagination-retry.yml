name: PR364 Final Integrity Pagination Retry

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rostering-automation-workforce-hr-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply resilient product patch
        run: python .github/scripts/apply_pr364_integrity_pagination.py
      - name: Compile corrected backend modules
        run: >-
          python -m compileall -q
          backend/amodb/apps/rostering/automation_service.py
          backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py
          backend/amodb/apps/workforce/hr_router.py
          backend/amodb/apps/workforce/hr_schemas.py
          backend/amodb/apps/workforce/hr_service.py
          backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
      - name: Commit product fixes
        run: |
          if git diff --quiet -- backend frontend; then
            echo "Integrity and pagination fixes already present"
            exit 0
          fi
          git config user.name "amo-portal-actions"
          git config user.email "actions@github.com"
          git add \
            backend/amodb/apps/rostering/automation_service.py \
            backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py \
            backend/amodb/apps/workforce/hr_router.py \
            backend/amodb/apps/workforce/hr_schemas.py \
            backend/amodb/apps/workforce/hr_service.py \
            backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py \
            frontend/src/pages/rostering/components/WorkforceHrWorkspace.tsx \
            frontend/src/pages/rostering/rosteringSetupExperience.test.ts \
            frontend/src/services/workforceHr.ts \
            frontend/src/types/workforceHr.ts
          git commit -m "Harden overtime evidence and paginate Workforce people"
          git push origin HEAD:${{ github.head_ref }}
