name: QMS External Draft CI

on:
  pull_request:
    paths:
      - "backend/amodb/alembic/versions/quality_260816_fieldwork_sync.py"
      - "backend/amodb/alembic/versions/quality_260816_external_finding_drafts.py"
      - "backend/amodb/apps/quality/audit_checklist_execution_*.py"
      - "backend/amodb/apps/quality/audit_external_*.py"
      - "backend/amodb/apps/quality/tests/test_audit_external_access_contract.py"
      - "backend/amodb/apps/quality/tests/test_audit_fieldwork_sync_contract.py"
      - "backend/amodb/apps/quality/tests/test_audit_external_finding_draft_contract.py"
      - "backend/amodb/apps/quality/tests/postgres_audit_external_access_probe.py"
      - "frontend/src/pages/PublicAuditAccessPage.tsx"
      - "frontend/src/features/qms/auditSession/ExternalAuditorFieldworkWorkspace.tsx"
      - "frontend/src/features/qms/auditSession/ExternalAuditorFindingDraftPanel.tsx"
      - "frontend/src/features/qms/auditSession/ExternalFindingDraftReviewPanel.tsx"
      - "frontend/src/services/qmsAuditExternalAccess.ts"
      - "frontend/src/services/qmsExternalFindingDrafts.ts"
      - "frontend/src/services/qmsExternalFindingDraftReview.ts"
      - "frontend/src/styles/qms-external-finding-drafts.css"
      - "frontend/src/styles/qms-external-finding-draft-review.css"
      - "frontend/tests/e2e/qms-external-auditor-finding-drafts.spec.ts"
      - ".github/workflows/qms-external-draft-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qms-external-draft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: qms-external-draft-ci-secret
      QUALITY_SCHEMA_STRICT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Compile external audit contracts
        run: >-
          python -m compileall -q
          amodb/apps/quality/audit_checklist_execution_models.py
          amodb/apps/quality/audit_checklist_execution_router.py
          amodb/apps/quality/audit_external_access_router.py
          amodb/apps/quality/audit_external_fieldwork_router.py
          amodb/apps/quality/audit_external_participant_guard_router.py
          amodb/apps/quality/audit_external_session_guard_router.py
          amodb/apps/quality/audit_external_finding_draft_models.py
          amodb/apps/quality/audit_external_finding_draft_router.py
      - name: Test external access contract
        run: pytest -q amodb/apps/quality/tests/test_audit_external_access_contract.py
      - name: Test fieldwork sync contract
        run: pytest -q amodb/apps/quality/tests/test_audit_fieldwork_sync_contract.py
      - name: Test external finding draft contract
        run: pytest -q amodb/apps/quality/tests/test_audit_external_finding_draft_contract.py
      - name: Prove authoritative audit workflow remains green
        run: pytest -q amodb/apps/quality/tests/test_audit_workflow_contract.py

  postgres-contract:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_qms_external_draft_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_qms_external_draft_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_qms_external_draft_ci
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_qms_external_draft_ci
      SECRET_KEY: qms-external-draft-ci-secret
      QUALITY_SCHEMA_STRICT: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Upgrade all Alembic heads
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Verify RLS, immutability and attribution
        run: python -m amodb.apps.quality.tests.postgres_audit_external_access_probe

  frontend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint external audit workspaces
        run: >-
          npx eslint
          src/pages/PublicAuditAccessPage.tsx
          src/features/qms/auditSession/ExternalAuditorFieldworkWorkspace.tsx
          src/features/qms/auditSession/ExternalAuditorFindingDraftPanel.tsx
          src/features/qms/auditSession/ExternalFindingDraftReviewPanel.tsx
          src/services/qmsAuditExternalAccess.ts
          src/services/qmsExternalFindingDrafts.ts
          src/services/qmsExternalFindingDraftReview.ts
      - name: Production frontend build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: External auditor draft browser acceptance
        run: npx playwright test tests/e2e/qms-external-auditor-finding-drafts.spec.ts --project=chromium
