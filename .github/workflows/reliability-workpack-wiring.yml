name: Reliability workpack wiring

on:
  push:
    branches:
      - agent/reliability-workpack-wiring

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/reliability-workpack-wiring

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply canonical workpack wiring
        run: python scripts/apply_reliability_workpack_wiring.py

      - name: Validate backend syntax
        run: |
          python -m compileall -q \
            backend/amodb/apps/reliability/workpack_integration.py \
            backend/amodb/apps/reliability/tests/test_workpack_integration.py \
            backend/amodb/apps/reliability/__init__.py

      - name: Validate frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate patch hygiene
        run: |
          git diff --check
          test ! -e scripts/apply_reliability_workpack_wiring.py
          test ! -e .github/workflows/reliability-workpack-wiring.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Reliability to workpack data and manual entry"
          git push origin HEAD:agent/reliability-workpack-wiring
