name: PR364 Retry Final Review Fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/rostering-automation-workforce-hr-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rostering-automation-workforce-hr-overhaul
          fetch-depth: 0

      - name: Reuse validated patch with normalized EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/pr364-final-review-fixes.yml').read_text(encoding='utf-8')
          script = workflow.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = dedent(script)
          script = script.replace(
              'policy_test.write_text(test_text.rstrip() + addition + "\\n", encoding="utf-8")',
              'policy_test.write_text(test_text.rstrip() + addition.rstrip() + "\\n", encoding="utf-8")',
          )
          exec(compile(script, 'pr364-final-review-fixes', 'exec'))
          PY

          git diff --check
          git add backend/amodb/apps/rostering backend/amodb/jobs/rostering_automation.py frontend/src/router.legacy.tsx frontend/src/pages/rostering
          git config user.name "amo-portal-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Resolve final Rostering review blockers"
          git push origin HEAD:agent/rostering-automation-workforce-hr-overhaul
