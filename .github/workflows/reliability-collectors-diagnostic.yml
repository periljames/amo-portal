name: Reliability Collectors Diagnostic

on:
  push:
    branches: [agent/reliability-v2-collectors-prep]
    paths: [docs/reliability/.collectors-diagnostic-trigger]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: sqlite+pysqlite:///:memory:
      WRITE_DATABASE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: reliability-collectors-diagnostic
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-collectors-prep
          fetch-depth: 0
      - name: Reconstruct canonical Reliability backend and apply collectors
        run: |
          git fetch origin agent/reliability-v2-foundation feat/global-tenant-navigation-quality-home --force
          git checkout 00851d2556c2ec6ac0525dc7c4f3648812c171ab -- backend/amodb/apps/reliability backend/amodb/main.py
          git checkout agent/reliability-v2-collectors-prep -- backend/amodb/apps/reliability/internal_collectors.py backend/amodb/apps/reliability/tests/test_internal_collectors.py backend/scripts/apply_reliability_internal_collectors.py
          python backend/scripts/apply_reliability_internal_collectors.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install and validate
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/collectors
          pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt > /tmp/collectors/pip.log 2>&1
          A=$?
          python -m py_compile backend/amodb/apps/reliability/internal_collectors.py backend/amodb/apps/reliability/advanced_services.py backend/amodb/apps/reliability/tests/test_internal_collectors.py > /tmp/collectors/compile.log 2>&1
          B=$?
          (cd backend && pytest -q amodb/apps/reliability/tests/test_internal_collectors.py amodb/apps/reliability/tests/test_complete_scope.py) > /tmp/collectors/tests.log 2>&1
          C=$?
          (cd backend && python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; configure_mappers(); print(len(amodb.main.app.routes))") > /tmp/collectors/import.log 2>&1
          D=$?
          {
            echo '# Reliability Internal Collectors Diagnostic'
            echo
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo
            echo '| Stage | Exit |'
            echo '|---|---:|'
            echo "| pip | $A |"
            echo "| compile | $B |"
            echo "| tests | $C |"
            echo "| app import | $D |"
            for name in compile tests import; do echo; echo "## $name"; echo '```text'; tail -n 180 /tmp/collectors/$name.log; echo '```'; done
          } > /tmp/collectors/report.md
          git reset --hard HEAD
          git clean -fd
          mkdir -p docs/reliability
          cp /tmp/collectors/report.md docs/reliability/COLLECTORS_DIAGNOSTIC.md
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/reliability/COLLECTORS_DIAGNOSTIC.md
          git commit -m 'Record Reliability collector diagnostic'
          git push origin HEAD:agent/reliability-v2-collectors-prep
