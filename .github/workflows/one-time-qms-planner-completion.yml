name: One-time QMS planner completion

on:
  push:
    branches:
      - agent/qms-modern-business-planner

permissions:
  contents: write

jobs:
  complete:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qms-modern-business-planner
          fetch-depth: 0
      - name: Apply completed planner integration
        shell: bash
        run: |
          : > /tmp/qms-planner-patch.b64
          printf '%s' '' >> /tmp/qms-planner-patch.b64
          printf '%s' '' >> /tmp/qms-planner-patch.b64
          printf '%s' '' >> /tmp/qms-planner-patch.b64
          base64 --decode /tmp/qms-planner-patch.b64 | gzip --decompress > .github/scripts/qms_planner_completion.py
          python -m py_compile .github/scripts/qms_planner_completion.py
          python .github/scripts/qms_planner_completion.py
      - name: Commit completed integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete direct QMS planner scheduling and automation"
          git push origin HEAD:agent/qms-modern-business-planner
