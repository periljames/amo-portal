name: Reliability workpack sync hardening

on:
  push:
    branches:
      - agent/reliability-workpack-wiring

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/reliability-workpack-wiring

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply sync hardening
        run: python scripts/harden_reliability_workpack_sync.py

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Validate app import and Reliability tests
        working-directory: backend
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: '1'
          DATABASE_URL: sqlite:///./reliability_workpack_test.db
        run: |
          python -c "from amodb.main import app; assert app"
          python -m pytest -q amodb/apps/reliability/tests

      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate final diff hygiene
        run: |
          git diff --check
          test ! -e scripts/harden_reliability_workpack_sync.py
          test ! -e .github/workflows/reliability-workpack-sync-hardening.yml

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Reliability internal sync cutoffs"
          git push origin HEAD:agent/reliability-workpack-wiring
