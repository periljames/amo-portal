name: Venspera Production Quota and Reset Race CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/platform/storage_quota*"
      - "backend/amodb/apps/platform/tests/test_storage_quota_accounting.py"
      - "backend/amodb/apps/platform/tests/test_postgres_quota_and_reset_race.py"
      - "backend/amodb/apps/accounts/services.py"
      - "backend/amodb/alembic/versions/plat_20261016_storage_bytes.py"
      - ".github/workflows/venspera-production-quota-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-atomic-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_USER: postgres
          POSTGRES_DB: venspera_quota_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venspera_quota_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      SECRET_KEY: quota-race-ci-secret
      PYTHONPATH: backend
      STORAGE_QUOTA_POSTGRES_TEST_DSN: postgresql+psycopg2://postgres:postgres-ci-only@127.0.0.1:5432/venspera_quota_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked backend requirements and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Assert concurrent quota and reset-token rules on real PostgreSQL
        run: |
          python -m pytest -q \
            backend/amodb/apps/platform/tests/test_storage_quota_accounting.py \
            backend/amodb/apps/platform/tests/test_postgres_quota_and_reset_race.py
