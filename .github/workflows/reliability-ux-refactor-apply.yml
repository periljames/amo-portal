name: Apply Reliability UX Refactor

on:
  push:
    branches:
      - agent/reliability-operational-sources
    paths:
      - .github/workflows/reliability-ux-refactor-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reliability-operational-sources
          fetch-depth: 0
      - name: Apply reviewed Reliability UX refactor
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/reliability-ux-refactor.b64 <<'PAYLOAD'
          
          
          
          
          
          PAYLOAD
          sed 's/^          //' /tmp/reliability-ux-refactor.b64 | base64 --decode > /tmp/reliability-ux-refactor.tar.gz
          echo 'b9e7b8324046a0a36367d62bb28ebef653e95d22b94b356634ffdb3820641296  /tmp/reliability-ux-refactor.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/reliability-ux-refactor.tar.gz --directory .
          rm .github/workflows/reliability-ux-refactor-apply.yml
          python -m py_compile backend/amodb/apps/reliability/operational_hardening.py backend/amodb/apps/reliability/tests/test_operational_sources.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/amodb/apps/reliability/operational_hardening.py \
            backend/amodb/apps/reliability/tests/test_operational_sources.py \
            frontend/src/pages/reliability/ReliabilityOperationalControl.tsx \
            frontend/src/pages/reliability/ReliabilityOperationalControl.css \
            .github/workflows/reliability-ux-refactor-apply.yml
          git commit -m 'Refactor Reliability operational source UX'
          git push origin HEAD:agent/reliability-operational-sources
