name: PR Platform Session Hydration Fix

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/platform-session-hydration-and-schema-warning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/platform-session-hydration-and-schema-warning
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply code repair
        run: python .github/scripts/apply_platform_session_hydration_fix.py
      - name: Compile changed backend modules
        run: |
          python -m py_compile \
            backend/amodb/apps/doc_control/knowledge_workspace_router.py \
            backend/amodb/apps/doc_control/tests/test_knowledge_workspace_schema_contract.py
      - name: Commit product changes
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add \
            frontend/src/pages/platform/components/PlatformShared.tsx \
            frontend/src/services/platformControl.test.ts \
            backend/amodb/apps/doc_control/knowledge_workspace_router.py \
            backend/amodb/apps/doc_control/tests/test_knowledge_workspace_schema_contract.py
          if git diff --cached --quiet; then
            echo "No product changes were required."
            exit 0
          fi
          git commit -m "Repair platform session hydration and schema alias"
          git push origin HEAD:fix/platform-session-hydration-and-schema-warning
