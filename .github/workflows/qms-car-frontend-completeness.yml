name: Apply QMS CAR Frontend Completeness

on:
  push:
    branches:
      - agent/qms-car-control-loop
    paths:
      - ".github/workflows/qms-car-frontend-completeness.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/qms-car-control-loop
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply manual-driven frontend completeness patch
        run: |
          python .github/scripts/qms_car_frontend_completeness.py
          python .github/scripts/qms_car_frontend_lint_followup.py

      - name: Validate patch formatting and Python syntax
        run: |
          git diff --check
          python -m py_compile \
            .github/scripts/qms_car_frontend_completeness.py \
            .github/scripts/qms_car_frontend_lint_followup.py \
            backend/amodb/apps/quality/schemas.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "manual-driven QMS frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      - name: Lint advanced CAR frontend surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/services/qmsCarControlLoop.ts
          src/pages/qms/QmsCarControlLoopPage.tsx
          src/pages/qms/QmsCarControlOperations.tsx
          src/pages/PublicCarInvitePage.tsx
          src/app/routeGuards.ts
          src/pages/qms/routes/qmsWorkspaceRegistry.ts
          src/pages/qms/routes/qmsRouteRegistry.ts

      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build

      - name: Commit completed frontend advancement
        run: |
          git rm \
            .github/workflows/qms-car-frontend-completeness.yml \
            .github/scripts/qms_car_frontend_completeness.py \
            .github/scripts/qms_car_frontend_lint_followup.py
          git add -A
          git diff --cached --check
          git config user.name "amo-portal-qms-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(quality): complete manual-driven CAR frontend operations"
          git push origin HEAD:agent/qms-car-control-loop
