name: Portal Error Feedback CI

on:
  pull_request:
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/components/feedback/**"
      - "frontend/src/services/portalError*"
      - "frontend/src/services/portalFetchErrorBridge.ts"
      - "frontend/src/services/portalInlineErrorMirror.ts"
      - "frontend/src/services/portalUploadGuard.ts"
      - "frontend/src/styles/components/toast.css"
      - ".github/workflows/portal-error-feedback-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-error-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run visible error feedback contracts
        working-directory: frontend
        run: npm exec -- vitest run src/services/portalError.test.ts
      - name: Build integrated frontend
        working-directory: frontend
        run: npm run build
