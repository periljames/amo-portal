name: Reliability Module CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/reliability-module-ci.yml'
      - '.github/workflows/reliability-hotfix-finalizer.yml'
      - '.github/workflows/reliability-hotfix-pr-finalizer.yml'
      - '.github/workflows/reliability-hotfix-scheduled.yml'
      - '.github/workflows/reliability-review-finalize-v2.yml'
      - '.github/workflows/reliability-review-fixes.yml'
      - 'backend/amodb/alembic/env.py'
      - 'backend/amodb/alembic/versions/qms_vernum_128.py'
      - 'backend/amodb/alembic/versions/quality_20260705_notification_action_links.py'
      - 'backend/amodb/alembic/versions/docgov_20260807_audit_controls.py'
      - 'backend/amodb/alembic/versions/rel_*.py'
      - 'backend/amodb/alembic/versions/platform_rel_*.py'
      - 'backend/amodb/alembic/versions/plat_qms_260809_merge.py'
      - 'backend/amodb/apps/reliability/**'
      - 'backend/scripts/apply_reliability_review_fixes.py'
      - 'backend/amodb/main.py'
      - 'docs/reliability/**'
      - 'frontend/src/app/PortalRouteSurface.tsx'
      - 'frontend/src/app/portalRouteManifest.ts'
      - 'frontend/src/app/portalRouteManifest.test.ts'
      - 'frontend/src/app/routePreload.ts'
      - 'frontend/src/pages/ReliabilityReportsPage.tsx'
      - 'frontend/src/pages/reliability/**'
      - 'frontend/src/portalRoutes.tsx'
      - 'frontend/src/services/reliability.ts'
      - 'frontend/src/styles/reliability-v2.css'
      - 'frontend/tests/e2e/reliability-workbook-parity-ci.spec.ts'
      - 'frontend/tests/e2e/reliability-formal-reporting-ci.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reliability-backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliability_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reliability_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: reliability-ci-secret-key-not-for-production
      JWT_SECRET_KEY: reliability-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
      WRITE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce Reliability-only diff when Reliability is owned by the PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          BASE_SHA=$(git merge-base "$BASE_REF" HEAD)
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/reliability-files.txt
          # EHM file-storage hardening is a cross-cutting Platform storage change.
          # It must still run the Reliability suite, but it must not reclassify the
          # whole Platform control-plane PR as a Reliability-owned PR.
          grep -v '^backend/amodb/apps/reliability/ehm.py$' /tmp/reliability-files.txt > /tmp/reliability-owned-files.txt || true

          ACTIVATOR='^(backend/amodb/alembic/versions/(docgov_20260807_audit_controls|rel_[^/]+)\.py|backend/amodb/apps/reliability/.*|docs/reliability/.*|frontend/src/pages/ReliabilityReportsPage\.tsx|frontend/src/pages/reliability/.*|frontend/src/services/reliability\.ts|frontend/src/styles/reliability-v2\.css|frontend/tests/e2e/reliability-(workbook-parity|formal-reporting)-ci\.spec\.ts)$'
          if ! grep -E "$ACTIVATOR" /tmp/reliability-owned-files.txt >/dev/null; then
            echo 'No Reliability-owned implementation changed; cross-cutting Platform/EHM and migration-composition changes do not activate the Reliability-only scope guard.'
            exit 0
          fi

          ALLOWED='^(\.github/workflows/(reliability-module-ci|reliability-hotfix-finalizer|reliability-hotfix-pr-finalizer|reliability-hotfix-scheduled|reliability-review-finalize-v2|reliability-review-fixes)\.yml|backend/amodb/alembic/env\.py|backend/amodb/alembic/versions/(qms_vernum_128|quality_20260705_notification_action_links|docgov_20260807_audit_controls|rel_[^/]+|platform_rel_[^/]+|plat_qms_[^/]+)\.py|backend/amodb/apps/reliability/.*|backend/scripts/apply_reliability_review_fixes\.py|backend/amodb/main\.py|docs/reliability/.*|frontend/src/app/(PortalRouteSurface|portalRouteManifest|portalRouteManifest\.test|routePreload)\.tsx?$|frontend/src/pages/ReliabilityReportsPage\.tsx|frontend/src/pages/reliability/.*|frontend/src/portalRoutes\.tsx|frontend/src/services/reliability\.ts|frontend/src/styles/reliability-v2\.css|frontend/tests/e2e/reliability-(workbook-parity|formal-reporting)-ci\.spec\.ts)$'
          if grep -Ev "$ALLOWED" /tmp/reliability-owned-files.txt | grep -q .; then
            echo 'Unexpected files in Reliability-owned PR:'
            grep -Ev "$ALLOWED" /tmp/reliability-owned-files.txt
            exit 1
          fi

      - name: Verify recovery machinery is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/reliability-hotfix-finalizer.yml
          test ! -e .github/workflows/reliability-hotfix-pr-finalizer.yml
          test ! -e .github/workflows/reliability-hotfix-scheduled.yml
          test ! -e .github/workflows/reliability-review-finalize-v2.yml
          test ! -e .github/workflows/reliability-review-fixes.yml
          test ! -e backend/scripts/apply_reliability_review_fixes.py
          test ! -e docs/reliability/.review-fix-trigger
          test ! -e docs/reliability/.review-fix-trigger-v2
          test ! -e docs/reliability/.hotfix-trigger
          if git grep -n -E 'apply_reliability_review_fixes|review-fix-trigger|hotfix-trigger|Reliability Hotfix Scheduled|Reliability Review Finalizer' -- \
            .github/workflows docs/reliability backend/scripts \
            ':(exclude).github/workflows/reliability-module-ci.yml'; then
            echo 'Temporary Reliability recovery reference remains.'
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Compile Reliability backend
        run: python -m compileall -q backend/amodb/apps/reliability

      - name: Import application and configure mappers
        run: |
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print('application import and mapper configuration passed')
          PY

      - name: Verify Alembic heads and merged Reliability ancestry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config('backend/amodb/alembic.ini'))
          heads = script.get_heads()
          assert heads, 'Alembic graph has no heads'
          pending = [script.get_revision(head) for head in heads]
          ancestry = set()
          while pending:
              revision = pending.pop()
              if revision is None or revision.revision in ancestry:
                  continue
              ancestry.add(revision.revision)
              parents = revision.down_revision
              if not parents:
                  continue
              if isinstance(parents, str):
                  parents = (parents,)
              pending.extend(script.get_revision(parent) for parent in parents)
          for required in (
              'platform_rel_20260809_merge',
              'platform_ops_20260809_incident_lifecycle',
              'rel_20260807_formal_docgov_merge',
              'rel_20260807_formal_reporting',
              'docgov_rel_20260807_merge',
              'rel_20260807_main_merge',
              'rel_20260805_ops_exact_counts',
              'rel_20260806_reference_integrity',
              'merge_20260807_qms_planner_aircraft',
          ):
              assert required in ancestry, f'{required} is not reachable from current Alembic heads {heads}'
          print(f'alembic_heads={heads}')
          PY

      - name: Upgrade clean PostgreSQL schema
        run: python -m alembic -c backend/amodb/alembic.ini upgrade heads

      - name: Verify Alembic revisions and capacity
        run: |
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          expected = set(ScriptDirectory.from_config(Config('backend/amodb/alembic.ini')).get_heads())
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as connection:
              width = connection.execute(text("""
                  SELECT character_maximum_length
                  FROM information_schema.columns
                  WHERE table_name = 'alembic_version'
                    AND column_name = 'version_num'
              """)).scalar_one()
              versions = set(connection.execute(text('SELECT version_num FROM alembic_version')).scalars())
          assert width is not None and width >= 128, width
          assert versions == expected, (sorted(versions), sorted(expected))
          print(f'alembic_versions={sorted(versions)}; capacity={width}')
          PY

      - name: Verify formal Reliability Programme schema
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          expected_tables = {
              'reliability_regulatory_profiles',
              'reliability_regulatory_requirements',
              'reliability_formal_reports',
              'reliability_formal_report_sections',
              'reliability_formal_requirement_assessments',
              'reliability_formal_report_sources',
              'reliability_formal_approvals',
              'reliability_formal_lifecycle_events',
              'reliability_formal_completeness_overrides',
              'reliability_amp_recommendations',
              'reliability_reporting_schedule',
              'reliability_formal_distributions',
          }
          expected_triggers = {
              'trg_rel_formal_report_guard',
              'trg_rel_formal_section_guard',
              'trg_rel_formal_req_guard',
              'trg_rel_formal_source_guard',
              'trg_rel_formal_override_guard',
              'trg_rel_formal_approval_append',
              'trg_rel_formal_lifecycle_append',
          }
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as connection:
              tables = set(connection.execute(text("SELECT table_name FROM information_schema.tables WHERE table_schema='public'" )).scalars())
              triggers = set(connection.execute(text("SELECT trigger_name FROM information_schema.triggers WHERE event_object_schema='public'" )).scalars())
          missing_tables = expected_tables - tables
          missing_triggers = expected_triggers - triggers
          assert not missing_tables, f'Missing formal Reliability tables: {sorted(missing_tables)}'
          assert not missing_triggers, f'Missing formal Reliability immutability/audit triggers: {sorted(missing_triggers)}'
          print('formal Reliability Programme schema verification passed')
          PY

      - name: Verify formula, workbook and exactness schema
        run: |
          python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          expected_metric_columns = {'formula_latex', 'formula_mathml', 'formula_expression_json', 'formula_unit', 'formula_precision', 'formula_rounding_mode', 'denominator_policy', 'formula_source_fields_json'}
          expected_run_columns = {'formula_snapshot_json', 'formula_snapshot_hash'}
          expected_constraints = {'ck_reliability_metric_formula_latex_present', 'ck_reliability_metric_formula_mathml_present', 'ck_reliability_formula_snapshot_hash_format'}
          expected_workbook_tables = {'reliability_workbook_records', 'reliability_workbook_field_mappings', 'reliability_statistical_alert_results', 'reliability_report_layouts', 'reliability_workbook_report_snapshots', 'reliability_workbook_import_batches', 'reliability_workbook_import_row_results'}
          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as connection:
              metric_columns = set(connection.execute(text("SELECT column_name FROM information_schema.columns WHERE table_name='reliability_metric_definitions'")).scalars())
              run_columns = set(connection.execute(text("SELECT column_name FROM information_schema.columns WHERE table_name='reliability_calculation_runs'")).scalars())
              constraints = set(connection.execute(text("SELECT conname FROM pg_constraint WHERE conrelid IN ('reliability_metric_definitions'::regclass,'reliability_calculation_runs'::regclass)")).scalars())
              workbook_tables = set(connection.execute(text("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'reliability_%'")).scalars())
              retained_legacy_columns = list(connection.execute(text("""
                  SELECT table_name, column_name, data_type
                  FROM information_schema.columns
                  WHERE (table_name='reliability_defect_trends' AND column_name IN ('utilisation_hours','utilisation_cycles','defect_rate_per_100_fh'))
                     OR (table_name='reliability_kpis' AND column_name IN ('value','numerator','denominator'))
                  ORDER BY table_name, column_name
              """)).mappings())
          failures = []
          if expected_metric_columns - metric_columns: failures.append(f'Missing metric columns: {sorted(expected_metric_columns - metric_columns)}.')
          if expected_run_columns - run_columns: failures.append(f'Missing snapshot columns: {sorted(expected_run_columns - run_columns)}.')
          if expected_constraints - constraints: failures.append(f'Missing constraints: {sorted(expected_constraints - constraints)}.')
          if expected_workbook_tables - workbook_tables: failures.append(f'Missing workbook tables: {sorted(expected_workbook_tables - workbook_tables)}.')
          non_numeric = [dict(row) for row in retained_legacy_columns if row['data_type'] != 'numeric']
          if non_numeric: failures.append(f'Retained legacy Reliability analytical columns are not fixed-point numeric: {non_numeric}.')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('formula, workbook and exactness schema verification passed')
          PY

      - name: Run PostgreSQL append-only calculation regression
        run: python backend/amodb/apps/reliability/tests/postgresql_append_only_regression.py

      - name: Run PostgreSQL operational-source integrity regression
        run: python backend/amodb/apps/reliability/tests/postgresql_operational_sources_regression.py

      - name: Run PostgreSQL formal snapshot concurrency regression
        run: python backend/amodb/apps/reliability/tests/postgresql_formal_snapshot_guard_regression.py

      - name: Run PostgreSQL workbook-reference integrity regression
        run: python backend/amodb/apps/reliability/tests/postgresql_workbook_reference_integrity_regression.py

      - name: Run Reliability operational reporting tests
        run: pytest -q -rA backend/amodb/apps/reliability/tests/test_structured_daily_reporting.py

      - name: Run existing Reliability tests
        run: pytest -q -rA backend/amodb/apps/reliability/tests --ignore=backend/amodb/apps/reliability/tests/test_structured_daily_reporting.py

  reliability-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run tenant-shell route contracts
        working-directory: frontend
        run: npm run test:tenant-shell
      - name: Run workbook parity model tests
        working-directory: frontend
        run: npm exec -- vitest run src/pages/reliability/reliabilityWorkbookParityModel.test.ts
      - name: Lint Reliability-owned frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/reliability/*.ts src/pages/reliability/*.tsx src/services/reliability.ts tests/e2e/reliability-workbook-parity-ci.spec.ts tests/e2e/reliability-formal-reporting-ci.spec.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium for representative-tenant UAT
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run representative-tenant browser UAT
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > /tmp/reliability-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null
          npx playwright test tests/e2e/reliability-workbook-parity-ci.spec.ts tests/e2e/reliability-formal-reporting-ci.spec.ts
