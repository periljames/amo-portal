name: Reliability Module CI

on:
  pull_request:
    paths:
      - '.github/workflows/reliability-module-ci.yml'
      - 'backend/amodb/alembic/env.py'
      - 'backend/amodb/alembic/versions/rel_*.py'
      - 'backend/amodb/apps/reliability/**'
      - 'backend/amodb/main.py'
      - 'docs/reliability/**'
      - 'frontend/src/app/PortalRouteSurface.tsx'
      - 'frontend/src/app/portalRouteManifest.ts'
      - 'frontend/src/app/portalRouteManifest.test.ts'
      - 'frontend/src/app/routePreload.ts'
      - 'frontend/src/pages/ReliabilityReportsPage.tsx'
      - 'frontend/src/pages/reliability/**'
      - 'frontend/src/portalRoutes.tsx'
      - 'frontend/src/services/reliability.ts'
      - 'frontend/src/styles/reliability-v2.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reliability-backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliability_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reliability_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      SECRET_KEY: reliability-ci-secret-key-not-for-production
      JWT_SECRET_KEY: reliability-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce Reliability-only diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD > /tmp/reliability-files.txt
          ALLOWED='^(\.github/workflows/reliability-module-ci\.yml|backend/amodb/alembic/env\.py|backend/amodb/alembic/versions/rel_[^/]+\.py|backend/amodb/apps/reliability/.*|backend/amodb/main\.py|docs/reliability/.*|frontend/src/app/(PortalRouteSurface|portalRouteManifest|portalRouteManifest\.test|routePreload)\.tsx?$|frontend/src/pages/ReliabilityReportsPage\.tsx|frontend/src/pages/reliability/.*|frontend/src/portalRoutes\.tsx|frontend/src/services/reliability\.ts|frontend/src/styles/reliability-v2\.css)$'
          if grep -Ev "$ALLOWED" /tmp/reliability-files.txt | grep -q .; then
            echo 'Unexpected files in Reliability PR:'
            grep -Ev "$ALLOWED" /tmp/reliability-files.txt
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Reliability backend
        run: python -m compileall -q backend/amodb/apps/reliability
      - name: Import application and configure mappers
        run: |
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print('application import and mapper configuration passed')
          PY
      - name: Verify one Alembic head
        run: |
          set -o pipefail
          python -m alembic -c backend/amodb/alembic.ini heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
          grep -q 'rel_20260803_complete_scope' /tmp/alembic-heads.txt
      - name: Upgrade clean PostgreSQL schema
        run: python -m alembic -c backend/amodb/alembic.ini upgrade heads
      - name: Run Reliability tests
        run: pytest -q backend/amodb/apps/reliability/tests

  reliability-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run tenant-shell route contracts
        working-directory: frontend
        run: npm run test:tenant-shell
      - name: Lint Reliability-owned frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/reliability/*.tsx src/services/reliability.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
