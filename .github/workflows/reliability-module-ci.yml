name: Reliability Module CI

on:
  pull_request:
    paths:
      - '.github/workflows/reliability-module-ci.yml'
      - 'backend/amodb/alembic/env.py'
      - 'backend/amodb/alembic/versions/qms_vernum_128.py'
      - 'backend/amodb/alembic/versions/quality_20260705_notification_action_links.py'
      - 'backend/amodb/alembic/versions/rel_*.py'
      - 'backend/amodb/apps/reliability/**'
      - 'backend/scripts/apply_reliability_review_fixes.py'
      - 'backend/amodb/main.py'
      - 'docs/reliability/**'
      - 'frontend/src/app/PortalRouteSurface.tsx'
      - 'frontend/src/app/portalRouteManifest.ts'
      - 'frontend/src/app/portalRouteManifest.test.ts'
      - 'frontend/src/app/routePreload.ts'
      - 'frontend/src/pages/ReliabilityReportsPage.tsx'
      - 'frontend/src/pages/reliability/**'
      - 'frontend/src/portalRoutes.tsx'
      - 'frontend/src/services/reliability.ts'
      - 'frontend/src/styles/reliability-v2.css'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply_review_fixes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: reliability-review-fix
      JWT_SECRET_KEY: reliability-review-fix-jwt
      PYTHONPATH: backend
      DATABASE_URL: sqlite+pysqlite:///:memory:
      WRITE_DATABASE_URL: sqlite+pysqlite:///:memory:
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Detect pending correction
        id: detect
        shell: bash
        run: |
          if [[ -f docs/reliability/.review-fix-trigger && -f backend/scripts/apply_reliability_review_fixes.py ]]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.detect.outputs.pending == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        if: steps.detect.outputs.pending == 'true'
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Apply and validate corrections
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python backend/scripts/apply_reliability_review_fixes.py
          python -m py_compile \
            backend/amodb/apps/reliability/advanced_services.py \
            backend/amodb/apps/reliability/services.py \
            backend/amodb/apps/reliability/tests/test_review_regressions.py
          git diff --check
          pytest -q backend/amodb/apps/reliability/tests
      - name: Publish permanent source
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git show 55b4263623b5dc7ee3baef91fd8f39cc2c44aa2b:.github/workflows/reliability-module-ci.yml > .github/workflows/reliability-module-ci.yml
          rm -f backend/scripts/apply_reliability_review_fixes.py
          rm -f docs/reliability/.review-fix-trigger
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --check
          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m "Fix Reliability ingestion, metrics, scheduling and counts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  reliability-backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliability_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reliability_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: reliability-ci-secret-key-not-for-production
      JWT_SECRET_KEY: reliability-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
      WRITE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce Reliability-only diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD > /tmp/reliability-files.txt
          ALLOWED='^(\.github/workflows/reliability-module-ci\.yml|backend/amodb/alembic/env\.py|backend/amodb/alembic/versions/(qms_vernum_128|quality_20260705_notification_action_links|rel_[^/]+)\.py|backend/amodb/apps/reliability/.*|backend/amodb/main\.py|docs/reliability/.*|frontend/src/app/(PortalRouteSurface|portalRouteManifest|portalRouteManifest\.test|routePreload)\.tsx?$|frontend/src/pages/ReliabilityReportsPage\.tsx|frontend/src/pages/reliability/.*|frontend/src/portalRoutes\.tsx|frontend/src/services/reliability\.ts|frontend/src/styles/reliability-v2\.css)$'
          if grep -Ev "$ALLOWED" /tmp/reliability-files.txt | grep -q .; then
            echo 'Unexpected files in Reliability PR:'
            grep -Ev "$ALLOWED" /tmp/reliability-files.txt
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile Reliability backend
        run: python -m compileall -q backend/amodb/apps/reliability
      - name: Import application and configure mappers
        run: |
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print('application import and mapper configuration passed')
          PY
      - name: Verify one Alembic head
        run: |
          set -o pipefail
          python -m alembic -c backend/amodb/alembic.ini heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
          grep -q 'rel_20260803_complete_scope' /tmp/alembic-heads.txt
      - name: Upgrade clean PostgreSQL schema
        run: python -m alembic -c backend/amodb/alembic.ini upgrade heads
      - name: Verify Alembic revision capacity
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              width = connection.execute(text("""
                  SELECT character_maximum_length
                  FROM information_schema.columns
                  WHERE table_name = 'alembic_version'
                    AND column_name = 'version_num'
              """)).scalar_one()
          assert width is not None and width >= 128, width
          print(f'alembic_version.version_num capacity: {width}')
          PY
      - name: Run Reliability tests
        run: pytest -q backend/amodb/apps/reliability/tests

  reliability-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run tenant-shell route contracts
        working-directory: frontend
        run: npm run test:tenant-shell
      - name: Lint Reliability-owned frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/reliability/*.tsx src/services/reliability.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
