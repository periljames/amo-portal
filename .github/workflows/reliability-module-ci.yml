name: Reliability Module CI

on:
  pull_request:
    paths:
      - '.github/workflows/reliability-module-ci.yml'
      - '.github/workflows/reliability-hotfix-finalizer.yml'
      - '.github/workflows/reliability-hotfix-pr-finalizer.yml'
      - '.github/workflows/reliability-hotfix-scheduled.yml'
      - '.github/workflows/reliability-review-finalize-v2.yml'
      - '.github/workflows/reliability-review-fixes.yml'
      - 'backend/amodb/alembic/env.py'
      - 'backend/amodb/alembic/versions/qms_vernum_128.py'
      - 'backend/amodb/alembic/versions/quality_20260705_notification_action_links.py'
      - 'backend/amodb/alembic/versions/rel_*.py'
      - 'backend/amodb/apps/reliability/**'
      - 'backend/scripts/apply_reliability_review_fixes.py'
      - 'backend/amodb/main.py'
      - 'docs/reliability/**'
      - 'frontend/src/app/PortalRouteSurface.tsx'
      - 'frontend/src/app/portalRouteManifest.ts'
      - 'frontend/src/app/portalRouteManifest.test.ts'
      - 'frontend/src/app/routePreload.ts'
      - 'frontend/src/pages/ReliabilityReportsPage.tsx'
      - 'frontend/src/pages/reliability/**'
      - 'frontend/src/portalRoutes.tsx'
      - 'frontend/src/services/reliability.ts'
      - 'frontend/src/styles/reliability-v2.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reliability-backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reliability_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d reliability_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: reliability-ci-secret-key-not-for-production
      JWT_SECRET_KEY: reliability-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
      WRITE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reliability_ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce Reliability-only diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          BASE_SHA=$(git merge-base "$BASE_REF" HEAD)
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/reliability-files.txt
          ALLOWED='^(\.github/workflows/(reliability-module-ci|reliability-hotfix-finalizer|reliability-hotfix-pr-finalizer|reliability-hotfix-scheduled|reliability-review-finalize-v2|reliability-review-fixes)\.yml|backend/amodb/alembic/env\.py|backend/amodb/alembic/versions/(qms_vernum_128|quality_20260705_notification_action_links|rel_[^/]+)\.py|backend/amodb/apps/reliability/.*|backend/scripts/apply_reliability_review_fixes\.py|backend/amodb/main\.py|docs/reliability/.*|frontend/src/app/(PortalRouteSurface|portalRouteManifest|portalRouteManifest\.test|routePreload)\.tsx?$|frontend/src/pages/ReliabilityReportsPage\.tsx|frontend/src/pages/reliability/.*|frontend/src/portalRoutes\.tsx|frontend/src/services/reliability\.ts|frontend/src/styles/reliability-v2\.css)$'
          if grep -Ev "$ALLOWED" /tmp/reliability-files.txt | grep -q .; then
            echo 'Unexpected files in Reliability PR:'
            grep -Ev "$ALLOWED" /tmp/reliability-files.txt
            exit 1
          fi

      - name: Verify recovery machinery is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/reliability-hotfix-finalizer.yml
          test ! -e .github/workflows/reliability-hotfix-pr-finalizer.yml
          test ! -e .github/workflows/reliability-hotfix-scheduled.yml
          test ! -e .github/workflows/reliability-review-finalize-v2.yml
          test ! -e .github/workflows/reliability-review-fixes.yml
          test ! -e backend/scripts/apply_reliability_review_fixes.py
          test ! -e docs/reliability/.review-fix-trigger
          test ! -e docs/reliability/.review-fix-trigger-v2
          test ! -e docs/reliability/.hotfix-trigger
          if git grep -n -E 'apply_reliability_review_fixes|review-fix-trigger|hotfix-trigger|Reliability Hotfix Scheduled|Reliability Review Finalizer' -- \
            .github/workflows docs/reliability backend/scripts \
            ':(exclude).github/workflows/reliability-module-ci.yml'; then
            echo 'Temporary Reliability recovery reference remains.'
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Compile Reliability backend
        run: python -m compileall -q backend/amodb/apps/reliability

      - name: Import application and configure mappers
        run: |
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print('application import and mapper configuration passed')
          PY

      - name: Verify one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python -m alembic -c backend/amodb/alembic.ini heads | tee /tmp/alembic-heads.txt
          test "$(grep -c '(head)' /tmp/alembic-heads.txt)" -eq 1
          grep -q 'rel_20260806_formula_snapshots' /tmp/alembic-heads.txt

      - name: Upgrade clean PostgreSQL schema
        run: python -m alembic -c backend/amodb/alembic.ini upgrade heads

      - name: Verify Alembic revision, formula schema and capacity
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as connection:
              width = connection.execute(text("""
                  SELECT character_maximum_length
                  FROM information_schema.columns
                  WHERE table_name = 'alembic_version'
                    AND column_name = 'version_num'
              """)).scalar_one()
              version = connection.execute(text('SELECT version_num FROM alembic_version')).scalar_one()
              metric_columns = set(connection.execute(text("""
                  SELECT column_name FROM information_schema.columns
                  WHERE table_name = 'reliability_metric_definitions'
              """)).scalars())
              run_columns = set(connection.execute(text("""
                  SELECT column_name FROM information_schema.columns
                  WHERE table_name = 'reliability_calculation_runs'
              """)).scalars())
              constraints = set(connection.execute(text("""
                  SELECT conname FROM pg_constraint
                  WHERE conrelid IN (
                      'reliability_metric_definitions'::regclass,
                      'reliability_calculation_runs'::regclass
                  )
              """)).scalars())
          assert width is not None and width >= 128, width
          assert version == 'rel_20260806_formula_snapshots', version
          assert {
              'formula_latex',
              'formula_mathml',
              'formula_expression_json',
              'formula_unit',
              'formula_precision',
              'formula_rounding_mode',
              'denominator_policy',
              'formula_source_fields_json',
          }.issubset(metric_columns), metric_columns
          assert {'formula_snapshot_json', 'formula_snapshot_hash'}.issubset(run_columns), run_columns
          assert {
              'ck_reliability_metric_formula_latex_present',
              'ck_reliability_metric_formula_mathml_present',
              'ck_reliability_formula_snapshot_hash_format',
          }.issubset(constraints), constraints
          print(f'alembic_version={version}; capacity={width}; formula schema verified')
          PY

      - name: Run PostgreSQL append-only calculation regression
        run: python backend/amodb/apps/reliability/tests/postgresql_append_only_regression.py

      - name: Run PostgreSQL operational-source integrity regression
        run: python backend/amodb/apps/reliability/tests/postgresql_operational_sources_regression.py

      - name: Run Reliability tests
        run: pytest -q backend/amodb/apps/reliability/tests

  reliability-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run tenant-shell route contracts
        working-directory: frontend
        run: npm run test:tenant-shell
      - name: Lint Reliability-owned frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/reliability/*.tsx src/services/reliability.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
