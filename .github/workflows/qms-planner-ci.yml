name: QMS Planner CI

on:
  push:
    branches:
      - agent/qms-modern-business-planner
  pull_request:
    paths:
      - ".github/workflows/qms-planner-ci.yml"
      - "backend/amodb/apps/quality/canonical_router.py"
      - "backend/amodb/apps/quality/canonical_router_legacy.py"
      - "backend/amodb/apps/quality/planner_calendar_router.py"
      - "backend/amodb/apps/quality/planner_router.py"
      - "backend/amodb/apps/quality/tests/test_planner_router.py"
      - "frontend/package.json"
      - "frontend/src/pages/qms/**"
      - "frontend/src/pages/qualityAudits/QualityAuditPlanSchedule*.tsx"
      - "frontend/src/styles/qms-modern-planner*.css"
      - "frontend/tests/e2e/qms-planner-*.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qms-planner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Planner backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: qms-planner-ci-secret
      QUALITY_SCHEMA_STRICT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Compile planner backend
        run: >-
          python -m compileall -q
          amodb/apps/quality/canonical_router.py
          amodb/apps/quality/canonical_router_legacy.py
          amodb/apps/quality/planner_calendar_router.py
          amodb/apps/quality/planner_router.py
          amodb/apps/quality/tests/test_planner_router.py
      - name: Configure application mappers
        run: python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; import amodb.quality_main; configure_mappers(); print('QMS planner mappers configured')"
      - name: Run planner backend regressions
        run: pytest -q amodb/apps/quality/tests/test_planner_router.py

  frontend:
    name: Planner frontend contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run planner unit tests
        run: npm run test:qms-planner
      - name: Validate CSS contract
        run: npm run check:css
      - name: Lint planner surfaces
        run: >-
          npm exec -- eslint
          src/pages/qms/QmsCanonicalPage.tsx
          src/pages/qms/planner/QmsPlannerLivePage.tsx
          src/pages/qms/planner/QmsPlannerPageV2.tsx
          src/pages/qms/planner/qmsPlannerClock.ts
          src/pages/qms/planner/qmsPlannerClock.test.ts
          src/pages/qms/planner/qmsPlannerModel.ts
          src/pages/qms/planner/qmsPlannerModel.test.ts
          src/pages/qualityAudits/QualityAuditPlanSchedulePage.tsx
          tests/e2e/qms-modern-planner-live.spec.ts
          tests/e2e/qms-planner-lifecycle.spec.ts
          tests/e2e/qms-planner-audit-handoff.spec.ts
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start mocked portal readiness
        run: |
          node -e 'const http=require("http");http.createServer((req,res)=>{if(req.url==="/readyz"||req.url==="/healthz"){res.writeHead(200,{"Content-Type":"application/json","X-Portal-Readiness":"ready"});res.end(JSON.stringify({ready:true,status:"ok",db:true}));return;}res.writeHead(502,{"Content-Type":"application/json"});res.end(JSON.stringify({detail:"CI readiness stub only; retry direct mocked backend"}));}).listen(8080,"127.0.0.1");' > /tmp/qms-planner-readiness.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qms-planner-readiness.log
          exit 1
      - name: Run deterministic planner browser regressions
        shell: bash
        run: |
          set +e
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qms-planner-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:4173 >/dev/null; then
            cat /tmp/qms-planner-preview.log
            exit 1
          fi
          npx playwright test \
            tests/e2e/qms-modern-planner-live.spec.ts \
            tests/e2e/qms-planner-lifecycle.spec.ts \
            tests/e2e/qms-planner-audit-handoff.spec.ts \
            --workers=1 --reporter=github,line --trace=retain-on-failure 2>&1 | tee /tmp/qms-planner-playwright.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 140 /tmp/qms-planner-playwright.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-7000)
            echo "::error title=QMS planner browser failure::$summary"
          fi
          exit "$status"
      - name: Retain planner browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: qms-planner-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            /tmp/qms-planner-playwright.log
            /tmp/qms-planner-preview.log
            /tmp/qms-planner-readiness.log
          if-no-files-found: warn
          retention-days: 14
