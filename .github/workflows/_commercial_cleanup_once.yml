name: One-time commercial legacy cleanup

on:
  push:
    branches:
      - agent/platform-commercial-scale-hardening
    paths:
      - ".github/workflows/_commercial_cleanup_once.yml"
      - "backend/amodb/apps/accounts/billing_access.py"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/platform-commercial-scale-hardening
          fetch-depth: 0

      - name: Transform stale source code
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          def swap(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old in text:
                  p.write_text(text.replace(old, new), encoding="utf-8")

          swap("backend/amodb/apps/accounts/router_billing.py", "from . import billing_auth, models, schemas, services", "from . import billing_access, billing_auth, models, schemas, services")
          swap("backend/amodb/apps/accounts/router_billing.py", "return services.get_billing_access_status(db, amo_id=current_user.amo_id)", "return billing_access.get_billing_access_status(db, amo_id=current_user.amo_id)")
          swap("backend/amodb/apps/accounts/router_billing.py", "return list(services.resolve_entitlements(db, amo_id=current_user.amo_id).values())", "return list(billing_access.resolve_entitlements(db, amo_id=current_user.amo_id).values())")

          swap("backend/amodb/entitlements.py", "from amodb.apps.accounts import services as account_services", "from amodb.apps.accounts import billing_access")
          swap("backend/amodb/entitlements.py", "account_services.resolve_entitlements(db, amo_id=amo_id)", "billing_access.resolve_entitlements(db, amo_id=amo_id)")
          swap("backend/amodb/entitlements.py", "account_services.get_billing_access_status(db, amo_id=amo_id)", "billing_access.get_billing_access_status(db, amo_id=amo_id)")

          swap("backend/amodb/apps/platform/module_access_router.py", "from amodb.apps.accounts import services as account_services", "from amodb.apps.accounts import billing_access")
          swap("backend/amodb/apps/platform/module_access_router.py", "account_services.get_billing_access_status(db, amo_id=tenant_id, as_of=checked_at)", "billing_access.get_billing_access_status(db, amo_id=tenant_id, as_of=checked_at)")

          swap("backend/amodb/apps/platform/tests/test_module_access_scope.py", "from amodb.apps.platform import commercial_access_scope_policy, module_access_router", "from amodb.apps.accounts import billing_access\nfrom amodb.apps.platform import module_access_router")
          swap("backend/amodb/apps/platform/tests/test_module_access_scope.py", "commercial_access_scope_policy.scoped_billing_access_status", "billing_access.get_billing_access_status")

          init = Path("backend/amodb/apps/platform/__init__.py")
          text = init.read_text(encoding="utf-8")
          for line in (
              "from .commercial_access_policy import install_billing_access_hot_path\n",
              "from .commercial_access_scope_policy import install_commercial_access_scope_policy\n",
              "install_billing_access_hot_path()\n",
              "install_commercial_access_scope_policy()\n",
          ):
              text = text.replace(line, "")
          init.write_text(text, encoding="utf-8")

          routes = Path("frontend/src/portalRoutes.tsx")
          text = routes.read_text(encoding="utf-8")
          text = "".join(line for line in text.splitlines(True) if "UpsellPage" not in line)
          routes.write_text(text, encoding="utf-8")

          for stale in (
              "frontend/src/pages/UpsellPage.tsx",
              "backend/amodb/apps/platform/commercial_access_policy.py",
              "backend/amodb/apps/platform/commercial_access_scope_policy.py",
          ):
              path = Path(stale)
              if path.exists():
                  path.unlink()
          PY
          git status --short
          git diff --check

      - name: Commit source cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "amo-portal-ci"
          git config user.email "amo-portal-ci@users.noreply.github.com"
          git add backend frontend
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "refactor(commercial): remove runtime access compatibility layers"
          fi

      - name: Push source cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git push origin HEAD:agent/platform-commercial-scale-hardening
