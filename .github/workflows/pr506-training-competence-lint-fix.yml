name: PR 506 Training Competence lint fix

on:
  push:
    branches:
      - codex/training-record-redesign-20260817

permissions:
  contents: write

concurrency:
  group: pr506-training-competence-lint-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
          fetch-depth: 0
      - name: Apply typed lint cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/pages/TrainingCompetencePage.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          def once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          if 'type DeferralReasonCategory,' not in text:
              once(
                  '  TrainingCourseRead,\n  TrainingDeferralRequestRead,\n',
                  '  TrainingCourseRead,\n  DeferralReasonCategory,\n  TrainingDeferralRequestRead,\n',
                  'DeferralReasonCategory import',
              )

          if 'type AdminUserSummaryWithDepartment =' not in text:
              once(
                  'type PersonRow = {\n',
                  'type AdminUserSummaryWithDepartment = AdminUserSummaryRead & { department_code?: string | null };\n\ntype PersonRow = {\n',
                  'summary compatibility type',
              )

          if 'function errorMessage(error: unknown' not in text:
              once(
                  'function csvEscape(value: unknown): string {\n',
                  'function errorMessage(error: unknown, fallback: string): string {\n  return error instanceof Error && error.message ? error.message : fallback;\n}\n\nfunction csvEscape(value: unknown): string {\n',
                  'error helper',
              )

          once('  const load = async () => {\n', '  const load = React.useCallback(async () => {\n', 'load callback start')
          once('    setLoading(false);\n  };\n\n  useEffect(() => {\n    void load();\n  }, [peoplePage]);\n', '    setLoading(false);\n  }, [amoCode, peoplePage]);\n\n  useEffect(() => {\n    void load();\n  }, [load]);\n', 'load callback end/effect')

          once('(user as any).department_code', '(user as AdminUserSummaryWithDepartment).department_code', 'department cast')
          once('reason_category: deferralForm.reason_category as any,', 'reason_category: deferralForm.reason_category as DeferralReasonCategory,', 'deferral reason type')

          text, catch_count = re.subn(r'catch \(error: any\)', 'catch (error: unknown)', text)
          if catch_count != 8:
              raise SystemExit(f'error catch typing: expected 8 occurrences, found {catch_count}')

          text, message_count = re.subn(
              r'error\?\.message \|\| ("[^"]+")',
              r'errorMessage(error, \1)',
              text,
          )
          if message_count != 8:
              raise SystemExit(f'error message cleanup: expected 8 occurrences, found {message_count}')

          if ' as any' in text or 'error: any' in text:
              raise SystemExit('explicit any remains in TrainingCompetencePage.tsx')
          if text == original:
              print('No patch required.')
          else:
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit source cleanup when needed
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/pages/TrainingCompetencePage.tsx; then
            echo "Source already clean."
            exit 0
          fi
          git diff --check -- frontend/src/pages/TrainingCompetencePage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/TrainingCompetencePage.tsx
          git commit -m "Clean Training competence TypeScript gate"
          git push origin HEAD:codex/training-record-redesign-20260817
