name: PR 477 fix CI heads

on:
  push:
    branches:
      - agent/dms-reader-governance-completion
    paths:
      - .github/workflows/pr477-fix-ci-heads.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dms-reader-governance-completion
          fetch-depth: 0
      - name: Merge Alembic heads and remove dead reader import
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/amodb/alembic/versions/docgov_merge_20260807_heads.py <<'PY'
          """Merge governed reader with the current aircraft architecture migration line.

          Revision ID: docgov_merge_20260807_heads
          Revises: docgov_20260807_reader_governance, aircraft_arch_20260806_usage_hsi
          Create Date: 2026-08-07
          """
          from __future__ import annotations

          from typing import Sequence, Union

          revision: str = "docgov_merge_20260807_heads"
          down_revision: Union[str, Sequence[str], None] = (
              "docgov_20260807_reader_governance",
              "aircraft_arch_20260806_usage_hsi",
          )
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              pass


          def downgrade() -> None:
              pass
          PY
          python - <<'PY'
          from pathlib import Path

          reader = Path('frontend/src/pages/manuals/PublicationsReaderPage.tsx')
          source = reader.read_text(encoding='utf-8')
          if source.count('  ChevronLeft,\n') != 1:
              raise SystemExit('Expected one unused ChevronLeft import')
          reader.write_text(source.replace('  ChevronLeft,\n', ''), encoding='utf-8')

          workflow = Path('.github/workflows/document-control-governance-ci.yml')
          source = workflow.read_text(encoding='utf-8')
          old = 'assert heads == ["docgov_20260807_reader_governance"], heads'
          new = 'assert heads == ["docgov_merge_20260807_heads"], heads'
          if source.count(old) != 1:
              raise SystemExit('CI Alembic head assertion marker changed')
          source = source.replace(old, new)
          marker = '          assert script.get_revision("docgov_20260807_reader_governance") is not None\n'
          if source.count(marker) != 1:
              raise SystemExit('CI reader revision marker changed')
          source = source.replace(marker, marker + '          assert script.get_revision("docgov_merge_20260807_heads") is not None\n')
          workflow.write_text(source, encoding='utf-8')

          test = Path('backend/amodb/apps/doc_control/tests/test_reader_governance_contract.py')
          source = test.read_text(encoding='utf-8')
          marker = '    assert \'down_revision: Union[str, Sequence[str], None] = "docgov_merge_20260807"\' in reader\n'
          if source.count(marker) != 1:
              raise SystemExit('Reader governance migration test marker changed')
          source = source.replace(marker, marker + '    heads = Path("amodb/alembic/versions/docgov_merge_20260807_heads.py").read_text(encoding="utf-8")\n    assert \'"docgov_20260807_reader_governance"\' in heads\n    assert \'"aircraft_arch_20260806_usage_hsi"\' in heads\n')
          test.write_text(source, encoding='utf-8')
          PY
          python -m compileall -q backend/amodb/apps/doc_control backend/amodb/alembic/versions/docgov_merge_20260807_heads.py
          git config user.name "amo-portal-automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr477-fix-ci-heads.yml
          git add backend/amodb/alembic/versions/docgov_merge_20260807_heads.py backend/amodb/apps/doc_control/tests/test_reader_governance_contract.py frontend/src/pages/manuals/PublicationsReaderPage.tsx .github/workflows/document-control-governance-ci.yml
          git commit -m "fix(document-control): reconcile migration heads and reader lint"
          git push origin HEAD:agent/dms-reader-governance-completion
