name: Document Control Evidence Pack CI

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/amodb/apps/doc_control/workspace_evidence_pack_router.py"
      - "backend/amodb/apps/doc_control/workspace_evidence_pack_job_router.py"
      - "backend/amodb/apps/doc_control/evidence_pack_job_service.py"
      - "backend/amodb/apps/doc_control/evidence_pack_job_lifecycle_router.py"
      - "backend/amodb/apps/doc_control/evidence_pack_runtime_guard.py"
      - "backend/amodb/apps/doc_control/workspace_evidence_router.py"
      - "backend/amodb/apps/doc_control/evidence_models.py"
      - "backend/amodb/apps/doc_control/router.py"
      - "backend/amodb/apps/doc_control/tests/test_document_evidence_pack_contract.py"
      - "backend/amodb/apps/doc_control/tests/test_document_evidence_pack_job_contract.py"
      - "frontend/src/pages/documentControl/DocumentEvidencePackAction.tsx"
      - "frontend/src/pages/documentControl/DocumentControlRecordActions.tsx"
      - "frontend/src/services/documentControlEvidence.ts"
      - ".github/workflows/document-control-evidence-pack-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Compile evidence-pack routes and durable worker
        working-directory: backend
        run: |
          python -m py_compile \
            amodb/apps/doc_control/workspace_evidence_pack_router.py \
            amodb/apps/doc_control/workspace_evidence_pack_job_router.py \
            amodb/apps/doc_control/evidence_pack_job_service.py \
            amodb/apps/doc_control/evidence_pack_job_lifecycle_router.py \
            amodb/apps/doc_control/router.py
      - name: Run evidence-pack contracts
        working-directory: backend
        run: |
          pytest -q \
            amodb/apps/doc_control/tests/test_document_evidence_pack_contract.py \
            amodb/apps/doc_control/tests/test_document_evidence_pack_job_contract.py \
            amodb/apps/doc_control/tests/test_document_control_evidence_assets_contract.py
      - name: Import Document Control routing graph
        working-directory: backend
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          SECRET_KEY: "ci-only-document-evidence-pack-key"
        run: python -c "from amodb.apps.doc_control.router import router; assert router.routes"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Lint evidence-pack surfaces
        working-directory: frontend
        run: npm exec -- eslint src/pages/documentControl/DocumentEvidencePackAction.tsx src/pages/documentControl/DocumentControlRecordActions.tsx src/services/documentControlEvidence.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
