name: PR506 Final Security Patch
on:
  push:
    branches: [codex/training-record-redesign-20260817]
    paths: [scripts/pr506_final_security_patch.py, .github/workflows/pr506-final-security-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/training-record-redesign-20260817
          fetch-depth: 0
      - run: |
          git fetch origin codex/training-record-redesign-20260817
          git reset --hard origin/codex/training-record-redesign-20260817
          python scripts/pr506_final_security_patch.py
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/amodb/apps/training/router.py backend/amodb/apps/training/workflow_completion.py
          git commit -m "training: secure manager workspace and external delivery"
          git push origin HEAD:codex/training-record-redesign-20260817
