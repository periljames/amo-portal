name: Apply Manual Daily Aircraft Utilisation

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-daily-utilisation-apply.yml"
      - ".github/transfer/daily-utilisation.part*"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      SECRET_KEY: aircraft-daily-utilisation-ci-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0

      - name: Reconstruct and verify reviewed source bundle
        run: |
          cat .github/transfer/daily-utilisation.part00 \
              .github/transfer/daily-utilisation.part01 \
              .github/transfer/daily-utilisation.part02 > /tmp/daily-utilisation.b64
          base64 --decode /tmp/daily-utilisation.b64 > /tmp/daily-utilisation.tgz
          echo "8fd4528f93dd6e7efa907569c0bcd29f8948ad10df7bc502a057086ebfbda40b  /tmp/daily-utilisation.tgz" | sha256sum --check --strict
          tar -xzf /tmp/daily-utilisation.tgz -C .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile daily utilisation architecture
        run: python -m compileall -q backend/amodb/apps/aircraft_architecture

      - name: Verify one Alembic head and upgrade clean PostgreSQL
        run: |
          output=$(alembic -c backend/amodb/alembic.ini heads)
          printf '%s\n' "$output"
          heads=$(printf '%s\n' "$output" | grep -c '(head)')
          test "$heads" -eq 1
          alembic -c backend/amodb/alembic.ini upgrade head

      - name: Import application and initialize all mappers
        run: python -c "import amodb.main; from sqlalchemy.orm import configure_mappers; configure_mappers()"

      - name: Run aircraft architecture regression tests
        run: pytest -q backend/amodb/apps/aircraft_architecture

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend daily utilisation page
        working-directory: frontend
        run: npm ci && npm run build

      - name: Publish validated source and remove transfer harnesses
        run: |
          rm -rf .github/transfer
          rm -f .github/workflows/aircraft-daily-utilisation-apply.yml
          rm -f .github/workflows/aircraft-architecture-u5-apply.yml
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add manual daily aircraft utilisation workflow"
          git push origin HEAD:agent/aircraft-induction-architecture
