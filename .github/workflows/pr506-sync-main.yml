name: PR506 Sync Main
on:
  push:
    branches: [codex/training-record-redesign-20260817]
    paths: [.github/workflows/pr506-sync-main.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/training-record-redesign-20260817
          fetch-depth: 0
      - run: |
          git fetch origin main codex/training-record-redesign-20260817
          git reset --hard origin/codex/training-record-redesign-20260817
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin HEAD:codex/training-record-redesign-20260817
