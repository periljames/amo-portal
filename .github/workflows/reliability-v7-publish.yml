name: Reliability V7 Final Publisher

on:
  push:
    branches: [agent/reliability-v6-publisher]
    paths: [docs/reliability/.v7-publish-trigger]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reliability-v7-final-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_reliability_v7
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_reliability_v7"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BASE_SHA: 246638e66a8583fac95a284aea35c03d5d47ef5b
      OLD_BASE_SHA: 309a8eac0aecfdbb19a1ecd71c83cdbaababb074
      TARGET_BRANCH: agent/reliability-v2-foundation
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_reliability_v7
      WRITE_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_reliability_v7
      SECRET_KEY: reliability-v7-publisher
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v6-publisher
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct clean Reliability tree
        shell: bash
        run: |
          set -euo pipefail
          echo reconstruct > /tmp/reliability-v7-stage
          test "$(git rev-parse refs/remotes/origin/feat/global-tenant-navigation-quality-home)" = "$BASE_SHA"
          git reset --hard "$BASE_SHA"

          SOURCE=refs/remotes/origin/agent/reliability-v2-canonical-source
          CLEAN=refs/remotes/origin/agent/reliability-v2-clean
          COLLECTORS=refs/remotes/origin/agent/reliability-v2-collectors-prep

          git checkout "$SOURCE" -- \
            .gitignore \
            backend/amodb/apps/reliability \
            docs/reliability/RELIABILITY_MODULE_V2_TARGET_DESIGN.md \
            docs/reliability/RELIABILITY_V2_IMPLEMENTATION_TRACKER.md \
            docs/reliability/RELIABILITY_V2_VALIDATION.md \
            docs/reliability/RELIABILITY_COMPLETE_SCOPE_VALIDATION.md \
            frontend/src/pages/reliability \
            frontend/src/services/reliability.ts \
            frontend/src/styles/reliability-v2.css
          git rm -f --ignore-unmatch frontend/src/pages/ReliabilityReportsPage.tsx

          git diff --binary "$OLD_BASE_SHA" "$SOURCE" -- \
            backend/amodb/alembic/env.py \
            backend/amodb/main.py \
            frontend/src/app/PortalRouteSurface.tsx \
            frontend/src/app/portalRouteManifest.test.ts \
            frontend/src/app/routePreload.ts \
            frontend/src/portalRoutes.tsx \
            > /tmp/reliability-shared.patch
          git apply --3way /tmp/reliability-shared.patch
          test -z "$(git diff --name-only --diff-filter=U)"

          git checkout "$CLEAN" -- \
            backend/scripts/prepare_reliability_clean_tree.py \
            backend/scripts/validate_reliability_clean.py \
            .github/workflows/reliability.yml
          python backend/scripts/prepare_reliability_clean_tree.py

          git checkout "$COLLECTORS" -- \
            backend/amodb/apps/reliability/internal_collectors.py \
            backend/amodb/apps/reliability/tests/test_internal_collectors.py \
            backend/amodb/apps/reliability/tests/test_merge_readiness_contracts.py \
            backend/scripts/apply_reliability_internal_collectors.py
          python backend/scripts/apply_reliability_internal_collectors.py
          rm -f backend/scripts/apply_reliability_internal_collectors.py

          python -m py_compile \
            backend/amodb/apps/reliability/*.py \
            backend/amodb/apps/reliability/tests/*.py \
            backend/amodb/alembic/env.py \
            backend/amodb/main.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          echo backend-dependencies > /tmp/reliability-v7-stage
          pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Upgrade baseline and generate current Reliability migration
        shell: bash
        run: |
          set -euo pipefail
          echo migration-generation > /tmp/reliability-v7-stage
          psql -h 127.0.0.1 -U postgres -d amo_reliability_v7 -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS alembic_version (version_num varchar(255) NOT NULL PRIMARY KEY);
          ALTER TABLE alembic_version ALTER COLUMN version_num TYPE varchar(255);
          SQL

          cd backend
          alembic -c amodb/alembic.ini upgrade heads
          psql -h 127.0.0.1 -U postgres -d amo_reliability_v7 -v ON_ERROR_STOP=1 <<'SQL'
          SET session_replication_role = replica;
          INSERT INTO reliability_events (amo_id, event_type, occurred_at, created_at, description)
          VALUES ('legacy-reliability-v7-probe', 'DEFECT', now(), now(), 'Existing row before advanced Reliability migration.');
          SET session_replication_role = origin;
          SQL

          rm -f amodb/alembic/versions/rel_20260803_complete_scope*.py
          rm -f amodb/alembic/versions/rel_20260803_merge_heads*.py
          mapfile -t HEADS < <(alembic -c amodb/alembic.ini heads | awk '{print $1}')
          if [ "${#HEADS[@]}" -gt 1 ]; then
            alembic -c amodb/alembic.ini merge \
              --rev-id rel_20260803_merge_heads \
              -m "merge current heads before complete Reliability scope" \
              "${HEADS[@]}"
            alembic -c amodb/alembic.ini upgrade head
          fi

          git checkout refs/remotes/origin/agent/reliability-finalizer-source -- scripts/finalize_reliability_migration.py
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize_reliability_migration.py')
          text = path.read_text(encoding='utf-8')
          for role_id in ('rel-role-viewer','rel-role-engineer','rel-role-manager','rel-role-authority'):
              old = f"u.amo_id || ':' || u.id || ':{role_id}'"
              new = f"u.amo_id || '|' || u.id || '|{role_id}'"
              if old not in text:
                  raise RuntimeError(f'Missing role seed anchor: {role_id}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          RELIABILITY_AUTOGENERATE_ONLY=true alembic -c amodb/alembic.ini revision \
            --autogenerate \
            --rev-id rel_20260803_complete_scope \
            -m "complete Reliability full stack scope"
          python scripts/finalize_reliability_migration.py
          rm -f scripts/finalize_reliability_migration.py
          python -m py_compile amodb/alembic/versions/rel_20260803_*.py

      - name: Prove PostgreSQL, application and Reliability regressions
        working-directory: backend
        env:
          RELIABILITY_AUTOGENERATE_ONLY: "true"
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          echo backend-validation > /tmp/reliability-v7-stage
          alembic -c amodb/alembic.ini upgrade head
          test "$(alembic -c amodb/alembic.ini heads | wc -l | tr -d ' ')" -eq 1
          alembic -c amodb/alembic.ini check
          psql -h 127.0.0.1 -U postgres -d amo_reliability_v7 -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE probe record;
          BEGIN
            SELECT validation_status, validation_errors, provenance_json INTO probe
            FROM reliability_events WHERE amo_id = 'legacy-reliability-v7-probe';
            IF probe.validation_status <> 'VALID' OR probe.validation_errors IS NULL OR probe.provenance_json IS NULL THEN
              RAISE EXCEPTION 'Reliability existing-row backfill failed';
            END IF;
          END $$;
          SQL
          alembic -c amodb/alembic.ini downgrade -1
          alembic -c amodb/alembic.ini upgrade head
          alembic -c amodb/alembic.ini check
          python scripts/validate_reliability_clean.py
          pytest -q amodb/apps/reliability/tests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prove tenant shell, lint and production build
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          echo frontend-validation > /tmp/reliability-v7-stage
          npm ci --no-audit --no-fund
          npm run test:tenant-shell
          npx eslint \
            src/services/reliability.ts \
            src/pages/reliability/ReliabilityWorkspacePage.tsx \
            src/pages/reliability/ReliabilityAdvancedViews.tsx \
            src/pages/reliability/ReliabilityReportsView.tsx \
            src/app/PortalRouteSurface.tsx \
            src/app/portalRouteManifest.ts \
            src/app/portalRouteManifest.test.ts \
            src/app/routePreload.ts
          npm run build

      - name: Record evidence, enforce scope and publish PR head
        shell: bash
        run: |
          set -euo pipefail
          echo publication > /tmp/reliability-v7-stage
          cat > docs/reliability/RELIABILITY_CLEAN_REBUILD_VALIDATION.md <<EOF
          # Reliability Clean Rebuild Validation

          - Run: \`${GITHUB_RUN_ID}\`
          - Shared-shell baseline: \`${BASE_SHA}\`
          - Collector source: \`7063d46c384b38c0a46544e02a7fb2f6180f4637\`
          - UTC: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`

          ## Passed

          - exact-current-base reconstruction and one canonical Reliability route/client/workspace;
          - current-head migration generation, clean PostgreSQL upgrade, one head, downgrade and re-upgrade;
          - existing-row validation and provenance backfill;
          - application import, mapper and governance validation;
          - complete Reliability regression suite including scheduler, tenant, bounded-query, freshness and FRACAS evidence controls;
          - authoritative internal collectors and explicit unsupported external source contracts;
          - tenant-shell tests, scoped ESLint and full production build;
          - strict Reliability-owned path allowlist with no generated or temporary artifacts.
          EOF

          cp backend/scripts/validate_reliability_clean.py /tmp/validate_reliability_clean.py
          rm -f backend/scripts/prepare_reliability_clean_tree.py backend/scripts/validate_reliability_clean.py
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete

          git add .gitignore .github/workflows/reliability.yml
          git add backend/amodb/alembic/env.py backend/amodb/alembic/versions/rel_20260803_*.py
          git add backend/amodb/apps/reliability backend/amodb/main.py
          git add docs/reliability/RELIABILITY_*.md
          git add frontend/src/app/PortalRouteSurface.tsx frontend/src/app/portalRouteManifest.ts
          git add frontend/src/app/portalRouteManifest.test.ts frontend/src/app/routePreload.ts
          git add frontend/src/pages/reliability frontend/src/services/reliability.ts
          git add frontend/src/styles/reliability-v2.css frontend/src/portalRoutes.tsx
          git add -u frontend/src/pages/ReliabilityReportsPage.tsx || true

          PYTHONPATH=backend RELIABILITY_CLEAN_VALIDATION_MODE=paths python /tmp/validate_reliability_clean.py
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(\.venv|__pycache__|node_modules)(/|$)|\.pyc$|\.db$|clean-publish|diagnostic|prepare_reliability_clean|validate_reliability_clean'; then
            echo 'Forbidden publication artifact detected.' >&2
            exit 1
          fi

          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m "Complete Reliability module on current tenant shell"
          git push --force origin HEAD:"$TARGET_BRANCH"

      - name: Record failure without modifying PR head
        if: failure()
        shell: bash
        run: |
          set +e
          STAGE="$(cat /tmp/reliability-v7-stage 2>/dev/null || echo unknown)"
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          mkdir -p docs/reliability
          cat > docs/reliability/V7_PUBLISH_FAILURE.md <<EOF
          # Reliability V7 Publisher Failure
          - Run: \`${GITHUB_RUN_ID}\`
          - Stage: \`${STAGE}\`
          - Source: \`${GITHUB_SHA}\`
          - UTC: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`
          PR #404 was not modified by this failed run.
          EOF
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/reliability/V7_PUBLISH_FAILURE.md
          git commit -m "Record Reliability V7 publisher failure" || true
          git push origin HEAD:agent/reliability-v6-publisher || true
