name: PR Platform Access Lint Fix

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/platform-session-hydration-and-schema-warning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/platform-session-hydration-and-schema-warning
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply lint-safe access effect repair
        run: python .github/scripts/fix_platform_access_effect_lint.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate changed frontend surface
        working-directory: frontend
        run: |
          npx eslint src/pages/platform/components/PlatformShared.tsx src/services/platformControl.test.ts
          npm run test:platform
          npm run build
      - name: Commit product change
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add frontend/src/pages/platform/components/PlatformShared.tsx
          if git diff --cached --quiet; then
            echo "No product change required."
            exit 0
          fi
          git commit -m "Make platform access hydration effect lint-safe"
          git push origin HEAD:fix/platform-session-hydration-and-schema-warning
