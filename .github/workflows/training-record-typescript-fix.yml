name: Training Record TypeScript Fix

on:
  push:
    branches:
      - codex/training-record-redesign-20260817

permissions:
  contents: write

concurrency:
  group: training-record-typescript-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/training-record-redesign-20260817
      - name: Apply canonical recurrent type fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/pages/QMSTrainingUserPage.tsx")
          text = path.read_text(encoding="utf-8")
          old = 'courses.find((course) => coursePhase(course) === "REFRESHER" && courseFamilyKey(course) === family) || null;'
          new = 'courses.find((course) => coursePhase(course) === "RECURRENT" && courseFamilyKey(course) === family) || null;'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Expected Training course selector was not found; refusing an unguarded edit.")
          PY
      - name: Commit fix when needed
        run: |
          if git diff --quiet -- frontend/src/pages/QMSTrainingUserPage.tsx; then
            echo "Canonical recurrent selector is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/QMSTrainingUserPage.tsx
          git commit -m "fix(training): use canonical recurrent course phase"
          git push origin HEAD:codex/training-record-redesign-20260817
