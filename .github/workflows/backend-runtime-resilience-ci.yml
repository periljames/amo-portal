name: Backend Runtime Resilience CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-runtime-resilience-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend-runtime-resilience-ci.yml"

permissions:
  contents: read

jobs:
  runtime-contracts:
    name: Process, admission and DB capacity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10.0-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      AUTH_RATE_LIMIT_SHARED_REQUIRED: "true"
      AUTH_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Compile production runtime modules
        run: python -m compileall -q backend/amodb/serve.py backend/amodb/production_app.py backend/amodb/runtime_concurrency.py backend/amodb/distributed_rate_limit.py
      - name: Run runtime resilience contracts
        run: >-
          python -m pytest -q
          backend/tests/test_connection_budget.py
          backend/tests/test_distributed_rate_limit.py
          backend/tests/test_serve_runtime.py
          backend/amodb/apps/accounts/tests/test_router_public_rate_limit.py
      - name: Prepare compose environment
        run: cp .env.example .env
      - name: Validate production compose model
        run: docker compose -f docker-compose.prod.yml config >/dev/null
      - name: Build production backend image
        run: docker build -f backend/Dockerfile -t amo-portal-backend:runtime-ci .
