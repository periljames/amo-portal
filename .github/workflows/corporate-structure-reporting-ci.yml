name: Corporate Structure Reporting CI

on:
  push:
    paths:
      - 'backend/amodb/apps/accounts/**'
      - 'backend/amodb/alembic/versions/accounts_20260805_corporate_structure.py'
      - 'backend/amodb/alembic/versions/accounts_20260805_reporting_lines.py'
      - 'frontend/src/app/PortalRouteSurface.tsx'
      - 'frontend/src/app/portalRouteManifest.ts'
      - 'frontend/src/pages/admin-users/**'
      - 'frontend/src/services/corporateStructure.ts'
      - 'frontend/src/services/reportingLines.ts'
      - 'frontend/src/styles/admin-corporate-structure.css'
      - 'frontend/src/styles/admin-user-governance.css'
      - 'frontend/src/styles/reporting-line-builder.css'
      - 'frontend/src/styles/workforce-portals.css'
      - '.github/workflows/corporate-structure-reporting-ci.yml'
  pull_request:
    paths:
      - 'backend/amodb/apps/accounts/**'
      - 'backend/amodb/alembic/versions/accounts_20260805_corporate_structure.py'
      - 'backend/amodb/alembic/versions/accounts_20260805_reporting_lines.py'
      - 'frontend/src/app/PortalRouteSurface.tsx'
      - 'frontend/src/app/portalRouteManifest.ts'
      - 'frontend/src/pages/admin-users/**'
      - 'frontend/src/services/corporateStructure.ts'
      - 'frontend/src/services/reportingLines.ts'
      - 'frontend/src/styles/admin-corporate-structure.css'
      - 'frontend/src/styles/admin-user-governance.css'
      - 'frontend/src/styles/reporting-line-builder.css'
      - 'frontend/src/styles/workforce-portals.css'
      - '.github/workflows/corporate-structure-reporting-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corporate-structure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: '1'
      SECRET_KEY: corporate-structure-ci-secret
      DATABASE_URL: sqlite+pysqlite:///:memory:
      DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Compile accounts backend
        run: python -m compileall -q backend/amodb/apps/accounts

      - name: Configure application mappers
        working-directory: backend
        run: python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; configure_mappers(); print('All application mappers configured')"

      - name: Run accounts tests
        working-directory: backend
        run: pytest -q amodb/apps/accounts/tests

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run tenant shell contracts
        working-directory: frontend
        run: npm run test:tenant-shell

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Lint corporate structure surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/app/PortalRouteSurface.tsx
          src/app/portalRouteManifest.ts
          src/pages/admin-users
          src/services/corporateStructure.ts
          src/services/reportingLines.ts
