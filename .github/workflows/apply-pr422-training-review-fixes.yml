name: Apply PR 422 Training review fixes

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: apply-pr422-training-review-fixes
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 422 &&
      github.event.comment.body == '/apply-pr422-training-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/training-workbook-control-centre
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Retrieve and apply exact reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5178920889'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/training-review-comment.txt
          python - <<'PY'
          import base64
          from pathlib import Path

          body = Path('/tmp/training-review-comment.txt').read_text(encoding='utf-8')
          start_marker = 'PATCH_BASE64_BEGIN'
          end_marker = 'PATCH_BASE64_END'
          if start_marker not in body or end_marker not in body:
              raise SystemExit('Reviewed patch markers were not found.')
          encoded = ''.join(body.split(start_marker, 1)[1].split(end_marker, 1)[0].split())
          patch = base64.b64decode(encoded, validate=True)
          Path('/tmp/training-six-fixes.diff').write_bytes(patch)
          print(f'Decoded {len(patch)} patch bytes.')
          PY
          git apply --check /tmp/training-six-fixes.diff
          git apply /tmp/training-six-fixes.diff
          rm -f .github/workflows/apply-training-review-fixes.yml
          rm -f .github/triggers/apply-training-review-fixes.txt
          git diff --check

      - name: Verify reviewed file set
        run: |
          set -euo pipefail
          expected=$'backend/amodb/apps/training/tests/test_workbook_import_mapping.py\nbackend/amodb/apps/training/workbook_import.py\ndocs/training/TRAINING_TRACKER_WORKBOOK_MAPPING.md\nfrontend/src/components/training/TrainingWorkbookImportDialog.tsx'
          actual="$(git diff --name-only | grep -v '^.github/' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected patch file set:'
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run focused backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+pysqlite:///:memory:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: '1'
        run: |
          python -m py_compile backend/amodb/apps/training/workbook_import.py backend/amodb/apps/training/tests/test_workbook_import_mapping.py
          pytest -q backend/amodb/apps/training/tests/test_workbook_import_mapping.py

      - name: Validate Alembic revision graph
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+psycopg2://validation:validation@127.0.0.1:5432/validation
          APP_ENV: test
        working-directory: backend
        run: alembic -c amodb/alembic.ini heads

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check CSS contracts
        working-directory: frontend
        run: npm run check:css

      - name: Commit and push PR fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address Training workbook reconciliation review'
          git push origin HEAD:agent/training-workbook-control-centre
          gh pr comment 422 --body "Applied all six latest Training workbook review fixes. Focused backend tests, Alembic graph validation, frontend production build, and CSS contract checks passed in workflow run ${GITHUB_RUN_ID}."

      - name: Clean temporary workflow from main
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/apply-pr422-training-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary PR 422 repair workflow'
          git push origin HEAD:main

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 422 --body "The automated application of the six Training review fixes failed in workflow run ${GITHUB_RUN_ID}. No reviewed product changes were pushed by this run."
