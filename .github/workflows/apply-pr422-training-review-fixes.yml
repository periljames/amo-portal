name: Apply PR 422 Training review fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pr422-training-review-fixes.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: apply-pr422-training-review-fixes
  cancel-in-progress: false

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/training-workbook-control-centre
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Retrieve and apply reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5178920889'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/training-review-comment.txt
          sed -n '/PATCH_BASE64_BEGIN/,/PATCH_BASE64_END/p' /tmp/training-review-comment.txt | sed '1d;$d' | tr -d '\n\r\t ' | base64 --decode > /tmp/training-six-fixes.diff
          test -s /tmp/training-six-fixes.diff
          patch --batch --forward --fuzz=3 -p1 < /tmp/training-six-fixes.diff || true
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/amodb/apps/training/workbook_import.py')
          text = path.read_text(encoding='utf-8')
          old = '''    except Exception as exc:
                  work_db.rollback()
                  progress_db.rollback()
                  job = progress_db.get(TrainingWorkbookImportJob, job_id)
                  if job:
                      if str(exc) == "IMPORT_CANCELLED":
                          job.status = "CANCELLED"
                          job.stage = "CANCELLED"
                      else:
                          job.status = "FAILED"
                          job.stage = "FAILED"
                          job.error_message = str(exc)
                      job.completed_at = utcnow()
                      progress_db.add(job)
                      progress_db.commit()
          '''
          new = '''    except Exception as exc:
                  work_db.rollback()
                  progress_db.rollback()
                  job = progress_db.get(TrainingWorkbookImportJob, job_id)
                  if job:
                      if isinstance(exc, PersonnelIdentityChanged):
                          row = progress_db.get(TrainingWorkbookImportRow, exc.row_id)
                          if row:
                              row.status = "REVIEW"
                              row.decision = None
                              row.decision_required = True
                              row.issue_code = "IDENTITY_CHANGED"
                              row.issue_message = str(exc)
                              progress_db.add(row)
                          job.status = "REVIEW_REQUIRED"
                          job.stage = "REVIEW"
                          job.error_message = str(exc)
                      if str(exc) == "IMPORT_CANCELLED":
                          job.status = "CANCELLED"
                          job.stage = "CANCELLED"
                      elif not isinstance(exc, PersonnelIdentityChanged):
                          job.status = "FAILED"
                          job.stage = "FAILED"
                          job.error_message = str(exc)
                      job.completed_at = utcnow()
                      progress_db.add(job)
                      progress_db.commit()
          '''
          if 'IDENTITY_CHANGED' not in text:
              if old not in text:
                  raise SystemExit('Could not locate commit failure handler for reviewed identity-race fix.')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f backend/amodb/apps/training/workbook_import.py.rej
          rm -f .github/workflows/apply-training-review-fixes.yml
          rm -f .github/triggers/apply-training-review-fixes.txt
          rm -f .github/triggers/direct-training-review-fix.txt
          test "$(find . -name '*.rej' -print -quit)" = ""
          grep -q 'class PersonnelIdentityChanged' backend/amodb/apps/training/workbook_import.py
          grep -q '_materialize_mandatory_catalogue_requirements' backend/amodb/apps/training/workbook_import.py
          grep -q 'IDENTITY_CHANGED' backend/amodb/apps/training/workbook_import.py
          grep -q 'Retry reviewed import' frontend/src/components/training/TrainingWorkbookImportDialog.tsx
          git diff --check

      - name: Verify reviewed file set
        run: |
          set -euo pipefail
          expected=$'backend/amodb/apps/training/tests/test_workbook_import_mapping.py\nbackend/amodb/apps/training/workbook_import.py\ndocs/training/TRAINING_TRACKER_WORKBOOK_MAPPING.md\nfrontend/src/components/training/TrainingWorkbookImportDialog.tsx'
          actual="$(git diff --name-only | grep -v '^.github/' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected patch file set:'
            printf '%s\n' "$actual"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run focused backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: 'sqlite+pysqlite:///:memory:'
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: '1'
        run: |
          python -m py_compile backend/amodb/apps/training/workbook_import.py backend/amodb/apps/training/tests/test_workbook_import_mapping.py
          pytest -q backend/amodb/apps/training/tests/test_workbook_import_mapping.py

      - name: Validate Alembic revision graph
        env:
          PYTHONPATH: backend
          DATABASE_URL: 'postgresql+psycopg2://validation:validation@127.0.0.1:5432/validation'
          APP_ENV: test
        working-directory: backend
        run: alembic -c amodb/alembic.ini heads

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check CSS contracts
        working-directory: frontend
        run: npm run check:css

      - name: Commit and push PR fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address Training workbook reconciliation review'
          git push origin HEAD:agent/training-workbook-control-centre
          gh pr comment 422 --body "Applied all six Training workbook review fixes. Focused backend tests, Alembic graph validation, frontend production build, and CSS contract checks passed in workflow run ${GITHUB_RUN_ID}."

      - name: Remove temporary workflow from main
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/apply-pr422-training-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary PR 422 repair workflow'
          git push origin HEAD:main

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 422 --body "The automated application of the six Training review fixes failed in workflow run ${GITHUB_RUN_ID}. No reviewed product changes were pushed by this run."
