name: Portal Rostering CI

on:
  pull_request:
    paths:
      - "backend/amodb/apps/rostering/**"
      - "backend/amodb/apps/workforce/**"
      - "backend/amodb/apps/accounts/**"
      - "backend/amodb/apps/realtime/**"
      - "frontend/index.html"
      - "frontend/src/clipboardFeedback.ts"
      - "frontend/src/pages/rostering/**"
      - "frontend/tests/e2e/clipboard-feedback.spec.ts"
      - "frontend/src/pages/AdminUserNewPage.tsx"
      - "frontend/src/components/Layout/**"
      - "frontend/src/components/offline/**"
      - "frontend/src/components/realtime/**"
      - "frontend/src/components/shared/ModalTopLayerGuard*"
      - "frontend/src/components/QMS/QualityEnhancementsRouteGate.tsx"
      - "frontend/src/standalone/manuals-main.tsx"
      - "frontend/src/services/rostering.ts"
      - "frontend/src/services/workforce.ts"
      - "frontend/src/services/fleet.ts"
      - "frontend/src/services/maintenance.ts"
      - "frontend/src/services/workOrders.ts"
      - "frontend/src/services/typedApi.ts"
      - "frontend/src/services/apiClient.ts"
      - "frontend/src/services/crs.ts"
      - "frontend/src/services/offlineHttp.ts"
      - "frontend/src/services/offlinePersistence.ts"
      - "frontend/src/services/queryPersister.ts"
      - "frontend/src/styles/**"
      - "frontend/src/main.tsx"
      - "frontend/scripts/check-modal-layer.mjs"
      - "frontend/public/portal-sw.js"
      - "frontend/public/portal.webmanifest"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/scripts/**"
      - ".github/workflows/duty-rostering-ci.yml"
      - ".github/workflows/recheck-transient-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-rostering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies with bounded transient retries
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "rostering backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Verify Alembic graph without database configuration
        env:
          DATABASE_URL: ""
          DATABASE_WRITE_URL: ""
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("amodb/alembic.ini"))
          heads = script.get_heads()
          print("Alembic heads:", heads)
          assert len(heads) == len(set(heads)), heads
          assert script.get_revision("workforce_20260721_complete") is not None
          PY
      - name: Compile affected backend modules
        run: python -m compileall -q amodb/apps/accounts amodb/apps/realtime amodb/apps/workforce amodb/apps/rostering
      - name: Verify complete SQLAlchemy mapper startup
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          DATABASE_URL: sqlite+pysqlite:///:memory:
          DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
          SECRET_KEY: mapper-test-secret
        run: python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; configure_mappers(); print('All application mappers configured')"
      - name: Run account, workforce and rostering tests
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          DATABASE_URL: sqlite+pysqlite:///:memory:
          DATABASE_WRITE_URL: sqlite+pysqlite:///:memory:
          SECRET_KEY: mapper-test-secret
        run: pytest -q amodb/apps/accounts/tests amodb/apps/workforce/tests amodb/apps/rostering/tests

  calendar-feed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rostering_calendar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rostering_calendar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SECRET_KEY: rostering-calendar-postgres-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/rostering_calendar_ci
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/rostering_calendar_ci
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/rostering_calendar_ci
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies with bounded transient retries
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "calendar feed PostgreSQL dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Upgrade the PostgreSQL integration database
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Exercise the published personal calendar endpoint
        run: pytest -q amodb/apps/rostering/tests/test_calendar_feed_postgres.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies with bounded transient retries
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "rostering frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Typecheck and production build
        run: npm run build
      - name: Lint offline, theme and rostering implementation
        run: >-
          npm exec -- eslint
          src/main.tsx
          src/clipboardFeedback.ts
          src/components/QMS/QualityEnhancementsRouteGate.tsx
          src/components/shared/ModalTopLayerGuard.tsx
          src/components/offline
          src/pages/rostering
          src/standalone/manuals-main.tsx
          src/services/rostering.ts
          src/services/workforce.ts
          src/services/fleet.ts
          src/services/maintenance.ts
          src/services/workOrders.ts
          src/services/typedApi.ts
          src/services/apiClient.ts
          src/services/crs.ts
          src/services/offlineHttp.ts
          src/services/offlinePersistence.ts
          src/services/queryPersister.ts
      - name: Run rostering, modal layer and offline regression tests
        run: >-
          npm exec -- vitest run
          src/pages/rostering
          src/components/shared/ModalTopLayerGuard.test.ts
          src/services/offlineHttp.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run clipboard feedback browser regression
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/clipboard-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/clipboard-preview.log
              exit 1
            fi
            sleep 1
          done
          npm exec -- playwright test tests/e2e/clipboard-feedback.spec.ts --reporter=line
