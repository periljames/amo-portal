name: PR364 Synchronize Current Main

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  synchronize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rostering-automation-workforce-hr-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Merge current main without workflow-token rejection
        run: |
          git config user.name "amo-portal-actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          cp .github/workflows/release-candidate-recheck.yml .github/pr364-release-candidate-recheck.merged.yml
          git checkout HEAD -- .github/workflows/release-candidate-recheck.yml
          git add .
          git commit -m "Merge current main into PR364"
          git push origin HEAD:${{ github.head_ref }}
