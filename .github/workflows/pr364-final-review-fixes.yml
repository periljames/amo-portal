name: PR364 Final Review Fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rostering-automation-workforce-hr-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply final review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = Path("backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py")
          if marker.exists():
              print("PR364 final review fixes already applied")
              raise SystemExit(0)

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected source block not found in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          automation_path = "backend/amodb/apps/rostering/automation_service.py"
          replace_once(
              automation_path,
              '''    if previous_scheduled_at is not None:
                  previous = previous_scheduled_at.astimezone(zone)
                  if frequency == RosterAutomationFrequency.MONTHLY.value:
                      next_month = _add_months(previous.date().replace(day=1), 1)
                      candidate = datetime.combine(
                          date(next_month.year, next_month.month, run_day),
                          time(policy.run_hour_local, 0),
                          tzinfo=zone,
                      )
                      while candidate <= current:
                          next_month = _add_months(candidate.date().replace(day=1), 1)
                          candidate = datetime.combine(
                              date(next_month.year, next_month.month, run_day),
                              time(policy.run_hour_local, 0),
                              tzinfo=zone,
                          )
                  else:
                      cadence_days = 7 if frequency == RosterAutomationFrequency.WEEKLY.value else 14
                      candidate = datetime.combine(
                          previous.date() + timedelta(days=cadence_days),
                          time(policy.run_hour_local, 0),
                          tzinfo=zone,
                      )
                      while candidate <= current:
                          candidate = datetime.combine(
                              candidate.date() + timedelta(days=cadence_days),
                              time(policy.run_hour_local, 0),
                              tzinfo=zone,
                          )
                  return candidate.astimezone(timezone.utc)
          ''',
              '''    if previous_scheduled_at is not None:
                  previous = previous_scheduled_at.astimezone(zone)
                  if frequency == RosterAutomationFrequency.MONTHLY.value:
                      next_month = _add_months(previous.date().replace(day=1), 1)
                      candidate = datetime.combine(
                          date(next_month.year, next_month.month, run_day),
                          time(policy.run_hour_local, 0),
                          tzinfo=zone,
                      )
                  else:
                      cadence_days = 7 if frequency == RosterAutomationFrequency.WEEKLY.value else 14
                      candidate = datetime.combine(
                          previous.date() + timedelta(days=cadence_days),
                          time(policy.run_hour_local, 0),
                          tzinfo=zone,
                      )
                  # Advance exactly one recorded occurrence. If the resulting
                  # timestamp is still overdue, the next scheduler pass must
                  # process it and retain its own target period and run evidence.
                  return candidate.astimezone(timezone.utc)
          ''',
          )

          workforce_path = Path("backend/amodb/apps/workforce/services.py")
          workforce_text = workforce_path.read_text(encoding="utf-8")
          preview_start = workforce_text.index("def preview_patterns(")
          preview_prefix = workforce_text[:preview_start]
          preview_section = workforce_text[preview_start:]
          query_old = '''    query = db.query(models.EmployeeWorkPatternAssignment).options(
          '''
          query_new = '''    query = db.query(models.EmployeeWorkPatternAssignment).join(
                  models.WorkPattern,
                  models.EmployeeWorkPatternAssignment.work_pattern_id == models.WorkPattern.id,
              ).options(
          '''
          if query_old not in preview_section:
              raise RuntimeError("Pattern preview query anchor not found")
          preview_section = preview_section.replace(query_old, query_new, 1)
          filter_old = '''        models.EmployeeWorkPatternAssignment.amo_id == amo_id,
                  models.EmployeeWorkPatternAssignment.effective_from <= payload.to_date,
          '''
          filter_new = '''        models.EmployeeWorkPatternAssignment.amo_id == amo_id,
                  models.WorkPattern.amo_id == amo_id,
                  models.WorkPattern.is_active.is_(True),
                  models.EmployeeWorkPatternAssignment.effective_from <= payload.to_date,
          '''
          if filter_old not in preview_section:
              raise RuntimeError("Pattern activity filter anchor not found")
          preview_section = preview_section.replace(filter_old, filter_new, 1)
          workforce_path.write_text(preview_prefix + preview_section, encoding="utf-8")

          hr_path = "backend/amodb/apps/workforce/hr_service.py"
          replace_once(
              hr_path,
              '''    if row is None:
                  raise ValueError("Overtime request not found")
              stage = models.LeaveApprovalStage(payload.stage)
              decision = models.ApprovalDecision(payload.decision)
              expected = (
          ''',
              '''    if row is None:
                  raise ValueError("Overtime request not found")
              if str(actor_user_id) == str(row.user_id):
                  raise ValueError("Overtime requesters cannot approve their own claims")
              stage = models.LeaveApprovalStage(payload.stage)
              decision = models.ApprovalDecision(payload.decision)
              if stage == models.LeaveApprovalStage.SUPERVISOR:
                  work_date = row.starts_at.date()
                  contract = db.query(models.EmploymentContract).filter(
                      models.EmploymentContract.amo_id == amo_id,
                      models.EmploymentContract.user_id == row.user_id,
                      models.EmploymentContract.employment_status == models.EmploymentStatus.ACTIVE,
                      models.EmploymentContract.effective_from <= work_date,
                      or_(
                          models.EmploymentContract.effective_to.is_(None),
                          models.EmploymentContract.effective_to >= work_date,
                      ),
                  ).order_by(models.EmploymentContract.effective_from.desc()).first()
                  if contract is None or str(contract.supervisor_user_id or "") != str(actor_user_id):
                      raise ValueError("Only the assigned supervisor may decide the supervisor overtime stage")
              expected = (
          ''',
          )

          counts_helper = '''
          def _pending_queue_counts(db: Session, *, amo_id: str) -> dict[str, int]:
              """Return uncapped queue totals independently from dashboard samples."""

              pending_leave = int(db.query(func.count(models.LeaveRequest.id)).filter(
                  models.LeaveRequest.amo_id == amo_id,
                  models.LeaveRequest.status.in_([
                      models.LeaveRequestStatus.SUBMITTED,
                      models.LeaveRequestStatus.SUPERVISOR_APPROVED,
                  ]),
              ).scalar() or 0)
              pending_timesheet = int(db.query(func.count(models.Timesheet.id)).filter(
                  models.Timesheet.amo_id == amo_id,
                  models.Timesheet.status.in_([
                      models.TimesheetStatus.SUBMITTED,
                      models.TimesheetStatus.SUPERVISOR_APPROVED,
                  ]),
              ).scalar() or 0)
              pending_overtime = int(db.query(func.count(models.OvertimeRequest.id)).filter(
                  models.OvertimeRequest.amo_id == amo_id,
                  models.OvertimeRequest.status.in_([
                      models.OvertimeRequestStatus.SUBMITTED,
                      models.OvertimeRequestStatus.SUPERVISOR_APPROVED,
                  ]),
              ).scalar() or 0)
              attendance_exception = int(db.query(func.count(models.RosterActualVariance.id)).filter(
                  models.RosterActualVariance.amo_id == amo_id,
                  or_(
                      models.RosterActualVariance.classification != "MATCHED",
                      func.abs(models.RosterActualVariance.variance_minutes) >= 30,
                  ),
              ).scalar() or 0)
              return {
                  "leave": pending_leave,
                  "timesheet": pending_timesheet,
                  "overtime": pending_overtime,
                  "attendance_exception": attendance_exception,
              }


          '''
          replace_once(
              hr_path,
              '''def dashboard(
          ''',
              counts_helper + '''def dashboard(
          ''',
          )
          replace_once(
              hr_path,
              '''    without_pattern = [row for row in selected_contracts if row.user_id not in patterns]
              without_base = [row for row in selected_contracts if not row.primary_base_station_id]

              pending_leave_rows = db.query(models.LeaveRequest).options(
          ''',
              '''    without_pattern = [row for row in selected_contracts if row.user_id not in patterns]
              without_base = [row for row in selected_contracts if not row.primary_base_station_id]
              pending_counts = _pending_queue_counts(db, amo_id=amo_id)

              pending_leave_rows = db.query(models.LeaveRequest).options(
          ''',
          )
          replace_once(
              hr_path,
              '''        pending_leave_count=len(pending_leave_rows),
                  pending_timesheet_count=len(pending_timesheet_rows),
                  pending_overtime_count=len(pending_overtime_rows),
                  attendance_exception_count=len(attendance_exception_rows),
          ''',
              '''        pending_leave_count=pending_counts["leave"],
                  pending_timesheet_count=pending_counts["timesheet"],
                  pending_overtime_count=pending_counts["overtime"],
                  attendance_exception_count=pending_counts["attendance_exception"],
          ''',
          )

          Path("backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py").write_text(
              '''from datetime import datetime, timezone

          from amodb.apps.rostering import automation_service
          from amodb.apps.rostering.automation_models import (
              RosterAutomationFrequency,
              RosterGenerationPolicy,
          )


          def _policy(frequency: RosterAutomationFrequency, run_day: int) -> RosterGenerationPolicy:
              return RosterGenerationPolicy(
                  enabled=True,
                  frequency=frequency,
                  timezone_name="UTC",
                  run_day=run_day,
                  run_hour_local=9,
              )


          def test_monthly_overdue_schedule_advances_exactly_one_occurrence():
              previous = datetime(2026, 6, 15, 9, tzinfo=timezone.utc)
              current = datetime(2026, 8, 20, 12, tzinfo=timezone.utc)

              result = automation_service._next_run(
                  _policy(RosterAutomationFrequency.MONTHLY, 15),
                  now=current,
                  previous_scheduled_at=previous,
              )

              assert result == datetime(2026, 7, 15, 9, tzinfo=timezone.utc)
              assert result <= current


          def test_fortnightly_overdue_schedule_preserves_each_due_cycle():
              previous = datetime(2026, 6, 1, 9, tzinfo=timezone.utc)
              current = datetime(2026, 7, 20, 12, tzinfo=timezone.utc)

              result = automation_service._next_run(
                  _policy(RosterAutomationFrequency.FORTNIGHTLY, 1),
                  now=current,
                  previous_scheduled_at=previous,
              )

              assert result == datetime(2026, 6, 15, 9, tzinfo=timezone.utc)
              assert result <= current
          ''',
              encoding="utf-8",
          )

          Path("backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py").write_text(
              '''from datetime import date, datetime, timezone
          from types import SimpleNamespace
          from unittest.mock import MagicMock

          import pytest

          from amodb.apps.accounts import models as account_models
          from amodb.apps.workforce import hr_service, models, services


          def _query_returning(value):
              query = MagicMock()
              query.options.return_value = query
              query.filter.return_value = query
              query.with_for_update.return_value = query
              query.order_by.return_value = query
              query.first.return_value = value
              return query


          def _overtime_row(user_id: str = "employee-1"):
              return SimpleNamespace(
                  id="ot-1",
                  amo_id="amo-1",
                  user_id=user_id,
                  starts_at=datetime(2026, 7, 29, 17, tzinfo=timezone.utc),
                  status=models.OvertimeRequestStatus.SUBMITTED,
              )


          def _decision(stage: str = "SUPERVISOR"):
              return SimpleNamespace(stage=stage, decision="APPROVED", comment="Reviewed")


          def test_overtime_requester_cannot_self_approve():
              db = MagicMock()
              db.query.return_value = _query_returning(_overtime_row())

              with pytest.raises(ValueError, match="cannot approve their own"):
                  hr_service.decide_overtime(
                      db,
                      amo_id="amo-1",
                      actor_user_id="employee-1",
                      request_id="ot-1",
                      payload=_decision(),
                  )

              db.add.assert_not_called()


          def test_supervisor_stage_requires_assigned_supervisor():
              db = MagicMock()
              request_query = _query_returning(_overtime_row())
              contract = SimpleNamespace(supervisor_user_id="assigned-supervisor")
              contract_query = _query_returning(contract)
              db.query.side_effect = [request_query, contract_query]

              with pytest.raises(ValueError, match="assigned supervisor"):
                  hr_service.decide_overtime(
                      db,
                      amo_id="amo-1",
                      actor_user_id="different-manager",
                      request_id="ot-1",
                      payload=_decision(),
                  )

              db.add.assert_not_called()


          class _PatternQuery:
              def __init__(self, *, first_value=None):
                  self.first_value = first_value
                  self.criteria = []
                  self.joined = False

              def join(self, *args, **kwargs):
                  self.joined = True
                  return self

              def options(self, *args, **kwargs):
                  return self

              def filter(self, *criteria):
                  self.criteria.extend(criteria)
                  return self

              def order_by(self, *args, **kwargs):
                  return self

              def first(self):
                  return self.first_value

              def all(self):
                  return []


          def test_pattern_generation_query_excludes_inactive_patterns():
              amo_query = _PatternQuery(first_value=SimpleNamespace(time_zone="UTC"))
              assignment_query = _PatternQuery()
              db = MagicMock()

              def query(entity):
                  return amo_query if entity is account_models.AMO else assignment_query

              db.query.side_effect = query
              payload = SimpleNamespace(
                  from_date=date(2026, 8, 1),
                  to_date=date(2026, 8, 31),
                  user_ids=[],
                  roster_version_id=None,
              )

              response = services.preview_patterns(db, amo_id="amo-1", payload=payload)

              assert response.item_count == 0
              assert assignment_query.joined is True
              assert any("work_patterns.is_active" in str(item) for item in assignment_query.criteria)


          class _CountQuery:
              def __init__(self, value: int):
                  self.value = value

              def filter(self, *args, **kwargs):
                  return self

              def scalar(self):
                  return self.value


          def test_dashboard_pending_counts_are_uncapped():
              expected = {
                  "leave": 73,
                  "timesheet": 81,
                  "overtime": 64,
                  "attendance_exception": 92,
              }
              db = MagicMock()

              def query(expression):
                  rendered = str(expression)
                  if "leave_requests" in rendered:
                      return _CountQuery(expected["leave"])
                  if "timesheets" in rendered:
                      return _CountQuery(expected["timesheet"])
                  if "overtime_requests" in rendered:
                      return _CountQuery(expected["overtime"])
                  if "roster_actual_variances" in rendered:
                      return _CountQuery(expected["attendance_exception"])
                  raise AssertionError(rendered)

              db.query.side_effect = query

              assert hr_service._pending_queue_counts(db, amo_id="amo-1") == expected
          ''',
              encoding="utf-8",
          )
          PY
      - name: Compile corrected backend modules
        run: >-
          python -m compileall -q
          backend/amodb/apps/rostering/automation_service.py
          backend/amodb/apps/workforce/hr_service.py
          backend/amodb/apps/workforce/services.py
          backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py
          backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
      - name: Commit corrected implementation
        run: |
          if git diff --quiet -- backend/amodb; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "amo-portal-actions"
          git config user.email "actions@github.com"
          git add \
            backend/amodb/apps/rostering/automation_service.py \
            backend/amodb/apps/workforce/hr_service.py \
            backend/amodb/apps/workforce/services.py \
            backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py \
            backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
          git commit -m "Resolve final PR364 review blockers"
          git push origin HEAD:${{ github.head_ref }}
