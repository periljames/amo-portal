name: PR364 Codex Flags Fixer V2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 364 && github.actor == 'periljames'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rostering-automation-workforce-hr-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Preserve every overdue scheduled occurrence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/amodb/apps/rostering/automation_service.py')
          text = path.read_text(encoding='utf-8')
          old_monthly = '''            while candidate <= current:
                next_month = _add_months(candidate.date().replace(day=1), 1)
                candidate = datetime.combine(
                    date(next_month.year, next_month.month, run_day),
                    time(policy.run_hour_local, 0),
                    tzinfo=zone,
                )
'''
          old_submonthly = '''            while candidate <= current:
                candidate = datetime.combine(
                    candidate.date() + timedelta(days=cadence_days),
                    time(policy.run_hour_local, 0),
                    tzinfo=zone,
                )
'''
          if text.count(old_monthly) != 1 or text.count(old_submonthly) != 1:
              raise SystemExit('scheduled catch-up implementation drifted')
          path.write_text(text.replace(old_monthly, '', 1).replace(old_submonthly, '', 1), encoding='utf-8')

          tests = Path('backend/amodb/apps/rostering/tests/test_automation_policy_contract.py')
          source = tests.read_text(encoding='utf-8')
          if 'test_long_scheduler_outage_advances_only_one_occurrence_for_catch_up' not in source:
              source += '''


def test_long_scheduler_outage_advances_only_one_occurrence_for_catch_up():
    due = datetime(2026, 7, 13, 6, tzinfo=timezone.utc)
    executed = datetime(2026, 8, 20, 6, tzinfo=timezone.utc)
    fortnightly = automation_service._next_run(
        policy(frequency=RosterAutomationFrequency.FORTNIGHTLY, run_day=1, timezone_name="UTC"),
        now=executed,
        previous_scheduled_at=due,
    )
    monthly = automation_service._next_run(
        policy(frequency=RosterAutomationFrequency.MONTHLY, run_day=15, timezone_name="UTC"),
        now=executed,
        previous_scheduled_at=datetime(2026, 6, 15, 6, tzinfo=timezone.utc),
    )
    assert fortnightly == datetime(2026, 7, 27, 6, tzinfo=timezone.utc)
    assert monthly == datetime(2026, 7, 15, 6, tzinfo=timezone.utc)
'''
          tests.write_text(source, encoding='utf-8')
          PY
          git diff --check
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Run Rostering automation tests
        working-directory: backend
        run: pytest -q amodb/apps/rostering/tests/test_automation_policy_contract.py
      - name: Commit and push
        run: |
          git config user.name "amo-portal-actions"
          git config user.email "actions@users.noreply.github.com"
          git add backend/amodb/apps/rostering/automation_service.py backend/amodb/apps/rostering/tests/test_automation_policy_contract.py
          git commit -m "Preserve overdue roster automation catch-up cycles"
          git push origin HEAD:agent/rostering-automation-workforce-hr-overhaul
