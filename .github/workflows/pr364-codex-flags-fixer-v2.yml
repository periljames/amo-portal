name: PR364 Codex Flags Fixer V2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 364 && github.actor == 'periljames'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rostering-automation-workforce-hr-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply reviewed fixes from the validated patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr364-codex-flags-fixer.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          block = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          exec(compile(script, 'pr364-codex-fixes.py', 'exec'), {})

          test_path = Path('backend/amodb/apps/rostering/tests/test_automation_policy_contract.py')
          source = test_path.read_text(encoding='utf-8')
          old = '    assert source.count("policy.next_run_at") == 1\n'
          new = '    assert "scheduled_occurrence = policy.next_run_at" in source\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected obsolete assertion once, found {source.count(old)}')
          test_path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Run focused backend tests
        working-directory: backend
        run: pytest -q amodb/apps/rostering/tests/test_automation_policy_contract.py amodb/apps/workforce/tests/test_hr_review_flags.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run focused frontend tests, lint and build
        working-directory: frontend
        run: |
          npm exec -- vitest run src/pages/rostering/rosteringSetupOverhaul.test.ts
          npm exec -- eslint src/pages/rostering/components/RosterShell.tsx src/pages/rostering/components/RosteringSetupWorkspace.tsx src/pages/rostering/components/WorkforceHrWorkspace.tsx src/services/workforceHr.ts src/types/workforceHr.ts tests/e2e/rostering-role-access.spec.ts
          npm run build
      - name: Commit and push reviewed fixes
        shell: bash
        run: |
          git config user.name "amo-portal-actions"
          git config user.email "actions@users.noreply.github.com"
          git add backend/amodb/apps/rostering/automation_service.py \
            backend/amodb/apps/rostering/tests/test_automation_policy_contract.py \
            backend/amodb/jobs/rostering_automation.py \
            backend/amodb/apps/workforce/permissions.py \
            backend/amodb/apps/workforce/hr_schemas.py \
            backend/amodb/apps/workforce/hr_service.py \
            backend/amodb/apps/workforce/hr_router.py \
            backend/amodb/apps/workforce/tests/test_hr_review_flags.py \
            frontend/src/pages/rostering/components/RosteringSetupWorkspace.tsx \
            frontend/src/pages/rostering/components/WorkforceHrWorkspace.tsx \
            frontend/src/pages/rostering/rosteringSetupOverhaul.test.ts \
            frontend/src/services/workforceHr.ts \
            frontend/src/types/workforceHr.ts \
            frontend/tests/e2e/rostering-role-access.spec.ts
          git commit -m "Resolve all open PR364 Codex review flags"
          git push origin HEAD:agent/rostering-automation-workforce-hr-overhaul
