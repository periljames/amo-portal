name: Aircraft Daily Fixture Diagnostic

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - .github/workflows/aircraft-daily-fixture-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0
      - name: Merge current main and reconstruct reviewed bundle
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main
          git merge --no-edit origin/main
          cat .github/transfer/daily-hardening.bin00 \
              .github/transfer/daily-hardening.bin01 \
              .github/transfer/daily-hardening.bin02 \
              .github/transfer/daily-hardening.bin03 \
              .github/transfer/daily-hardening.bin04 > /tmp/daily_hardening_bundle.tgz
          echo "d5ae046e553ad117bbe9d8d3f04864f5edf59fb72ba4b3c1fe1dd78b09bee3dd  /tmp/daily_hardening_bundle.tgz" | sha256sum --check --strict
          tar -xzf /tmp/daily_hardening_bundle.tgz -C .
      - name: Print daily utilisation test bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path("backend/amodb/apps/aircraft_architecture/daily_utilisation/tests/test_database_contract.py"),
              Path("backend/amodb/apps/aircraft_architecture/daily_utilisation/tests/test_posting_integration.py"),
              Path("backend/amodb/apps/aircraft_architecture/daily_utilisation/__init__.py"),
          )
          for path in paths:
              lines = path.read_text().splitlines()
              print(f"=== {path} ===")
              ranges = [(0, min(len(lines), 55))]
              if path.name == "test_posting_integration.py":
                  ranges.extend(((140, min(len(lines), 190)), (250, min(len(lines), 305)))
              for start, end in ranges:
                  print(f"--- lines {start + 1}-{end} ---")
                  for index in range(start, end):
                      print(f"{index + 1}: {lines[index]}")
          PY
