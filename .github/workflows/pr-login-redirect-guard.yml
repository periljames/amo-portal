name: PR Login Redirect Guard

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/platform-session-hydration-and-schema-warning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/platform-session-hydration-and-schema-warning
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply login redirect guard
        run: python .github/scripts/apply_login_redirect_guard.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate redirect behavior and frontend
        working-directory: frontend
        run: |
          npx eslint src/pages/LoginPage.tsx src/app/loginRedirect.ts src/app/loginRedirect.test.ts src/pages/platform/components/PlatformShared.tsx src/services/platformControl.test.ts
          npx vitest run src/app/loginRedirect.test.ts src/services/platformControl.test.ts
          npm run build
      - name: Commit product changes
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add frontend/src/pages/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No LoginPage change required."
            exit 0
          fi
          git commit -m "Enforce account-aware post-login redirects"
          git push origin HEAD:fix/platform-session-hydration-and-schema-warning
