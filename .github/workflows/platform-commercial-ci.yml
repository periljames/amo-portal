name: Platform Commercial CI

on:
  push:
    branches:
      - agent/platform-commercial-scale-hardening
  pull_request:
    paths:
      - "backend/amodb/alembic/versions/commercial_*"
      - "backend/amodb/apps/accounts/billing_*.py"
      - "backend/amodb/apps/accounts/router_billing.py"
      - "backend/amodb/apps/platform/commercial_*.py"
      - "backend/amodb/apps/platform/module_*.py"
      - "backend/amodb/apps/platform/saas_providers.py"
      - "backend/amodb/apps/platform/saas_webhooks.py"
      - "backend/amodb/apps/platform/tests/test_billing_privacy.py"
      - "backend/amodb/apps/platform/tests/test_commercial_control_plane.py"
      - "backend/amodb/apps/platform/tests/test_module_*.py"
      - "backend/amodb/apps/doc_control/router.py"
      - "backend/amodb/apps/finance/router.py"
      - "backend/amodb/apps/inventory/router.py"
      - "backend/amodb/entitlements.py"
      - "backend/amodb/jobs/billing_maintenance.py"
      - "backend/amodb/jobs/saas_worker_safe.py"
      - "frontend/src/app/PortalRouteSurface.tsx"
      - "frontend/src/pages/SubscriptionManagementPage.tsx"
      - "frontend/src/pages/platform/PlatformBillingPage.tsx"
      - "frontend/src/services/commercialControl.ts"
      - "frontend/src/services/moduleCommerce.ts"
      - ".github/workflows/platform-commercial-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-commercial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-commercial:
    name: Backend commercial contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_commercial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_commercial_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: platform-commercial-ci-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_commercial_ci
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_commercial_ci
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_commercial_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile reconciled commercial backend
        working-directory: backend
        run: >-
          python -m compileall -q
          amodb/apps/accounts/billing_access.py
          amodb/apps/accounts/billing_auth.py
          amodb/apps/accounts/billing_lifecycle.py
          amodb/apps/accounts/router_billing.py
          amodb/apps/platform/commercial_accounting.py
          amodb/apps/platform/commercial_fiscal_document_policy.py
          amodb/apps/platform/commercial_integrations.py
          amodb/apps/platform/commercial_invoice_policy.py
          amodb/apps/platform/commercial_policy.py
          amodb/apps/platform/commercial_router.py
          amodb/apps/platform/commercial_services.py
          amodb/apps/platform/module_access_router.py
          amodb/apps/platform/module_commerce.py
          amodb/apps/platform/module_commerce_router.py
          amodb/apps/platform/module_payment_status_router.py
          amodb/apps/platform/module_renewals.py
          amodb/apps/platform/module_subscription_router.py
          amodb/entitlements.py
          amodb/jobs/billing_maintenance.py
          amodb/jobs/saas_worker_safe.py
      - name: Upgrade disposable PostgreSQL schema
        working-directory: backend
        run: |
          python -m alembic -c amodb/alembic.ini upgrade heads
          python -m alembic -c amodb/alembic.ini current
      - name: Commercial control-plane contracts
        working-directory: backend
        run: pytest -q amodb/apps/platform/tests/test_commercial_control_plane.py
      - name: Module commerce security contracts
        working-directory: backend
        run: pytest -q amodb/apps/platform/tests/test_module_commerce_security.py
      - name: Billing privacy contracts
        working-directory: backend
        run: pytest -q amodb/apps/platform/tests/test_billing_privacy.py
      - name: Module access-scope contracts
        working-directory: backend
        run: pytest -q amodb/apps/platform/tests/test_module_access_scope.py
      - name: Tenant offer security contracts
        working-directory: backend
        run: pytest -q amodb/apps/platform/tests/test_module_offer_security.py
      - name: Module product-boundary contracts
        working-directory: backend
        run: pytest -q amodb/apps/platform/tests/test_module_product_boundaries.py

  frontend-commercial:
    name: Frontend commercial contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run platform frontend contracts
        working-directory: frontend
        run: npm run test:platform
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
