name: Training workbook final validation

on:
  push:
    branches:
      - agent/training-workbook-control-centre

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply final integration patch
        run: python .github/scripts/finalize_training_workbook_control_centre.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run focused workbook tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/amodb/apps/training/tests/test_workbook_import_mapping.py

      - name: Confirm Alembic revision graph
        working-directory: backend
        run: alembic -c amodb/alembic.ini heads

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check CSS contracts
        working-directory: frontend
        run: npm run check:css

      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/training-workbook-final-validation.yml
          rm -f .github/scripts/finalize_training_workbook_control_centre.py

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Training workbook integration and cache refresh"
          git push origin HEAD
