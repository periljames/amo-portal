name: PR357 TypeScript Diagnostic

on:
  push:
    branches:
      - agent/rostering-pr357-ts-diagnostic
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Capture TypeScript build output
        id: build
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run build > ../pr357-typescript-diagnostic.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v6
        with:
          name: pr357-typescript-diagnostic
          path: pr357-typescript-diagnostic.log
          if-no-files-found: error
          retention-days: 2
      - name: Enforce build result
        if: steps.build.outputs.status != '0'
        run: exit 1
