name: Finalize Aircraft Architecture U2

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".phase/aircraft-architecture-u2.tar.gz"
      - ".github/workflows/aircraft-architecture-u2-finalize.yml"

permissions:
  contents: write

jobs:
  finalize-u2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      SECRET_KEY: aircraft-architecture-u2-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Extract and verify reviewed U2 source
        run: |
          tar -xzf .phase/aircraft-architecture-u2.tar.gz
          sha256sum --check U2_MANIFEST.sha256
          rm U2_MANIFEST.sha256
      - name: Wire architecture API once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/amodb/main.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from .apps.fleet.router import router as fleet_router\n'
          include_anchor = 'app.include_router(fleet_router)\n'
          import_line = 'from .apps.aircraft_architecture.router import router as aircraft_architecture_router\n'
          include_line = 'app.include_router(aircraft_architecture_router)\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Unexpected fleet-router import anchor count')
              text = text.replace(import_anchor, import_anchor + import_line)
          if include_line not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit('Unexpected fleet-router include anchor count')
              text = text.replace(include_anchor, include_anchor + include_line)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile U2 source
        run: |
          python -m compileall -q backend/amodb/apps/aircraft_architecture
          python -m py_compile backend/amodb/main.py backend/amodb/alembic/versions/aircraft_arch_20260805_u2_effectivity.py
      - name: Run U2 focused tests
        run: pytest -q backend/amodb/apps/aircraft_architecture/effectivity
      - name: Verify one Alembic head and clean upgrade
        run: |
          output=$(alembic -c backend/amodb/alembic.ini heads)
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '(head)')" -eq 1
          alembic -c backend/amodb/alembic.ini upgrade head
      - name: Import application and initialize mappers
        run: python -c "import amodb.main; from sqlalchemy.orm import configure_mappers; configure_mappers()"
      - name: Commit verified U2 source
        run: |
          rm -f .phase/aircraft-architecture-u2.tar.gz
          rm -f .github/workflows/aircraft-architecture-u2-finalize.yml
          rm -f .github/workflows/aircraft-architecture-u2-apply.yml
          rm -f .github/workflows/aircraft-architecture-u2-retry.yml
          rm -f .github/workflows/aircraft-architecture-u2-verified-apply.yml
          rmdir .phase 2>/dev/null || true
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Phase U2: add explainable effectivity engine"
          git push origin HEAD:agent/aircraft-induction-architecture
