name: Complete Daily Utilisation Hardening

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-daily-hardening-debug.yml"
      - ".github/transfer/daily-hardening.bin*"
      - ".github/transfer/apply_daily_hardening_patch.py"

permissions:
  contents: write

jobs:
  merge-validate-publish:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: daily-utilisation-hardening-ci-secret
      JWT_SECRET_KEY: daily-utilisation-hardening-jwt-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      DATABASE_WRITE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      POSTGRES_INTEGRATION_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0

      - name: Merge current main without publishing
        run: |
          set -euo pipefail
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Reconstruct and verify reviewed hardening bundle
        run: |
          set -euo pipefail
          cat .github/transfer/daily-hardening.bin00 \
              .github/transfer/daily-hardening.bin01 \
              .github/transfer/daily-hardening.bin02 \
              .github/transfer/daily-hardening.bin03 \
              .github/transfer/daily-hardening.bin04 > /tmp/daily_hardening_bundle.tgz
          echo "d5ae046e553ad117bbe9d8d3f04864f5edf59fb72ba4b3c1fe1dd78b09bee3dd  /tmp/daily_hardening_bundle.tgz" | sha256sum --check --strict
          tar -xzf /tmp/daily_hardening_bundle.tgz -C .

      - name: Apply reviewed PostgreSQL and CI corrections
        run: python .github/transfer/apply_daily_hardening_patch.py

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile hardened aircraft architecture
        run: python -m compileall -q backend/amodb/apps/aircraft_architecture

      - name: Verify one merged Alembic head
        run: |
          output=$(python -m alembic -c backend/amodb/alembic.ini heads)
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | grep -c '(head)')" -eq 1
          printf '%s\n' "$output" | grep -q 'aircraft_arch_20260805_daily_hardening'

      - name: Upgrade a clean PostgreSQL database
        run: python -m alembic -c backend/amodb/alembic.ini upgrade head

      - name: Import the complete application and initialize mappers
        run: |
          python - <<'PY'
          import amodb.main  # noqa: F401
          from sqlalchemy.orm import configure_mappers
          configure_mappers()
          print("application import and mapper configuration passed")
          PY

      - name: Run aircraft architecture unit and PostgreSQL integration tests
        run: pytest -q backend/amodb/apps/aircraft_architecture

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run daily utilisation frontend contracts
        working-directory: frontend
        run: npm exec -- vitest run src/services/dailyUtilisation.test.ts

      - name: Run tenant-shell contracts
        working-directory: frontend
        run: npm run test:tenant-shell

      - name: Lint the daily utilisation frontend
        working-directory: frontend
        run: npm exec -- eslint src/pages/planning/DailyAircraftUtilisationPage.tsx src/services/dailyUtilisation.ts src/services/dailyUtilisation.test.ts

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build

      - name: Publish only the validated source
        run: |
          set -euo pipefail
          rm -rf .github/transfer
          rm -f .github/workflows/aircraft-daily-hardening-apply.yml
          rm -f .github/workflows/aircraft-daily-hardening-debug.yml
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "Harden manual daily utilisation end to end"
          git push origin HEAD:agent/aircraft-induction-architecture
