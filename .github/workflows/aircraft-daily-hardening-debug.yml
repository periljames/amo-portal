name: Debug Daily Utilisation Integration

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-daily-hardening-debug.yml"

permissions:
  contents: read

jobs:
  capture-traceback:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: daily-utilisation-debug-secret
      JWT_SECRET_KEY: daily-utilisation-debug-jwt-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      DATABASE_WRITE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      WRITE_DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0

      - name: Merge current main without publishing
        run: |
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Reconstruct reviewed hardening bundle
        run: |
          cat .github/transfer/daily-hardening.bin00 \
              .github/transfer/daily-hardening.bin01 \
              .github/transfer/daily-hardening.bin02 \
              .github/transfer/daily-hardening.bin03 \
              .github/transfer/daily-hardening.bin04 > /tmp/daily_hardening_bundle.tgz
          echo "d5ae046e553ad117bbe9d8d3f04864f5edf59fb72ba4b3c1fe1dd78b09bee3dd  /tmp/daily_hardening_bundle.tgz" | sha256sum --check --strict
          tar -xzf /tmp/daily_hardening_bundle.tgz -C .

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies quietly
        run: python -m pip install -q -r backend/requirements.txt

      - name: Upgrade clean PostgreSQL schema
        run: python -m alembic -c backend/amodb/alembic.ini upgrade head

      - name: Capture first full integration traceback
        id: pytest_trace
        continue-on-error: true
        run: |
          pytest -vv -x --tb=long \
            backend/amodb/apps/aircraft_architecture/daily_utilisation/tests/test_posting_integration.py \
            > /tmp/daily-integration-pytest.log 2>&1

      - name: Upload traceback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-integration-pytest-log
          path: /tmp/daily-integration-pytest.log
          if-no-files-found: error
          retention-days: 1

      - name: Print concise traceback and preserve failure
        if: steps.pytest_trace.outcome == 'failure'
        run: |
          tail -n 240 /tmp/daily-integration-pytest.log
          exit 1
