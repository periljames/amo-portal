name: Reliability Push Probe

on:
  push:
    branches:
      - agent/reliability-v2-foundation
    paths:
      - docs/reliability/.canonical-rebuild-trigger

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0
      - name: Record push execution
        run: |
          mkdir -p docs/reliability
          printf 'run=%s\nsha=%s\ntime=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/reliability/.push-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reliability/.push-probe
          git commit -m "Record Reliability push workflow execution"
          git push origin HEAD:agent/reliability-v2-foundation
