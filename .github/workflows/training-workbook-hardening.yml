name: Training workbook hardening

on:
  push:
    branches:
      - agent/training-workbook-control-centre

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply backend and frontend hardening
        run: python .github/scripts/harden_training_workbook_control_centre.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run CSS contract check
        working-directory: frontend
        run: npm run check:css

      - name: Remove one-shot validation files
        run: |
          rm -f .github/workflows/training-workbook-hardening.yml
          rm -f .github/scripts/harden_training_workbook_control_centre.py

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Training workbook dependency and access workflows"
          git push origin HEAD
