name: PR 422 Final Validation

"on":
  push:
    branches:
      - agent/training-workbook-control-centre
    paths:
      - .github/workflows/pr422-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr422-final-validation
  cancel-in-progress: false

jobs:
  backend-and-schema:
    name: Backend, Training, Accounts, and Schema
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_pr422_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_pr422_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: pr422-final-validation-secret
      PLATFORM_SECRETS_KEY: 5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_pr422_validation
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_pr422_validation
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_pr422_validation
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/training-workbook-control-centre
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Compile backend and configure mappers
        working-directory: backend
        run: |
          python -m compileall -q amodb
          python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; import amodb.quality_main; configure_mappers(); print('All application mappers configured')"

      - name: Validate Alembic graph and clean PostgreSQL upgrade
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("amodb/alembic.ini"))
          heads = script.get_heads()
          assert heads and len(heads) == len(set(heads)), heads
          print("Alembic heads:", heads)
          PY
          alembic -c amodb/alembic.ini upgrade heads

      - name: Run Training workbook tests
        working-directory: backend
        run: pytest -q amodb/apps/training/tests/test_workbook_import_mapping.py

      - name: Run Accounts regressions
        working-directory: backend
        run: pytest -q amodb/apps/accounts/tests

  frontend:
    name: Frontend Build and CSS Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/training-workbook-control-centre
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Check CSS contracts
        working-directory: frontend
        run: npm run check:css

  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/training-workbook-control-centre
          fetch-depth: 0

      - name: Reject generated and repair artifacts
        run: |
          set -euo pipefail
          test ! -e scripts/pr422_pass1.py
          test ! -e scripts/pr422_pass2.py
          test ! -e scripts/pr422_pass3.py
          test ! -e scripts/pr422_pass4.py
          test ! -e .github/workflows/pr422-final-hardening.yml
          test "$(find . -type f \( -name '*.pyc' -o -name '*.orig' -o -name '*.rej' \) -print -quit)" = ""
          git diff --check origin/main...HEAD
