name: Diagnose Reliability Backend and Migration

on:
  push:
    branches:
      - agent/reliability-v2-foundation
    paths:
      - docs/reliability/.backend-diagnostic-trigger

permissions:
  contents: write

jobs:
  backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_rel_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_rel_backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_rel_backend
      WRITE_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amo_rel_backend
      SECRET_KEY: reliability-backend-diagnostic
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run backend diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/rel-backend
          declare -A C
          run() { local n="$1"; shift; "$@" >"/tmp/rel-backend/$n.log" 2>&1; C[$n]=$?; echo "$n=${C[$n]}"; }
          run patch bash -lc 'python backend/scripts/complete_reliability_backend.py && python backend/scripts/strengthen_reliability_sod.py && python backend/scripts/fix_reliability_sod_escape.py'
          run envfix python - <<'PY'
          from pathlib import Path
          path = Path('backend/amodb/alembic/env.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    table = getattr(obj, "table", None) or getattr(compare_to, "table", None)\n    return table is not None and table.name in _RELIABILITY_TABLES',
              '    table = getattr(obj, "table", None)\n    if table is None:\n        table = getattr(compare_to, "table", None)\n    return table is not None and table.name in _RELIABILITY_TABLES',
          )
          path.write_text(text, encoding='utf-8')
          PY
          run pip pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
          run compile bash -lc 'python -m py_compile backend/amodb/apps/reliability/*.py backend/amodb/apps/reliability/tests/test_complete_scope.py backend/amodb/main.py backend/amodb/alembic/env.py'
          run baseline bash -lc 'cd backend && alembic -c amodb/alembic.ini upgrade heads'
          cat > /tmp/rel-backend/generate.sh <<'SH'
          #!/usr/bin/env bash
          set -e
          cd backend
          mapfile -t HEADS < <(alembic -c amodb/alembic.ini heads | awk '{print $1}')
          if [ "${#HEADS[@]}" -gt 1 ]; then
            alembic -c amodb/alembic.ini merge --rev-id rel_20260803_merge_heads_backend -m "merge heads before complete Reliability scope" "${HEADS[@]}"
            alembic -c amodb/alembic.ini upgrade head
          fi
          RELIABILITY_AUTOGENERATE_ONLY=true alembic -c amodb/alembic.ini revision --autogenerate --rev-id rel_20260803_complete_scope -m "complete Reliability full stack scope"
          python scripts/finalize_reliability_migration.py
          python -m py_compile amodb/alembic/versions/*rel_20260803_complete_scope*.py
          SH
          chmod +x /tmp/rel-backend/generate.sh
          run generate /tmp/rel-backend/generate.sh
          run upgrade bash -lc 'cd backend && RELIABILITY_AUTOGENERATE_ONLY=true alembic -c amodb/alembic.ini upgrade head'
          run check bash -lc 'cd backend && RELIABILITY_AUTOGENERATE_ONLY=true alembic -c amodb/alembic.ini check'
          run governance python - <<'PY'
          import os
          import psycopg2
          from urllib.parse import urlparse
          url = os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://')
          parsed = urlparse(url)
          conn = psycopg2.connect(host=parsed.hostname, port=parsed.port, dbname=parsed.path.lstrip('/'), user=parsed.username, password=parsed.password)
          cur = conn.cursor()
          cur.execute("SELECT count(*) FROM auth_capability_definitions WHERE module='reliability'")
          assert cur.fetchone()[0] == 21
          cur.execute("SELECT count(*) FROM auth_role_definitions WHERE code LIKE 'RELIABILITY_%'")
          assert cur.fetchone()[0] == 4
          cur.execute("SELECT count(*) FROM pg_trigger WHERE tgname LIKE 'trg_reliability_%_append_only' AND NOT tgisinternal")
          assert cur.fetchone()[0] == 4
          cur.close(); conn.close()
          PY
          run import bash -lc 'cd backend && python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; configure_mappers(); paths={route.path for route in amodb.main.app.routes}; assert \"/reliability/compliance\" in paths; assert \"/reliability/analytics\" in paths; assert all(\"/reliability/v2\" not in path for path in paths); print(len(paths))"'
          run tests bash -lc 'cd backend && pytest -q amodb/apps/reliability/tests'
          run downgrade bash -lc 'cd backend && alembic -c amodb/alembic.ini downgrade -1'
          run reupgrade bash -lc 'cd backend && alembic -c amodb/alembic.ini upgrade head'
          run recheck bash -lc 'cd backend && RELIABILITY_AUTOGENERATE_ONLY=true alembic -c amodb/alembic.ini check'
          {
            echo '# Reliability Backend and Migration Diagnostic'
            echo
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo
            echo '| Stage | Exit |'
            echo '|---|---:|'
            for n in patch envfix pip compile baseline generate upgrade check governance import tests downgrade reupgrade recheck; do echo "| $n | ${C[$n]:-999} |"; done
            for n in patch envfix compile baseline generate upgrade check governance import tests downgrade reupgrade recheck; do echo; echo "## $n"; echo '```text'; tail -n 140 "/tmp/rel-backend/$n.log"; echo '```'; done
          } > docs/reliability/BACKEND_MIGRATION_DIAGNOSTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reliability/BACKEND_MIGRATION_DIAGNOSTIC.md
          git commit -m "Record Reliability backend migration diagnostic"
          git push origin HEAD:agent/reliability-v2-foundation
