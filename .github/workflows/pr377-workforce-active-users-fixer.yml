name: PR377 Workforce Active Users Fixer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 377 && github.head_ref == 'fix/workforce-active-users-default-day'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workforce-active-users-default-day
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply active-user register and default-day correction
        run: |
          python .github/scripts/fix_workforce_active_users_default_day.py
          python .github/scripts/fix_workforce_active_users_followup.py
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Validate backend correction
        working-directory: backend
        run: |
          python -m compileall -q amodb/apps/workforce amodb/apps/rostering
          pytest -q amodb/apps/workforce/tests/test_hr_review_flags.py amodb/apps/workforce/tests amodb/apps/rostering/tests/test_route_contracts.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Validate frontend correction
        working-directory: frontend
        run: |
          npm exec -- vitest run src/pages/rostering/rosteringSetupOverhaul.test.ts
          npm exec -- eslint src/pages/rostering/components/WorkforceHrWorkspace.tsx src/services/workforceHr.ts src/types/workforceHr.ts
          npm run build
      - name: Remove one-shot correction machinery
        run: |
          rm -f .github/scripts/fix_workforce_active_users_default_day.py
          rm -f .github/scripts/fix_workforce_active_users_followup.py
          rm -f .github/workflows/pr377-workforce-active-users-fixer.yml
      - name: Commit and push validated correction
        run: |
          git config user.name 'periljames'
          git config user.email '244658594+periljames@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Populate Workforce from active users and add default day baseline'
          git push origin HEAD:fix/workforce-active-users-default-day
