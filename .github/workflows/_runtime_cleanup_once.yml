name: One-time runtime compatibility deletion

on:
  push:
    branches: [agent/platform-commercial-scale-hardening]
    paths:
      - ".github/workflows/_runtime_cleanup_once.yml"
      - "ops/cleanup_runtime_once.py"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/platform-commercial-scale-hardening
          fetch-depth: 0
      - name: Apply runtime compatibility cleanup
        run: python ops/cleanup_runtime_once.py
      - name: Compile backend and verify whitespace
        run: |
          python -m compileall -q backend/amodb
          git diff --check
      - name: Commit and push source cleanup
        run: |
          git config user.name "amo-portal-ci"
          git config user.email "amo-portal-ci@users.noreply.github.com"
          git add backend frontend
          git diff --cached --check
          git commit -m "refactor(runtime): delete migrated aliases and compatibility routes"
          git push origin HEAD:agent/platform-commercial-scale-hardening
