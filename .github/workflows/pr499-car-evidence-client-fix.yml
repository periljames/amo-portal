name: PR499 CAR Evidence Client Fix

on:
  push:
    branches: [agent/qms-car-control-loop]
    paths:
      - .github/workflows/pr499-car-evidence-client-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/qms-car-control-loop
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Route CAR workspace evidence through governed client
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/pages/qms/QmsCarControlOperations.tsx")
          source = path.read_text(encoding="utf-8")
          old = '} from "../../services/qms";'
          new = '} from "../../services/qmsCarControlEvidence";'
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one QMS import block, found {source.count(old)}")
              source = source.replace(old, new, 1)
          required = [
              'qmsDeleteCarAttachment,',
              'qmsDownloadCarAttachmentBlob,',
              'qmsListCarAttachments,',
              'qmsUploadCarAttachment,',
              '} from "../../services/qmsCarControlEvidence";',
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit(f"Governed evidence import incomplete: {missing}")
          path.write_text(source, encoding="utf-8")
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Lint and build
        working-directory: frontend
        run: |
          npm exec -- eslint src/pages/qms/QmsCarControlOperations.tsx src/services/qmsCarControlEvidence.ts
          npm run build
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/pr499-car-evidence-client-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/qms/QmsCarControlOperations.tsx .github/workflows/pr499-car-evidence-client-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(quality): route CAR workspace evidence through governed client"
          git push origin HEAD:agent/qms-car-control-loop
