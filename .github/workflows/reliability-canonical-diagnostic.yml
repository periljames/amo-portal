name: Diagnose Canonical Reliability Rebuild

on:
  push:
    branches:
      - agent/reliability-v2-foundation
    paths:
      - docs/reliability/.canonical-rebuild-trigger

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run full diagnostic and record outcomes
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/reliability-diagnostic docs/reliability backend/scripts frontend/src/pages/reliability frontend/src/services frontend/src/styles
          git fetch origin agent/reliability-v2-backup:refs/remotes/origin/agent/reliability-v2-backup > /tmp/reliability-diagnostic/fetch.log 2>&1
          FETCH_RC=$?
          if [ "$FETCH_RC" -eq 0 ]; then
            git show origin/agent/reliability-v2-backup:backend/scripts/canonicalise_reliability_module.py > backend/scripts/canonicalise_reliability_module.py
            git show origin/agent/reliability-v2-backup:docs/reliability/RELIABILITY_MODULE_V2_TARGET_DESIGN.md > docs/reliability/RELIABILITY_MODULE_V2_TARGET_DESIGN.md
            git show origin/agent/reliability-v2-backup:docs/reliability/RELIABILITY_V2_IMPLEMENTATION_TRACKER.md > docs/reliability/RELIABILITY_V2_IMPLEMENTATION_TRACKER.md
            git show origin/agent/reliability-v2-backup:frontend/src/pages/reliability/ReliabilityWorkspacePage.tsx > frontend/src/pages/reliability/ReliabilityWorkspacePage.tsx
            git show origin/agent/reliability-v2-backup:frontend/src/services/reliabilityV2.ts > frontend/src/services/reliabilityV2.ts
            git show origin/agent/reliability-v2-backup:frontend/src/styles/reliability-v2.css > frontend/src/styles/reliability-v2.css
          fi
          python - <<'PY' > /tmp/reliability-diagnostic/prepare.log 2>&1
          from pathlib import Path
          path = Path('backend/scripts/canonicalise_reliability_module.py')
          text = path.read_text(encoding='utf-8')
          needle = '    text = text.replace("current_user.amo_id", "_amo_id(current_user)")\n'
          replacement = needle + '    text = text.replace("amo_id = _amo_id(current_user)\\n    if not amo_id:", "amo_id = current_user.effective_amo_id\\n    if not amo_id:")\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('Tenant replacement anchor not found')
              text = text.replace(needle, replacement, 1)
          text = text.replace('"/events/{event_id}"', '"/events/{event_id:int}"')
          text = text.replace('"/alerts/{alert_id}"', '"/alerts/{alert_id:int}"')
          text = text.replace('"/fracas/cases/{case_id}"', '"/fracas/cases/{case_id:int}"')
          text = text.replace('"/fracas/cases/{case_id}/actions"', '"/fracas/cases/{case_id:int}/actions"')
          path.write_text(text, encoding='utf-8')
          PY
          PREPARE_RC=$?
          python backend/scripts/canonicalise_reliability_module.py > /tmp/reliability-diagnostic/canonicalize.log 2>&1
          CANON_RC=$?
          python backend/scripts/finalize_reliability_rebuild.py > /tmp/reliability-diagnostic/finalize.log 2>&1
          FINALIZE_RC=$?
          python -m py_compile backend/amodb/apps/reliability/router.py backend/amodb/apps/reliability/schemas.py backend/amodb/apps/reliability/services.py backend/amodb/apps/reliability/tests/test_canonical_foundation.py > /tmp/reliability-diagnostic/compile.log 2>&1
          COMPILE_RC=$?
          pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt > /tmp/reliability-diagnostic/pip.log 2>&1
          PIP_RC=$?
          if [ "$PIP_RC" -eq 0 ]; then
            (cd backend && APP_ENV=test ALLOW_SQLITE_FOR_TESTS=1 DATABASE_URL=sqlite:///./canonical_reliability_test.db DATABASE_WRITE_URL=sqlite:///./canonical_reliability_test.db SECRET_KEY=canonical-reliability-validation-secret QUALITY_SCHEMA_STRICT=0 python -c "import amodb.main; print('import passed')" && APP_ENV=test ALLOW_SQLITE_FOR_TESTS=1 DATABASE_URL=sqlite:///./canonical_reliability_test.db DATABASE_WRITE_URL=sqlite:///./canonical_reliability_test.db SECRET_KEY=canonical-reliability-validation-secret QUALITY_SCHEMA_STRICT=0 pytest -q amodb/apps/reliability/tests/test_canonical_foundation.py) > /tmp/reliability-diagnostic/backend.log 2>&1
            BACKEND_RC=$?
          else
            BACKEND_RC=99
          fi
          (cd frontend && npm ci --prefer-offline --no-audit --fund=false) > /tmp/reliability-diagnostic/npm.log 2>&1
          NPM_RC=$?
          if [ "$NPM_RC" -eq 0 ]; then
            (cd frontend && npm run test:tenant-shell) > /tmp/reliability-diagnostic/navigation.log 2>&1
            NAV_RC=$?
            (cd frontend && npm exec -- eslint src/App.tsx src/portalRoutes.tsx src/app/portalRouteManifest.ts src/app/portalRouteManifest.test.ts src/app/routePreload.ts src/pages/reliability/ReliabilityWorkspacePage.tsx src/pages/reliability/ReliabilityReportsView.tsx src/services/reliability.ts) > /tmp/reliability-diagnostic/lint.log 2>&1
            LINT_RC=$?
            (cd frontend && npm run build) > /tmp/reliability-diagnostic/build.log 2>&1
            BUILD_RC=$?
          else
            NAV_RC=99
            LINT_RC=99
            BUILD_RC=99
          fi
          cat > /tmp/reliability-diagnostic/report.md <<EOF
          # Canonical Reliability Rebuild Diagnostic

          - Run: \`${GITHUB_RUN_ID}\`
          - Source SHA: \`${GITHUB_SHA}\`
          - UTC: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`

          | Stage | Exit code |
          |---|---:|
          | Fetch backup | ${FETCH_RC} |
          | Prepare transformation | ${PREPARE_RC} |
          | Canonical replacement | ${CANON_RC} |
          | Finalize routes/navigation | ${FINALIZE_RC} |
          | Python compilation | ${COMPILE_RC} |
          | Backend dependency install | ${PIP_RC} |
          | Backend import/tests | ${BACKEND_RC} |
          | Frontend dependency install | ${NPM_RC} |
          | Tenant navigation tests | ${NAV_RC} |
          | Scoped ESLint | ${LINT_RC} |
          | Production build | ${BUILD_RC} |

          ## Failure tails
          EOF
          for stage in fetch prepare canonicalize finalize compile pip backend npm navigation lint build; do
            printf '\n### %s\n\n```text\n' "$stage" >> /tmp/reliability-diagnostic/report.md
            tail -n 30 "/tmp/reliability-diagnostic/${stage}.log" >> /tmp/reliability-diagnostic/report.md 2>/dev/null
            printf '\n```\n' >> /tmp/reliability-diagnostic/report.md
          done
          git reset --hard HEAD
          git clean -fdx
          mkdir -p docs/reliability
          cp /tmp/reliability-diagnostic/report.md docs/reliability/CANONICAL_REBUILD_DIAGNOSTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reliability/CANONICAL_REBUILD_DIAGNOSTIC.md
          git commit -m "Record canonical Reliability rebuild diagnostics"
          git push origin HEAD:agent/reliability-v2-foundation
