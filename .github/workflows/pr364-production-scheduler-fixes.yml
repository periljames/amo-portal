name: PR364 Publish Production Scheduler Fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/rostering-automation-workforce-hr-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rostering-automation-workforce-hr-overhaul
          fetch-depth: 0

      - name: Apply production scheduler and cadence fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count}, found {found}: {old[:150]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          service = "backend/amodb/apps/rostering/automation_service.py"
          replace(
              service,
              '''def _validate_run_day(frequency, run_day: int) -> int:\n    normalized = _enum_value(frequency)\n    if normalized in {\n        RosterAutomationFrequency.WEEKLY.value,\n        RosterAutomationFrequency.FORTNIGHTLY.value,\n    }:\n        if not 1 <= int(run_day) <= 7:\n            raise ValueError("Weekly and fortnightly automation run_day must be an ISO weekday from 1 to 7")\n    elif not 1 <= int(run_day) <= 28:\n        raise ValueError("Monthly automation run_day must be from 1 to 28")\n    return int(run_day)\n''',
              '''def _validate_run_day(frequency, run_day: int) -> int:\n    normalized = _enum_value(frequency)\n    if normalized in {\n        RosterAutomationFrequency.WEEKLY.value,\n        RosterAutomationFrequency.FORTNIGHTLY.value,\n    }:\n        if not 1 <= int(run_day) <= 7:\n            raise ValueError("Weekly and fortnightly automation run_day must be an ISO weekday from 1 to 7")\n    elif not 1 <= int(run_day) <= 28:\n        raise ValueError("Monthly automation run_day must be from 1 to 28")\n    return int(run_day)\n\n\n_SCHEDULE_FIELDS = frozenset({\n    "enabled",\n    "frequency",\n    "run_day",\n    "run_hour_local",\n    "timezone_name",\n})\n\n\ndef _schedule_fields_changed(policy: RosterGenerationPolicy, values: dict) -> bool:\n    for key in _SCHEDULE_FIELDS:\n        if key not in values:\n            continue\n        current = getattr(policy, key)\n        proposed = values[key]\n        if key == "frequency":\n            if _enum_value(current) != _enum_value(proposed):\n                return True\n        elif current != proposed:\n            return True\n    return False\n''',
          )
          replace(
              service,
              '''def _render_pattern(pattern: str, target_from: date, target_to: date) -> str:\n    tokens = {\n        "{YYYY}": f"{target_from.year:04d}",\n        "{YY}": f"{target_from.year % 100:02d}",\n        "{MM}": f"{target_from.month:02d}",\n        "{M}": str(target_from.month),\n        "{MMMM}": calendar.month_name[target_from.month],\n        "{MMM}": calendar.month_abbr[target_from.month],\n        "{DD}": f"{target_from.day:02d}",\n        "{END_DD}": f"{target_to.day:02d}",\n    }\n    rendered = pattern\n    for token, value in tokens.items():\n        rendered = rendered.replace(token, value)\n    return rendered.strip()\n''',
              '''def _render_pattern(pattern: str, target_from: date, target_to: date) -> str:\n    tokens = {\n        "{YYYY}": f"{target_from.year:04d}",\n        "{YY}": f"{target_from.year % 100:02d}",\n        "{MM}": f"{target_from.month:02d}",\n        "{M}": str(target_from.month),\n        "{MMMM}": calendar.month_name[target_from.month],\n        "{MMM}": calendar.month_abbr[target_from.month],\n        "{DD}": f"{target_from.day:02d}",\n        "{END_DD}": f"{target_to.day:02d}",\n    }\n    rendered = pattern\n    for token, value in tokens.items():\n        rendered = rendered.replace(token, value)\n    return rendered.strip()\n\n\ndef _render_period_code(pattern: str, target_from: date, target_to: date) -> str:\n    """Render a stable period code that stays unique for sub-monthly windows."""\n    rendered = _render_pattern(pattern, target_from, target_to) or "ROSTER"\n    full_month = (\n        target_from.day == 1\n        and target_from.year == target_to.year\n        and target_from.month == target_to.month\n        and target_to.day == calendar.monthrange(target_from.year, target_from.month)[1]\n    )\n    if full_month:\n        return rendered[:32]\n\n    boundary = f"{target_from:%Y%m%d}-{target_to:%Y%m%d}"\n    if rendered.endswith(boundary) and len(rendered) <= 32:\n        return rendered\n    prefix_length = 32 - len(boundary) - 1\n    prefix = rendered[:prefix_length].rstrip("- _")\n    return f"{prefix}-{boundary}" if prefix else boundary\n''',
          )
          replace(
              service,
              '''    if values.get("timezone_name"):\n        values["timezone_name"] = _validate_timezone(str(values["timezone_name"]))\n    for key, value in values.items():\n        setattr(row, key, value)\n    _validate_run_day(row.frequency, row.run_day)\n    row.updated_by_user_id = actor_user_id\n    row.updated_reason = reason\n    row.state_revision += 1\n    row.next_run_at = _next_run(row)\n''',
              '''    if values.get("timezone_name"):\n        values["timezone_name"] = _validate_timezone(str(values["timezone_name"]))\n    schedule_changed = _schedule_fields_changed(row, values)\n    previous_next_run = row.next_run_at\n    for key, value in values.items():\n        setattr(row, key, value)\n    _validate_run_day(row.frequency, row.run_day)\n    row.updated_by_user_id = actor_user_id\n    row.updated_reason = reason\n    row.state_revision += 1\n    frequency = _enum_value(row.frequency)\n    if not row.enabled or frequency == RosterAutomationFrequency.MANUAL.value:\n        row.next_run_at = None\n    elif schedule_changed or previous_next_run is None:\n        row.next_run_at = _next_run(row)\n    else:\n        row.next_run_at = previous_next_run\n''',
          )
          replace(
              service,
              '''    period_code = _render_pattern(policy.period_code_pattern, target_from, target_to)\n    period_name = _render_pattern(policy.period_name_pattern, target_from, target_to)\n''',
              '''    period_code = _render_period_code(policy.period_code_pattern, target_from, target_to)\n    period_name = _render_pattern(policy.period_name_pattern, target_from, target_to)\n''',
          )

          job = "backend/amodb/jobs/rostering_automation.py"
          replace(
              job,
              '''from __future__ import annotations\n\nfrom datetime import datetime, timezone\nfrom typing import Optional\n''',
              '''from __future__ import annotations\n\nimport argparse\nfrom datetime import datetime, timezone\nimport json\nimport os\nimport time as time_module\nfrom typing import Optional\n''',
          )
          replace(
              job,
              '''if __name__ == "__main__":\n    print("Rostering automation completed:", run())\n''',
              '''def _positive_int(value: str, *, field: str) -> int:\n    parsed = int(value)\n    if parsed < 1:\n        raise ValueError(f"{field} must be at least 1")\n    return parsed\n\n\ndef main(argv: Optional[list[str]] = None) -> int:\n    parser = argparse.ArgumentParser(description="Execute due roster automation policies")\n    parser.add_argument("--loop", action="store_true", help="Run continuously for container deployments")\n    parser.add_argument(\n        "--interval-seconds",\n        type=int,\n        default=_positive_int(os.getenv("ROSTER_AUTOMATION_POLL_SECONDS", "3600"), field="ROSTER_AUTOMATION_POLL_SECONDS"),\n    )\n    parser.add_argument(\n        "--retry-seconds",\n        type=int,\n        default=_positive_int(os.getenv("ROSTER_AUTOMATION_RETRY_SECONDS", "60"), field="ROSTER_AUTOMATION_RETRY_SECONDS"),\n    )\n    parser.add_argument(\n        "--limit",\n        type=int,\n        default=_positive_int(os.getenv("ROSTER_AUTOMATION_BATCH_LIMIT", "100"), field="ROSTER_AUTOMATION_BATCH_LIMIT"),\n    )\n    args = parser.parse_args(argv)\n    if args.interval_seconds < 1 or args.retry_seconds < 1 or args.limit < 1:\n        parser.error("interval, retry and limit values must be at least 1")\n\n    while True:\n        exit_code = 0\n        try:\n            summary = run(limit=args.limit)\n        except Exception as exc:\n            exit_code = 1\n            summary = {\n                "as_of": _utcnow().isoformat(),\n                "outcome": "scheduler_error",\n                "error": str(exc),\n            }\n        print(json.dumps(summary, sort_keys=True, default=str), flush=True)\n        if not args.loop:\n            return exit_code\n        time_module.sleep(args.interval_seconds if exit_code == 0 else args.retry_seconds)\n\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''',
          )

          tests = Path("backend/amodb/apps/rostering/tests/test_automation_policy_contract.py")
          text = tests.read_text(encoding="utf-8")
          addition = '''\n\ndef test_submonthly_period_codes_include_full_date_boundaries():\n    first = automation_service._render_period_code(\n        "{YYYY}-{MM}",\n        date(2026, 8, 3),\n        date(2026, 8, 9),\n    )\n    second = automation_service._render_period_code(\n        "{YYYY}-{MM}",\n        date(2026, 8, 10),\n        date(2026, 8, 16),\n    )\n    assert first != second\n    assert first.endswith("20260803-20260809")\n    assert second.endswith("20260810-20260816")\n    assert len(first) <= 32\n    assert automation_service._render_period_code(\n        "{YYYY}-{MM}",\n        date(2026, 8, 1),\n        date(2026, 8, 31),\n    ) == "2026-08"\n\n\ndef test_unrelated_policy_edits_do_not_change_the_schedule():\n    fortnightly = policy(\n        frequency=RosterAutomationFrequency.FORTNIGHTLY,\n        run_day=1,\n    )\n    assert not automation_service._schedule_fields_changed(\n        fortnightly,\n        {"period_name_pattern": "Controlled roster"},\n    )\n    assert automation_service._schedule_fields_changed(fortnightly, {"run_day": 2})\n    source = inspect.getsource(automation_service.update_policy)\n    assert "previous_next_run = row.next_run_at" in source\n    assert "row.next_run_at = previous_next_run" in source\n\n\ndef test_default_compose_deployments_run_the_scheduler_continuously():\n    repository_root = Path(__file__).resolve().parents[5]\n    for filename in ("docker-compose.yml", "docker-compose.prod.yml"):\n        source = (repository_root / filename).read_text(encoding="utf-8")\n        assert "rostering-automation:" in source\n        assert "amodb.jobs.rostering_automation" in source\n        assert "--loop" in source\n    worker_source = inspect.getsource(rostering_automation.main)\n    assert 'parser.add_argument("--loop"' in worker_source\n    assert "ROSTER_AUTOMATION_POLL_SECONDS" in worker_source\n    assert "time_module.sleep" in worker_source\n'''
          if addition.strip() not in text:
              if "from pathlib import Path" not in text:
                  text = text.replace("import inspect\n", "import inspect\nfrom pathlib import Path\n", 1)
              tests.write_text(text.rstrip() + addition.rstrip() + "\n", encoding="utf-8")

          local_compose = Path("docker-compose.yml")
          local_text = local_compose.read_text(encoding="utf-8")
          local_service = '''\n  rostering-automation:\n    build:\n      context: .\n      dockerfile: backend/Dockerfile\n    env_file:\n      - .env\n    command: ["python", "-m", "amodb.jobs.rostering_automation", "--loop"]\n    restart: unless-stopped\n    volumes:\n      - ./backend:/app/backend\n      - ./backend/uploads:/app/uploads\n    depends_on:\n      - backend\n'''
          if "  rostering-automation:" not in local_text:
              insertion = "\n  frontend:\n"
              if local_text.count(insertion) != 1:
                  raise SystemExit("docker-compose.yml insertion point drifted")
              local_compose.write_text(local_text.replace(insertion, local_service + insertion, 1), encoding="utf-8")

          prod_compose = Path("docker-compose.prod.yml")
          prod_text = prod_compose.read_text(encoding="utf-8")
          prod_service = '''\n  rostering-automation:\n    build:\n      context: .\n      dockerfile: backend/Dockerfile\n    env_file:\n      - .env\n    command: ["python", "-m", "amodb.jobs.rostering_automation", "--loop"]\n    restart: unless-stopped\n    volumes:\n      - /opt/amo-portal/shared/uploads:/srv/amo/uploads\n      - /opt/amo-portal/shared/logs:/var/log/amo\n    depends_on:\n      backend:\n        condition: service_healthy\n'''
          if "  rostering-automation:" not in prod_text:
              insertion = "\n  frontend:\n"
              if prod_text.count(insertion) != 1:
                  raise SystemExit("docker-compose.prod.yml insertion point drifted")
              prod_compose.write_text(prod_text.replace(insertion, prod_service + insertion, 1), encoding="utf-8")
          PY

          git diff --check
          git rm .github/workflows/pr364-production-scheduler-fixes.yml
          git add backend/amodb/apps/rostering/automation_service.py backend/amodb/apps/rostering/tests/test_automation_policy_contract.py backend/amodb/jobs/rostering_automation.py docker-compose.yml docker-compose.prod.yml
          git config user.name "amo-portal-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Wire production roster automation and stabilize cadence"
          git push origin HEAD:agent/rostering-automation-workforce-hr-overhaul
