name: PR364 Publish Final Merge Blocker Fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/rostering-automation-workforce-hr-overhaul' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rostering-automation-workforce-hr-overhaul
          fetch-depth: 0

      - name: Apply final schedule and idempotency fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count}, found {found}: {old[:140]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          service = "backend/amodb/apps/rostering/automation_service.py"
          replace(
              service,
              '''    run_row.completed_at = _utcnow()\n    policy.last_run_at = run_row.completed_at\n    policy.next_run_at = _next_run(policy, now=run_row.completed_at)\n    db.add(policy)\n    db.add(run_row)\n''',
              '''    run_row.completed_at = _utcnow()\n    if trigger == RosterAutomationTrigger.SCHEDULED:\n        policy.last_run_at = run_row.completed_at\n        policy.next_run_at = _next_run(policy, now=run_row.completed_at)\n        db.add(policy)\n    db.add(run_row)\n''',
          )

          router = "backend/amodb/apps/rostering/automation_router.py"
          replace(
              router,
              '''    except IntegrityError as exc:\n        message = str(exc)\n        evidence_retained = _record_failed_run(\n            db,\n            amo_id=amo_id,\n            actor_user_id=current_user.id,\n            payload=payload,\n            message=message,\n        )\n        raise _error(\n            message,\n            code="ROSTER_AUTOMATION_DATABASE_CONFLICT",\n            status_code=status.HTTP_409_CONFLICT,\n            conflicts=[{"failure_evidence_retained": evidence_retained}],\n        ) from exc\n''',
              '''    except IntegrityError as exc:\n        db.rollback()\n        winner = automation_service._existing_run(\n            db,\n            amo_id=amo_id,\n            idempotency_key=payload.idempotency_key,\n        )\n        if winner is not None:\n            expected_fingerprint = automation_service._request_fingerprint(\n                payload,\n                RosterAutomationTrigger.MANUAL,\n            )\n            stored_fingerprint = (winner.summary_json or {}).get("request_fingerprint")\n            if stored_fingerprint == expected_fingerprint:\n                winner_status = str(getattr(winner.status, "value", winner.status))\n                if winner_status == RosterAutomationRunStatus.FAILED.value:\n                    raise _error(\n                        "This automation request previously failed.",\n                        code="ROSTER_AUTOMATION_PREVIOUS_FAILURE",\n                        status_code=status.HTTP_409_CONFLICT,\n                        conflicts=[{"run_id": winner.id}],\n                    ) from exc\n                if winner_status == RosterAutomationRunStatus.RUNNING.value:\n                    raise _error(\n                        "An identical automation request is still running.",\n                        code="ROSTER_AUTOMATION_ALREADY_RUNNING",\n                        status_code=status.HTTP_409_CONFLICT,\n                        conflicts=[{"run_id": winner.id}],\n                        retryable=True,\n                    ) from exc\n                return winner\n            if stored_fingerprint:\n                raise _error(\n                    "This idempotency key was already used with a different automation request.",\n                    code="ROSTER_AUTOMATION_IDEMPOTENCY_PAYLOAD_MISMATCH",\n                    status_code=status.HTTP_409_CONFLICT,\n                    conflicts=[{"idempotency_key": payload.idempotency_key}],\n                ) from exc\n\n        message = str(exc)\n        evidence_retained = _record_failed_run(\n            db,\n            amo_id=amo_id,\n            actor_user_id=current_user.id,\n            payload=payload,\n            message=message,\n        )\n        raise _error(\n            message,\n            code="ROSTER_AUTOMATION_DATABASE_CONFLICT",\n            status_code=status.HTTP_409_CONFLICT,\n            conflicts=[{"failure_evidence_retained": evidence_retained}],\n        ) from exc\n''',
          )

          tests = Path("backend/amodb/apps/rostering/tests/test_automation_policy_contract.py")
          text = tests.read_text(encoding="utf-8")
          addition = '''\n\ndef test_manual_runs_do_not_advance_scheduled_policy_timestamps():\n    source = inspect.getsource(automation_service.run)\n    marker = source.index("if trigger == RosterAutomationTrigger.SCHEDULED:")\n    assert source.index("policy.last_run_at", marker) > marker\n    assert source.index("policy.next_run_at", marker) > marker\n    assert source.count("policy.last_run_at") == 1\n    assert source.count("policy.next_run_at") == 1\n\n\ndef test_concurrent_identical_manual_request_returns_the_winning_run():\n    source = inspect.getsource(automation_router.run_roster_automation)\n    branch = source[source.index("except IntegrityError"):source.index("except (ValueError, RuntimeError)")]\n    assert "db.rollback()" in branch\n    assert "automation_service._existing_run(" in branch\n    assert "automation_service._request_fingerprint(" in branch\n    assert "return winner" in branch\n    assert branch.index("return winner") < branch.index("_record_failed_run(")\n'''
          if addition.strip() not in text:
              tests.write_text(text.rstrip() + addition.rstrip() + "\n", encoding="utf-8")
          PY

          git diff --check
          git rm .github/workflows/pr364-final-concurrency-fixes.yml
          git add backend/amodb/apps/rostering/automation_service.py backend/amodb/apps/rostering/automation_router.py backend/amodb/apps/rostering/tests/test_automation_policy_contract.py
          git config user.name "amo-portal-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Resolve final Rostering merge blockers"
          git push origin HEAD:agent/rostering-automation-workforce-hr-overhaul
