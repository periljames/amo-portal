name: User Management Stabilization CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-management-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_management_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d user_management_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      SECRET_KEY: user-management-ci-secret-not-for-production
      JWT_SECRET_KEY: user-management-ci-jwt-secret-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/user_management_ci
      DATABASE_WRITE_URL: postgresql://postgres:postgres@127.0.0.1:5432/user_management_ci
      WRITE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/user_management_ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt

      - name: Compile affected backend modules
        run: python -m compileall -q backend/amodb/apps/accounts backend/amodb/apps/workforce backend/amodb/apps/realtime

      - name: Verify full mapper startup
        working-directory: backend
        run: python -c "from sqlalchemy.orm import configure_mappers; import amodb.main; configure_mappers(); print('All application mappers configured')"

      - name: Verify a single Alembic head
        run: |
          set -euo pipefail
          alembic -c backend/amodb/alembic.ini heads --verbose
          HEAD_COUNT=$(alembic -c backend/amodb/alembic.ini heads | grep -c '(head)')
          echo "Alembic head count: ${HEAD_COUNT}"
          test "$HEAD_COUNT" -eq 1

      - name: Upgrade a clean PostgreSQL schema
        run: alembic -c backend/amodb/alembic.ini upgrade heads

      - name: Run PostgreSQL reporting integrity smoke
        working-directory: backend
        run: python amodb/apps/accounts/tests/reporting_postgres_smoke.py

      - name: Run account and workforce tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          pytest -vv --maxfail=20 amodb/apps/accounts/tests amodb/apps/workforce/tests 2>&1 | tee ../user-management-pytest.log

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-management-pytest
          path: user-management-pytest.log
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run tenant-shell route contracts
        working-directory: frontend
        run: npm run test:tenant-shell

      - name: Run reporting-line client contracts
        working-directory: frontend
        run: npm exec -- vitest run src/services/reportingLines.test.ts

      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build

      - name: Lint user management and corporate structure
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm exec -- eslint \
            src/pages/AdminDashboardPage.tsx \
            src/pages/admin-users \
            src/services/adminUserDirectory.ts \
            src/services/corporateStructure.ts \
            src/services/reportingLines.ts \
            src/services/reportingLines.test.ts \
            src/components/realtime/RealtimeProvider.tsx \
            src/app/PortalRouteSurface.tsx \
            src/app/portalRouteManifest.ts \
            2>&1 | tee ../user-management-eslint.log

      - name: Upload frontend lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-management-eslint
          path: user-management-eslint.log
          if-no-files-found: warn
          retention-days: 7
