name: QMS Live Audit CI

on:
  pull_request:
    paths:
      - "backend/amodb/alembic/versions/quality_260816_external_access.py"
      - "backend/amodb/alembic/versions/quality_260816_guest_documents.py"
      - "backend/amodb/apps/quality/audit_session_*.py"
      - "backend/amodb/apps/quality/audit_external_access_*.py"
      - "backend/amodb/apps/quality/audit_finding_release_status_router.py"
      - "backend/amodb/apps/quality/audit_guest_document_*.py"
      - "backend/amodb/apps/quality/audit_guest_documents_router.py"
      - "backend/amodb/apps/quality/car_control_loop_route_order.py"
      - "backend/amodb/apps/quality/tests/test_audit_session_projection.py"
      - "backend/amodb/apps/quality/tests/test_audit_external_access_contract.py"
      - "backend/amodb/apps/quality/tests/test_audit_guest_document_storage_contract.py"
      - "backend/amodb/apps/quality/tests/postgres_audit_external_access_probe.py"
      - "frontend/src/App.tsx"
      - "frontend/src/pages/PublicAuditAccessPage.tsx"
      - "frontend/src/features/qms/auditSession/**"
      - "frontend/src/services/qmsAuditSession.ts"
      - "frontend/src/services/qmsAuditPreparationRoom.ts"
      - "frontend/src/services/qmsAuditExternalAccess.ts"
      - "frontend/src/components/QMS/QualityEnhancementsHost.tsx"
      - "frontend/src/styles/qms-audit-session.css"
      - "frontend/src/styles/qms-live-audit-workspace.css"
      - "frontend/src/styles/qms-live-finding-release.css"
      - "frontend/src/styles/qms-audit-prepare-workspace.css"
      - "frontend/src/styles/qms-audit-external-participants.css"
      - "frontend/src/styles/qms-audit-document-review.css"
      - "frontend/src/styles/qms-public-audit-access.css"
      - "frontend/src/styles/qms-public-audit-document-submit.css"
      - "docs/quality/QMS_LIVE_AUDIT_*.md"
      - "docs/quality/QMS_PENDING_PR_RECONCILIATION.md"
      - ".github/workflows/qms-live-audit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qms-live-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: qms-live-audit-ci-secret
      QUALITY_SCHEMA_STRICT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Compile live audit contract
        run: >-
          python -m compileall -q
          amodb/apps/quality/audit_session_router.py
          amodb/apps/quality/audit_session_route_order.py
          amodb/apps/quality/audit_external_access_models.py
          amodb/apps/quality/audit_external_access_router.py
          amodb/apps/quality/audit_external_access_route_order.py
          amodb/apps/quality/audit_finding_release_status_router.py
          amodb/apps/quality/audit_guest_document_models.py
          amodb/apps/quality/audit_guest_document_storage.py
          amodb/apps/quality/audit_guest_documents_router.py
      - name: Test session projection
        run: pytest -q amodb/apps/quality/tests/test_audit_session_projection.py
      - name: Test external access token and scope contract
        run: pytest -q amodb/apps/quality/tests/test_audit_external_access_contract.py
      - name: Test guest document storage controls
        run: pytest -q amodb/apps/quality/tests/test_audit_guest_document_storage_contract.py
      - name: Prove authoritative workflow contract remains green
        run: pytest -q amodb/apps/quality/tests/test_audit_workflow_contract.py

  postgres-contract:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amo_live_audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_live_audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/amo_live_audit_ci
      DATABASE_WRITE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/amo_live_audit_ci
      SECRET_KEY: qms-live-audit-ci-secret
      QUALITY_SCHEMA_STRICT: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Upgrade PostgreSQL through all Alembic heads
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Verify external access RLS and append-only contract
        run: python -m amodb.apps.quality.tests.postgres_audit_external_access_probe

  frontend-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint live audit workspaces
        run: >-
          npx eslint
          src/App.tsx
          src/pages/PublicAuditAccessPage.tsx
          src/features/qms/auditSession/AuditLifecycleRail.tsx
          src/features/qms/auditSession/AuditPrepareWorkspace.tsx
          src/features/qms/auditSession/AuditDocumentSubmissionReviewPanel.tsx
          src/features/qms/auditSession/GuestDocumentSubmit.tsx
          src/features/qms/auditSession/LiveAuditWorkspace.tsx
          src/features/qms/auditSession/LiveFindingReleasePanel.tsx
          src/features/qms/auditSession/auditSessionRoutes.ts
          src/features/qms/auditSession/auditSessionRoutes.test.ts
          src/services/qmsAuditSession.ts
          src/services/qmsAuditPreparationRoom.ts
          src/services/qmsAuditExternalAccess.ts
          src/components/QMS/QualityEnhancementsHost.tsx
      - name: Test route compatibility
        run: npx vitest run src/features/qms/auditSession/auditSessionRoutes.test.ts
      - name: Production frontend build
        run: npm run build
