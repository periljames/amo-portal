name: External Provider Phase 10 Verification

on:
  pull_request:
    paths:
      - ".github/workflows/external-provider-phase10-ci.yml"
      - "backend/amodb/apps/procurement/**"
      - "backend/amodb/apps/quality/provider_*.py"
      - "backend/amodb/alembic/versions/external_providers_*.py"
      - "backend/amodb/tests/test_external_provider*.py"
      - "backend/tests/test_*provider*.py"
      - "backend/tests/test_supplier_governance_contract.py"
      - "frontend/src/features/externalPartner/**"
      - "frontend/src/pages/externalProvider/**"
      - "frontend/src/pages/maintenance/ContractedWorkModule.tsx"
      - "frontend/src/services/loginDepartureWarmup*"
      - "frontend/src/pages/manuals/ManualReaderPage.tsx"
      - "docs/external-providers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-provider-phase10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgresql:
    name: PostgreSQL migrations, imports, security and backend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: external_provider_phase10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d external_provider_phase10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: external-provider-phase10-ci-secret
      PLATFORM_SECRETS_KEY: "5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU="
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/external_provider_phase10
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/external_provider_phase10
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/external_provider_phase10
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "Phase 10 backend dependencies"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile implementation, configure ORM and generate OpenAPI
        working-directory: backend
        run: |
          python -m compileall -q amodb/apps/procurement amodb/apps/quality amodb/jobs amodb/main.py
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          from amodb.main import app
          configure_mappers()
          schema = app.openapi()
          assert schema.get("paths"), "OpenAPI paths must exist"
          print(f"ORM configured, OpenAPI routes: {len(schema['paths'])}")
          PY
      - name: Inspect Alembic graph and apply all heads to clean PostgreSQL
        working-directory: backend
        run: |
          python -m alembic -c amodb/alembic.ini heads --verbose
          python -m alembic -c amodb/alembic.ini upgrade heads
          python -m alembic -c amodb/alembic.ini current --verbose
      - name: Execute provider, Procurement, QMS, DMS and broader backend regression
        working-directory: backend
        run: >-
          pytest -q
          tests
          amodb/tests
          amodb/apps/quality/tests
          amodb/apps/doc_control/tests

  frontend-checks:
    name: Frontend unit suite, role surfaces, lint, typecheck and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "Phase 10 frontend dependencies"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Execute full Vitest unit/integration suite
        run: npm exec -- vitest run
      - name: Lint provider workspaces, authentication, reader and quality UI
        run: >-
          npm exec -- eslint
          src/features/externalPartner
          src/pages/externalProvider
          src/pages/maintenance/ContractedWorkModule.tsx
          src/services/loginDepartureWarmup.ts
          src/services/loginDepartureWarmup.test.ts
          src/pages/manuals/ManualReaderPage.tsx
          src/features/qms/auditSession/AuditClosingWorkspace.tsx
      - name: Typecheck and build production frontend
        run: npm run build
