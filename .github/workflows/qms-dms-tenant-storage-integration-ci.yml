name: QMS DMS Tenant Storage Integration CI

on:
  pull_request:
    paths:
      - "backend/amodb/storage.py"
      - "backend/amodb/apps/platform/storage_quota*.py"
      - "backend/amodb/apps/platform/tests/test_storage_quota_accounting.py"
      - "backend/amodb/apps/platform/tests/test_storage_object_rollback_cleanup.py"
      - "backend/amodb/apps/platform/tests/test_postgres_tenant_storage_quota.py"
      - "backend/amodb/apps/platform/tests/test_s3_multinode_acceptance.py"
      - "backend/amodb/apps/quality/car_rca_storage.py"
      - "backend/amodb/apps/quality/audit_evidence_storage.py"
      - "backend/amodb/apps/quality/audit_guest_document_storage.py"
      - "backend/amodb/apps/doc_control/knowledge_hardening.py"
      - "backend/amodb/apps/doc_control/workspace_records_vault_router.py"
      - "backend/amodb/alembic/versions/plat_20261016_storage_bytes.py"
      - ".github/workflows/qms-dms-tenant-storage-integration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-quota-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: amo_storage_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amo_storage_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
      PYTHONPATH: backend
      SECRET_KEY: storage-quota-postgres-ci-key
      STORAGE_QUOTA_POSTGRES_TEST_DSN: postgresql+psycopg2://postgres:postgres-ci-only@127.0.0.1:5432/amo_storage_acceptance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Verify exact byte accounting, idempotency and independent PostgreSQL reservations
        run: >-
          python -m pytest -q
          backend/amodb/apps/platform/tests/test_storage_quota_accounting.py
          backend/amodb/apps/platform/tests/test_storage_object_rollback_cleanup.py
          backend/amodb/apps/platform/tests/test_postgres_tenant_storage_quota.py

  minio-cross-worker-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      DATABASE_WRITE_URL: "sqlite+pysqlite:///:memory:"
      PYTHONPATH: backend
      SECRET_KEY: storage-minio-ci-key
      AMO_STORAGE_BACKEND: s3
      AMO_REQUIRE_SHARED_STORAGE: "true"
      AMO_STORAGE_S3_BUCKET: amo-tenant-storage-acceptance
      AMO_STORAGE_S3_PREFIX: acceptance
      AMO_STORAGE_S3_REGION: us-east-1
      AMO_STORAGE_S3_ENDPOINT_URL: http://127.0.0.1:9000
      AMO_STORAGE_S3_ADDRESSING_STYLE: path
      AWS_ACCESS_KEY_ID: minio-local-ci
      AWS_SECRET_ACCESS_KEY: minio-ci-test-only-not-production
      STORAGE_MINIO_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Start isolated S3-compatible object storage
        run: |
          docker run -d --name amo-storage-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minio-local-ci \
            -e MINIO_ROOT_PASSWORD=minio-ci-test-only-not-production \
            cgr.dev/chainguard/minio:latest server /data
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs amo-storage-minio
          exit 1
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Prove real cross-worker restore, remote checksum and namespace-safe deletion
        run: python -m pytest -q backend/amodb/apps/platform/tests/test_s3_multinode_acceptance.py
      - name: Tear down isolated object store
        if: always()
        run: docker rm -f amo-storage-minio || true
