name: Apply validated Training review fixes

on:
  push:
    branches:
      - agent/training-workbook-control-centre

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: training-review-fixes-pr-422
  cancel-in-progress: true

jobs:
  apply-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Retrieve and apply exact reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5178920889'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/training-review-comment.txt
          python - <<'PY'
          import base64
          from pathlib import Path

          body = Path('/tmp/training-review-comment.txt').read_text(encoding='utf-8')
          start_marker = 'PATCH_BASE64_BEGIN'
          end_marker = 'PATCH_BASE64_END'
          if start_marker not in body or end_marker not in body:
              raise SystemExit('Reviewed patch markers were not found in the GitHub comment.')
          encoded = body.split(start_marker, 1)[1].split(end_marker, 1)[0]
          encoded = ''.join(encoded.split())
          patch = base64.b64decode(encoded, validate=True)
          Path('/tmp/training-six-fixes.diff').write_bytes(patch)
          print(f'Decoded {len(patch)} bytes of reviewed patch data.')
          PY
          git apply --check /tmp/training-six-fixes.diff
          git apply /tmp/training-six-fixes.diff
          expected=$'backend/amodb/apps/training/tests/test_workbook_import_mapping.py\nbackend/amodb/apps/training/workbook_import.py\ndocs/training/TRAINING_TRACKER_WORKBOOK_MAPPING.md\nfrontend/src/components/training/TrainingWorkbookImportDialog.tsx'
          actual="$(git diff --name-only | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected reviewed patch file set:'
            printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run focused backend regression tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite+pysqlite:///:memory:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: '1'
        run: |
          python -m py_compile backend/amodb/apps/training/workbook_import.py backend/amodb/apps/training/tests/test_workbook_import_mapping.py
          pytest -q backend/amodb/apps/training/tests/test_workbook_import_mapping.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check CSS contracts
        working-directory: frontend
        run: npm run check:css

      - name: Report validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 422 --body "Training review patch validation failed on workflow run ${GITHUB_RUN_ID}. The product branch was not modified."

      - name: Remove one-shot workflow and commit fixes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-training-review-fixes.yml
          rm -f .github/triggers/apply-training-review-fixes.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address Training workbook reconciliation review'
          git push origin HEAD
          gh pr comment 422 --body "Applied the six reviewed Training fixes. Focused backend tests, frontend production build, and CSS contract checks passed in workflow run ${GITHUB_RUN_ID}."
