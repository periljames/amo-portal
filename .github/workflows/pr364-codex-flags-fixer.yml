name: PR364 Codex Flags Fixer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 364 && github.actor == 'periljames'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rostering-automation-workforce-hr-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply all open Codex review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              text = read(path)
              begin = text.index(start)
              finish = text.index(end, begin)
              write(path, text[:begin] + replacement + text[finish:])

          service_path = 'backend/amodb/apps/rostering/automation_service.py'
          replace_once(
              service_path,
              '    return _month_window(today, policy.lead_periods)\n\n\ndef _render_pattern',
              '''    return _month_window(today, policy.lead_periods)\n\n\ndef _target_window_for_occurrence(\n    policy: RosterGenerationPolicy,\n    scheduled_at: datetime,\n) -> tuple[date, date]:\n    """Derive a target window from the scheduled occurrence, not worker delay."""\n    local_date = scheduled_at.astimezone(ZoneInfo(policy.timezone_name)).date()\n    return _target_window(policy, today=local_date)\n\n\ndef _render_pattern''',
          )
          replace_between(
              service_path,
              'def _render_period_code',
              '\n\ndef _next_run',
              '''def _render_period_code(pattern: str, target_from: date, target_to: date) -> str:\n    """Render a collision-safe code while preserving a stable date suffix."""\n    rendered = _render_pattern(pattern, target_from, target_to) or "ROSTER"\n    full_month = (\n        target_from.day == 1\n        and target_from.year == target_to.year\n        and target_from.month == target_to.month\n        and target_to.day == calendar.monthrange(target_from.year, target_from.month)[1]\n    )\n    boundary = (\n        f"{target_from:%Y%m}"\n        if full_month\n        else f"{target_from:%Y%m%d}-{target_to:%Y%m%d}"\n    )\n    if rendered.endswith(boundary) and len(rendered) <= 32:\n        return rendered\n    prefix_length = max(0, 32 - len(boundary) - 1)\n    prefix = rendered[:prefix_length].rstrip("- _")\n    return f"{prefix}-{boundary}" if prefix else boundary\n''',
          )
          replace_between(
              service_path,
              'def _next_run',
              '\n\ndef get_or_create_policy',
              '''def _next_run(\n    policy: RosterGenerationPolicy,\n    *,\n    now: Optional[datetime] = None,\n    previous_scheduled_at: Optional[datetime] = None,\n) -> Optional[datetime]:\n    if not policy.enabled or _enum_value(policy.frequency) == RosterAutomationFrequency.MANUAL.value:\n        return None\n    run_day = _validate_run_day(policy.frequency, policy.run_day)\n    zone = ZoneInfo(policy.timezone_name)\n    current = (now or _utcnow()).astimezone(zone)\n    frequency = _enum_value(policy.frequency)\n\n    if previous_scheduled_at is not None:\n        previous = previous_scheduled_at.astimezone(zone)\n        if frequency == RosterAutomationFrequency.MONTHLY.value:\n            next_month = _add_months(previous.date().replace(day=1), 1)\n            candidate = datetime.combine(\n                date(next_month.year, next_month.month, run_day),\n                time(policy.run_hour_local, 0),\n                tzinfo=zone,\n            )\n            while candidate <= current:\n                next_month = _add_months(candidate.date().replace(day=1), 1)\n                candidate = datetime.combine(\n                    date(next_month.year, next_month.month, run_day),\n                    time(policy.run_hour_local, 0),\n                    tzinfo=zone,\n                )\n        else:\n            cadence_days = 7 if frequency == RosterAutomationFrequency.WEEKLY.value else 14\n            candidate = datetime.combine(\n                previous.date() + timedelta(days=cadence_days),\n                time(policy.run_hour_local, 0),\n                tzinfo=zone,\n            )\n            while candidate <= current:\n                candidate = datetime.combine(\n                    candidate.date() + timedelta(days=cadence_days),\n                    time(policy.run_hour_local, 0),\n                    tzinfo=zone,\n                )\n        return candidate.astimezone(timezone.utc)\n\n    if frequency == RosterAutomationFrequency.MONTHLY.value:\n        candidate = datetime.combine(\n            date(current.year, current.month, run_day),\n            time(policy.run_hour_local, 0),\n            tzinfo=zone,\n        )\n        if candidate <= current:\n            next_month = _add_months(candidate.date().replace(day=1), 1)\n            candidate = datetime.combine(\n                date(next_month.year, next_month.month, run_day),\n                time(policy.run_hour_local, 0),\n                tzinfo=zone,\n            )\n    else:\n        cadence_days = 7 if frequency == RosterAutomationFrequency.WEEKLY.value else 14\n        days_ahead = (run_day - current.isoweekday()) % 7\n        candidate = datetime.combine(\n            current.date() + timedelta(days=days_ahead),\n            time(policy.run_hour_local, 0),\n            tzinfo=zone,\n        )\n        if candidate <= current:\n            candidate += timedelta(days=cadence_days)\n    return candidate.astimezone(timezone.utc)\n''',
          )
          replace_once(
              service_path,
              '    policy = get_or_create_policy(db, amo_id=amo_id, actor_user_id=actor_user_id)\n    preview_result = preview',
              '    policy = get_or_create_policy(db, amo_id=amo_id, actor_user_id=actor_user_id)\n    scheduled_occurrence = policy.next_run_at if trigger == RosterAutomationTrigger.SCHEDULED else None\n    preview_result = preview',
          )
          replace_once(
              service_path,
              '        policy.next_run_at = _next_run(policy, now=run_row.completed_at)',
              '        policy.next_run_at = _next_run(\n            policy,\n            now=run_row.completed_at,\n            previous_scheduled_at=scheduled_occurrence,\n        )',
          )

          job_path = 'backend/amodb/jobs/rostering_automation.py'
          replace_once(
              job_path,
              '    message: str,\n    as_of: datetime,',
              '    message: str,\n    scheduled_occurrence: datetime,\n    as_of: datetime,',
          )
          replace_once(
              job_path,
              '            target_from, target_to = automation_service._target_window(policy)',
              '            target_from, target_to = automation_service._target_window_for_occurrence(\n                policy, scheduled_occurrence\n            )',
          )
          replace_once(
              job_path,
              '        policy.next_run_at = automation_service._next_run(policy, now=as_of)',
              '        policy.next_run_at = automation_service._next_run(\n            policy,\n            now=as_of,\n            previous_scheduled_at=scheduled_occurrence,\n        )',
          )
          replace_once(
              job_path,
              '        amo_id = policy.amo_id\n        due_key = policy.next_run_at.astimezone(timezone.utc).strftime("%Y%m%dT%H%M%SZ")',
              '        scheduled_occurrence = policy.next_run_at\n        target_from, target_to = automation_service._target_window_for_occurrence(\n            policy, scheduled_occurrence\n        )\n        amo_id = policy.amo_id\n        due_key = scheduled_occurrence.astimezone(timezone.utc).strftime("%Y%m%dT%H%M%SZ")',
          )
          replace_once(
              job_path,
              '                message=message,\n                as_of=as_of,\n                failure_kind="NO_ACCOUNTABLE_OWNER",',
              '                message=message,\n                scheduled_occurrence=scheduled_occurrence,\n                as_of=as_of,\n                failure_kind="NO_ACCOUNTABLE_OWNER",',
          )
          replace_once(
              job_path,
              '                    idempotency_key=idempotency_key,\n                    confirm_preview=True,',
              '                    idempotency_key=idempotency_key,\n                    target_from=target_from,\n                    target_to=target_to,\n                    confirm_preview=True,',
          )
          replace_once(
              job_path,
              '                message=message,\n                as_of=as_of,\n            )',
              '                message=message,\n                scheduled_occurrence=scheduled_occurrence,\n                as_of=as_of,\n            )',
          )

          permissions_path = 'backend/amodb/apps/workforce/permissions.py'
          replace_between(
              permissions_path,
              'def permissions_for_user',
              '\n\ndef any_permission',
              '''def permissions_for_user(db: Session, *, user: account_models.User) -> list[str]:\n    """Return globally effective permissions using the same rules as guards."""\n    permissions = default_permissions_for(user)\n    amo_id = getattr(user, "effective_amo_id", None) or user.amo_id\n    today = date.today()\n    rows = db.query(models.WorkforcePermissionGrant).filter(\n        models.WorkforcePermissionGrant.amo_id == amo_id,\n        models.WorkforcePermissionGrant.user_id == user.id,\n        or_(models.WorkforcePermissionGrant.effective_from.is_(None), models.WorkforcePermissionGrant.effective_from <= today),\n        or_(models.WorkforcePermissionGrant.effective_to.is_(None), models.WorkforcePermissionGrant.effective_to >= today),\n        models.WorkforcePermissionGrant.department_id.is_(None),\n        models.WorkforcePermissionGrant.base_station_id.is_(None),\n    ).order_by(models.WorkforcePermissionGrant.created_at.asc()).all()\n    effects: dict[str, set[models.PermissionEffect]] = {}\n    for row in rows:\n        effects.setdefault(row.permission_code, set()).add(row.effect)\n    for code, code_effects in effects.items():\n        if models.PermissionEffect.DENY in code_effects:\n            permissions.discard(code)\n        elif models.PermissionEffect.GRANT in code_effects:\n            permissions.add(code)\n    return sorted(permissions)\n''',
          )

          setup_path = 'frontend/src/pages/rostering/components/RosteringSetupWorkspace.tsx'
          replace_once(
              setup_path,
              '  const can = (permission: string) => permissions.includes(permission);\n  const readiness = readinessQuery.data;',
              '  const can = (permission: string) => permissions.includes(permission);\n  const canGenerate = can("roster.create") && can("roster.manage_patterns");\n  const readiness = readinessQuery.data;',
          )
          replace_once(setup_path, '          previewEnabled={can("roster.manage_patterns")}', '          previewEnabled={canGenerate}')

          hr_schema_path = 'backend/amodb/apps/workforce/hr_schemas.py'
          replace_once(hr_schema_path, 'from typing import Optional', 'from typing import Literal, Optional')
          replace_once(
              hr_schema_path,
              '\n\nclass HrDashboardResponse(HrSchema):',
              '''\n\nclass HrOvertimeRequestRead(HrSchema):\n    id: str\n    amo_id: str\n    user_id: str\n    user_full_name: Optional[str] = None\n    roster_assignment_id: Optional[str] = None\n    starts_at: datetime\n    ends_at: datetime\n    requested_minutes: int\n    reason: str\n    status: str\n    created_by_user_id: Optional[str] = None\n    created_at: datetime\n    updated_at: datetime\n\n\nclass HrOvertimeDecisionRequest(HrSchema):\n    stage: Literal["SUPERVISOR", "HR"]\n    decision: Literal["APPROVED", "REJECTED"]\n    comment: str = Field(min_length=5, max_length=2000)\n\n\nclass HrDashboardResponse(HrSchema):''',
          )
          replace_once(
              hr_schema_path,
              '    can_approve_timesheet_hr: bool\n    can_export_payroll: bool',
              '    can_approve_timesheet_hr: bool\n    can_approve_overtime_supervisor: bool\n    can_approve_overtime_hr: bool\n    can_export_payroll: bool',
          )
          replace_once(
              hr_schema_path,
              '    action_queue: list[HrActionItem]\n    people: list[HrPersonReadiness]',
              '    action_queue: list[HrActionItem]\n    pending_overtime: list[HrOvertimeRequestRead]\n    people: list[HrPersonReadiness]',
          )

          hr_service_path = 'backend/amodb/apps/workforce/hr_service.py'
          replace_once(hr_service_path, 'from . import hr_schemas, models, permissions', 'from . import hr_schemas, models, permissions, schemas, services')
          replace_once(
              hr_service_path,
              '\n\ndef _person_readiness(',
              '''\n\ndef serialize_overtime(row: models.OvertimeRequest) -> hr_schemas.HrOvertimeRequestRead:\n    return hr_schemas.HrOvertimeRequestRead(\n        id=row.id,\n        amo_id=row.amo_id,\n        user_id=row.user_id,\n        user_full_name=_display_name(row.user),\n        roster_assignment_id=row.roster_assignment_id,\n        starts_at=row.starts_at,\n        ends_at=row.ends_at,\n        requested_minutes=row.requested_minutes,\n        reason=row.reason,\n        status=_value(row.status),\n        created_by_user_id=row.created_by_user_id,\n        created_at=row.created_at,\n        updated_at=row.updated_at,\n    )\n\n\ndef list_overtime_requests(\n    db: Session,\n    *,\n    amo_id: str,\n    pending_only: bool = True,\n    limit: int = 200,\n) -> list[hr_schemas.HrOvertimeRequestRead]:\n    query = db.query(models.OvertimeRequest).options(\n        joinedload(models.OvertimeRequest.user),\n    ).filter(models.OvertimeRequest.amo_id == amo_id)\n    if pending_only:\n        query = query.filter(models.OvertimeRequest.status.in_([\n            models.OvertimeRequestStatus.SUBMITTED,\n            models.OvertimeRequestStatus.SUPERVISOR_APPROVED,\n        ]))\n    rows = query.order_by(models.OvertimeRequest.starts_at.asc(), models.OvertimeRequest.id.asc()).limit(limit).all()\n    return [serialize_overtime(row) for row in rows]\n\n\ndef create_overtime_request(\n    db: Session,\n    *,\n    amo_id: str,\n    actor_user_id: str,\n    payload: schemas.OvertimeRequestCreate,\n) -> models.OvertimeRequest:\n    user_id = payload.user_id or actor_user_id\n    services._require_user(db, amo_id=amo_id, user_id=user_id, active_only=True)\n    on_date = payload.starts_at.date()\n    contract = db.query(models.EmploymentContract).filter(\n        models.EmploymentContract.amo_id == amo_id,\n        models.EmploymentContract.user_id == user_id,\n        models.EmploymentContract.employment_status == models.EmploymentStatus.ACTIVE,\n        models.EmploymentContract.effective_from <= on_date,\n        or_(models.EmploymentContract.effective_to.is_(None), models.EmploymentContract.effective_to >= on_date),\n    ).order_by(models.EmploymentContract.effective_from.desc()).first()\n    if contract is None:\n        raise ValueError("An active employment contract is required for overtime")\n    if not contract.overtime_eligible:\n        raise ValueError("The employee is not eligible for overtime under the active contract")\n    actual_minutes = int((payload.ends_at - payload.starts_at).total_seconds() // 60)\n    requested_minutes = payload.requested_minutes or actual_minutes\n    if requested_minutes < 1 or requested_minutes > actual_minutes:\n        raise ValueError("requested_minutes must be within the requested overtime window")\n    duplicate = db.query(models.OvertimeRequest.id).filter(\n        models.OvertimeRequest.amo_id == amo_id,\n        models.OvertimeRequest.user_id == user_id,\n        models.OvertimeRequest.starts_at == payload.starts_at,\n        models.OvertimeRequest.ends_at == payload.ends_at,\n        models.OvertimeRequest.status.notin_([\n            models.OvertimeRequestStatus.REJECTED,\n            models.OvertimeRequestStatus.CANCELLED,\n        ]),\n    ).first()\n    if duplicate:\n        raise ValueError("An active overtime request already exists for this window")\n    row = models.OvertimeRequest(\n        amo_id=amo_id,\n        user_id=user_id,\n        roster_assignment_id=payload.roster_assignment_id,\n        starts_at=payload.starts_at,\n        ends_at=payload.ends_at,\n        requested_minutes=requested_minutes,\n        reason=payload.reason.strip(),\n        status=models.OvertimeRequestStatus.SUBMITTED,\n        created_by_user_id=actor_user_id,\n    )\n    db.add(row)\n    db.flush()\n    return row\n\n\ndef decide_overtime(\n    db: Session,\n    *,\n    amo_id: str,\n    actor_user_id: str,\n    request_id: str,\n    payload: hr_schemas.HrOvertimeDecisionRequest,\n) -> models.OvertimeRequest:\n    row = db.query(models.OvertimeRequest).options(\n        joinedload(models.OvertimeRequest.user),\n    ).filter(\n        models.OvertimeRequest.amo_id == amo_id,\n        models.OvertimeRequest.id == request_id,\n    ).with_for_update().first()\n    if row is None:\n        raise ValueError("Overtime request not found")\n    stage = models.LeaveApprovalStage(payload.stage)\n    decision = models.ApprovalDecision(payload.decision)\n    expected = (\n        models.OvertimeRequestStatus.SUBMITTED\n        if stage == models.LeaveApprovalStage.SUPERVISOR\n        else models.OvertimeRequestStatus.SUPERVISOR_APPROVED\n    )\n    if row.status != expected:\n        raise ValueError(f"Overtime request is not awaiting {stage.value.lower()} review")\n    existing = db.query(models.OvertimeApproval.id).filter(\n        models.OvertimeApproval.amo_id == amo_id,\n        models.OvertimeApproval.overtime_request_id == row.id,\n        models.OvertimeApproval.stage == stage,\n    ).first()\n    if existing:\n        raise ValueError(f"The {stage.value.lower()} overtime decision is already recorded")\n    db.add(models.OvertimeApproval(\n        amo_id=amo_id,\n        overtime_request_id=row.id,\n        stage=stage,\n        decision=decision,\n        actor_user_id=actor_user_id,\n        comment=payload.comment.strip(),\n    ))\n    if decision == models.ApprovalDecision.REJECTED:\n        row.status = models.OvertimeRequestStatus.REJECTED\n    elif stage == models.LeaveApprovalStage.SUPERVISOR:\n        row.status = models.OvertimeRequestStatus.SUPERVISOR_APPROVED\n    else:\n        row.status = models.OvertimeRequestStatus.HR_APPROVED\n    db.add(row)\n    db.flush()\n    return row\n\n\ndef _person_readiness(''',
          )
          replace_once(
              hr_service_path,
              '    for row in pending_timesheet_rows[:20]:\n        actions.append(hr_schemas.HrActionItem(\n            id=f"timesheet:{row.id}",\n            category="TIMESHEET",\n            severity="ACTION",\n            title="Timesheet approval required",\n            detail=f"Pay period {row.period_start} to {row.period_end}.",\n            user_id=row.user_id,\n            user_name=_display_name(row.user),\n            due_on=row.period_end,\n            action_label="Review timesheet",\n            action_path=f"time/timesheets/{row.id}",\n        ))',
              '''    for row in pending_timesheet_rows[:20]:\n        actions.append(hr_schemas.HrActionItem(\n            id=f"timesheet:{row.id}",\n            category="TIMESHEET",\n            severity="ACTION",\n            title="Timesheet approval required",\n            detail=f"Pay period {row.period_start} to {row.period_end}.",\n            user_id=row.user_id,\n            user_name=_display_name(row.user),\n            due_on=row.period_end,\n            action_label="Review timesheet",\n            action_path=f"time/timesheets/{row.id}",\n        ))\n    for row in pending_overtime_rows[:20]:\n        actions.append(hr_schemas.HrActionItem(\n            id=f"overtime:{row.id}",\n            category="OVERTIME",\n            severity="ACTION",\n            title="Overtime approval required",\n            detail=f"{row.requested_minutes} minutes from {row.starts_at.isoformat()}.",\n            user_id=row.user_id,\n            user_name=_display_name(row.user),\n            due_on=row.starts_at.date(),\n            action_label="Review overtime",\n            action_path=f"time/overtime/{row.id}",\n        ))''',
          )
          replace_once(
              hr_service_path,
              '    can_approve_timesheet_hr = can_approve_timesheet_supervisor and permissions.has_permission(\n        db, user=current_user, permission=permissions.PermissionCode.ATTENDANCE_APPROVE\n    )\n    can_export_payroll',
              '''    can_approve_timesheet_hr = can_approve_timesheet_supervisor and permissions.has_permission(\n        db, user=current_user, permission=permissions.PermissionCode.ATTENDANCE_APPROVE\n    )\n    can_approve_overtime_supervisor = permissions.has_permission(\n        db, user=current_user, permission=permissions.PermissionCode.OVERTIME_APPROVE\n    )\n    can_approve_overtime_hr = can_approve_overtime_supervisor and permissions.has_permission(\n        db, user=current_user, permission=permissions.PermissionCode.ATTENDANCE_APPROVE\n    )\n    can_export_payroll''',
          )
          replace_once(
              hr_service_path,
              '        can_approve_timesheet_hr=can_approve_timesheet_hr,\n        can_export_payroll=can_export_payroll,',
              '        can_approve_timesheet_hr=can_approve_timesheet_hr,\n        can_approve_overtime_supervisor=can_approve_overtime_supervisor,\n        can_approve_overtime_hr=can_approve_overtime_hr,\n        can_export_payroll=can_export_payroll,',
          )
          replace_once(
              hr_service_path,
              '        action_queue=actions[:100],\n        people=people,',
              '        action_queue=actions[:100],\n        pending_overtime=[serialize_overtime(row) for row in pending_overtime_rows],\n        people=people,',
          )

          hr_router_path = 'backend/amodb/apps/workforce/hr_router.py'
          replace_once(
              hr_router_path,
              '        db.commit()\n        return services.list_pattern_assignments(\n            db,\n            amo_id=_amo(current_user),\n            user_id=row.user_id,\n            pattern_id=row.work_pattern_id,\n        )[0]',
              '''        created_id = row.id\n        db.commit()\n        assignments = services.list_pattern_assignments(\n            db,\n            amo_id=_amo(current_user),\n            user_id=row.user_id,\n            pattern_id=row.work_pattern_id,\n        )\n        return next(item for item in assignments if item.id == created_id)''',
          )
          with Path(hr_router_path).open('a', encoding='utf-8') as handle:
              handle.write('''\n\n@router.get("/overtime-requests", response_model=list[hr_schemas.HrOvertimeRequestRead])\ndef hr_overtime_requests(\n    pending_only: bool = Query(default=True),\n    limit: int = Query(default=200, ge=1, le=500),\n    db: Session = Depends(get_db),\n    current_user: account_models.User = Depends(get_current_active_user),\n):\n    permissions.require_permission(\n        db, user=current_user, permission=permissions.PermissionCode.WORKFORCE_VIEW_SENSITIVE\n    )\n    return hr_service.list_overtime_requests(\n        db, amo_id=_amo(current_user), pending_only=pending_only, limit=limit\n    )\n\n\n@router.post(\n    "/overtime-requests",\n    response_model=hr_schemas.HrOvertimeRequestRead,\n    status_code=status.HTTP_201_CREATED,\n)\ndef hr_create_overtime_request(\n    payload: schemas.OvertimeRequestCreate,\n    db: Session = Depends(get_db),\n    current_user: account_models.User = Depends(get_current_active_user),\n):\n    target_user_id = payload.user_id or current_user.id\n    permission = (\n        permissions.PermissionCode.OVERTIME_REQUEST\n        if target_user_id == current_user.id\n        else permissions.PermissionCode.OVERTIME_APPROVE\n    )\n    permissions.require_permission(db, user=current_user, permission=permission)\n    try:\n        row = hr_service.create_overtime_request(\n            db, amo_id=_amo(current_user), actor_user_id=current_user.id, payload=payload\n        )\n        db.commit()\n        db.refresh(row)\n        return hr_service.serialize_overtime(row)\n    except ValueError as exc:\n        db.rollback()\n        raise _error(str(exc), code="HR_OVERTIME_REQUEST_INVALID") from exc\n\n\n@router.post(\n    "/overtime-requests/{request_id}/decision",\n    response_model=hr_schemas.HrOvertimeRequestRead,\n)\ndef hr_decide_overtime_request(\n    request_id: str,\n    payload: hr_schemas.HrOvertimeDecisionRequest,\n    db: Session = Depends(get_db),\n    current_user: account_models.User = Dep