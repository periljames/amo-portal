name: PR 466 scale fixture patch

on:
  push:
    branches:
      - fix/workforce-default-day-pattern-postgres-lock
    paths:
      - .github/workflows/pr466-scale-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workforce-default-day-pattern-postgres-lock
          fetch-depth: 0
      - name: Align optional API fallbacks with portal acceptance fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/tests/e2e/workforce-governance-scale.spec.ts')
          source = path.read_text(encoding='utf-8')
          old_fallback = '    return json(route, []);\n'
          new_fallback = '    return json(route, { detail: "Not required by the Workforce scale scenario" }, 404);\n'
          if source.count(old_fallback) != 1:
              raise SystemExit(f'Expected one generic JSON fallback, found {source.count(old_fallback)}')
          source = source.replace(old_fallback, new_fallback)
          marker = 'test("governed Workforce remains bounded and completes a 10,000-person batch", async ({ page }) => {\n'
          diagnostic = marker + '  page.on("pageerror", (error) => console.error(`[pageerror] ${error.stack || error.message}`));\n  page.on("console", (message) => { if (message.type() === "error") console.error(`[browser-console] ${message.text()}`); });\n'
          if source.count(marker) != 1:
              raise SystemExit(f'Expected one test marker, found {source.count(marker)}')
          source = source.replace(marker, diagnostic)
          path.write_text(source, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/e2e/workforce-governance-scale.spec.ts
          git commit -m "test(workforce): use portal bootstrap fallbacks in scale acceptance"
          git push origin HEAD:fix/workforce-default-day-pattern-postgres-lock
