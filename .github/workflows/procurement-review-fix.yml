name: Procurement Review Fix

on:
  push:
    branches:
      - agent/procurement-ui-document-controls
    paths:
      - .github/workflows/procurement-review-fix.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/procurement-ui-document-controls
          fetch-depth: 0

      - name: Apply exact Procurement corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def regex_once(path: Path, pattern: str, replacement: str, *, flags: int = 0) -> None:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern}")
              path.write_text(updated, encoding="utf-8")

          service = Path("backend/amodb/apps/procurement/service.py")
          models = Path("backend/amodb/apps/procurement/models.py")
          document_service = Path("backend/amodb/apps/procurement/document_service.py")
          sections = Path("frontend/src/pages/procurement/ProcurementSections.tsx")
          env_file = Path(".env.example")
          module_contract = Path("backend/tests/test_procurement_module_contract.py")
          document_contract = Path("backend/tests/test_procurement_document_contract.py")
          frontend_contract = Path("backend/tests/test_procurement_frontend_contract.py")

          regex_once(
              service,
              r'\n\ndef assert_legacy_purchase_order_eligible\(.*?\n\ndef dashboard\(',
              '\n\ndef dashboard(',
              flags=re.DOTALL,
          )
          replace_once(
              service,
              '''    elif action == "SEND_TO_SOURCING":
              if requisition.status != models.RequisitionStatus.BUDGET_REVIEW:
                  raise HTTPException(status_code=409, detail="Requisition is not ready for sourcing.")
              requisition.status = models.RequisitionStatus.SOURCING
          ''',
              '',
          )

          replace_once(
              models,
              '    legacy_purchase_order_id = Column(Integer, ForeignKey("purchase_orders.id", ondelete="SET NULL"), nullable=True)\n',
              '',
          )

          replace_once(
              document_service,
              'DOCUMENT_ROOT = Path(os.getenv("PROCUREMENT_DOCUMENT_DIR", "uploads/procurement-documents")).resolve()',
              'DOCUMENT_ROOT = Path(os.getenv("PROCUREMENT_DOCUMENT_DIR", "/srv/amo/uploads/procurement-documents")).resolve()',
          )

          env_text = env_file.read_text(encoding="utf-8")
          if "PROCUREMENT_DOCUMENT_DIR=" not in env_text:
              replace_once(
                  env_file,
                  'EHM_LOG_UPLOAD_DIR=/srv/amo/uploads/ehm\n',
                  'EHM_LOG_UPLOAD_DIR=/srv/amo/uploads/ehm\nPROCUREMENT_DOCUMENT_DIR=/srv/amo/uploads/procurement-documents\n',
              )

          old_actions = '''<td><RecordActions><button type="button" onClick={() => linkDocument("REQUISITION", item.id)}><Paperclip size={14} />Evidence</button>{item.status === "DRAFT" ? <button type="button" onClick={() => void act("Submit requisition", () => transitionProcurementRequisition(amoCode(), item.id, "SUBMIT"))}>Submit</button> : null}{item.status === "SUBMITTED" ? <button type="button" onClick={() => void act("Technical review", () => transitionProcurementRequisition(amoCode(), item.id, "TECHNICAL_REVIEW"))}>Technical review</button> : null}</RecordActions></td>'''
          new_actions = '''<td><RecordActions><button type="button" onClick={() => linkDocument("REQUISITION", item.id)}><Paperclip size={14} />Evidence</button>{item.status === "DRAFT" ? <button type="button" onClick={() => void act("Submit requisition", () => transitionProcurementRequisition(amoCode(), item.id, "SUBMIT"))}>Submit</button> : null}{["SUBMITTED", "TECHNICAL_REVIEW"].includes(item.status) ? <button type="button" onClick={() => void act("Technical approval", () => transitionProcurementRequisition(amoCode(), item.id, "TECHNICAL_APPROVE"))}>Technical approve</button> : null}{item.status === "BUDGET_REVIEW" ? <button type="button" onClick={() => void act("Budget approval", () => transitionProcurementRequisition(amoCode(), item.id, "BUDGET_APPROVE"))}>Budget approve</button> : null}{item.status === "SOURCING" ? <button type="button" onClick={() => void act("Approve requisition", () => transitionProcurementRequisition(amoCode(), item.id, "APPROVE"))}>Approve</button> : null}</RecordActions></td>'''
          replace_once(sections, old_actions, new_actions)

          module_text = module_contract.read_text(encoding="utf-8")
          if "assert_legacy_purchase_order_eligible' not in service" not in module_text:
              replace_once(
                  module_contract,
                  "    assert 'procurement_service' not in inventory_router\n    assert 'tags=[\"inventory\"]' in inventory_router\n",
                  "    assert 'procurement_service' not in inventory_router\n    assert 'tags=[\"inventory\"]' in inventory_router\n    assert 'assert_legacy_purchase_order_eligible' not in service\n",
              )
          module_text = module_contract.read_text(encoding="utf-8")
          if "test_requisition_lifecycle_requires_technical_and_budget_approval" not in module_text:
              module_contract.write_text(module_text + '''


def test_requisition_lifecycle_requires_technical_and_budget_approval() -> None:
    service = _read(PROCUREMENT / "service.py")
    sections = _read(FRONTEND / "pages" / "procurement" / "ProcurementSections.tsx")

    assert 'elif action == "SEND_TO_SOURCING"' not in service
    assert 'item.id, "TECHNICAL_REVIEW"' not in sections
    assert 'item.id, "SUBMIT"' in sections
    assert 'item.id, "TECHNICAL_APPROVE"' in sections
    assert 'item.id, "BUDGET_APPROVE"' in sections
    assert 'item.id, "APPROVE"' in sections
    assert 'requisition.technical_reviewed_by_user_id = actor_user_id' in service
    assert 'requisition.budget_reviewed_by_user_id = actor_user_id' in service
    assert 'not requisition.technical_reviewed_by_user_id or not requisition.budget_reviewed_by_user_id' in service
''', encoding="utf-8")

          document_text = document_contract.read_text(encoding="utf-8")
          if "test_procurement_evidence_uses_persistent_upload_root" not in document_text:
              document_contract.write_text(document_text + '''


def test_procurement_evidence_uses_persistent_upload_root():
    service = read("amodb/apps/procurement/document_service.py")
    environment = (ROOT.parent / ".env.example").read_text(encoding="utf-8")
    expected = "/srv/amo/uploads/procurement-documents"
    assert f'PROCUREMENT_DOCUMENT_DIR", "{expected}"' in service
    assert f"PROCUREMENT_DOCUMENT_DIR={expected}" in environment
''', encoding="utf-8")

          frontend_text = frontend_contract.read_text(encoding="utf-8")
          if "test_requisition_actions_match_backend_lifecycle" not in frontend_text:
              frontend_contract.write_text(frontend_text + '''


def test_requisition_actions_match_backend_lifecycle():
    sections = read("pages/procurement/ProcurementSections.tsx")
    assert 'item.id, "TECHNICAL_REVIEW"' not in sections
    for action in ["SUBMIT", "TECHNICAL_APPROVE", "BUDGET_APPROVE", "APPROVE"]:
        assert f'item.id, "{action}"' in sections
''', encoding="utf-8")

          checks = {
              "legacy helper": "assert_legacy_purchase_order_eligible",
              "legacy PO field": "legacy_purchase_order_id",
              "sourcing bypass": 'elif action == "SEND_TO_SOURCING"',
          }
          procurement_sources = "\n".join(
              path.read_text(encoding="utf-8")
              for path in [service, models]
          )
          for label, token in checks.items():
              if token in procurement_sources:
                  raise SystemExit(f"{label} remains: {token}")
          if 'item.id, "TECHNICAL_REVIEW"' in sections.read_text(encoding="utf-8"):
              raise SystemExit("Unsupported frontend TECHNICAL_REVIEW action remains")
          PY

      - name: Verify corrected source contracts
        shell: bash
        run: |
          python -m compileall -q backend/amodb/apps/procurement backend/tests
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path("backend/amodb/apps/procurement/service.py"),
              Path("backend/amodb/apps/procurement/models.py"),
              Path("backend/amodb/apps/procurement/document_service.py"),
              Path("backend/tests/test_procurement_module_contract.py"),
              Path("backend/tests/test_procurement_document_contract.py"),
              Path("backend/tests/test_procurement_frontend_contract.py"),
          ]:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
          git diff --check

      - name: Commit corrected implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example \
            backend/amodb/apps/procurement/service.py \
            backend/amodb/apps/procurement/models.py \
            backend/amodb/apps/procurement/document_service.py \
            frontend/src/pages/procurement/ProcurementSections.tsx \
            backend/tests/test_procurement_module_contract.py \
            backend/tests/test_procurement_document_contract.py \
            backend/tests/test_procurement_frontend_contract.py
          git commit -m "Clear final Procurement review blockers"
          git push origin HEAD:agent/procurement-ui-document-controls
