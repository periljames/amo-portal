name: Apply QMS CAR Reporting Follow-up

on:
  push:
    branches:
      - agent/qms-car-control-loop
    paths:
      - ".github/workflows/qms-car-reporting-followup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/qms-car-control-loop
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply explicit report route follow-up
        run: python .github/scripts/qms_car_reporting_followup.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: >-
          python ../.github/scripts/retry_transient.py --attempts 4
          --label "CAR reporting follow-up dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Lint report and route surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/portalRoutes.tsx
          src/pages/qms/QmsCarPerformanceReportPage.tsx
          src/pages/qms/QmsCanonicalPage.tsx
          tests/e2e/qms-car-control-loop.spec.ts
          tests/e2e/qms-car-performance-report.spec.ts
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qms-car-reporting-preview.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qms-car-reporting-preview.log
          exit 1
      - name: Browser acceptance
        working-directory: frontend
        run: npx playwright test tests/e2e/qms-car-control-loop.spec.ts tests/e2e/qms-car-performance-report.spec.ts --workers=1 --reporter=github,line
      - name: Commit source follow-up
        run: |
          git rm .github/scripts/qms_car_reporting_followup.py
          git add frontend/src/portalRoutes.tsx frontend/src/pages/qms/QmsCarPerformanceReportPage.tsx frontend/tests/e2e/qms-car-control-loop.spec.ts frontend/tests/e2e/qms-car-performance-report.spec.ts
          git diff --cached --check
          git config user.name "amo-portal-qms-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(quality): verify CAR inputs and live performance reporting"
          git push origin HEAD:agent/qms-car-control-loop
