name: Apply verified reader bundle once

on:
  push:
    branches:
      - agent/document-reader-pdfium-hardening
    paths:
      - .github/workflows/apply-reader-bundle-once.yml

permissions:
  contents: write
  issues: read

jobs:
  apply-bundle:
    if: github.event.head_commit.message == 'chore: stage verified reader bundle application'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/document-reader-pdfium-hardening
          fetch-depth: 2

      - name: Retrieve, validate, and apply verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: 52a7f420a5cff8a52bfbd6d6bd5c3dfb304d77ba
          COMMENT_ID: '5145575459'
        shell: bash
        run: |
          set -euo pipefail

          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$EXPECTED_PARENT"

          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/comment-body.txt
          sed -n '/^BUNDLE_BASE64_START$/,/^BUNDLE_BASE64_END$/p' /tmp/comment-body.txt \
            | sed '1d;$d' \
            | tr -d '\r\n' > /tmp/reader-bundle.b64
          test -s /tmp/reader-bundle.b64
          base64 --decode /tmp/reader-bundle.b64 > /tmp/reader-bundle.tar.gz

          tar -tzf /tmp/reader-bundle.tar.gz | LC_ALL=C sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          backend/amodb/apps/doc_control/pdfium_service.py
          backend/amodb/apps/doc_control/tests/test_pdf_reader_final_hardening.py
          backend/amodb/apps/doc_control/tests/test_pdf_reader_interaction_contract.py
          frontend/src/pages/manuals/PdfReaderCore.tsx
          frontend/src/pages/manuals/pdfReaderEngine.test.ts
          frontend/src/pages/manuals/pdfReaderEngine.ts
          EOF
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/actual-files.txt; then
            echo 'Unsafe bundle path detected' >&2
            exit 1
          fi

          mkdir -p /tmp/reader-bundle
          tar -xzf /tmp/reader-bundle.tar.gz -C /tmp/reader-bundle
          while IFS= read -r file; do
            install -D -m 0644 "/tmp/reader-bundle/${file}" "${file}"
          done < /tmp/expected-files.txt

          rm .github/workflows/apply-reader-bundle-once.yml
          git diff --check

          git config user.name 'AMO Portal automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete PDF reader navigation and form custody'
          git push origin HEAD:agent/document-reader-pdfium-hardening
