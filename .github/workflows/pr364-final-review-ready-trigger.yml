name: PR364 Ready Review Patch Trigger

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply-staged-fixer:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/rostering-automation-workforce-hr-overhaul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract and apply staged fixer
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr364-final-review-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end].splitlines()
          )
          Path('/tmp/apply_pr364_final_review_fixes.py').write_text(script + "\n", encoding='utf-8')
          PY
          python /tmp/apply_pr364_final_review_fixes.py
      - name: Compile corrected backend modules
        run: >-
          python -m compileall -q
          backend/amodb/apps/rostering/automation_service.py
          backend/amodb/apps/workforce/hr_service.py
          backend/amodb/apps/workforce/services.py
          backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py
          backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
      - name: Commit corrected implementation
        run: |
          if git diff --quiet -- backend/amodb; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "amo-portal-actions"
          git config user.email "actions@github.com"
          git add \
            backend/amodb/apps/rostering/automation_service.py \
            backend/amodb/apps/workforce/hr_service.py \
            backend/amodb/apps/workforce/services.py \
            backend/amodb/apps/rostering/tests/test_pr364_final_review_regressions.py \
            backend/amodb/apps/workforce/tests/test_pr364_final_review_regressions.py
          git commit -m "Resolve final PR364 review blockers"
          git push origin HEAD:${{ github.head_ref }}
