name: Aircraft Architecture CI

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
      - agent/oem-mpd-source-governance
  pull_request:
    paths:
      - "backend/amodb/apps/aircraft_architecture/**"
      - "backend/amodb/apps/fleet/__init__.py"
      - "backend/amodb/alembic_helpers/**"
      - "backend/amodb/alembic/versions/aircraft_arch_*.py"
      - "backend/amodb/main.py"
      - "backend/requirements.txt"
      - "frontend/src/pages/planning/DailyAircraftUtilisationPage.tsx"
      - "frontend/src/pages/planning/OemBaselinePage.tsx"
      - "frontend/src/pages/PlanningProductionPages.tsx"
      - "frontend/src/services/dailyUtilisation.ts"
      - "frontend/src/services/dailyUtilisation.test.ts"
      - "frontend/src/services/oemMpd.ts"
      - "frontend/src/styles/daily-utilisation.css"
      - "frontend/src/styles/oem-mpd-baseline.css"
      - "frontend/src/styles/oemMpdBaseline.css"
      - "frontend/tests/e2e/aircraft-daily-utilisation.spec.ts"
      - "frontend/playwright.aircraft-architecture.config.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/aircraft-architecture-ci.yml"

permissions:
  contents: read

concurrency:
  group: aircraft-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-gate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: aircraft-architecture-ci-secret
      JWT_SECRET_KEY: aircraft-architecture-ci-jwt-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      WRITE_DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
      POSTGRES_INTEGRATION_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Compile architecture modules
        run: python -m compileall -q backend/amodb/apps/aircraft_architecture backend/amodb/alembic_helpers
      - name: Verify single Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("backend/amodb/alembic.ini"))
          heads = script.get_heads()
          assert len(heads) == 1, f"Expected one Alembic head, found {heads}"
          head = heads[0]
          revisions = {
              revision.revision
              for revision in script.walk_revisions(base="base", head=head)
          }
          assert "aircraft_arch_20260806_u5_u6" in revisions, head
          assert "aircraft_arch_20260807_oem_mpd" in revisions, head
          print(f"alembic_head={head}")
          PY
      - name: Upgrade clean PostgreSQL database
        run: python -m alembic -c backend/amodb/alembic.ini upgrade head
      - name: Verify database reached repository head
        run: |
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          expected = ScriptDirectory.from_config(Config("backend/amodb/alembic.ini")).get_current_head()
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              actual = connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
          assert actual == expected, (actual, expected)
          print(f"database_head={actual}")
          PY
      - name: Import application and initialize mappers
        run: python -c "import amodb.main; from sqlalchemy.orm import configure_mappers; configure_mappers()"
      - name: Run aircraft architecture tests
        shell: bash
        run: |
          set +e
          pytest -q --tb=short --disable-warnings --maxfail=10 backend/amodb/apps/aircraft_architecture 2>&1 | tee /tmp/aircraft-architecture-pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Aircraft architecture test failure"
              echo '```text'
              tail -n 180 /tmp/aircraft-architecture-pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY'
          from pathlib import Path

          lines = Path("/tmp/aircraft-architecture-pytest.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()[-100:]
          message = "\n".join(lines)
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Aircraft architecture tests failed::{message}")
          PY
          fi
          exit "$status"

  frontend-gate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint architecture frontend surface
        run: >-
          npx eslint
          src/services/dailyUtilisation.ts
          src/services/dailyUtilisation.test.ts
          src/services/oemMpd.ts
          src/pages/planning/DailyAircraftUtilisationPage.tsx
          src/pages/planning/OemBaselinePage.tsx
          tests/e2e/aircraft-daily-utilisation.spec.ts
          playwright.aircraft-architecture.config.ts
      - name: Run architecture frontend unit tests
        run: npm run test:aircraft-architecture
      - name: Typecheck and build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run aircraft architecture Playwright acceptance
        run: npx playwright test --config playwright.aircraft-architecture.config.ts
