name: Aircraft Architecture CI

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
  pull_request:
    paths:
      - "backend/amodb/apps/aircraft_architecture/**"
      - "backend/amodb/apps/fleet/__init__.py"
      - "backend/amodb/apps/exports/evidence_pack.py"
      - "backend/amodb/alembic/versions/aircraft_arch_*.py"
      - ".github/workflows/aircraft-architecture-ci.yml"

permissions:
  contents: read

jobs:
  architecture-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amo
          POSTGRES_PASSWORD: amo
          POSTGRES_DB: amo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amo -d amo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      APP_ENV: test
      SECRET_KEY: aircraft-architecture-ci-secret
      DATABASE_URL: postgresql+psycopg2://amo:amo@127.0.0.1:5432/amo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile architecture modules
        run: python -m compileall -q backend/amodb/apps/aircraft_architecture
      - name: Verify single Alembic head
        run: |
          output=$(alembic -c backend/amodb/alembic.ini heads)
          printf '%s\n' "$output"
          heads=$(printf '%s\n' "$output" | grep -c '(head)')
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head; found $heads." >&2
            exit 1
          fi
      - name: Upgrade clean PostgreSQL database
        run: alembic -c backend/amodb/alembic.ini upgrade head
      - name: Import application and initialize mappers
        run: python -c "import amodb.main; from sqlalchemy.orm import configure_mappers; configure_mappers()"
      - name: Run aircraft architecture tests
        run: pytest -q backend/amodb/apps/aircraft_architecture
