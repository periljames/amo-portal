name: QMS Operational UI CI

on:
  pull_request:
    paths:
      - "backend/docs/quality/QMS_FRONTEND_OPERATIONAL_WIREFRAMES_20260809.md"
      - "frontend/src/app/routeGuards.ts"
      - "frontend/src/pages/qms/**"
      - "frontend/src/pages/QualityCarsPage.tsx"
      - "frontend/src/services/qms*.ts"
      - "frontend/src/styles/qms*.css"
      - "frontend/scripts/check-qms-operational-ui.mjs"
      - "frontend/tests/e2e/qms-*.spec.ts"
      - "frontend/src/styles/index.css"
      - ".github/workflows/qms-operational-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qms-operational-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-operational-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "QMS operational UI dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000

      - name: Enforce QMS operational UI contract
        run: node scripts/check-qms-operational-ui.mjs

      - name: Typecheck and production build
        run: npm run build

      - name: Lint redesigned QMS frontend
        run: >-
          npm exec -- eslint
          src/app/routeGuards.ts
          src/pages/qms/routes/qmsWorkspaceRegistry.ts
          src/pages/qms/routes/qmsRouteRegistry.ts
          src/pages/qms/QmsPeoplePage.tsx
          src/pages/qms/QmsAssurancePage.tsx
          src/pages/qms/QmsIntelligencePage.tsx
          src/pages/qms/QmsRegisterPage.tsx
          src/services/qmsPeople.ts
          src/services/qmsIntelligence.ts
          tests/e2e/qms-assurance-operating-system.spec.ts
          tests/e2e/qms-operational-semantic-regressions.spec.ts
          tests/e2e/qms-codex-review-regressions.spec.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start mocked portal readiness
        run: |
          node -e 'const http=require("http");http.createServer((req,res)=>{if(req.url==="/readyz"||req.url==="/healthz"){res.writeHead(200,{"Content-Type":"application/json","X-Portal-Readiness":"ready"});res.end(JSON.stringify({ready:true,status:"ok",db:true}));return;}res.writeHead(503,{"Content-Type":"application/json"});res.end(JSON.stringify({detail:"CI readiness stub only; retry direct mocked backend"}));}).listen(8080,"127.0.0.1");' > /tmp/qms-operational-ui-readiness.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qms-operational-ui-readiness.log
          exit 1

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/qms-operational-ui-preview.log 2>&1 &
          echo $! > /tmp/qms-operational-ui-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qms-operational-ui-preview.log
          exit 1

      - name: Browser - People 1080p
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/qms-assurance-operating-system.spec.ts --grep "People is person-first" --workers=1 --reporter=github --trace=retain-on-failure 2>&1 | tee /tmp/qms-operational-ui-people.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 100 /tmp/qms-operational-ui-people.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-7000)
            echo "::error title=QMS People browser failure::$summary"
          fi
          exit "$status"

      - name: Retain People browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: qms-operational-ui-people-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            /tmp/qms-operational-ui-people.log
            /tmp/qms-operational-ui-preview.log
            /tmp/qms-operational-ui-readiness.log
          if-no-files-found: warn
          retention-days: 14

      - name: Browser - Assurance 1080p
        run: npx playwright test tests/e2e/qms-assurance-operating-system.spec.ts --grep "Assurance keeps case triage" --workers=1 --reporter=github

      - name: Browser - Intelligence 1080p
        run: npx playwright test tests/e2e/qms-assurance-operating-system.spec.ts --grep "Intelligence leads with ranked" --workers=1 --reporter=github

      - name: Browser - semantic truth regressions
        run: npx playwright test tests/e2e/qms-operational-semantic-regressions.spec.ts --workers=1 --reporter=github

      - name: Browser - Codex review regressions
        run: npx playwright test tests/e2e/qms-codex-review-regressions.spec.ts --workers=1 --reporter=github

      - name: Browser - Missions portfolio and drawer
        run: npx playwright test tests/e2e/qms-missions.spec.ts --workers=1

      - name: Browser - Control Room
        run: npx playwright test tests/e2e/qms-excellence-cockpit.spec.ts --workers=1

      - name: Browser - My Quality Work and bounded registers
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/qms-register-bounded.spec.ts --workers=1 --reporter=github,line --trace=retain-on-failure 2>&1 | tee /tmp/qms-operational-ui-registers.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 120 /tmp/qms-operational-ui-registers.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-7000)
            echo "::error title=QMS bounded-register browser failure::$summary"
          fi
          exit "$status"

      - name: Retain bounded-register browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: qms-operational-ui-registers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            /tmp/qms-operational-ui-registers.log
            /tmp/qms-operational-ui-preview.log
            /tmp/qms-operational-ui-readiness.log
          if-no-files-found: warn
          retention-days: 14

      - name: Browser - CAR usability
        run: npx playwright test tests/e2e/qms-usability-enhancements.spec.ts --workers=1

      - name: Browser - Planner
        run: npx playwright test tests/e2e/qms-modern-planner-live.spec.ts --workers=1
