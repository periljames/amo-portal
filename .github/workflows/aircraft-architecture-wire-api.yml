name: Wire Aircraft Architecture API

on:
  push:
    branches:
      - agent/aircraft-induction-architecture
    paths:
      - ".github/workflows/aircraft-architecture-wire-api.yml"

permissions:
  contents: write

jobs:
  wire-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aircraft-induction-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Register aircraft architecture router
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/amodb/main.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = "from .apps.fleet.router import router as fleet_router\n"
          include_anchor = "app.include_router(fleet_router)\n"
          import_line = "from .apps.aircraft_architecture.router import router as aircraft_architecture_router\n"
          include_line = "app.include_router(aircraft_architecture_router)\n"

          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("Unexpected fleet router import anchor")
              text = text.replace(import_anchor, import_anchor + import_line)
          if include_line not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit("Unexpected fleet router include anchor")
              text = text.replace(include_anchor, include_anchor + include_line)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile application entrypoint
        run: python -m py_compile backend/amodb/main.py
      - name: Commit API wiring
        run: |
          if git diff --quiet -- backend/amodb/main.py; then
            echo "Architecture API is already wired."
            exit 0
          fi
          git config user.name "amo-portal-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/amodb/main.py
          git commit -m "Phase U2: register aircraft architecture API"
          git push origin HEAD:agent/aircraft-induction-architecture
