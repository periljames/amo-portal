name: Reliability Review Fix Finalizer

on:
  push:
    branches: [agent/reliability-v2-foundation]
    paths: [docs/reliability/.review-fix-trigger]

permissions:
  contents: write

concurrency:
  group: reliability-review-fix-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: test
      ENVIRONMENT: test
      TESTING: "true"
      RELIABILITY_SCHEDULER_ENABLED: "false"
      SECRET_KEY: reliability-review-fix
      JWT_SECRET_KEY: reliability-review-fix-jwt
      PYTHONPATH: backend
      DATABASE_URL: sqlite+pysqlite:///:memory:
      WRITE_DATABASE_URL: sqlite+pysqlite:///:memory:

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/reliability-v2-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed Reliability corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          advanced_path = root / "backend/amodb/apps/reliability/advanced_services.py"
          workbench_path = root / "backend/amodb/apps/reliability/services.py"
          test_path = root / "backend/amodb/apps/reliability/tests/test_review_regressions.py"

          advanced = advanced_path.read_text(encoding="utf-8")

          old_validation = '''    if event_type in {"MEL_DEFERRAL", "CDL_DEFERRAL"} and not (
              payload.get("mel_reference") or payload.get("cdl_reference")
          ):
              warnings.append("Deferral occurrence has no MEL/CDL reference")
          return errors, warnings
          '''
          new_validation = '''    if event_type in {"MEL_DEFERRAL", "CDL_DEFERRAL"} and not (
              payload.get("mel_reference") or payload.get("cdl_reference")
          ):
              warnings.append("Deferral occurrence has no MEL/CDL reference")
          delay_value = payload.get("delay_minutes")
          if delay_value not in (None, ""):
              delay_error = "delay_minutes must be a nonnegative whole number"
              if isinstance(delay_value, bool):
                  errors.append(delay_error)
              else:
                  try:
                      parsed_delay = Decimal(str(delay_value))
                  except Exception:
                      errors.append(delay_error)
                  else:
                      if (
                          not parsed_delay.is_finite()
                          or parsed_delay < 0
                          or parsed_delay != parsed_delay.to_integral_value()
                      ):
                          errors.append(delay_error)
                      else:
                          payload["delay_minutes"] = int(parsed_delay)
          return errors, warnings
          '''
          if advanced.count(old_validation) != 1:
              raise RuntimeError("ingestion validation anchor changed")
          advanced = advanced.replace(old_validation, new_validation, 1)

          rate_anchor = '''def _rate_with_confidence(
              *,
              events: int,
              exposure: Decimal,
              multiplier: Decimal,
              method: str,
          ) -> Tuple[Optional[Decimal], Optional[Decimal], Optional[Decimal]]:
          '''
          metric_contract = '''def _metric_event_contract(
              *,
              method: str,
              configured_event_types: Sequence[str],
          ) -> Tuple[List[str], Optional[List[str]], Optional[str]]:
              """Resolve numerator and event-based denominator semantics.

              ``PERCENT`` is the selected occurrence class as a share of all
              occurrences in the same governed scope and period. ``NFF_RATE`` is
              always no-fault-found occurrences divided by unscheduled removals.
              Other methods retain their configured exposure denominator.
              """
              numerator_types = [str(item) for item in configured_event_types]
              if method == "PERCENT":
                  return numerator_types, [], "ALL_RELIABILITY_EVENTS"
              if method == "NFF_RATE":
                  return ["NO_FAULT_FOUND"], ["UNSCHEDULED_REMOVAL"], "UNSCHEDULED_REMOVALS"
              return numerator_types, None, None


def _advance_metric_schedule(
              metric: domain.ReliabilityMetricDefinition,
              source_cutoff: datetime,
          ) -> None:
              metric.last_run_at = source_cutoff
              metric.next_run_at = source_cutoff + timedelta(
                  minutes=max(int(metric.schedule_interval_minutes or 0), 60)
              )


'''
          if advanced.count(rate_anchor) != 1:
              raise RuntimeError("rate helper anchor changed")
          advanced = advanced.replace(rate_anchor, metric_contract + rate_anchor, 1)

          old_rate = '''    if method == "MTBUR":
              value = exposure / Decimal(events) if events else None
              return quantize(value), None, None
          value = Decimal(events) / exposure * multiplier
          '''
          new_rate = '''    if method == "MTBUR":
              value = exposure / Decimal(events) if events else None
              return quantize(value), None, None
          if method in {"PERCENT", "NFF_RATE"}:
              value = Decimal(events) / exposure * multiplier
              return quantize(value), None, None
          value = Decimal(events) / exposure * multiplier
          '''
          if advanced.count(old_rate) != 1:
              raise RuntimeError("rate calculation anchor changed")
          advanced = advanced.replace(old_rate, new_rate, 1)

          old_metric_inputs = '''    event_types = [str(item) for item in (metric.numerator_event_types or [])]
              query = _scope_event_query(
                  db,
                  amo_id=amo_id,
                  period_start=start,
                  period_end=end,
                  event_types=event_types,
                  scope_type=resolved_scope_type,
                  scope_id=resolved_scope_id,
              )
              events = query.count()
              exposure = _exposure(
                  db,
                  amo_id=amo_id,
                  period_start=start,
                  period_end=end,
                  denominator_type=metric.denominator_type,
                  scope_type=resolved_scope_type,
                  scope_id=resolved_scope_id,
              )
          '''
          new_metric_inputs = '''    configured_event_types = [str(item) for item in (metric.numerator_event_types or [])]
              event_types, denominator_event_types, denominator_source = _metric_event_contract(
                  method=metric.method,
                  configured_event_types=configured_event_types,
              )
              query = _scope_event_query(
                  db,
                  amo_id=amo_id,
                  period_start=start,
                  period_end=end,
                  event_types=event_types,
                  scope_type=resolved_scope_type,
                  scope_id=resolved_scope_id,
              )
              events = query.count()
              if denominator_event_types is None:
                  exposure = _exposure(
                      db,
                      amo_id=amo_id,
                      period_start=start,
                      period_end=end,
                      denominator_type=metric.denominator_type,
                      scope_type=resolved_scope_type,
                      scope_id=resolved_scope_id,
                  )
              else:
                  denominator_query = _scope_event_query(
                      db,
                      amo_id=amo_id,
                      period_start=start,
                      period_end=end,
                      event_types=denominator_event_types,
                      scope_type=resolved_scope_type,
                      scope_id=resolved_scope_id,
                  )
                  exposure = Decimal(denominator_query.count())
          '''
          if advanced.count(old_metric_inputs) != 1:
              raise RuntimeError("metric input anchor changed")
          advanced = advanced.replace(old_metric_inputs, new_metric_inputs, 1)

          old_lineage = '''        "denominator_type": metric.denominator_type,
              "exposure": str(exposure),
          '''
          new_lineage = '''        "denominator_type": denominator_source or metric.denominator_type,
              "configured_denominator_type": metric.denominator_type,
              "denominator_event_types": denominator_event_types,
              "exposure": str(exposure),
          '''
          if advanced.count(old_lineage) != 1:
              raise RuntimeError("calculation lineage anchor changed")
          advanced = advanced.replace(old_lineage, new_lineage, 1)

          execute_start = advanced.index("def execute_metric(\n")
          existing_start = advanced.index("    existing = (\n", execute_start)
          alert_start = advanced.index("    if alert_severity:\n", existing_start)
          replacement = '''    existing = (
              db.query(domain.ReliabilityCalculationRun)
              .filter(
                  domain.ReliabilityCalculationRun.amo_id == amo_id,
                  domain.ReliabilityCalculationRun.metric_definition_id == metric.id,
                  domain.ReliabilityCalculationRun.scope_type == resolved_scope_type,
                  domain.ReliabilityCalculationRun.scope_id == resolved_scope_id,
                  domain.ReliabilityCalculationRun.period_start == start,
                  domain.ReliabilityCalculationRun.period_end == end,
                  domain.ReliabilityCalculationRun.formula_version == metric.formula_version,
              )
              .first()
          )
          if existing:
              run = existing
              run.numerator = Decimal(events)
              run.denominator = exposure
              run.value = value
              run.confidence_lower = lower
              run.confidence_upper = upper
              run.sample_size = events
              run.small_fleet = active_aircraft < 6
              run.status = result_status
              run.source_cutoff_at = source_cutoff
              run.source_lineage_json = lineage
              run.result_hash = result_hash
              run.scheduled = bool(run.scheduled or scheduled)
              if actor_user_id is not None:
                  run.run_by_user_id = actor_user_id
              audit_action = "CALCULATION_REFRESHED"
          else:
              run = domain.ReliabilityCalculationRun(
                  amo_id=amo_id,
                  metric_definition_id=metric.id,
                  scope_type=resolved_scope_type,
                  scope_id=resolved_scope_id,
                  period_start=start,
                  period_end=end,
                  numerator=Decimal(events),
                  denominator=exposure,
                  value=value,
                  confidence_lower=lower,
                  confidence_upper=upper,
                  sample_size=events,
                  small_fleet=active_aircraft < 6,
                  status=result_status,
                  formula_version=metric.formula_version,
                  source_cutoff_at=source_cutoff,
                  source_lineage_json=lineage,
                  result_hash=result_hash,
                  scheduled=scheduled,
                  run_by_user_id=actor_user_id,
              )
              db.add(run)
              audit_action = "CALCULATION_EXECUTED"
          db.flush()
          _advance_metric_schedule(metric, source_cutoff)
          '''
          advanced = advanced[:existing_start] + replacement + advanced[alert_start:]

          old_audit = '''        action="CALCULATION_EXECUTED",
              payload={"metric_id": metric.id, "status": result_status, "result_hash": result_hash, "scheduled": scheduled},
          '''
          new_audit = '''        action=audit_action,
              payload={
                  "metric_id": metric.id,
                  "status": result_status,
                  "result_hash": result_hash,
                  "scheduled": scheduled,
                  "source_cutoff_at": source_cutoff.isoformat(),
              },
          '''
          if advanced.count(old_audit) != 1:
              raise RuntimeError("calculation audit anchor changed")
          advanced = advanced.replace(old_audit, new_audit, 1)

          advanced_path.write_text(advanced, encoding="utf-8")

          workbench = workbench_path.read_text(encoding="utf-8")
          engine_anchor = '''    engine_shifts = list_engine_trend_statuses(
              db,
              amo_id=amo_id,
              current_status=models.EngineTrendStatusEnum.SHIFT,
              limit=limit,
          )
          '''
          engine_replacement = engine_anchor + '''    engine_shift_count = (
              db.query(func.count(models.EngineTrendStatus.id))
              .filter(
                  models.EngineTrendStatus.amo_id == amo_id,
                  models.EngineTrendStatus.current_status == models.EngineTrendStatusEnum.SHIFT,
              )
              .scalar()
              or 0
          )
          '''
          if workbench.count(engine_anchor) != 1:
              raise RuntimeError("engine shift list anchor changed")
          workbench = workbench.replace(engine_anchor, engine_replacement, 1)
          if workbench.count("            engine_shifts=len(engine_shifts),") != 1:
              raise RuntimeError("engine shift count anchor changed")
          workbench = workbench.replace(
              "            engine_shifts=len(engine_shifts),",
              "            engine_shifts=engine_shift_count,",
              1,
          )
          workbench_path.write_text(workbench, encoding="utf-8")

          test_path.write_text('''from datetime import datetime, timezone
          from decimal import Decimal
          from inspect import getsource
          from types import SimpleNamespace

          from amodb.apps.reliability import advanced_services
          from amodb.apps.reliability import services as workbench_services


          def test_negative_delay_is_rejected_before_orm_insertion():
              payload = {
                  "event_type": "TECHNICAL_DELAY",
                  "occurred_at": "2026-08-04T00:00:00Z",
                  "flight_number": "KQ100",
                  "delay_minutes": -1,
              }
              errors, _ = advanced_services._validate_ingestion_record(payload)
              assert "delay_minutes must be a nonnegative whole number" in errors


          def test_valid_delay_is_normalized_to_an_integer():
              payload = {
                  "event_type": "TECHNICAL_DELAY",
                  "occurred_at": "2026-08-04T00:00:00Z",
                  "flight_number": "KQ100",
                  "delay_minutes": "15.0",
              }
              errors, _ = advanced_services._validate_ingestion_record(payload)
              assert not errors
              assert payload["delay_minutes"] == 15


          def test_percentage_metric_contract_uses_all_scoped_events_as_denominator():
              numerator, denominator, label = advanced_services._metric_event_contract(
                  method="PERCENT",
                  configured_event_types=["TECHNICAL_DELAY"],
              )
              assert numerator == ["TECHNICAL_DELAY"]
              assert denominator == []
              assert label == "ALL_RELIABILITY_EVENTS"


          def test_nff_metric_contract_uses_unscheduled_removals_as_denominator():
              numerator, denominator, label = advanced_services._metric_event_contract(
                  method="NFF_RATE",
                  configured_event_types=["DEFECT"],
              )
              assert numerator == ["NO_FAULT_FOUND"]
              assert denominator == ["UNSCHEDULED_REMOVAL"]
              assert label == "UNSCHEDULED_REMOVALS"
              value, lower, upper = advanced_services._rate_with_confidence(
                  events=2,
                  exposure=Decimal("8"),
                  multiplier=Decimal("100"),
                  method="NFF_RATE",
              )
              assert value == Decimal("25.00000000")
              assert lower is None
              assert upper is None


          def test_subdaily_schedule_advances_after_each_execution():
              metric = SimpleNamespace(
                  schedule_interval_minutes=60,
                  last_run_at=None,
                  next_run_at=None,
              )
              cutoff = datetime(2026, 8, 4, 5, 0, tzinfo=timezone.utc)
              advanced_services._advance_metric_schedule(metric, cutoff)
              assert metric.last_run_at == cutoff
              assert metric.next_run_at == datetime(2026, 8, 4, 6, 0, tzinfo=timezone.utc)


          def test_existing_period_result_is_refreshed_instead_of_returned_early():
              source = getsource(advanced_services.execute_metric)
              assert "if existing:" in source
              assert "run.source_cutoff_at = source_cutoff" in source
              assert 'audit_action = "CALCULATION_REFRESHED"' in source
              assert "if existing:\n        return existing" not in source


          def test_workbench_total_engine_shift_count_is_not_page_limited():
              source = getsource(workbench_services.build_reliability_workbench)
              assert "engine_shift_count = (" in source
              assert "func.count(models.EngineTrendStatus.id)" in source
              assert "engine_shifts=engine_shift_count" in source
              assert "engine_shifts=len(engine_shifts)" not in source
          ''', encoding="utf-8")
          PY

          python -m py_compile \
            backend/amodb/apps/reliability/advanced_services.py \
            backend/amodb/apps/reliability/services.py \
            backend/amodb/apps/reliability/tests/test_review_regressions.py
          git diff --check

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate Reliability regression suite
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
          pytest -q backend/amodb/apps/reliability/tests

      - name: Remove temporary finalizer and publish corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reliability-review-fixes.yml
          rm -f docs/reliability/.review-fix-trigger
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete

          git add backend/amodb/apps/reliability/advanced_services.py
          git add backend/amodb/apps/reliability/services.py
          git add backend/amodb/apps/reliability/tests/test_review_regressions.py
          git add -u .github/workflows docs/reliability
          git diff --cached --check

          git config user.name github-actions
          git config user.email actions@github.com
          git commit -m "Fix Reliability ingestion, metrics, scheduling and counts"
          git push origin HEAD:agent/reliability-v2-foundation
