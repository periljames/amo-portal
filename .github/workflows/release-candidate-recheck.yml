name: PR377 Final Review Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-validate-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_pr377_final_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_pr377_final_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      SECRET_KEY: pr377-final-review-secret
      PLATFORM_SECRETS_KEY: "5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU="
      QUALITY_SCHEMA_STRICT: "0"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_pr377_final_review
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_pr377_final_review
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_pr377_final_review
    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Apply final Codex review corrections
        run: python .github/scripts/fix_pr377_final_review.py
      - name: Verify clean patch and compile backend
        run: |
          git diff --check
          python -m compileall -q backend/amodb/apps/workforce backend/amodb/apps/audit backend/amodb/apps/rostering
      - name: Upgrade clean PostgreSQL schema
        working-directory: backend
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Run complete Workforce regressions
        working-directory: backend
        run: pytest -q amodb/apps/workforce/tests
      - name: Run complete Rostering regressions
        working-directory: backend
        run: pytest -q amodb/apps/rostering/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run assistant and Rostering frontend regressions
        working-directory: frontend
        run: npm exec -- vitest run src/pages/rostering/documentationAssistantUx.test.ts src/pages/rostering/rosteringSetupOverhaul.test.ts
      - name: Lint changed frontend surfaces
        working-directory: frontend
        run: npm exec -- eslint src/pages/manuals/DocumentationAssistantPanel.tsx src/pages/rostering/documentationAssistantUx.test.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify final-review source contracts
        working-directory: backend
        run: |
          python - <<'PY'
          import inspect
          from amodb.apps.workforce import hr_service

          readiness = inspect.getsource(hr_service._person_readiness_for_user)
          shift_snapshot = inspect.getsource(hr_service._shift_template_snapshot)
          pattern_snapshot = inspect.getsource(hr_service._work_pattern_snapshot)
          assert "str(pattern.work_pattern_id) == managed_default_pattern_id" in readiness
          assert 'work_pattern.code == "DEFAULT-DAY-5X2"' not in readiness
          for source in (shift_snapshot, pattern_snapshot):
              assert '"updated_by_user_id"' in source
              assert '"updated_at"' in source
          print("Final backend review contracts verified")
          PY
          cd ../frontend
          python - <<'PY'
          from pathlib import Path
          component = Path('src/pages/manuals/DocumentationAssistantPanel.tsx').read_text()
          css = Path('src/pages/manuals/documentationAssistantPanel.css').read_text()
          assert 'aria-label="Open assisted search"' in component
          assert 'documentation-assistant-launcher__label' in component
          assert '.documentation-assistant-launcher__label' in css
          assert '.documentation-assistant-launcher span' not in css
          print("Mobile assistant launcher contract verified")
          PY
      - name: Restore permanent gate and remove temporary machinery
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git checkout "origin/${{ github.event.pull_request.base.ref }}" -- .github/workflows/release-candidate-recheck.yml
          rm -f .github/scripts/fix_pr377_final_review.py
          git diff --check
      - name: Publish validated final review corrections
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No changes remained after validation."
            exit 0
          fi
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git add backend/amodb/apps/workforce/hr_service.py \
                  backend/amodb/apps/workforce/tests/test_hr_review_flags.py \
                  backend/docs/rostering/WORKFORCE_ACTIVE_USER_READINESS_20260729.md \
                  frontend/src/pages/manuals/DocumentationAssistantPanel.tsx \
                  frontend/src/pages/manuals/documentationAssistantPanel.css \
                  frontend/src/pages/rostering/documentationAssistantUx.test.ts \
                  .github/workflows/release-candidate-recheck.yml \
                  .github/scripts/fix_pr377_final_review.py
          git commit -m "fix(workforce): close final review identity and accessibility gaps"
          git push origin "HEAD:${HEAD_BRANCH}"
