name: PR380 Calendar Fix Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish-fix:
    if: github.event.pull_request.head.ref == 'fix/rostering-calendar-feed-copy-feedback-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect pending patch
        id: pending
        shell: bash
        run: |
          if [ -f .github/scripts/pr380_calendar_copy_fix.py ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Calendar correction is already published; no-op."
          fi
      - uses: actions/setup-python@v6
        if: steps.pending.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        if: steps.pending.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply calendar and copy-state patch
        if: steps.pending.outputs.run == 'true'
        run: python .github/scripts/pr380_calendar_copy_fix.py
      - name: Install backend dependencies
        if: steps.pending.outputs.run == 'true'
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Run calendar regression and complete Rostering suite
        if: steps.pending.outputs.run == 'true'
        working-directory: backend
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          SECRET_KEY: pr380-calendar-regression-secret
        run: |
          pytest -q amodb/apps/rostering/tests/test_calendar_feed.py
          pytest -q amodb/apps/rostering/tests
      - name: Install frontend dependencies
        if: steps.pending.outputs.run == 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run frontend regression, lint and build
        if: steps.pending.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm exec -- vitest run src/pages/rostering/rosteringSetupOverhaul.test.ts
          npm exec -- eslint src/pages/rostering/components/MyRosterWorkspace.tsx src/pages/rostering/rosteringSetupOverhaul.test.ts
          npm run build
      - name: Update implementation record
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          cat >> backend/docs/rostering/CALENDAR_FEED_COPY_FIX_20260730.md <<'EOF'

## Implemented correction

- Replaced SQLAlchemy 2-incompatible string loader paths with class-bound Work ORM relationships.
- Added direct loader construction and signed-token regression coverage.
- Added animated, accessible copied/error confirmation with timed reset and reduced-motion behavior.
- Validated the complete Rostering backend suite, targeted frontend regression, ESLint, and production build before publication.
EOF
      - name: Restore permanent branch state and publish
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          git show ac4443c933612a66e37da17bfc3b1ddb6b1da865:.github/workflows/release-candidate-recheck.yml > .github/workflows/release-candidate-recheck.yml
          rm -f \
            .github/scripts/pr380_calendar_copy_fix.py \
            .github/pr380-calendar-copy-trigger.txt \
            .github/pr380-child-trigger.txt
          git diff --check
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair calendar feed and confirm copied links"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
