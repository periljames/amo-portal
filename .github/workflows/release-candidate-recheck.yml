name: PR377 Bootstrap Governance Publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-validate-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_pr377_governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_pr377_governance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      SECRET_KEY: pr377-bootstrap-governance-secret
      PLATFORM_SECRETS_KEY: "5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU="
      QUALITY_SCHEMA_STRICT: "0"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_pr377_governance
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_pr377_governance
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_pr377_governance
    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Apply all outstanding bootstrap governance reviews
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/fix_pr377_bootstrap_governance.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'service_path.write_text(service_text[:start] + new_block + "\\n", encoding="utf-8")',
              'service_path.write_text(service_text[:start] + new_block.rstrip() + "\\n", encoding="utf-8")',
          )
          text = text.replace(
              'test_path.write_text(test_text.rstrip() + addition + "\\n", encoding="utf-8")',
              'test_path.write_text(test_text.rstrip() + addition.rstrip() + "\\n", encoding="utf-8")',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/fix_pr377_bootstrap_governance.py
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/amodb/apps/workforce/tests/test_hr_review_flags.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "    assert 'code=\"DEFAULT-DAY\"' in source\n    assert 'code=\"DEFAULT-DAY-5X2\"' in source\n",
              "    assert hr_service._DEFAULT_DAY_SHIFT_CODE == \"DEFAULT-DAY\"\n"
              "    assert hr_service._DEFAULT_DAY_PATTERN_CODE == \"DEFAULT-DAY-5X2\"\n"
              "    assert \"code=_DEFAULT_DAY_SHIFT_CODE\" in source\n"
              "    assert \"code=_DEFAULT_DAY_PATTERN_CODE\" in source\n",
          )
          text = text.replace(
              "    assert 'current.work_pattern.code == \"DEFAULT-DAY-5X2\"' in source\n",
              "    assert \"str(current.work_pattern_id) == str(pattern.id)\" in source\n",
          )
          text = text.replace(
              "        assert action in source\n",
              "        assert action.replace('action=\"', '').replace('\"', '') in source\n",
          )
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Verify patch cleanliness
        run: |
          git diff --check
          python -m compileall -q backend/amodb/apps/workforce backend/amodb/apps/audit backend/amodb/apps/rostering
      - name: Upgrade clean PostgreSQL schema
        working-directory: backend
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Run complete Workforce regressions
        working-directory: backend
        run: pytest -q amodb/apps/workforce/tests
      - name: Run complete Rostering regressions
        working-directory: backend
        run: pytest -q amodb/apps/rostering/tests
      - name: Verify governance implementation contract
        working-directory: backend
        run: |
          python - <<'PY'
          import inspect
          from amodb.apps.workforce import hr_service

          source = inspect.getsource(hr_service.bootstrap_default_day_pattern)
          audit_source = inspect.getsource(hr_service._bootstrap_audit)
          identity_source = inspect.getsource(hr_service._default_day_system_id)
          assert "uuid5" in identity_source
          assert "already owned by tenant configuration" in source
          assert "id=shift_id" in source and "id=pattern_id" in source
          assert "create_audit_event" in audit_source
          assert "correlation_id=operation_id" in audit_source
          for action in ("bootstrap_create", "bootstrap_update", "bootstrap_close", "bootstrap_delete", "bootstrap_assign"):
              assert action in source
          print("Bootstrap provenance and audit contract verified")
          PY
      - name: Restore permanent gate and remove temporary executor
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git checkout "origin/${{ github.event.pull_request.base.ref }}" -- .github/workflows/release-candidate-recheck.yml
          rm -f .github/scripts/fix_pr377_bootstrap_governance.py
          git diff --check
      - name: Publish validated review corrections
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No changes remained after validation."
            exit 0
          fi
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git add backend/amodb/apps/workforce/hr_service.py \
                  backend/amodb/apps/workforce/tests/test_hr_review_flags.py \
                  backend/docs/rostering/WORKFORCE_ACTIVE_USER_READINESS_20260729.md \
                  .github/workflows/release-candidate-recheck.yml \
                  .github/scripts/fix_pr377_bootstrap_governance.py
          git commit -m "fix(workforce): protect and audit default-day bootstrap"
          git push origin "HEAD:${HEAD_BRANCH}"
