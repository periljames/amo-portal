name: PR333 Release Candidate Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  release-candidate:
    if: github.event.pull_request.head.ref == 'fix/workforce-active-users-default-day'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workforce-active-users-default-day
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply assistant default-width correction
        run: python .github/scripts/fix_pr377_assistant_default_width.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run assistant UX contract
        working-directory: frontend
        run: npm exec -- vitest run src/pages/rostering/documentationAssistantUx.test.ts
      - name: Lint changed assistant surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/pages/manuals/DocumentationAssistantPanel.tsx
          src/pages/rostering/documentationAssistantUx.test.ts
      - name: Typecheck and build production frontend
        working-directory: frontend
        run: npm run build
      - name: Restore permanent gate and remove patch script
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-candidate-recheck.yml
          rm -f .github/scripts/fix_pr377_assistant_default_width.py
      - name: Publish validated correction
        run: |
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git add \
            frontend/src/pages/manuals/DocumentationAssistantPanel.tsx \
            frontend/src/pages/rostering/documentationAssistantUx.test.ts \
            .github/workflows/release-candidate-recheck.yml
          git add -u .github/scripts/fix_pr377_assistant_default_width.py
          git commit -m "Use the intended assistant default width"
          git push origin HEAD:fix/workforce-active-users-default-day
