name: PR377 Main Synchronization

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.number == 377 && github.event.pull_request.head.ref == 'fix/workforce-active-users-default-day'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/workforce-active-users-default-day
          fetch-depth: 0
          show-progress: false
          persist-credentials: true
      - name: Merge latest main and restore permanent gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "Merge latest main into PR #377"
          git checkout origin/main -- .github/workflows/release-candidate-recheck.yml
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git diff --check HEAD^ HEAD
          git push origin HEAD:fix/workforce-active-users-default-day
