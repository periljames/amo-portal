name: PR377 Calendar Feed and Copy Feedback Fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  publish-fix:
    if: github.event.pull_request.number == 377 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply calendar and copy-state patch
        run: python .github/scripts/pr377_calendar_copy_fix.py
      - name: Install backend dependencies
        run: pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Run calendar-feed regression
        working-directory: backend
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          SECRET_KEY: pr377-calendar-regression-secret
        run: pytest -q amodb/apps/rostering/tests/test_calendar_feed.py
      - name: Run complete Rostering suite
        working-directory: backend
        env:
          APP_ENV: test
          ALLOW_SQLITE_FOR_TESTS: "1"
          SECRET_KEY: pr377-calendar-regression-secret
        run: pytest -q amodb/apps/rostering/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run Rostering source regressions
        working-directory: frontend
        run: npm exec -- vitest run src/pages/rostering/rosteringSetupOverhaul.test.ts
      - name: Lint changed frontend surfaces
        working-directory: frontend
        run: npm exec -- eslint src/pages/rostering/components/MyRosterWorkspace.tsx src/pages/rostering/rosteringSetupOverhaul.test.ts
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Restore permanent gate and publish clean commit
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-candidate-recheck.yml
          rm -f .github/scripts/pr377_calendar_copy_fix.py
          git diff --check
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair calendar feed and confirm copied links"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
