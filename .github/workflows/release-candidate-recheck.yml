name: PR333 Release Candidate Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  release-candidate:
    if: github.event.pull_request.head.ref == 'fix/workforce-active-users-default-day'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      APP_ENV: test
      ALLOW_SQLITE_FOR_TESTS: "1"
      SECRET_KEY: pr377-final-ux-secret
      PLATFORM_SECRETS_KEY: "5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU="
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workforce-active-users-default-day
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply PR377 backend and UX corrections
        run: python .github/scripts/apply_pr377_final_ux.py
      - name: Install backend dependencies
        run: >-
          pip install --disable-pip-version-check --retries 5 --timeout 60
          -r backend/requirements.txt
      - name: Validate complete Workforce suite
        working-directory: backend
        run: pytest -q amodb/apps/workforce/tests
      - name: Validate complete Rostering suite
        working-directory: backend
        run: pytest -q amodb/apps/rostering/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run Rostering and documentation-assistant regressions
        working-directory: frontend
        run: npm exec -- vitest run src/pages/rostering src/pages/manuals
      - name: Lint changed frontend surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/pages/manuals/DocumentationAssistantPanel.tsx
          src/pages/rostering/components/WorkforceHrWorkspace.tsx
          src/pages/rostering/documentationAssistantUx.test.ts
      - name: Typecheck and build production frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium
      - name: Run authenticated Rostering role acceptance
        working-directory: frontend
        shell: bash
        run: |
          npm exec -- vite preview --host 127.0.0.1 --port 4173 > /tmp/pr377-role-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/pr377-role-preview.log
              exit 1
            fi
            sleep 1
          done
          npm exec -- playwright test tests/e2e/rostering-role-access.spec.ts
      - name: Restore permanent workflow and remove temporary machinery
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-candidate-recheck.yml
          rm -f \
            .github/scripts/apply_pr377_final_ux.py \
            .github/workflows/pr377-final-ux-fixer.yml \
            .github/pr377-final-ux-trigger.txt
      - name: Publish validated correction
        run: |
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git add -A
          git commit -m "Fix suspended contract readiness and refine Workforce UX"
          git push origin HEAD:fix/workforce-active-users-default-day
