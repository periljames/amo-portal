name: Release Candidate Recheck

on:
  workflow_dispatch:
    inputs:
      run_browser_performance:
        description: "Run Chromium Rostering acceptance and synthetic-network checks"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-candidate-recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amodb_release_candidate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amodb_release_candidate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: release-candidate-secret
      PLATFORM_SECRETS_KEY: "5T4IWN4Fkif7LtiH2tGLHSrAX2tyvDEh6bXCWf7cRpU="
      QUALITY_SCHEMA_STRICT: "0"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_release_candidate
      DATABASE_WRITE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_release_candidate
      DATABASE_READ_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/amodb_release_candidate
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: >-
          python .github/scripts/retry_transient.py
          --attempts 4
          --label "release-candidate backend dependency install"
          -- pip install --disable-pip-version-check --retries 5 --timeout 60 -r backend/requirements.txt
      - name: Verify release contracts
        working-directory: backend
        run: |
          python -m amodb.scripts.quality_module_internal_check
          python -m amodb.scripts.saas_control_plane_internal_check
          python -m amodb.scripts.saas_release_cleanup_check
      - name: Upgrade clean PostgreSQL schema
        working-directory: backend
        run: alembic -c amodb/alembic.ini upgrade heads
      - name: Compile backend and configure all mappers
        working-directory: backend
        run: |
          python -m compileall -q amodb
          python - <<'PY'
          from sqlalchemy.orm import configure_mappers
          from amodb.main import app
          import amodb.quality_main

          configure_mappers()
          print(f"Configured all mappers; application exposes {len(app.routes)} routes")
          PY
      - name: Run integrated backend regressions
        working-directory: backend
        run: >-
          pytest -q
          amodb/apps/accounts/tests
          amodb/apps/quality/tests
          amodb/apps/workforce/tests
          amodb/apps/rostering/tests
          amodb/apps/platform/tests
          amodb/apps/notifications/tests
          amodb/apps/realtime/tests
      - name: Run worker smoke tests
        working-directory: backend
        run: |
          python -m amodb.jobs.saas_worker_safe --once --batch-size 5
          python -m amodb.jobs.platform_command_worker --once --batch-size 5
      - name: Install frontend dependencies
        working-directory: frontend
        run: >-
          python ../.github/scripts/retry_transient.py
          --attempts 4
          --label "release-candidate frontend dependency install"
          -- npm ci --prefer-offline --no-audit --fund=false
          --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
      - name: Typecheck and build production frontend
        working-directory: frontend
        run: npm run build
      - name: Run integrated frontend regressions
        working-directory: frontend
        run: |
          npm run test:quality
          npm run test:tenant-shell
          npm run test:platform
          npm exec -- vitest run src/pages/rostering src/services/offlineHttp.test.ts
      - name: Enforce production bundle budgets
        working-directory: frontend
        run: |
          npm run perf:report
          npm run perf:rostering
      - name: Install Chromium
        if: inputs.run_browser_performance
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium
      - name: Run authenticated Rostering acceptance
        if: inputs.run_browser_performance
        working-directory: frontend
        shell: bash
        run: |
          npm exec -- vite preview --host 127.0.0.1 --port 4173 > /tmp/rostering-role-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/rostering-role-preview.log
              exit 1
            fi
            sleep 1
          done
          npm exec -- playwright test tests/e2e/rostering-role-access.spec.ts
      - name: Run synthetic-network Rostering measurement
        if: inputs.run_browser_performance
        working-directory: frontend
        shell: bash
        run: |
          npm exec -- vite preview --host 127.0.0.1 --port 4173 > /tmp/rostering-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/perf-shell.html >/dev/null && break
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/rostering-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run perf:rostering:browser
