name: PR333 Release Candidate Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  release-candidate:
    if: github.event.pull_request.head.ref == 'fix/workforce-active-users-default-day'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workforce-active-users-default-day
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply planner asset correction
        run: python .github/scripts/remove_pr377_grip_asset.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run assistant UX contract
        working-directory: frontend
        run: npm exec -- vitest run src/pages/rostering/documentationAssistantUx.test.ts
      - name: Lint changed assistant surfaces
        working-directory: frontend
        run: >-
          npm exec -- eslint
          src/pages/manuals/DocumentationAssistantPanel.tsx
          src/pages/rostering/documentationAssistantUx.test.ts
      - name: Typecheck and build production frontend
        working-directory: frontend
        run: npm run build
      - name: Enforce production bundle and lazy-route budgets
        working-directory: frontend
        run: npm run perf:rostering
      - name: Install Chromium
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium
      - name: Measure cold and warm synthetic 2G Rostering waterfall
        working-directory: frontend
        shell: bash
        run: |
          npm exec -- vite preview --host 127.0.0.1 --port 4173 > /tmp/rostering-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/perf-shell.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/rostering-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run perf:rostering:browser
      - name: Restore permanent gate and remove patch script
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release-candidate-recheck.yml
          rm -f .github/scripts/remove_pr377_grip_asset.py
      - name: Publish validated correction
        run: |
          git config user.name "periljames"
          git config user.email "244658594+periljames@users.noreply.github.com"
          git add \
            frontend/src/pages/manuals/DocumentationAssistantPanel.tsx \
            frontend/src/pages/manuals/documentationAssistantPanel.css \
            frontend/src/pages/rostering/documentationAssistantUx.test.ts \
            .github/workflows/release-candidate-recheck.yml
          git add -u .github/scripts/remove_pr377_grip_asset.py
          git commit -m "Render the assistant resize grip without a planner asset"
          git push origin HEAD:fix/workforce-active-users-default-day
